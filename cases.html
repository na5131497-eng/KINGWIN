<!DOCTYPE html>
<html lang="ru">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>📦 CASES — KINGWIN</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Georgia,serif; -webkit-tap-highlight-color: transparent;}
body{background: radial-gradient(ellipse at 50% 0%, #5a0f0f 0%, #2a0808 40%, #150505 70%, #0a0202 100%); color:#fff;min-height:100vh;padding:20px;display:flex;justify-content:center}
.c{width:100%;max-width:1200px;margin:0 auto}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;gap:12px;flex-wrap:wrap}
.back{padding:10px 22px;border-radius:12px;background:linear-gradient(180deg,#2a0808,#1a0505);border:2px solid #d4af37;color:#ffd700;text-decoration:none;font-size:.85em;font-weight:700;letter-spacing:2px;transition:all .3s}
.back:hover{transform:translateX(-4px);box-shadow:0 0 25px rgba(212,175,55,.7)}
.bal-box{display:flex;align-items:center;gap:12px;padding:14px 26px;background:linear-gradient(180deg,#2a0808,#1a0505);border:3px solid #d4af37;border-radius:14px;box-shadow:0 0 0 1px #8a6a10 inset,0 0 30px rgba(212,175,55,.5);overflow:hidden;position:relative;min-width:210px}
.bal-box .lbl{font-size:.65em;font-weight:700;letter-spacing:3px;color:#d4af37;margin-bottom:4px;text-transform:uppercase}
.bal-box .num{font-size:1.4em;font-weight:700;background:linear-gradient(180deg,#fff8d0,#ffd700 50%,#b8860b);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;font-variant-numeric:tabular-nums}
h1{text-align:center;font-size:2.5em;font-weight:800;letter-spacing:10px;background:linear-gradient(180deg,#fff8d0,#ffd700 40%,#b8860b);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:6px; transition: all 0.3s;}
.subtitle{text-align:center;color:#d4af37;font-size:.85em;letter-spacing:2px;margin-bottom:26px;text-transform:uppercase;opacity:.85; font-style:italic;}
.cases-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:18px;margin-bottom:24px}

/* БЕЛАЯ КАРТОЧКА */
.case-card{
    background: #ffffff;
    border: 2px solid #d4af37;
    border-radius: 18px;
    padding: 22px 18px;
    text-align: center;
    cursor: pointer;
    transition: all .3s;
    box-shadow: 0 8px 25px rgba(0,0,0,.5);
    position: relative;
    overflow: hidden;
}
.case-card:hover{
    transform:translateY(-5px);
    box-shadow: 0 15px 40px rgba(0,0,0,.7), 0 0 40px rgba(212,175,55,.6);
    border-color:#ffd700;
}

.case-card .ic{display:flex;justify-content:center;align-items:center;margin-bottom:10px;height:140px; position:relative; z-index:2;}
.case-card .ic img { 
    width: 140px; 
    height: 140px; 
    object-fit: contain; 
    mix-blend-mode: multiply;
    transition: transform 0.3s ease;
}
.case-card:hover .ic img {
    transform: scale(1.1) rotate(3deg);
}

.case-card .nm{font-size:1.15em;font-weight:900;letter-spacing:2px;color:#0a0505;display:block;margin-bottom:4px; position:relative; z-index:2;}

/* СТИЛИ ДЛЯ СКИДКИ */
.price-block { display: flex; justify-content: center; align-items: center; gap: 8px; margin-top: 8px; margin-bottom: 10px; position: relative; z-index:2;}
.price-old { font-size: 0.9em; color: #888; text-decoration: line-through; font-family: Arial; font-weight: 700; }
.price-new { font-size: 1.2em; color: #1dd1a1; font-weight: 900; font-family: Arial; }

.case-card .peek{font-size:.75em;color:#8a6a10;text-decoration:underline;letter-spacing:1px;cursor:pointer;padding:4px 8px;border-radius:6px; transition: all 0.2s; position:relative; z-index:2;}
.case-card .peek:hover{color:#0a0505;background:rgba(212,175,55,.2)}

/* ЦВЕТА РАМОК */
.case-card.common{border-color:#a8a8a8}
.case-card.rare{border-color:#48dbfb}
.case-card.epic{border-color:#a855f7}
.case-card.legendary{border-color:#feca57; box-shadow: 0 8px 25px rgba(0,0,0,.5), 0 0 15px rgba(254,202,87,.4);}

/* КНОПКА ОТКРЫТЬ (С АНИМАЦИЕЙ) */
.btn-open{
    padding: 16px 40px;
    border-radius: 14px;
    border: 3px solid #ffd700;
    background: linear-gradient(180deg, #ffd700, #b8860b);
    color: #0a0505;
    font-family: Georgia;
    font-size: 1.2em;
    font-weight: 900;
    letter-spacing: 3px;
    cursor: pointer;
    text-transform: uppercase;
    box-shadow: 0 6px 0 #7a5a10;
    transition: all 0.25s cubic-bezier(0.18, 0.89, 0.32, 1.28);
    position: relative;
    z-index: 2;
    animation: pulseGold 2s infinite;
}
.btn-open:hover:not(:disabled){
    transform: translateY(-4px) scale(1.05);
    box-shadow: 0 10px 0 #7a5a10, 0 0 50px rgba(255, 215, 0, 1);
    background: linear-gradient(180deg, #ffea70, #d4af37);
}
.btn-open:active:not(:disabled){
    transform: translateY(3px) scale(1);
    box-shadow: 0 2px 0 #7a5a10;
}
.btn-open:disabled{
    opacity: 0.4;
    cursor: not-allowed;
    animation: none;
}

@keyframes pulseGold {
    0%, 100% { box-shadow: 0 6px 0 #7a5a10, 0 0 20px rgba(255, 215, 0, 0.4); }
    50% { box-shadow: 0 6px 0 #7a5a10, 0 0 35px rgba(255, 215, 0, 0.8); }
}

/* МОДАЛКИ */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.92);display:none;justify-content:center;align-items:center;z-index:300;padding:20px;backdrop-filter:blur(8px)}
.modal.on{display:flex}
.modal-box{background:linear-gradient(180deg,#2a0808,#0a0202);border:3px solid #d4af37;border-radius:20px;padding:26px;max-width:600px;width:100%;max-height:90vh;overflow-y:auto}
.modal-box h2{text-align:center;color:#ffd700;font-size:1.4em;letter-spacing:3px;margin-bottom:6px}
.modal-box .modal-sub{text-align:center;color:#d4af37;font-size:.75em;letter-spacing:2px;margin-bottom:20px;opacity:.85}
.items-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px;margin-bottom:20px}

.item-row{border:2px solid;border-radius:12px;padding:0;text-align:center;position:relative;overflow:hidden;aspect-ratio:1;display:flex;justify-content:center;align-items:center; background: #fff;}
.item-row img { width: 100%; height: 100%; object-fit: cover; } 
.item-row .pr{position:absolute;bottom:0;left:0;right:0;background:rgba(0,0,0,0.6);color:#ffd700;font-family:Arial;font-weight:900;font-size:.85em;padding:4px 0;text-align:center;z-index: 2;}
.item-row.common{border-color:#a8a8a8}
.item-row.rare{border-color:#48dbfb}
.item-row.epic{border-color:#a855f7}
.item-row.legendary{border-color:#feca57; box-shadow:0 0 15px rgba(254,202,87,.5)}

.modal-close{display:block;margin:0 auto;padding:12px 32px;border-radius:10px;border:2px solid #ffd700;background:linear-gradient(180deg,#ffd700,#b8860b);color:#0a0505;font-family:Georgia;font-weight:700;letter-spacing:2px;cursor:pointer;font-size:1em}
.open-area{display:none;margin-top:20px;position:relative;}
.open-area.on{display:block}

.scroller-wrap{position:relative;overflow:hidden;height:150px;background:linear-gradient(180deg,rgba(10,2,2,.98),rgba(42,8,8,.95));border:3px solid #d4af37;border-radius:16px;margin-bottom:18px;box-shadow:inset 0 0 30px rgba(0,0,0,.7)}
.scroller-wrap::before,.scroller-wrap::after{content:'';position:absolute;top:0;bottom:0;width:80px;z-index:5;pointer-events:none}
.scroller-wrap::before{left:0;background:linear-gradient(90deg,#1a0505,transparent)}
.scroller-wrap::after{right:0;background:linear-gradient(-90deg,#1a0505,transparent)}
.scroller-pointer{position:absolute;top:0;bottom:0;left:50%;width:3px;background:linear-gradient(180deg,#ffd700,#ff6b6b,#ffd700);z-index:10;box-shadow:0 0 20px rgba(255,215,0,.9);transform:translateX(-50%)}
.scroller-pointer::before,.scroller-pointer::after{content:'';position:absolute;left:50%;width:0;height:0;border-left:10px solid transparent;border-right:10px solid transparent;transform:translateX(-50%)}
.scroller-pointer::before{top:-2px;border-top:14px solid #ffd700}
.scroller-pointer::after{bottom:-2px;border-bottom:14px solid #ffd700}
.scroller-track{display:flex;gap:8px;padding:25px 0;height:100%;align-items:center;position:relative}

.item-card{min-width:100px;height:100px;border-radius:12px;display:flex;flex-direction:column;justify-content:center;align-items:center;border:2px solid;position:relative;overflow:hidden; background: #fff;}
.item-card img { width: 100%; height: 100%; object-fit: cover; }
.item-card .pr{position:absolute;bottom:0;left:0;right:0;background:rgba(0,0,0,0.6);color:#ffd700;font-family:Arial;font-weight:900;font-size:.75em;padding:2px 0;text-align:center;z-index: 2;}
.item-card.common{border-color:#a8a8a8}
.item-card.rare{border-color:#48dbfb}
.item-card.epic{border-color:#a855f7}
.item-card.legendary{border-color:#feca57;box-shadow:0 0 20px rgba(254,202,87,.5)}

/* КОРОЛЕВСКОЕ УВЕДОМЛЕНИЕ */
.top-notification {
    position: fixed;
    top: -150px;
    left: 50%;
    transform: translateX(-50%);
    background: linear-gradient(180deg, #2a0808, #0a0202);

    display: flex;
    flex-direction: column;

.top-notification .title {
    font-size: 0.85em;
    color: #d4af37;
    text-transform: uppercase;
    letter-spacing: 3px;
    margin-bottom: 5px;
    font-family: Georgia, serif;
    font-weight: 700;
}
.top-notification .amount {
    font-size: 2.5em;
    font-family: 'Impact', 'Arial Black', sans-serif;
    font-weight: 900;
    background: linear-gradient(180deg, #fff8d0, #ffd700 50%, #b8860b);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    text-shadow: 0 0 25px rgba(255,215,0,0.8);
    letter-spacing: 2px;
}
.top-notification.gold-win {
    border-color: #ffd700;
    box-shadow: 0 0 60px rgba(255, 215, 0, 0.9), inset 0 0 30px rgba(255, 215, 0, 0.4);
}

/* КОРОЛЕВСКАЯ МОДАЛКА ОШИБКИ */
.royal-error-modal { position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(8px); display: none; justify-content: center; align-items: center; z-index: 2000; }
.royal-error-modal.on { display: flex; }
.royal-error-box { background: linear-gradient(180deg, #2a0808, #0a0202); border: 3px solid #ff6b6b; border-radius: 20px; padding: 30px; text-align: center; max-width: 400px; width: 90%; box-shadow: 0 0 60px rgba(255, 107, 107, 0.5); animation: popIn 0.4s cubic-bezier(0.18, 0.89, 0.32, 1.28); }
@keyframes popIn { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.royal-error-icon { font-size: 3em; margin-bottom: 10px; color: #ff6b6b; text-shadow: 0 0 20px #ff6b6b; }
.royal-error-title { font-size: 1.3em; color: #ff6b6b; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 10px; font-weight: 900; }
.royal-error-text { color: #ddd; margin-bottom: 20px; font-size: 0.95em; }
.royal-error-btn { padding: 10px 30px; border-radius: 10px; border: 2px solid #ffd700; background: linear-gradient(180deg, #ffd700, #b8860b); color: #0a0505; font-weight: 900; cursor: pointer; text-transform: uppercase; font-family: Georgia; }

/* КНОПКА "ВЫБРАТЬ ДРУГОЙ" */
.btn-cancel {
    padding: 16px 40px;
    border-radius: 14px;
    border: 2px solid #d4af37;
    background: linear-gradient(180deg, #3a0a0a, #1a0505);
    color: #ffd700;
    font-family: Georgia;
    font-size: 1.1em;
    font-weight: 700;
    letter-spacing: 2px;
    cursor: pointer;
    text-transform: uppercase;
    box-shadow: 0 4px 0 #7a5a10;
    transition: all 0.25s cubic-bezier(0.18, 0.89, 0.32, 1.28);
}
.btn-cancel:hover:not(:disabled) {
    transform: translateY(-4px) scale(1.05);
    box-shadow: 0 8px 0 #7a5a10, 0 0 30px rgba(212, 175, 55, 0.8);
    background: linear-gradient(180deg, #4a0a0a, #2a0505);
}
.btn-cancel:active:not(:disabled) {
    transform: translateY(2px) scale(1);
    box-shadow: 0 2px 0 #7a5a10;
}
.btn-cancel:disabled {
    opacity: 0.4;
    cursor: not-allowed;
}

@media(max-width:700px){
  h1{font-size:1.6em;letter-spacing:4px}
  .cases-grid{grid-template-columns:1fr 1fr;gap:10px}
  .case-card{padding:16px 10px}
  .case-card .ic{height:100px;}
  .case-card .ic img { width: 90px; height: 90px; }
  .case-card .nm{font-size:.85em}
  .price-old { font-size: 0.75em; }
  .price-new { font-size: 1em; }
  .item-card{min-width:80px;height:80px}
  .scroller-wrap{height:120px}
  .top-notification { padding: 15px 20px; width: 90%; text-align: center; }
  .top-notification .amount { font-size: 2em; }
}
</style>
</head>

<script>

var CURRENT_USER_KEY = 'kw_current_user';
var B = 0;
var currentCase = null;

function $(i){ return document.getElementById(i); }
function fmt(n){
  var r = Math.round(n*100)/100;
  if(r%1===0) return Math.floor(r).toLocaleString('ru-RU');
  return r.toFixed(2).replace('.',',').replace(/\B(?=(\d{3})+(?!\d))/g,' ');
}

function showRoyalError(text) {
  $('royalErrorText').textContent = text;
  $('royalErrorModal').classList.add('on');
}

function loadBalance(){
  var uid = localStorage.getItem(CURRENT_USER_KEY);
  if(!uid){ window.location.replace('auth.html?need_auth=1'); return; }

  db.ref('users/' + uid).once('value').then(function(snapshot){
    var user = snapshot.val();
    if(!user){
      localStorage.removeItem(CURRENT_USER_KEY);
      window.location.replace('auth.html?need_auth=1');
      return;
    }
    B = (user.realBalance || 0) + (user.bonusBalance || 0);
    $('bal').textContent = fmt(B);
  });
}

function setBalDisplay(newTotal){
  B = newTotal;
  $('bal').textContent = fmt(B);
}

async function safeChangeBalance(delta, type){
  var uid = localStorage.getItem(CURRENT_USER_KEY);
  if(!uid) return null;

  var ref = db.ref('users/' + uid);
  try {
    var result = await ref.transaction(function(user) {
      if (!user) return user;
      var real = user.realBalance || 0;
      var bonus = user.bonusBalance || 0;
      if (delta < 0) {
        var toTake = -delta;
        var fromReal = Math.min(real, toTake);
        toTake -= fromReal;
        var fromBonus = Math.min(bonus, toTake);
        if (fromReal + fromBonus < -delta) return;
        user.realBalance = real - fromReal;
        user.bonusBalance = bonus - fromBonus;
      } else {
        user.realBalance = real + delta;
      }
      if (!user.stats) user.stats = { totalBets: 0, totalWins: 0, biggestWin: 0, gamesPlayed: 0, casesOpened: 0 };
      if (delta < 0) {
        user.stats.totalBets = (user.stats.totalBets || 0) + (-delta);
        user.stats.gamesPlayed = (user.stats.gamesPlayed || 0) + 1;
        user.stats.casesOpened = (user.stats.casesOpened || 0) + 1;
      } else {
        user.stats.totalWins = (user.stats.totalWins || 0) + delta;
        if (delta > (user.stats.biggestWin || 0)) user.stats.biggestWin = delta;
      }
      return user;
    });
    if (!result.committed) return null;
    var u = result.snapshot.val();
    return (u.realBalance || 0) + (u.bonusBalance || 0);
  } catch(e) {
    console.error('safeChangeBalance error:', e);
    return null;
  }
}

// ==================== ЗВУКИ ====================
var AC = null;
function getAC(){ if(!AC){ try{ AC = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } if(AC && AC.state === 'suspended') AC.resume(); return AC; }

var scrollAudio = new Audio('case_open.mp3');
scrollAudio.volume = 0.6;

function startScrollSound() {
    scrollAudio.currentTime = 0;
    scrollAudio.play().catch(function(e){ console.log('Звук не загружен:', e); });
}

function stopScrollSound() {
    scrollAudio.pause();
    scrollAudio.currentTime = 0;
}

function sWin(){ var c = getAC(); if(!c) return; [523,659,784,1047,1319].forEach(function(f,i){ setTimeout(function(){ var o = c.createOscillator(); o.type='triangle'; o.frequency.value=f; var g=c.createGain(); g.gain.setValueAtTime(.2,c.currentTime); g.gain.exponentialRampToValueAtTime(.01,c.currentTime+.4); o.connect(g); g.connect(c.destination); o.start(); o.stop(c.currentTime+.45); }, i*90) }) }
function sLegendary(){ var c = getAC(); if(!c) return; [523,659,784,1047,1319,1568,2093].forEach(function(f,i){ setTimeout(function(){ var o = c.createOscillator(); o.type='triangle'; o.frequency.value=f; var g=c.createGain(); g.gain.setValueAtTime(.25,c.currentTime); g.gain.exponentialRampToValueAtTime(.01,c.currentTime+.6); o.connect(g); g.connect(c.destination); o.start(); o.stop(c.currentTime+.65); }, i*100) }) }
function sLose(){
  var c = getAC(); if(!c) return;
  var o = c.createOscillator(); o.type = 'sine';
  o.frequency.setValueAtTime(330, c.currentTime); o.frequency.exponentialRampToValueAtTime(180, c.currentTime+.4);
  var g = c.createGain(); g.gain.setValueAtTime(0, c.currentTime); g.gain.linearRampToValueAtTime(.1, c.currentTime+.03); g.gain.exponentialRampToValueAtTime(.001, c.currentTime+.5);
  var f = c.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 800;
  o.connect(f); f.connect(g); g.connect(c.destination); o.start(); o.stop(c.currentTime+.55);

function getItemClass(item) {
    return 'bg-' + item.bg;
}

function renderCases(){
  var grid = $('casesGrid');
  var html = '';
  for(var i=0;i<CASES.length;i++){
    var c = CASES[i];
    html += '<div class="case-card ' + c.rarity + '">';
    
    if(c.image){
        html += '<span class="ic"><img src="' + c.image + '" alt="case" onerror="this.style.display=\'none\'; this.parentElement.innerHTML=\'' + c.icon + '\';"></span>';
    } else {
        html += '<span class="ic">' + c.icon + '</span>';
    }
    
    html += '<span class="nm">' + c.name + '</span>';
    
    html += '<div class="price-block">';
    if (c.oldPrice && c.oldPrice > c.price) {
        html += '<span class="price-old">₽' + fmt(c.oldPrice) + '</span>';
    }
    html += '<span class="price-new">₽' + fmt(c.price) + '</span>';
    html += '</div>';

    html += '<span class="peek" onclick="event.stopPropagation();peekCase(\'' + c.id + '\')">👁 Содержимое</span>';
    html += '<div style="margin-top:10px"><button class="btn-open" style="padding:10px 24px;font-size:.85em" onclick="selectCase(\'' + c.id + '\')">🎁 ОТКРЫТЬ</button></div>';
    html += '</div>';
  }
  grid.innerHTML = html;
}

function peekCase(id){
  var c = null;
  for(var i=0;i<CASES.length;i++) if(CASES[i].id === id){ c = CASES[i]; break; }
  if(!c) return;
  $('peekTitle').textContent = c.name;
  $('peekSub').textContent = 'Цена кейса: ₽' + fmt(c.price);
  var html = '';
  var items = c.items.slice().sort(function(a,b){ return b.price - a.price });
  for(var i=0;i<items.length;i++){
    var it = items[i];
    html += '<div class="item-row ' + it.rarity + ' ' + getItemClass(it) + '"><img src="' + it.img + '" alt="item"><div class="pr">₽' + fmt(it.price) + '</div></div>';
  }
  $('peekItems').innerHTML = html;
  $('peekModal').classList.add('on');
}
function closePeek(){ $('peekModal').classList.remove('on'); }

function selectCase(id){
  if(opening) return;
  var c = null;
  for(var i=0;i<CASES.length;i++) if(CASES[i].id === id){ c = CASES[i]; break; }
  if(!c) return;
  currentCase = c;
  
  $('pageTitle').textContent = c.name;
  $('pageSubtitle').textContent = c.quote;

  $('casesGrid').style.display = 'none';
  $('openArea').classList.add('on');
  buildScroller();
  $('openBtn').disabled = false;
  $('openBtn').textContent = 'ОТКРЫТЬ';
}

function cancelOpen(){
  if(opening) return;
  $('openArea').classList.remove('on');
  $('casesGrid').style.display = 'grid';
  
  $('pageTitle').textContent = '📦 КЕЙСЫ';
  $('pageSubtitle').textContent = '✦ Выбери свой кейс и испытай удачу ✦';

  currentCase = null;
}

function rollItem(caseItems){
  var total = 0;
  for(var i=0;i<caseItems.length;i++) total += caseItems[i].weight;
  var r = Math.random() * total;
  for(var i=0;i<caseItems.length;i++){ r -= caseItems[i].weight; if(r <= 0) return caseItems[i]; }
  return caseItems[0];
}

function buildScroller(){
  var track = $('scrollerTrack');
  var html = '';
  for(var i=0;i<60;i++){
    var item = rollItem(currentCase.items);
    html += '<div class="item-card ' + item.rarity + ' ' + getItemClass(item) + '"><img src="' + item.img + '" alt="item"><div class="pr">₽' + fmt(item.price) + '</div></div>';
  }
  track.innerHTML = html;
  track.style.transition = 'none';
  track.style.transform = 'translateX(0)';
}

async function openCase(){
  if(opening || !currentCase) return;
  if(B < currentCase.price){ showRoyalError('На вашем балансе недостаточно средств для открытия этого кейса. Пополните счёт и попробуйте снова.'); return; }

  opening = true;
  $('openBtn').disabled = true;
  $('cancelBtn').disabled = true;
  
  $('topNotification').classList.remove('on');
  $('topNotification').classList.remove('gold-win');

  var newTotal = await safeChangeBalance(-currentCase.price, 'bet');
  if(newTotal === null){
    opening = false;
    $('openBtn').disabled = false;
    $('cancelBtn').disabled = false;
    showRoyalError('Произошла ошибка при списании средств. Попробуйте ещё раз.');
    return;
  }
  setBalDisplay(newTotal);

  var winItem = rollItem(currentCase.items);
  
  var track = $('scrollerTrack');
  var html = '';
  var WIN_INDEX = 50;
  
  for(var i=0;i<WIN_INDEX;i++){
    var item = rollItem(currentCase.items);
    html += '<div class="item-card ' + item.rarity + ' ' + getItemClass(item) + '"><img src="' + item.img + '" alt="item"><div class="pr">₽' + fmt(item.price) + '</div></div>';
  }
  
  html += '<div class="item-card ' + winItem.rarity + ' ' + getItemClass(winItem) + '"><img src="' + winItem.img + '" alt="item"><div class="pr">₽' + fmt(winItem.price) + '</div></div>';
  
  for(var i=WIN_INDEX+1;i<80;i++){
    var item = rollItem(currentCase.items);
    html += '<div class="item-card ' + item.rarity + ' ' + getItemClass(item) + '"><img src="' + item.img + '" alt="item"><div class="pr">₽' + fmt(item.price) + '</div></div>';
  }
  
  track.innerHTML = html;
  track.style.transition = 'none';
  track.style.transform = 'translateX(0)';
  void track.offsetWidth;

  startScrollSound();

  var containerWidth = track.parentElement.offsetWidth;
  var itemWidth = 100 + 8;
  var targetX = -(WIN_INDEX * itemWidth) + (containerWidth/2) - (itemWidth/2) + (Math.random()*40 - 20);

  track.style.transition = 'transform 2.5s linear';
  track.style.transform = 'translateX(-3000px)';

  setTimeout(function(){
      track.style.transition = 'transform 3s cubic-bezier(0.15, 0.85, 0.3, 1)';
      track.style.transform = 'translateX(' + targetX + 'px)';
      
      setTimeout(async function(){
        opening = false;
        $('cancelBtn').disabled = false;
        $('openBtn').textContent = 'ОТКРЫТЬ';
        
        stopScrollSound();

        var winTotal = await safeChangeBalance(winItem.price, 'win');
        if(winTotal !== null) setBalDisplay(winTotal);

        var notify = $('topNotification');
        $('topNotificationVal').textContent = fmt(winItem.price) + ' ₽';
        
        if(winItem.price >= currentCase.price * 5) {
            notify.classList.add('gold-win');
        } else {
            notify.classList.remove('gold-win');
        }

        notify.classList.add('on');

        if(winItem.price >= currentCase.price * 5){ sLegendary(); showFloat('+₽' + fmt(winItem.price), '#feca57'); }
        else if(winItem.price >= currentCase.price){ sWin(); showFloat('+₽' + fmt(winItem.price), '#1dd1a1'); }
        else { sLose(); }

        setTimeout(function(){ $('openBtn').disabled = false; }, 500);
        
        setTimeout(function() {
            notify.classList.remove('on');
        }, 3500);

      }, 3000);

  }, 2500);
}

function showFloat(text, color){
  var el = document.createElement('div');
  el.className = 'float-text';
  el.textContent = text;
  el.style.color = color || '#ffd700';
  el.style.left = '50%'; el.style.top = '50%';
  el.style.transform = 'translateX(-50%)';
  document.body.appendChild(el);
  setTimeout(function(){ el.remove(); }, 2000);
}

auth.onAuthStateChanged(function(user){
  if(user){
    localStorage.setItem(CURRENT_USER_KEY, user.uid);
    renderCases();
    loadBalance();
  } else {
    localStorage.removeItem(CURRENT_USER_KEY);
    window.location.replace('auth.html?need_auth=1');
  }
});

$('openBtn').onclick = openCase;
$('cancelBtn').onclick = cancelOpen;
$('peekModal').onclick = function(e){ if(e.target === this) closePeek(); };
