<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>KINGWIN — Кейсы</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-main: #090a10; --bg-panel: #181a24; --bg-dark: #11121a;
    --accent: #00e5ff; --accent-green: #00ff88;
    --text-main: #fff; --text-muted: #8b92a5;
    --border: rgba(255,255,255,0.06); --red: #ff4d4d; --gold: #f1c40f;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Montserrat', sans-serif; }
  body { background: var(--bg-main); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; overflow-x: hidden; }
  
  /* ТОПБАР */
  .topbar { height: 70px; display: flex; justify-content: space-between; align-items: center; padding: 0 20px; border-bottom: 1px solid var(--border); background: rgba(9, 10, 16, 0.8); backdrop-filter: blur(10px); position: sticky; top: 0; z-index: 100; }
  .logo { font-size: 20px; font-weight: 900; letter-spacing: 2px; background: linear-gradient(135deg, #00e5ff, #0077ff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; cursor: pointer; text-decoration: none; }
  .balance-badge { background: rgba(0,0,0,0.5); border: 1px solid rgba(0,229,255,0.35); padding: 8px 16px; border-radius: 20px; font-size: 14px; font-weight: 700; display: flex; gap: 8px; }
  .balance-badge span { color: var(--accent); }

  /* КОНТЕНТ */
  .container { max-width: 1200px; margin: 0 auto; padding: 30px 20px; width: 100%; flex: 1; }
  .header-title { font-size: 24px; font-weight: 900; margin-bottom: 20px; }
  .header-title::before { content: ''; display: inline-block; width: 4px; height: 24px; background: var(--accent); border-radius: 2px; margin-right: 12px; vertical-align: middle; }
  
  /* СЕТКА КЕЙСОВ */
  .cases-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; }
  .case-card { background: var(--bg-panel); border: 1px solid var(--border); border-radius: 16px; padding: 20px; text-align: center; transition: 0.3s; position: relative; overflow: hidden; }
  .case-card:hover { transform: translateY(-5px); border-color: var(--accent); box-shadow: 0 10px 30px rgba(0,229,255,0.1); }
  .case-image { width: 120px; height: 120px; margin: 0 auto 15px; object-fit: contain; filter: drop-shadow(0 0 15px rgba(0,229,255,0.3)); }
  .case-name { font-size: 18px; font-weight: 800; margin-bottom: 5px; }
  .case-price { font-size: 14px; color: var(--gold); font-weight: 700; margin-bottom: 15px; }
  .case-btn { width: 100%; background: linear-gradient(135deg, #00e5ff, #0077ff); color: #000; border: none; border-radius: 8px; padding: 12px; font-weight: 900; font-size: 14px; cursor: pointer; transition: 0.2s; }
  .case-btn:hover { box-shadow: 0 0 20px rgba(0,229,255,0.5); transform: scale(1.02); }
  .case-btn:disabled { background: #333; color: #888; cursor: not-allowed; box-shadow: none; transform: none; }

  /* РУЛЕТКА */
  .roulette-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.9); backdrop-filter: blur(10px); z-index: 1000; display: none; flex-direction: column; justify-content: center; align-items: center; }
  .roulette-overlay.show { display: flex; }
  .roulette-wrapper { width: 100%; max-width: 1000px; position: relative; height: 140px; background: #000; overflow: hidden; }
  .roulette-track { display: flex; position: absolute; left: 0; top: 0; height: 100%; align-items: center; }
  
  /* ПЕРЕЛИВАЮЩИЕСЯ КАРТОЧКИ */
  @keyframes shine {
    0% { background-position: 0% 50%; }
    100% { background-position: 200% 50%; }
  }
  
  .roulette-item { 
    width: 130px; height: 110px; margin: 0 5px; 
    background: linear-gradient(135deg, #131624 0%, #1a1c29 100%);
    border-radius: 12px; display: flex; justify-content: center; align-items: center; 
    flex-shrink: 0; position: relative; 
    font-size: 24px; font-weight: 900; color: #fff;
    box-sizing: content-box; /* Чтобы margin не влиял на ширину */
  }

  .roulette-item.silver {
    border: 2px solid transparent;
    background: linear-gradient(#131624, #131624) padding-box,
                linear-gradient(90deg, #8e9eab, #eef2f3, #8e9eab, #eef2f3, #8e9eab) border-box;
    background-size: auto, 200% 100%;
    animation: shine 4s linear infinite;
    color: #eef2f3;
    text-shadow: 0 0 10px rgba(255,255,255,0.3);
  }

  .roulette-item.blue {
    border: 2px solid transparent;
    background: linear-gradient(#131624, #131624) padding-box,
                linear-gradient(90deg, #00e5ff, #0077ff, #00e5ff, #0077ff, #00e5ff) border-box;
    background-size: auto, 200% 100%;
    animation: shine 3s linear infinite;
    color: var(--accent);
    text-shadow: 0 0 15px rgba(0,229,255,0.6);
    box-shadow: inset 0 0 20px rgba(0,229,255,0.1);
  }

  .roulette-item.gold {
    border: 2px solid transparent;
    background: linear-gradient(#131624, #131624) padding-box,
                linear-gradient(90deg, #f1c40f, #ffe066, #ffd700, #f1c40f) border-box;
    background-size: auto, 200% 100%;
    animation: shine 2.5s linear infinite;
    color: #ffd700;
    text-shadow: 0 0 20px rgba(255,215,0,0.8);
    box-shadow: inset 0 0 20px rgba(241,196,15,0.2), 0 0 15px rgba(241,196,15,0.2);
  }

  /* УКАЗАТЕЛЬ */
  .roulette-pointer { position: absolute; top: 0; bottom: 0; left: 50%; width: 4px; background: var(--red); transform: translateX(-50%); z-index: 10; box-shadow: 0 0 15px var(--red); }
  .roulette-pointer::before { content: ''; position: absolute; top: -10px; left: 50%; transform: translateX(-50%); border-left: 12px solid transparent; border-right: 12px solid transparent; border-top: 18px solid var(--red); }
  .roulette-pointer::after { content: ''; position: absolute; bottom: -10px; left: 50%; transform: translateX(-50%); border-left: 12px solid transparent; border-right: 12px solid transparent; border-bottom: 18px solid var(--red); }
  
  .win-modal { background: var(--bg-panel); border: 2px solid var(--accent-green); border-radius: 20px; padding: 40px; text-align: center; margin-top: 40px; box-shadow: 0 0 60px rgba(0,255,136,0.3); display: none; z-index: 20; }
  .win-modal.show { display: block; animation: pop 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
  @keyframes pop { 0% { transform: scale(0.5); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
  .win-title { font-size: 24px; font-weight: 900; margin-bottom: 10px; }
  .win-amount { font-size: 42px; font-weight: 900; color: var(--accent-green); text-shadow: 0 0 20px rgba(0,255,136,0.5); margin-bottom: 20px; }

  .toast-container { position: fixed; top: 80px; right: 20px; z-index: 9999; display: flex; flex-direction: column; gap: 10px; }
  .toast { background: rgba(24,26,36,0.95); border-left: 4px solid var(--accent); padding: 16px 20px; border-radius: 8px; font-size: 14px; font-weight: 600; transform: translateX(120%); transition: 0.3s; }
  .toast.show { transform: translateX(0); }
  .toast.error { border-left-color: var(--red); }

  @media (max-width: 768px) {
    .roulette-wrapper { height: 110px; }
    .roulette-item { width: 90px; height: 80px; margin: 0 3px; font-size: 18px; }
    .win-modal { padding: 30px 20px; margin-top: 20px; }
    .win-amount { font-size: 32px; }
  }
</style>
</head>
<body>

<div class="toast-container" id="toastContainer"></div>

<div class="topbar">
  <a href="/" class="logo">KINGWIN</a>
  <div class="balance-badge">Баланс: <span id="topBalance">0.00</span> ₽</div>
</div>

<div class="container">
  <div class="header-title">Кейсы</div>
  <div class="cases-grid" id="casesGrid">
    <div style="color:var(--text-muted); padding:20px;">Загрузка кейсов...</div>
  </div>
</div>

<!-- ОКНО РУЛЕТКИ -->
<div class="roulette-overlay" id="rouletteOverlay">
  <div class="roulette-wrapper" id="rouletteWrapper">
    <div class="roulette-pointer"></div>
    <div class="roulette-track" id="rouletteTrack"></div>
  </div>
  <div class="win-modal" id="winModal">
    <div class="win-title">Вы выиграли!</div>
    <div class="win-amount" id="winAmount">0 ₽</div>
    <button class="case-btn" style="width: 200px;" onclick="closeRoulette()">Забрать</button>
  </div>
</div>

<script>
let playerId = localStorage.getItem('kingwin_player_id');

// Загрузка профиля для баланса
async function loadProfile() {
  if(!playerId) return;
  try {
    const r = await fetch('/api/guest/me?id=' + encodeURIComponent(playerId));
    const d = await r.json();
    if(r.ok && d.guest) {
      const total = (parseFloat(d.guest.bonus_balance) || 0) + (parseFloat(d.guest.deposit_balance) || 0);
      document.getElementById('topBalance').textContent = total.toFixed(2);
    }
  } catch(e) {}
}

// Загрузка кейсов
async function loadCases() {
  try {
    const url = playerId ? `/api/cases/list?guest_id=${playerId}` : '/api/cases/list';
    const r = await fetch(url);
    const cases = await r.json();
    const grid = document.getElementById('casesGrid');
    
    if(!cases || cases.length === 0) {
      grid.innerHTML = '<div style="color:var(--text-muted);">Нет доступных кейсов</div>';
      return;
    }

    grid.innerHTML = cases.map(c => `
      <div class="case-card">
        <img src="/case_${c.name.toLowerCase()}.png" class="case-image" 
             onerror="this.src='/cases_card.jpg'" alt="${c.name}">
        <div class="case-name">${c.name}</div>
        <div class="case-price">${c.price} ₽</div>
        <button class="case-btn" onclick="openCase('${c.name}')" ${!c.available ? 'disabled' : ''}>
          ${c.available ? 'Открыть' : 'Недоступно'}
        </button>
      </div>
    `).join('');
  } catch(e) {
    document.getElementById('casesGrid').innerHTML = '<div style="color:var(--red);">Ошибка загрузки кейсов</div>';
  }
}

// Определение класса для карточки рулетки
function getPrizeClass(prize) {
  if (prize >= 500) return 'gold';
  if (prize >= 50) return 'blue';
  return 'silver';
}

// Открытие кейса
async function openCase(caseName) {
  if(!playerId) { showToast('Войдите в аккаунт!', 'error'); return; }
  
  const grid = document.getElementById('casesGrid');
  grid.style.opacity = '0.5';
  grid.style.pointerEvents = 'none';

  try {
    const r = await fetch('/api/cases/open', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ guest_id: playerId, case_name: caseName })
    });
    const d = await r.json();
    
    if(!r.ok) {
      showToast(d.error || 'Ошибка открытия', 'error');
      grid.style.opacity = '1';
      grid.style.pointerEvents = 'auto';
      return;
    }

    startRouletteAnimation(d.prize);
    loadProfile();

  } catch(e) {
    showToast('Ошибка соединения', 'error');
    grid.style.opacity = '1';
    grid.style.pointerEvents = 'auto';
  }
}

// Анимация рулетки
function startRouletteAnimation(prize) {
  const overlay = document.getElementById('rouletteOverlay');
  const track = document.getElementById('rouletteTrack');
  const wrapper = document.getElementById('rouletteWrapper');
  const winModal = document.getElementById('winModal');
  const winAmount = document.getElementById('winAmount');
  
  overlay.classList.add('show');
  winModal.classList.remove('show');
  
  // Сброс позиции
  track.style.transition = 'none';
  track.style.transform = 'translateX(0)';
  track.innerHTML = '';

  const itemsCount = 60;
  const prizeIndex = 50; // Победная карточка будет 50-й
  
  for(let i = 0; i < itemsCount; i++) {
    // Генерируем случайные суммы для фона
    let val = Math.floor(Math.random() * 100) + 5;
    if(i === prizeIndex) val = prize; // Реальный выигрыш
    
    let cls = getPrizeClass(val);
    
    track.innerHTML += `
      <div class="roulette-item ${cls}">
        ${val} ₽
      </div>
    `;
  }

  // Даем браузеру отрисовать DOM перед тем как считать ширины
  setTimeout(() => {
    const items = track.querySelectorAll('.roulette-item');
    const winItem = items[prizeIndex];
    
    // Получаем точные координаты победной карточки
    const itemWidth = winItem.offsetWidth;
    const itemLeft = winItem.offsetLeft;
    const wrapperWidth = wrapper.offsetWidth;
    
    // Вычисляем смещение, чтобы центр победной карточки оказался ровно под указателем
    const offset = itemLeft + (itemWidth / 2) - (wrapperWidth / 2);

    // Запускаем анимацию
    track.style.transition = 'transform 4s cubic-bezier(0.15, 0.9, 0.25, 1)';
    track.style.transform = `translateX(-${offset}px)`;

    // Показываем результат
    setTimeout(() => {
      winAmount.textContent = prize.toFixed(2) + ' ₽';
      winModal.classList.add('show');
    }, 4200);
  }, 50);
}

function closeRoulette() {
  document.getElementById('rouletteOverlay').classList.remove('show');
  const grid = document.getElementById('casesGrid');
  grid.style.opacity = '1';
  grid.style.pointerEvents = 'auto';
}

function showToast(text, type='success') {
  const c = document.getElementById('toastContainer');
  const t = document.createElement('div');
  t.className = `toast ${type}`;
  t.textContent = text;
  c.appendChild(t);
  setTimeout(() => t.classList.add('show'), 10);
  setTimeout(() => { t.classList.remove('show'); setTimeout(() => t.remove(), 300); }, 3000);
}

// Инициализация
loadProfile();
loadCases();
setInterval(loadProfile, 5000);
</script>
</body>
</html>
