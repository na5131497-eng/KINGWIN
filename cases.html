<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>KINGWIN — Кейсы</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-main: #0c0e14; 
    --bg-panel: #151822; 
    --bg-dark: #0a0c11;
    --accent: #00e5ff; 
    --accent-green: #00ff88;
    --gold: #f1c40f;
    --text-main: #fff; 
    --text-muted: #8b92a5;
    --border: rgba(255,255,255,0.05);
    --red: #ff4d4d; 
  }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Montserrat', sans-serif; -webkit-tap-highlight-color: transparent;}
  body { background: var(--bg-main); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; }

  /* TOPBAR */
  .topbar { display: flex; justify-content: space-between; align-items: center; padding: 15px 30px; background: var(--bg-dark); border-bottom: 1px solid var(--border); }
  .topbar-left { display: flex; align-items: center; gap: 20px; }
  .topbar-logo { font-size: 20px; font-weight: 900; letter-spacing: 2px; background: linear-gradient(135deg, #00e5ff, #0077ff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .back-btn { color: var(--text-muted); text-decoration: none; font-size: 14px; font-weight: 600; transition: 0.2s; display: flex; align-items: center; gap: 8px; }
  .back-btn:hover { color: #fff; }
  
  .balance-badge { display: flex; align-items: center; gap: 8px; background: rgba(0,0,0,0.5); border: 1px solid rgba(0,229,255,0.3); padding: 8px 16px; border-radius: 20px; font-size: 14px; font-weight: 700; cursor: pointer; transition: 0.3s; }
  .balance-badge:hover { border-color: var(--accent); }
  .balance-badge span { color: var(--accent); }

  /* MAIN */
  .container { max-width: 1200px; margin: 0 auto; padding: 30px 20px; flex: 1; width: 100%; }

  /* --- ЭКРАН СПИСКА КЕЙСОВ --- */
  .all-cases-screen { display: block; }
  .all-cases-screen.hidden { display: none; }
  
  h1.section-title { font-size: 32px; font-weight: 900; text-transform: uppercase; letter-spacing: 4px; text-align: center; margin-bottom: 10px; background: linear-gradient(180deg, #fff, #b0b8c8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .subtitle { text-align: center; color: var(--text-muted); font-size: 13px; letter-spacing: 2px; margin-bottom: 40px; text-transform: uppercase; }

  .cases-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; margin-bottom: 40px; }
  
  .case-card { background: var(--bg-panel); border: 2px solid var(--border); border-radius: 20px; padding: 25px 15px; display: flex; flex-direction: column; align-items: center; text-align: center; cursor: pointer; transition: 0.3s; position: relative; overflow: hidden; }
  .case-card:hover { transform: translateY(-8px); border-color: rgba(241, 196, 15, 0.5); box-shadow: 0 15px 40px rgba(0,0,0,0.6), 0 0 30px rgba(241, 196, 15, 0.1); }
  
  /* Цвета карточек по редкости (рамки) */
  .case-card.common { border-color: rgba(160,174,192,0.3); }
  .case-card.rare { border-color: rgba(0,229,255,0.3); }
  .case-card.epic { border-color: rgba(168,85,247,0.3); }
  .case-card.legendary { border-color: rgba(241,196,15,0.6); box-shadow: 0 0 20px rgba(241,196,15,0.15); }

  .case-img { width: 140px; height: 140px; margin-bottom: 15px; display: flex; justify-content: center; align-items: center; position: relative; z-index: 2; }
  .case-img img { width: 100%; height: 100%; object-fit: contain; filter: drop-shadow(0 10px 20px rgba(0,0,0,0.5)); transition: 0.3s; }
  .case-card:hover .case-img img { transform: scale(1.1) rotate(3deg); }

  .case-name { font-size: 18px; font-weight: 900; letter-spacing: 1px; color: #fff; margin-bottom: 5px; }
  .case-quote { font-size: 11px; color: var(--text-muted); margin-bottom: 15px; height: 28px; line-height: 1.3; }
  
  .price-block { display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 15px; }
  .price-old { font-size: 13px; color: var(--text-muted); text-decoration: line-through; font-weight: 700; }
  .price-new { font-size: 20px; color: var(--accent-green); font-weight: 900; text-shadow: 0 0 10px rgba(0,255,136,0.3); }

  .btn-peek { background: transparent; border: 1px solid var(--border); color: var(--text-muted); padding: 6px 12px; border-radius: 8px; font-size: 12px; font-weight: 600; cursor: pointer; transition: 0.2s; margin-bottom: 10px; display: inline-flex; align-items: center; gap: 5px; }
  .btn-peek:hover { color: #fff; border-color: var(--accent); }
  
  .btn-open-small { background: linear-gradient(135deg, #00ff88, #00b366); color: #000; border: none; border-radius: 10px; padding: 12px 24px; font-size: 14px; font-weight: 900; text-transform: uppercase; width: 100%; cursor: pointer; transition: 0.2s; box-shadow: 0 4px 15px rgba(0,255,136,0.2); }
  .btn-open-small:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0,255,136,0.4); }

  /* --- ЭКРАН КОНКРЕТНОГО КЕЙСА --- */
  .case-screen { display: none; }
  .case-screen.active { display: block; animation: fadeIn 0.3s; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

  /* Центр */
  .case-center { text-align: center; margin-bottom: 30px; }
  .case-center-img { width: 180px; height: 180px; margin: 0 auto 20px; display: flex; justify-content: center; align-items: center; filter: drop-shadow(0 0 40px rgba(0,229,255,0.2)); }
  .case-center-img img { width: 100%; height: 100%; object-fit: contain; }
  .case-center h1 { font-size: 42px; font-weight: 900; text-transform: uppercase; letter-spacing: 4px; margin-bottom: 10px; background: linear-gradient(180deg, #fff, #b0b8c8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .case-center .price-tag { font-size: 24px; color: var(--accent-green); font-weight: 900; margin-bottom: 30px; text-shadow: 0 0 15px rgba(0,255,136,0.4); }
  
  .case-actions { display: flex; justify-content: center; gap: 15px; flex-wrap: wrap; }
  .btn-open-big { background: linear-gradient(135deg, #00ff88, #00b366); color: #000; border: none; border-radius: 14px; padding: 18px 60px; font-size: 20px; font-weight: 900; text-transform: uppercase; letter-spacing: 1px; cursor: pointer; transition: 0.3s; box-shadow: 0 0 30px rgba(0,255,136,0.3); }
  .btn-open-big:hover { transform: translateY(-3px); box-shadow: 0 0 50px rgba(0,255,136,0.5); }
  .btn-back { background: rgba(255,255,255,0.05); color: #fff; border: 1px solid var(--border); border-radius: 14px; padding: 18px 40px; font-size: 16px; font-weight: 700; text-transform: uppercase; cursor: pointer; transition: 0.2s; }
  .btn-back:hover { background: rgba(255,255,255,0.1); }

  /* Возможный дроп */
  .drop-title { font-size: 18px; font-weight: 800; text-transform: uppercase; color: var(--text-muted); margin-bottom: 20px; text-align: center; letter-spacing: 2px; }
  .drop-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 15px; }
  
  .drop-item { background: var(--bg-panel); border: 2px solid var(--border); border-radius: 16px; padding: 0; text-align: center; position: relative; overflow: hidden; aspect-ratio: 1; display: flex; justify-content: center; align-items: center; }
  .drop-item img { width: 100%; height: 100%; object-fit: cover; }
  .drop-item .pr { position: absolute; bottom: 0; left: 0; right: 0; background: rgba(0,0,0,0.7); color: #fff; font-weight: 900; font-size: 14px; padding: 8px 0; z-index: 2; backdrop-filter: blur(4px); }
  
  .drop-item.common { border-color: rgba(160,174,192,0.3); }
  .drop-item.rare { border-color: rgba(0,229,255,0.4); box-shadow: 0 0 15px rgba(0,229,255,0.1); }
  .drop-item.epic { border-color: rgba(168,85,247,0.4); box-shadow: 0 0 15px rgba(168,85,247,0.1); }
  .drop-item.legendary { border-color: rgba(241,196,15,0.6); box-shadow: 0 0 20px rgba(241,196,15,0.2); }

  /* --- ПОЛНОЭКРАННАЯ КРУТКА --- */
  .fullscreen-spin { position: fixed; inset: 0; background: rgba(10, 12, 17, 0.98); z-index: 2000; display: none; flex-direction: column; justify-content: center; align-items: center; overflow: hidden; backdrop-filter: blur(10px); }
  .fullscreen-spin.show { display: flex; }
  .fs-title { font-size: 32px; font-weight: 900; text-transform: uppercase; letter-spacing: 4px; margin-bottom: 40px; text-shadow: 0 0 20px rgba(0,229,255,0.3); }
  .fs-spin-window { width: 100%; max-width: 1200px; height: 180px; background: linear-gradient(180deg, rgba(21, 24, 34, 0.9), rgba(10, 12, 17, 0.9)); border-top: 3px solid var(--accent); border-bottom: 3px solid var(--accent); position: relative; overflow: hidden; box-shadow: 0 0 60px rgba(0,229,255,0.15); }
  .fs-spin-track { display: flex; align-items: center; gap: 10px; height: 100%; padding: 0 20px; position: absolute; left: 0; }
  
  .fs-spin-item { flex-shrink: 0; width: 120px; height: 120px; border-radius: 12px; background: #fff; border: 2px solid var(--border); display: flex; flex-direction: column; justify-content: center; align-items: center; position: relative; overflow: hidden; }
  .fs-spin-item img { width: 100%; height: 100%; object-fit: cover; }
  .fs-spin-item .pr { position: absolute; bottom: 0; left: 0; right: 0; background: rgba(0,0,0,0.7); color: #fff; font-weight: 900; font-size: 14px; padding: 6px 0; z-index: 2; }
  
  .fs-pointer { position: absolute; top: 0; bottom: 0; left: 50%; width: 4px; background: var(--gold); z-index: 10; transform: translateX(-50%); box-shadow: 0 0 20px var(--gold); }
  .fs-pointer::before, .fs-pointer::after { content: ''; position: absolute; left: 50%; transform: translateX(-50%); border-left: 12px solid transparent; border-right: 12px solid transparent; }
  .fs-pointer::before { top: 0; border-top: 15px solid var(--gold); }
  .fs-pointer::after { bottom: 0; border-bottom: 15px solid var(--gold); }

  /* Цвета в крутке */
  .fs-spin-item.common { border-color: rgba(160,174,192,0.5); }
  .fs-spin-item.rare { border-color: rgba(0,229,255,0.6); }
  .fs-spin-item.epic { border-color: rgba(168,85,247,0.6); }
  .fs-spin-item.legendary { border-color: rgba(241,196,15,0.8); box-shadow: 0 0 20px rgba(241,196,15,0.4); }

  /* УВЕДОМЛЕНИЕ СВЕРХУ */
  .top-toast { position: fixed; top: -150px; left: 50%; transform: translateX(-50%); background: linear-gradient(180deg, #1a2233, #0a0c11); border: 2px solid var(--gold); border-radius: 20px; padding: 20px 50px; text-align: center; box-shadow: 0 0 50px rgba(241,196,15,0.4); z-index: 4000; transition: top 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); min-width: 320px; }
  .top-toast.show { top: 30px; }
  .top-toast .t-title { font-size: 14px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 3px; font-weight: 800; margin-bottom: 5px; }
  .top-toast .t-amount { font-size: 42px; font-weight: 900; color: var(--gold); text-shadow: 0 0 20px rgba(241,196,15,0.5); line-height: 1; }
  .top-toast.gold-win { border-color: #fff; box-shadow: 0 0 80px rgba(241,196,15,0.8); }

  /* МОДАЛКА СОДЕРЖИМОГО */
  .content-modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(8px); display: none; justify-content: center; align-items: center; z-index: 3000; padding: 20px; }
  .content-modal-overlay.show { display: flex; }
  .content-modal-box { background: var(--bg-panel); border: 2px solid var(--border); border-radius: 24px; padding: 30px; max-width: 600px; width: 100%; text-align: center; animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); max-height: 90vh; overflow-y: auto; box-shadow: 0 20px 50px rgba(0,0,0,0.8); }
  @keyframes popIn { from { transform: scale(0.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .content-modal-box h2 { font-size: 24px; font-weight: 900; margin-bottom: 5px; text-transform: uppercase; letter-spacing: 2px; color: #fff; }
  .content-modal-box .modal-sub { color: var(--accent-green); font-weight: 700; margin-bottom: 25px; }
  
  .modal-items-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 12px; margin-bottom: 25px; }
  
  .modal-actions { display: flex; gap: 10px; }
  .modal-actions button { flex: 1; padding: 16px; border-radius: 12px; font-size: 16px; font-weight: 900; cursor: pointer; border: none; transition: 0.2s; text-transform: uppercase; }
  .btn-cancel { background: rgba(255,255,255,0.1); color: #fff; }
  .btn-cancel:hover { background: rgba(255,255,255,0.2); }
  .btn-spin { background: linear-gradient(135deg, #00ff88, #00b366); color: #000; box-shadow: 0 0 20px rgba(0,255,136,0.3); }
  .btn-spin:hover { transform: translateY(-2px); box-shadow: 0 0 30px rgba(0,255,136,0.5); }

  @media (max-width: 900px) {
    .cases-grid { grid-template-columns: repeat(2, 1fr); gap: 15px; }
    .case-img { width: 90px; height: 90px; }
    .case-name { font-size: 14px; }
    .price-new { font-size: 16px; }
    .case-center h1 { font-size: 28px; letter-spacing: 2px; }
    .case-center-img { width: 120px; height: 120px; }
    .btn-open-big { padding: 14px 30px; font-size: 16px; }
    .btn-back { padding: 14px 20px; font-size: 14px; }
    .fs-spin-window { height: 120px; }
    .fs-spin-item { width: 90px; height: 90px; }
    .top-toast { min-width: 90%; padding: 15px; }
    .top-toast .t-amount { font-size: 32px; }
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-left">
    <div class="topbar-logo">KINGWIN</div>
    <a href="/" class="back-btn">← На главную</a>
  </div>
  <div class="balance-badge" id="balanceBadge">
    Баланс: <span id="balanceVal">0.00</span> ₽
  </div>
</div>

<div class="container">

  <!-- СПИСОК ВСЕХ КЕЙСОВ -->
  <div class="all-cases-screen" id="allCasesScreen">
    <h1 class="section-title">📦 КЕЙСЫ</h1>
    <div class="subtitle">✦ Выбери свой кейс и испытай удачу ✦</div>
    <div class="cases-grid" id="casesGrid"></div>
  </div>

  <!-- ЭКРАН КОНКРЕТНОГО КЕЙСА -->
  <div class="case-screen" id="caseScreen">
    <div class="case-center">
      <div class="case-center-img" id="caseCenterImg"></div>
      <h1 id="caseCenterName">Новичок</h1>
      <div class="price-tag" id="caseCenterPrice">39.99 ₽</div>
      
      <div class="case-actions">
        <button class="btn-open-big" id="btnCenterOpen">ОТКРЫТЬ</button>
        <button class="btn-back" onclick="backToAllCases()">ВЫБРАТЬ ДРУГОЙ</button>
      </div>
    </div>

    <div class="drop-title">Возможный дроп</div>
    <div class="drop-grid" id="dropGrid"></div>
  </div>

</div>

<!-- ПОЛНОЭКРАННАЯ КРУТКА -->
<div class="fullscreen-spin" id="fsSpinOverlay">
  <div class="fs-title" id="fsTitle">Открытие...</div>
  <div class="fs-spin-window">
    <div class="fs-pointer"></div>
    <div class="fs-spin-track" id="fsSpinTrack"></div>
  </div>
</div>

<!-- УВЕДОМЛЕНИЕ СВЕРХУ -->
<div class="top-toast" id="topToast">
  <div class="t-title">ВЫПАЛО</div>
  <div class="t-amount" id="toastAmount">0 ₽</div>
</div>

<!-- МОДАЛКА СОДЕРЖИМОГО КЕЙСА -->
<div class="content-modal-overlay" id="contentModalOverlay">
  <div class="content-modal-box">
    <h2 id="contentModalTitle">Содержимое</h2>
    <div class="modal-sub" id="contentModalSub">Цена: 0 ₽</div>
    <div class="modal-items-grid" id="contentPrizesGrid"></div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeContentModal()">ЗАКРЫТЬ</button>
      <button class="btn-spin" id="contentBtnSpin">КРУТИТЬ</button>
    </div>
  </div>
</div>

<script>
const PLAYER_KEY = 'kingwin_player_id';
let playerId = localStorage.getItem(PLAYER_KEY);
let casesData = [];
let currentCase = null;
let isSpinning = false;

function fmt(n){ return (Math.round((n||0)*100)/100).toLocaleString('ru-RU'); }

function getRarityClass(price, casePrice) {
  // Определяем редкость по отношению к цене кейса
  if (price >= casePrice * 10) return 'legendary';
  if (price >= casePrice * 3) return 'epic';
  if (price >= casePrice) return 'rare';
  return 'common';
}

// Функция для картинок. Если картинки нет, покажет эмодзи.
function getCaseImage(name) {
  const map = {
    'Новичок': 'case_novice.png',
    'Бродяга': 'case_wanderer.png',
    'Бывалый': 'case_experienced.png',
    'Странник': 'case_stranger.png',
    'Рыцарь': 'case_knight.png',
    'Барон': 'case_baron.png',
    'Граф': 'case_count.png',
    'Герцог': 'case_duke.png',
    'Король': 'case_king.png',
    'Царский': 'case_royal.png'
  };
  return map[name] || 'case_novice.png';
}

async function loadBalance() {
  if (!playerId) return;
  try {
    const r = await fetch('/api/guest/me?id=' + encodeURIComponent(playerId));
    const d = await r.json();
    if (r.ok && d.guest) {
      const total = (parseFloat(d.guest.bonus_balance) || 0) + (parseFloat(d.guest.deposit_balance) || 0);
      document.getElementById('balanceVal').textContent = total.toFixed(2);
    }
  } catch(e) {}
}

async function initCases() {
  await loadBalance();
  
  if (!playerId) {
    document.getElementById('casesGrid').innerHTML = `<div style="grid-column: 1/-1; text-align:center; padding:40px; color:#8b92a5;">Войдите в аккаунт, чтобы играть</div>`;
    return;
  }

  try {
    const r = await fetch('/api/cases/list?guest_id=' + encodeURIComponent(playerId));
    casesData = await r.json();
    casesData.sort((a,b) => a.price - b.price);

    const grid = document.getElementById('casesGrid');
    grid.innerHTML = '';

    casesData.forEach((c) => {
      const div = document.createElement('div');
      // Определяем редкость для рамки
      let rarity = 'common';
      if (c.price >= 1000) rarity = 'legendary';
      else if (c.price >= 400) rarity = 'epic';
      else if (c.price >= 100) rarity = 'rare';
      
      div.className = `case-card ${rarity}`;
      
      div.onclick = () => { 
        if(c.available) {
          openCaseScreen(c);
        } else {
          alert('Кейс недоступен для вашего ранга');
        }
      };

      // Цена со скидкой (эмуляция для красоты)
      const oldPrice = c.price * 1.2;

      div.innerHTML = `
        <div class="case-img">
          <img src="${getCaseImage(c.name)}" alt="${c.name}" onerror="this.style.display='none'; this.parentElement.innerHTML='📦';">
        </div>
        <div class="case-name">${c.name}</div>
        <div class="case-quote">✦ Испытай удачу ✦</div>
        <div class="price-block">
          <span class="price-old">₽${fmt(oldPrice)}</span>
          <span class="price-new">₽${fmt(c.price)}</span>
        </div>
        <button class="btn-peek" onclick="event.stopPropagation(); openContentModal('${c.name}')">👁 Содержимое</button>
        <button class="btn-open-small" onclick="event.stopPropagation(); openCaseScreen('${c.name}')">🎁 ОТКРЫТЬ</button>
      `;

      grid.appendChild(div);
    });
  } catch(e) {
    console.error(e);
  }
}

function openCaseScreen(c) {
  if (typeof c === 'string') {
    c = casesData.find(x => x.name === c);
  }
  if (!c) return;
  currentCase = c;
  
  document.getElementById('allCasesScreen').classList.add('hidden');
  document.getElementById('caseScreen').classList.add('active');

  document.getElementById('caseCenterImg').innerHTML = `<img src="${getCaseImage(c.name)}" alt="${c.name}" onerror="this.style.display='none'; this.parentElement.innerHTML='📦';">`;
  document.getElementById('caseCenterName').textContent = c.name;
  document.getElementById('caseCenterPrice').textContent = `${fmt(c.price)} ₽`;
  
  const btn = document.getElementById('btnCenterOpen');
  btn.textContent = `ОТКРЫТЬ ЗА ${fmt(c.price)} ₽`;
  btn.onclick = startSpin;

  const dropGrid = document.getElementById('dropGrid');
  dropGrid.innerHTML = c.prizes.map(p => {
    const rar = getRarityClass(p, c.price);
    return `
      <div class="drop-item ${rar}">
        <img src="money.png" alt="prize" onerror="this.style.display='none'">
        <div class="pr">₽${fmt(p)}</div>
      </div>
    `;
  }).join('');
}

function backToAllCases() {
  document.getElementById('caseScreen').classList.remove('active');
  document.getElementById('allCasesScreen').classList.remove('hidden');
  currentCase = null;
}

// Модалка содержимого
function openContentModal(caseName) {
  const c = casesData.find(x => x.name === caseName);
  if (!c) return;

  document.getElementById('contentModalTitle').textContent = c.name;
  document.getElementById('contentModalSub').textContent = `Цена кейса: ₽${fmt(c.price)}`;
  
  const grid = document.getElementById('contentPrizesGrid');
  grid.innerHTML = c.prizes.map(p => {
    const rar = getRarityClass(p, c.price);
    return `
      <div class="drop-item ${rar}" style="aspect-ratio:1; border:2px solid;">
        <img src="money.png" alt="prize" onerror="this.style.display='none'">
        <div class="pr">₽${fmt(p)}</div>
      </div>
    `;
  }).join('');

  const btn = document.getElementById('contentBtnSpin');
  btn.textContent = `Крутить за ${fmt(c.price)} ₽`;
  btn.onclick = () => {
    closeContentModal();
    openCaseScreen(c);
    setTimeout(() => startSpin(), 100);
  };

  document.getElementById('contentModalOverlay').classList.add('show');
}

function closeContentModal() {
  document.getElementById('contentModalOverlay').classList.remove('show');
}

// ЗАПУСК ПРОКРУТКИ
async function startSpin() {
  if (isSpinning || !currentCase) return;
  isSpinning = true;

  // Проверка баланса на клиенте (грубая)
  const balText = document.getElementById('balanceVal').textContent.replace(/\s/g, '').replace('₽', '');
  if (parseFloat(balText) < currentCase.price) {
    alert('Недостаточно средств');
    isSpinning = false;
    return;
  }

  document.getElementById('fsSpinOverlay').classList.add('show');
  document.getElementById('fsTitle').textContent = currentCase.name;
  
  const track = document.getElementById('fsSpinTrack');
  track.innerHTML = '';
  track.style.transition = 'none';
  track.style.transform = 'translateX(0)';

  try {
    const res = await fetch('/api/cases/open', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ guest_id: playerId, case_name: currentCase.name })
    });
    const data = await res.json();
    
    if (!res.ok) {
      document.getElementById('fsSpinOverlay').classList.remove('show');
      alert(data.error || 'Ошибка');
      isSpinning = false;
      return;
    }

    const prize = data.prize;
    loadBalance();

    const allPrizes = currentCase.prizes || [5, 10, 20];
    
    for(let i=0; i<50; i++){
      let val = allPrizes[Math.floor(Math.random()*allPrizes.length)];
      if (i === 45) val = prize; 
      
      const rar = getRarityClass(val, currentCase.price);
      track.innerHTML += `
        <div class="fs-spin-item ${rar}">
          <img src="money.png" onerror="this.style.display='none'">
          <div class="pr">₽${fmt(val)}</div>
        </div>
      `;
    }

    const containerWidth = document.querySelector('.fs-spin-window').clientWidth;
    const itemWidth = 130; 
    const centerOffset = containerWidth / 2;
    const randomOffset = (Math.random() * 60) - 30;
    const targetScroll = (45 * itemWidth) - centerOffset + (itemWidth / 2) + randomOffset;

    setTimeout(() => {
      track.style.transition = 'transform 5s cubic-bezier(0.1, 0.8, 0.1, 1)';
      track.style.transform = `translateX(-${targetScroll}px)`;
    }, 50);

    setTimeout(() => {
      document.getElementById('fsSpinOverlay').classList.remove('show');
      showTopToast(prize);
      loadBalance();
      isSpinning = false;
    }, 5100);

  } catch(e) {
    document.getElementById('fsSpinOverlay').classList.remove('show');
    isSpinning = false;
  }
}

function showTopToast(prize) {
  const toast = document.getElementById('topToast');
  document.getElementById('toastAmount').textContent = `+${fmt(prize)} ₽`;
  
  if (currentCase && prize >= currentCase.price * 5) {
    toast.classList.add('gold-win');
  } else {
    toast.classList.remove('gold-win');
  }
  
  toast.classList.add('show');
  
  setTimeout(() => {
    toast.classList.remove('show');
  }, 4000);
}

initCases();
</script>
