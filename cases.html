<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>KINGWIN — Кейсы</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-main: #0c0e14; 
    --bg-panel: #151822; 
    --bg-dark: #0a0c11;
    --accent: #00e5ff; 
    --accent-green: #00ff88;
    --text-main: #fff; 
    --text-muted: #8b92a5;
    --border: rgba(255,255,255,0.05);
    --red: #ff4d4d; 
  }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Montserrat', sans-serif; }
  body { background: var(--bg-main); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; }

  /* TOPBAR */
  .topbar { display: flex; justify-content: space-between; align-items: center; padding: 15px 30px; background: var(--bg-dark); border-bottom: 1px solid var(--border); }
  .topbar-left { display: flex; align-items: center; gap: 20px; }
  .topbar-logo { font-size: 20px; font-weight: 900; letter-spacing: 2px; background: linear-gradient(135deg, #00e5ff, #0077ff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .back-btn { color: var(--text-muted); text-decoration: none; font-size: 14px; font-weight: 600; transition: 0.2s; display: flex; align-items: center; gap: 8px; }
  .back-btn:hover { color: #fff; }
  .balance-badge { display: flex; align-items: center; gap: 8px; background: rgba(0,0,0,0.5); border: 1px solid rgba(0,229,255,0.3); padding: 8px 16px; border-radius: 20px; font-size: 14px; font-weight: 700; cursor: pointer; }
  .balance-badge span { color: var(--accent); }

  /* MAIN CONTENT */
  .container { max-width: 1200px; margin: 0 auto; padding: 40px 20px; flex: 1; width: 100%; }
  .section-title { font-size: 24px; font-weight: 900; text-transform: uppercase; letter-spacing: 2px; text-align: center; margin-bottom: 30px; color: #fff; }

  /* CASES GRID */
  .cases-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 15px; margin-bottom: 40px; }
  
  .case-card { background: var(--bg-panel); border: 1px solid var(--border); border-radius: 16px; padding: 20px 10px; display: flex; flex-direction: column; align-items: center; text-align: center; cursor: pointer; transition: 0.3s; position: relative; overflow: hidden; }
  .case-card:hover { transform: translateY(-5px); border-color: rgba(255,255,255,0.2); box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
  .case-card.active { border-color: var(--accent); box-shadow: 0 0 20px rgba(0,229,255,0.15); }
  
  .case-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 4px; background: #333; transition: 0.3s; }
  .case-card[data-rank="0"]::before { background: #cd7f32; }
  .case-card[data-rank="1"]::before { background: #c0c0c0; }
  .case-card[data-rank="2"]::before { background: #f1c40f; }
  .case-card[data-rank="3"]::before { background: #e5e4e2; }
  .case-card[data-rank="4"]::before { background: #b9f2ff; }
  .case-card[data-rank="5"]::before { background: #d4af37; }

  .case-name { font-size: 11px; font-weight: 800; text-transform: uppercase; color: var(--text-muted); margin-bottom: 15px; letter-spacing: 1px; }
  .case-img { width: 70px; height: 70px; margin-bottom: 15px; position: relative; display: flex; justify-content: center; align-items: center; }
  .case-img svg { width: 100%; height: 100%; filter: drop-shadow(0 5px 15px rgba(0,0,0,0.5)); }
  
  .case-price { font-size: 14px; font-weight: 900; color: var(--accent-green); margin-bottom: 15px; }
  .case-price span { font-size: 10px; color: var(--text-muted); text-decoration: line-through; margin-left: 4px; }
  
  .btn-select { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: #fff; padding: 8px 15px; border-radius: 8px; font-size: 12px; font-weight: 700; width: 100%; cursor: pointer; transition: 0.2s; text-transform: uppercase; }
  .case-card:hover .btn-select { background: rgba(255,255,255,0.1); }
  .case-card.active .btn-select { background: var(--accent); color: #000; border-color: var(--accent); }

  /* ROULETTE AREA */
  .roulette-container { background: var(--bg-panel); border: 1px solid var(--border); border-radius: 24px; padding: 30px; margin-bottom: 30px; display: none; position: relative; }
  .roulette-container.show { display: block; animation: fadeIn 0.4s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: none; } }

  .roulette-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
  .roulette-title { font-size: 20px; font-weight: 900; text-transform: uppercase; }

  .spin-window { position: relative; height: 140px; background: var(--bg-dark); border-radius: 16px; overflow: hidden; margin-bottom: 30px; border: 1px solid var(--border); box-shadow: inset 0 0 30px rgba(0,0,0,0.8); }
  .spin-track { display: flex; align-items: center; gap: 10px; height: 100%; padding: 0 20px; position: absolute; left: 0; }
  
  .spin-item { flex-shrink: 0; width: 110px; height: 110px; border-radius: 12px; background: #1e2230; border: 2px solid var(--border); display: flex; flex-direction: column; justify-content: center; align-items: center; font-weight: 900; font-size: 18px; gap: 4px; position: relative; }
  .spin-item span { font-size: 10px; color: var(--text-muted); font-weight: 600; }
  
  /* Курсор */
  .spin-pointer { position: absolute; top: 0; bottom: 0; left: 50%; width: 4px; background: var(--accent); z-index: 10; transform: translateX(-50%); box-shadow: 0 0 15px var(--accent); }
  .spin-pointer::before, .spin-pointer::after { content: ''; position: absolute; left: 50%; transform: translateX(-50%); border-left: 8px solid transparent; border-right: 8px solid transparent; }
  .spin-pointer::before { top: 0; border-top: 10px solid var(--accent); }
  .spin-pointer::after { bottom: 0; border-bottom: 10px solid var(--accent); }

  /* Цвета призов */
  .spin-item.r0 { color: #fff; }
  .spin-item.r1 { border-color: rgba(63,191,127,0.5); color: #3fbf7f; background: rgba(63,191,127,0.1); }
  .spin-item.r2 { border-color: rgba(0,119,255,0.5); color: #00e5ff; background: rgba(0,119,255,0.1); }
  .spin-item.r3 { border-color: rgba(168,85,247,0.5); color: #d8b4fe; background: rgba(168,85,247,0.1); }
  .spin-item.r4 { border-color: rgba(255,215,0,0.5); color: #ffd700; background: rgba(255,215,0,0.1); box-shadow: 0 0 15px rgba(255,215,0,0.2); }

  .btn-spin { width: 100%; background: linear-gradient(135deg, #00e5ff, #0077ff); color: #000; border: none; border-radius: 12px; padding: 18px; font-size: 20px; font-weight: 900; text-transform: uppercase; letter-spacing: 1px; cursor: pointer; transition: 0.3s; box-shadow: 0 0 20px rgba(0,229,255,0.3); display: flex; justify-content: center; align-items: center; gap: 10px; }
  .btn-spin:hover { transform: translateY(-2px); box-shadow: 0 0 30px rgba(0,229,255,0.5); }
  .btn-spin:disabled { opacity: 0.5; cursor: not-allowed; transform: none; box-shadow: none; }

  /* WIN MODAL */
  .win-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(8px); display: none; justify-content: center; align-items: center; z-index: 3000; }
  .win-overlay.show { display: flex; }
  .win-modal { background: var(--bg-panel); border: 1px solid var(--accent); border-radius: 24px; padding: 40px; text-align: center; max-width: 400px; width: 100%; box-shadow: 0 0 50px rgba(0,229,255,0.2); animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
  @keyframes popIn { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .win-title { font-size: 24px; font-weight: 900; margin-bottom: 10px; }
  .win-amount { font-size: 48px; font-weight: 900; color: var(--accent-green); text-shadow: 0 0 20px rgba(0,255,136,0.5); margin: 20px 0; }
  .btn-close-win { background: var(--accent); color: #000; border: none; border-radius: 12px; padding: 15px 40px; font-size: 16px; font-weight: 900; cursor: pointer; width: 100%; }

  /* МОДАЛКА СОДЕРЖИМОГО КЕЙСА */
  .content-modal { background: var(--bg-panel); border: 1px solid var(--accent); border-radius: 24px; padding: 30px; text-align: center; max-width: 600px; width: 100%; box-shadow: 0 0 50px rgba(0,229,255,0.2); animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
  .content-modal h2 { font-size: 24px; font-weight: 900; margin-bottom: 20px; text-transform: uppercase; }
  .prizes-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 10px; margin-bottom: 25px; }
  .prize-item { background: #1e2230; border: 1px solid var(--border); border-radius: 12px; padding: 15px 5px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-weight: 900; font-size: 16px; }
  .prize-item span { font-size: 10px; color: var(--text-muted); font-weight: 600; margin-top: 5px; }
  .prize-item.r0 { border-color: rgba(255,255,255,0.1); color: #fff; }
  .prize-item.r1 { border-color: rgba(63,191,127,0.5); color: #3fbf7f; background: rgba(63,191,127,0.1); }
  .prize-item.r2 { border-color: rgba(0,119,255,0.5); color: #00e5ff; background: rgba(0,119,255,0.1); }
  .prize-item.r3 { border-color: rgba(168,85,247,0.5); color: #d8b4fe; background: rgba(168,85,247,0.1); }
  .prize-item.r4 { border-color: rgba(255,215,0,0.5); color: #ffd700; background: rgba(255,215,0,0.1); box-shadow: 0 0 15px rgba(255,215,0,0.2); }

  .modal-actions { display: flex; gap: 10px; }
  .modal-actions button { flex: 1; padding: 15px; border-radius: 12px; font-size: 16px; font-weight: 900; cursor: pointer; border: none; transition: 0.2s; }
  .btn-cancel { background: rgba(255,255,255,0.1); color: #fff; }
  .btn-cancel:hover { background: rgba(255,255,255,0.2); }
  .btn-confirm { background: linear-gradient(135deg, #00ff88, #00b366); color: #000; box-shadow: 0 0 20px rgba(0,255,136,0.3); }
  .btn-confirm:hover { transform: translateY(-2px); box-shadow: 0 0 30px rgba(0,255,136,0.5); }

  @media (max-width: 900px) {
    .cases-grid { grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .case-name { font-size: 10px; }
    .case-img { width: 50px; height: 50px; }
    .case-price { font-size: 12px; }
    .btn-select { font-size: 10px; padding: 6px; }
    .topbar { padding: 15px; }
    .roulette-container { padding: 15px; }
  }
  @media (max-width: 500px) {
    .cases-grid { grid-template-columns: repeat(2, 1fr); }
    .content-modal { padding: 20px; }
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-left">
    <div class="topbar-logo">KINGWIN</div>
    <a href="/" class="back-btn">← На главную</a>
  </div>
  <div class="balance-badge" id="balanceBadge">
    Баланс: <span id="balanceVal">0.00</span> ₽
  </div>
</div>

<div class="container">
  <div class="section-title">Кейсы</div>

  <!-- Сетка кейсов -->
  <div class="cases-grid" id="casesGrid"></div>

  <!-- Зона прокрутки (появляется после клика на кейс) -->
  <div class="roulette-container" id="rouletteContainer">
    <div class="roulette-header">
      <div class="roulette-title" id="rouletteCaseName">Новичок</div>
    </div>

    <div class="spin-window">
      <div class="spin-pointer"></div>
      <div class="spin-track" id="spinTrack"></div>
    </div>

    <button class="btn-spin" id="btnSpin" disabled>Крутить</button>
  </div>
</div>

<!-- Модалка содержимого кейса (Стартовая) -->
<div class="win-overlay" id="caseContentOverlay">
  <div class="content-modal">
    <h2 id="contentTitle">Содержимое кейса</h2>
    <div class="prizes-grid" id="prizesGrid"></div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeContentModal()">Отмена</button>
      <button class="btn-confirm" id="btnStartSpin" onclick="startSpinFromModal()">Крутить</button>
    </div>
  </div>
</div>

<!-- Модалка выигрыша -->
<div class="win-overlay" id="winOverlay">
  <div class="win-modal">
    <div class="win-title">Вы выиграли!</div>
    <div class="win-amount" id="winAmount">0 ₽</div>
    <button class="btn-close-win" onclick="closeWin()">Забрать</button>
  </div>
</div>

<script>
const PLAYER_KEY = 'kingwin_player_id';
let playerId = localStorage.getItem(PLAYER_KEY);
let casesData = [];
let selectedCase = null;
let isSpinning = false;

function fmt(n){ return (Math.round((n||0)*100)/100).toLocaleString('ru-RU'); }

async function loadBalance() {
  if (!playerId) return;
  try {
    const r = await fetch('/api/guest/me?id=' + encodeURIComponent(playerId));
    const d = await r.json();
    if (r.ok && d.guest) {
      const total = (parseFloat(d.guest.bonus_balance) || 0) + (parseFloat(d.guest.deposit_balance) || 0);
      document.getElementById('balanceVal').textContent = total.toFixed(2);
    }
  } catch(e) {}
}

// Цвета для редкости призов
function getRarityClass(val) {
  if (val >= 1000) return 'r4';
  if (val >= 200) return 'r3';
  if (val >= 50) return 'r2';
  if (val > 0) return 'r1';
  return 'r0';
}

// Иконки для кейсов
const caseIcons = {
  'Новичок': '<svg viewBox="0 0 100 100" fill="none"><circle cx="50" cy="50" r="40" fill="rgba(205,127,50,0.2)" stroke="#cd7f32" stroke-width="2"/><path d="M50 20 L55 45 L80 50 L55 55 L50 80 L45 55 L20 50 L45 45 Z" fill="#cd7f32"/></svg>',
  'Бронза': '<svg viewBox="0 0 100 100" fill="none"><circle cx="50" cy="50" r="40" fill="rgba(192,192,192,0.2)" stroke="#c0c0c0" stroke-width="2"/><path d="M50 20 L55 45 L80 50 L55 55 L50 80 L45 55 L20 50 L45 45 Z" fill="#c0c0c0"/></svg>',
  'Сильвер': '<svg viewBox="0 0 100 100" fill="none"><circle cx="50" cy="50" r="40" fill="rgba(241,196,15,0.2)" stroke="#f1c40f" stroke-width="2"/><path d="M50 20 L55 45 L80 50 L55 55 L50 80 L45 55 L20 50 L45 45 Z" fill="#f1c40f"/></svg>',
  'Голд': '<svg viewBox="0 0 100 100" fill="none"><circle cx="50" cy="50" r="40" fill="rgba(229,228,226,0.2)" stroke="#e5e4e2" stroke-width="2"/><path d="M50 20 L55 45 L80 50 L55 55 L50 80 L45 55 L20 50 L45 45 Z" fill="#e5e4e2"/></svg>',
  'Платина': '<svg viewBox="0 0 100 100" fill="none"><circle cx="50" cy="50" r="40" fill="rgba(185,242,255,0.2)" stroke="#b9f2ff" stroke-width="2"/><path d="M50 20 L55 45 L80 50 L55 55 L50 80 L45 55 L20 50 L45 45 Z" fill="#b9f2ff"/></svg>',
  'Алмаз': '<svg viewBox="0 0 100 100" fill="none"><circle cx="50" cy="50" r="40" fill="rgba(212,175,55,0.2)" stroke="#d4af37" stroke-width="2"/><path d="M50 20 L55 45 L80 50 L55 55 L50 80 L45 55 L20 50 L45 45 Z" fill="#d4af37"/></svg>',
  'Королевский': '<svg viewBox="0 0 100 100" fill="none"><circle cx="50" cy="50" r="40" fill="rgba(255,215,0,0.2)" stroke="#ffd700" stroke-width="2"/><path d="M50 20 L55 45 L80 50 L55 55 L50 80 L45 55 L20 50 L45 45 Z" fill="#ffd700"/></svg>'
};

async function initCases() {
  await loadBalance();
  
  if (!playerId) {
    document.getElementById('casesGrid').innerHTML = `<div style="grid-column: 1/-1; text-align:center; padding:40px; color:#8b92a5;">Войдите в аккаунт, чтобы играть</div>`;
    return;
  }

  try {
    const r = await fetch('/api/cases/list?guest_id=' + encodeURIComponent(playerId));
    casesData = await r.json();
    
    // Сортируем по цене
    casesData.sort((a,b) => a.price - b.price);

    const grid = document.getElementById('casesGrid');
    grid.innerHTML = '';

    casesData.forEach((c, idx) => {
      const div = document.createElement('div');
      div.className = `case-card ${c.available ? '' : 'locked'}`;
      div.dataset.rank = c.minRank;
      // Клик по карточке открывает модалку с содержимым
      div.onclick = () => { 
        if(c.available) {
          openContentModal(c);
        } else {
          alert('Этот кейс недоступен для вашего ранга');
        }
      };

      div.innerHTML = `
        <div class="case-name">${c.name}</div>
        <div class="case-img">${caseIcons[c.name] || ''}</div>
        <div class="case-price">${fmt(c.price)} ₽</div>
        <button class="btn-select">Открыть</button>
      `;

      grid.appendChild(div);
    });
  } catch(e) {
    console.error(e);
  }
}

// Открытие модалки содержимого
function openContentModal(c) {
  selectedCase = c;
  
  // Подсветка карточки
  document.querySelectorAll('.case-card').forEach(el => el.classList.remove('active'));
  const cards = Array.from(document.querySelectorAll('.case-card'));
  const idx = casesData.indexOf(c);
  if(cards[idx]) cards[idx].classList.add('active');

  document.getElementById('contentTitle').textContent = `Содержимое кейса "${c.name}"`;
  
  // Заполняем сетку призов
  const grid = document.getElementById('prizesGrid');
  grid.innerHTML = c.prizes.map(p => {
    const rar = getRarityClass(p.v);
    return `
      <div class="prize-item ${rar}">
        ${p.v} ₽
        <span>${p.v > 0 ? 'Приз' : 'Пусто'}</span>
      </div>
    `;
  }).join('');

  // Настраиваем кнопку
  const btn = document.getElementById('btnStartSpin');
  btn.textContent = `Крутить за ${fmt(c.price)} ₽`;
  
  document.getElementById('caseContentOverlay').classList.add('show');
}

function closeContentModal() {
  document.getElementById('caseContentOverlay').classList.remove('show');
}

// Запуск прокрутки из модалки
function startSpinFromModal() {
  closeContentModal();
  
  // Показываем зону крутки
  document.getElementById('rouletteContainer').classList.add('show');
  document.getElementById('rouletteCaseName').textContent = selectedCase.name;
  document.getElementById('btnSpin').textContent = `Крутить за ${fmt(selectedCase.price)} ₽`;
  document.getElementById('btnSpin').disabled = true;
  
  // Инициализация визуальной ленты
  renderTrack(selectedCase);
  
  // Автоматический запуск прокрутки
  spin();
}

function renderTrack(c) {
  const track = document.getElementById('spinTrack');
  track.innerHTML = '';
  track.style.transition = 'none';
  track.style.transform = 'translateX(0)';

  // Заглушки для визуала (сервер вернет реальный приз)
  for(let i=0; i<40; i++){
    const fakeVal = [0, 5, 10, 20, 50, 100, 500][Math.floor(Math.random()*7)];
    const rar = getRarityClass(fakeVal);
    track.innerHTML += `
      <div class="spin-item ${rar}">
        ${fakeVal} ₽
        <span>${fakeVal > 0 ? 'Приз' : 'Пусто'}</span>
      </div>
    `;
  }
}

async function spin() {
  if (isSpinning || !selectedCase) return;
  
  if (!playerId) { alert('Войдите в аккаунт'); return; }
  
  isSpinning = true;
  document.getElementById('btnSpin').disabled = true;
  document.getElementById('btnSpin').textContent = 'Крутим...';

  try {
    const res = await fetch('/api/cases/open', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ guest_id: playerId, case_name: selectedCase.name })
    });
    const data = await res.json();
    
    if (!res.ok) {
      alert(data.error || 'Ошибка');
      isSpinning = false;
      document.getElementById('btnSpin').disabled = false;
      document.getElementById('btnSpin').textContent = `Крутить за ${fmt(selectedCase.price)} ₽`;
      return;
    }

    const prize = data.prize;
    
    // Обновляем ленту, подставляя реальный приз на 35-й элемент
    const track = document.getElementById('spinTrack');
    track.innerHTML = '';
    
    for(let i=0; i<40; i++){
      let val = [0, 5, 10, 20, 50, 100, 500][Math.floor(Math.random()*7)];
      if (i === 35) val = prize; // Реальный приз
      
      const rar = getRarityClass(val);
      track.innerHTML += `
        <div class="spin-item ${rar}">
          ${val} ₽
          <span>${val > 0 ? 'Приз' : 'Пусто'}</span>
        </div>
      `;
    }

    // Анимация (5 секунд)
    const containerWidth = document.querySelector('.spin-window').clientWidth;
    const itemWidth = 120; // 110 + 10 gap
    const centerOffset = containerWidth / 2;
    const randomOffset = (Math.random() * 40) - 20; // Сдвиг
    const targetScroll = (35 * itemWidth) - centerOffset + (itemWidth / 2) + randomOffset;

    setTimeout(() => {
      track.style.transition = 'transform 5s cubic-bezier(0.1, 0.8, 0.1, 1)';
      track.style.transform = `translateX(-${targetScroll}px)`;
    }, 50);

    setTimeout(() => {
      showWinModal(prize);
      loadBalance();
      isSpinning = false;
      document.getElementById('btnSpin').disabled = false;
      document.getElementById('btnSpin').textContent = `Крутить за ${fmt(selectedCase.price)} ₽`;
    }, 5100);

  } catch(e) {
    alert('Ошибка соединения');
    isSpinning = false;
    document.getElementById('btnSpin').disabled = false;
    document.getElementById('btnSpin').textContent = `Крутить за ${fmt(selectedCase.price)} ₽`;
  }
}

function showWinModal(prize) {
  if (prize > 0) {
    document.getElementById('winAmount').textContent = `+${fmt(prize)} ₽`;
    document.getElementById('winAmount').style.color = 'var(--accent-green)';
  } else {
    document.getElementById('winAmount').textContent = 'Пусто';
    document.getElementById('winAmount').style.color = 'var(--text-muted)';
  }
  document.getElementById('winOverlay').classList.add('show');
}

function closeWin() {
  document.getElementById('winOverlay').classList.remove('show');
}

initCases();
</script>
</body>
