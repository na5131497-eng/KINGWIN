<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>KINGWIN — Cases</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-main: #090a10; --bg-panel: #151922; --bg-card: #1a1f2b;
    --accent: #00e5ff; --accent-green: #00ff88; --gold: #f1c40f;
    --text-main: #fff; --text-muted: #8b92a5;
    --border: rgba(255,255,255,0.06); --red: #ff4d4d;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Montserrat', sans-serif; }
  html, body { height: 100%; }
  body { background: var(--bg-main); color: var(--text-main); min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; overflow-x: hidden; }
  
  .bg-glow { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; background: radial-gradient(circle at 10% 20%, rgba(0,229,255,0.08) 0%, transparent 40%), radial-gradient(circle at 90% 80%, rgba(241,196,15,0.08) 0%, transparent 40%); }
  
  .topbar { height: 60px; background: rgba(21,25,34,0.9); backdrop-filter: blur(10px); border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; padding: 0 20px; position: sticky; top: 0; z-index: 100; }
  .logo { font-size: 20px; font-weight: 900; letter-spacing: 2px; background: linear-gradient(135deg, #00e5ff, #0077ff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-decoration: none; }
  .back-btn { background: rgba(255,255,255,0.05); border: 1px solid var(--border); color: #fff; padding: 8px 15px; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 600; text-decoration: none; transition: 0.2s; }
  .back-btn:hover { border-color: var(--accent); color: var(--accent); }
  .balance-pill { background: rgba(0,255,136,0.12); border: 1px solid rgba(0,255,136,0.35); color: var(--accent-green); padding: 8px 16px; border-radius: 8px; font-weight: 900; font-size: 13px; white-space: nowrap; }
  
  .layout { max-width: 1400px; margin: 0 auto; padding: 20px; width: 100%; flex: 1; display: flex; flex-direction: column; gap: 20px; z-index: 1; position: relative; }
  
  .cases-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; }
  .case-card { background: linear-gradient(180deg, rgba(26,31,43,0.9), rgba(10,13,20,0.9)); border: 1px solid rgba(0,229,255,0.2); border-radius: 20px; padding: 20px; display: flex; flex-direction: column; align-items: center; gap: 12px; cursor: pointer; transition: 0.3s; position: relative; overflow: hidden; box-shadow: inset 0 0 30px rgba(0,0,0,0.5); }
  .case-card:hover { transform: translateY(-5px); border-color: rgba(0,229,255,0.6); box-shadow: 0 10px 40px rgba(0,229,255,0.2), inset 0 0 30px rgba(0,229,255,0.1); }
  .case-card.locked { opacity: 0.5; cursor: not-allowed; filter: grayscale(1); }
  .case-card.locked:hover { transform: none; box-shadow: inset 0 0 30px rgba(0,0,0,0.5); border-color: rgba(0,229,255,0.2); }
  .case-card.locked::after { content: 'НУЖЕН РАНГ'; position: absolute; top: 15px; right: 15px; background: var(--red); color: #fff; font-size: 10px; font-weight: 900; letter-spacing: 1px; padding: 4px 10px; border-radius: 8px; box-shadow: 0 0 10px rgba(255,77,77,0.5); }
  
  .case-box-img { width: 120px; height: 120px; position: relative; display: flex; align-items: center; justify-content: center; filter: drop-shadow(0 0 20px rgba(0,229,255,0.4)); }
  .case-box-img svg { width: 100%; height: 100%; }
  .case-name { font-size: 18px; font-weight: 900; letter-spacing: 1px; text-align: center; color: #fff; text-shadow: 0 0 10px rgba(0,229,255,0.5); }
  .case-price { font-size: 16px; color: var(--gold); font-weight: 900; text-shadow: 0 0 10px rgba(241,196,15,0.5); }
  
  .open-area { background: linear-gradient(180deg, rgba(21,25,34,0.95), rgba(9,10,16,0.95)); border: 1px solid rgba(0,229,255,0.3); border-radius: 24px; padding: 25px; display: flex; flex-direction: column; gap: 20px; box-shadow: 0 0 50px rgba(0,229,255,0.1), inset 0 0 50px rgba(0,0,0,0.8); }
  .open-title { font-size: 22px; font-weight: 900; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; color: #fff; text-shadow: 0 0 10px rgba(255,255,255,0.3); }
  .open-title .price-tag { font-size: 18px; color: var(--gold); font-weight: 900; background: rgba(241,196,15,0.1); padding: 4px 12px; border-radius: 8px; border: 1px solid rgba(241,196,15,0.3); }
  
  .roulette-wrap { position: relative; height: 160px; overflow: hidden; border-radius: 16px; background: linear-gradient(180deg, #0a0d14, #05070a); border: 1px solid rgba(0,229,255,0.2); box-shadow: inset 0 0 30px rgba(0,0,0,0.9); width: 100%; }
  .roulette-wrap::before, .roulette-wrap::after { content: ''; position: absolute; top: 0; bottom: 0; width: 80px; z-index: 5; pointer-events: none; }
  .roulette-wrap::before { left: 0; background: linear-gradient(90deg, #090a10, transparent); }
  .roulette-wrap::after { right: 0; background: linear-gradient(-90deg, #090a10, transparent); }
  .roulette-pointer { position: absolute; top: 0; bottom: 0; left: 50%; width: 2px; background: var(--gold); transform: translateX(-50%); z-index: 6; box-shadow: 0 0 20px var(--gold), 0 0 40px rgba(241,196,15,0.8); }
  .roulette-pointer::before, .roulette-pointer::after { content: ''; position: absolute; left: 50%; transform: translateX(-50%); border-left: 10px solid transparent; border-right: 10px solid transparent; }
  .roulette-pointer::before { top: -2px; border-top: 12px solid var(--gold); filter: drop-shadow(0 0 5px var(--gold)); }
  .roulette-pointer::after { bottom: -2px; border-bottom: 12px solid var(--gold); filter: drop-shadow(0 0 5px var(--gold)); }

  .roulette-track { display: flex; height: 100%; align-items: center; gap: 15px; position: absolute; top: 0; left: 0; padding: 0 15px; will-change: transform; white-space: nowrap; }
  .roulette-item { width: 120px; height: 120px; flex-shrink: 0; border-radius: 16px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; background: linear-gradient(145deg, #1a2a4a, #0a1a3a); border: 2px solid rgba(0,229,255,0.3); font-weight: 900; position: relative; transition: 0.3s; box-shadow: inset 0 0 20px rgba(0,229,255,0.1); }
  .roulette-item .emoji { font-size: 32px; filter: drop-shadow(0 0 10px rgba(255,255,255,0.5)); }
  .roulette-item .val { font-size: 14px; color: #fff; }
  .roulette-item.win { background: linear-gradient(145deg, rgba(241,196,15,0.3), rgba(241,196,15,0.05)); border-color: var(--gold); box-shadow: 0 0 30px rgba(241,196,15,0.6), inset 0 0 20px rgba(241,196,15,0.3); transform: scale(1.05); z-index: 2; }
  .roulette-item.win .val { color: var(--gold); text-shadow: 0 0 10px var(--gold); }
  
  .open-controls { display: flex; gap: 15px; justify-content: center; align-items: center; flex-wrap: wrap; }
  .btn-open { background: linear-gradient(135deg, var(--accent), #0077ff); color: #000; border: none; border-radius: 14px; padding: 18px 50px; font-size: 18px; font-weight: 900; text-transform: uppercase; letter-spacing: 1px; cursor: pointer; font-family: inherit; transition: 0.3s; box-shadow: 0 0 30px rgba(0,229,255,0.4); min-width: 280px; }
  .btn-open:hover:not(:disabled) { box-shadow: 0 0 60px rgba(0,229,255,0.8); transform: translateY(-3px) scale(1.02); }
  .btn-open:disabled { opacity: 0.5; cursor: not-allowed; box-shadow: none; background: #333; }
  
  .open-result { text-align: center; font-size: 20px; font-weight: 900; min-height: 30px; letter-spacing: 1px; }
  
  .toast-container { position: fixed; top: 70px; right: 20px; z-index: 999999; display: flex; flex-direction: column; gap: 10px; }
  .toast { background: rgba(24,26,36,0.95); border-left: 4px solid var(--accent); padding: 16px 20px; border-radius: 8px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); min-width: 250px; transform: translateX(120%); transition: 0.3s; font-weight: 600; font-size: 14px; color: #fff; }
  .toast.show { transform: translateX(0); }
  .toast.success { border-left-color: var(--accent-green); }
  .toast.error { border-left-color: var(--red); }
  
  @media (max-width: 600px) {
    .layout { padding: 12px; gap: 15px; }
    .cases-list { grid-template-columns: repeat(2, 1fr); gap: 10px; }
    .case-card { padding: 15px; }
    .case-box-img { width: 80px; height: 80px; }
    .case-name { font-size: 14px; }
    .case-price { font-size: 13px; }
    .roulette-wrap { height: 130px; }
    .roulette-item { width: 100px; height: 100px; gap: 4px; }
    .roulette-item .emoji { font-size: 24px; }
    .roulette-item .val { font-size: 12px; }
    .btn-open { padding: 15px 20px; font-size: 15px; min-width: 0; width: 100%; }
    .open-area { padding: 15px; }
    .open-title { font-size: 18px; }
  }
</style>
</head>
<body>

<div class="bg-glow"></div>
<div class="toast-container" id="toastContainer"></div>

<div class="topbar">
  <a href="/" class="logo">KINGWIN</a>
  <div style="display: flex; align-items: center; gap: 10px;">
    <a href="/" class="back-btn">← Главная</a>
    <div class="balance-pill"><span id="balanceVal">0.00</span> ₽</div>
  </div>
</div>

<div class="layout">
  <div style="font-size: 24px; font-weight: 900; margin-bottom: 4px; text-shadow: 0 0 15px rgba(0,229,255,0.4);">🎁 Кейсы</div>
  <div class="cases-list" id="casesList">
    <div style="grid-column: 1 / -1; text-align: center; padding: 40px; color: var(--text-muted);">Загрузка кейсов...</div>
  </div>
  
  <div class="open-area" id="openArea" style="display: none;">
    <div class="open-title">
      <span id="openTitle">Открыть кейс</span>
      <span class="price-tag" id="openPrice">—</span>
    </div>
    <div class="roulette-wrap" id="rouletteWrap">
      <div class="roulette-pointer"></div>
      <div class="roulette-track" id="rouletteTrack"></div>
    </div>
    <div class="open-result" id="openResult"></div>
    <div class="open-controls">
      <button class="btn-open" id="btnOpen" onclick="doOpen()">Открыть кейс</button>
    </div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
let currentPlayer = null;
let balance = 0;
let selectedCase = null;
let allCases = [];
let busy = false;

const CASE_SVG = {
  'Новичок': `<svg viewBox="0 0 100 100"><defs><linearGradient id="g1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#00e5ff"/><stop offset="1" stop-color="#0077ff"/></linearGradient></defs><rect x="20" y="30" width="60" height="50" rx="8" fill="#151922" stroke="url(#g1)" stroke-width="3"/><rect x="15" y="45" width="70" height="8" fill="url(#g1)"/><circle cx="50" cy="55" r="8" fill="#f1c40f" stroke="#fff" stroke-width="2"/><path d="M50 20 L55 30 L65 30 L57 37 L60 47 L50 41 L40 47 L43 37 L35 30 L45 30 Z" fill="#f1c40f" opacity="0.8"/></svg>`,
  'Сильвер': `<svg viewBox="0 0 100 100"><defs><linearGradient id="g2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e0e0e0"/><stop offset="1" stop-color="#888"/></linearGradient></defs><rect x="20" y="30" width="60" height="50" rx="8" fill="#151922" stroke="url(#g2)" stroke-width="3"/><rect x="15" y="45" width="70" height="8" fill="url(#g2)"/><circle cx="50" cy="55" r="8" fill="#f1c40f" stroke="#fff" stroke-width="2"/><path d="M50 20 L55 30 L65 30 L57 37 L60 47 L50 41 L40 47 L43 37 L35 30 L45 30 Z" fill="#f1c40f" opacity="0.8"/></svg>`,
  'Голд': `<svg viewBox="0 0 100 100"><defs><linearGradient id="g3" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f1c40f"/><stop offset="1" stop-color="#b8860b"/></linearGradient></defs><rect x="20" y="30" width="60" height="50" rx="8" fill="#151922" stroke="url(#g3)" stroke-width="3"/><rect x="15" y="45" width="70" height="8" fill="url(#g3)"/><circle cx="50" cy="55" r="8" fill="#f1c40f" stroke="#fff" stroke-width="2"/><path d="M50 20 L55 30 L65 30 L57 37 L60 47 L50 41 L40 47 L43 37 L35 30 L45 30 Z" fill="#f1c40f" opacity="0.8"/></svg>`,
  'Платина': `<svg viewBox="0 0 100 100"><defs><linearGradient id="g4" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e5e4e2"/><stop offset="1" stop-color="#a0a0a0"/></linearGradient></defs><rect x="20" y="30" width="60" height="50" rx="8" fill="#151922" stroke="url(#g4)" stroke-width="3"/><rect x="15" y="45" width="70" height="8" fill="url(#g4)"/><circle cx="50" cy="55" r="8" fill="#f1c40f" stroke="#fff" stroke-width="2"/><path d="M50 20 L55 30 L65 30 L57 37 L60 47 L50 41 L40 47 L43 37 L35 30 L45 30 Z" fill="#f1c40f" opacity="0.8"/></svg>`,
  'Королевский': `<svg viewBox="0 0 100 100"><defs><linearGradient id="g5" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#d4af37"/><stop offset="1" stop-color="#8b0000"/></linearGradient></defs><rect x="20" y="30" width="60" height="50" rx="8" fill="#151922" stroke="url(#g5)" stroke-width="3"/><rect x="15" y="45" width="70" height="8" fill="url(#g5)"/><circle cx="50" cy="55" r="8" fill="#f1c40f" stroke="#fff" stroke-width="2"/><path d="M50 20 L55 30 L65 30 L57 37 L60 47 L50 41 L40 47 L43 37 L35 30 L45 30 Z" fill="#f1c40f" opacity="0.8"/></svg>`
};

function fmt(n) { return (Math.round((n || 0) * 100) / 100).toLocaleString('ru-RU'); }

function showToast(text, type='success') {
  const c = $('toastContainer'); if (!c) return;
  const t = document.createElement('div'); t.className = `toast ${type}`; t.textContent = text;
  c.appendChild(t); setTimeout(() => t.classList.add('show'), 10);
  setTimeout(() => { t.classList.remove('show'); setTimeout(() => t.remove(), 300); }, 3000);
}

window.onload = () => {
  const savedId = localStorage.getItem('kingwin_guest_id');
  if (savedId) {
    currentPlayer = { id: savedId, name: savedId };
    refreshBalance();
    loadCases();
  } else {
    window.location.href = '/';
  }
};

async function refreshBalance() {
  if (!currentPlayer) return;
  try {
    const r = await fetch('/api/guest/me?id=' + encodeURIComponent(currentPlayer.id));
    const d = await r.json();
    if (d.balance) balance = d.balance.total;
    $('balanceVal').textContent = fmt(balance);
  } catch(e) {}
}

async function loadCases() {
  try {
    const r = await fetch('/api/cases/list' + (currentPlayer ? '?guest_id=' + encodeURIComponent(currentPlayer.id) : ''));
    const list = await r.json();
    allCases = Array.isArray(list) ? list : [];
    renderCases();
  } catch(e) {
    $('casesList').innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:40px;color:var(--red);">Ошибка загрузки кейсов</div>';
  }
}

function renderCases() {
  const wrap = $('casesList');
  if (!allCases.length) { wrap.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:40px;color:var(--text-muted);">Кейсы пока недоступны</div>'; return; }
  
  wrap.innerHTML = allCases.map(c => {
    const locked = !c.available;
    const svg = CASE_SVG[c.name] || CASE_SVG['Новичок'];
    return `<div class="case-card ${locked?'locked':''}" onclick="selectCase('${c.name}')">
      <div class="case-box-img">${svg}</div>
      <div class="case-name">${c.name}</div>
      <div class="case-price">${fmt(c.price)} ₽</div>
    </div>`;
  }).join('');
}

function selectCase(name) {
  const c = allCases.find(x => x.name === name);
  if (!c) return;
  if (!currentPlayer) { showToast('Войдите в аккаунт', 'error'); setTimeout(() => location.href = '/', 800); return; }
  if (!c.available) { showToast('Недоступно для вашего ранга', 'error'); return; }
  
  selectedCase = c;
  $('openArea').style.display = 'flex';
  $('openTitle').textContent = 'Кейс: ' + c.name;
  $('openPrice').textContent = fmt(c.price) + ' ₽';
  $('openResult').textContent = '';
  $('rouletteTrack').style.transform = 'translateX(0)';
  
  // Заполняем рулетку случайными призами
  let html = '';
  const prizes = c.prizes || [10, 25, 50, 100];
  for (let i = 0; i < 30; i++) {
    const p = prizes[Math.floor(Math.random() * prizes.length)];
    html += `<div class="roulette-item"><div class="emoji">💎</div><div class="val">${p} ₽</div></div>`;
  }
  $('rouletteTrack').innerHTML = html;
}

async function doOpen() {
  if (!selectedCase || busy) return;
  if (balance < selectedCase.price) { showToast('Недостаточно средств', 'error'); return; }
  
  busy = true;
  $('btnOpen').disabled = true;
  $('btnOpen').textContent = 'Открываем...';
  $('openResult').textContent = '';
  
  try {
    const res = await fetch('/api/cases/open', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ guest_id: currentPlayer.id, case_name: selectedCase.name })
    });
    const data = await res.json();
    
    if (!data.ok) {
      showToast(data.error || 'Ошибка', 'error');
      busy = false; $('btnOpen').disabled = false; $('btnOpen').textContent = 'Открыть кейс';
      return;
    }

    // Анимация прокрутки
    const track = $('rouletteTrack');
    const items = track.children;
    const winIndex = Math.floor(Math.random() * 20) + 5; // Выбираем случайный элемент (не крайний)
    
    // Подменяем выигрышный элемент на реальный приз
    items[winIndex].innerHTML = `<div class="emoji">🏆</div><div class="val">${data.prize} ₽</div>`;
    items[winIndex].classList.add('win');

    // Высчитываем сдвиг, чтобы элемент оказался по центру
    const itemWidth = 120 + 15; // Ширина + gap
    const wrapWidth = $('rouletteWrap').offsetWidth;
    const centerOffset = wrapWidth / 2 - 60; // 60 = половина ширины элемента
    const targetX = -(winIndex * itemWidth) + centerOffset;

    track.style.transition = 'transform 4s cubic-bezier(0.1, 0.8, 0.1, 1)';
    track.style.transform = `translateX(${targetX}px)`;

    setTimeout(async () => {
      $('openResult').innerHTML = `<span style="color:var(--gold);">Вы выиграли: ${data.prize} ₽!</span>`;
      showToast(`Выигрыш: ${data.prize} ₽`, 'success');
      
      balance = data.balance;
      $('balanceVal').textContent = fmt(balance);
      
      busy = false;
      $('btnOpen').disabled = false;
      $('btnOpen').textContent = 'Открыть еще раз';
    }, 4100);

  } catch(e) {
    showToast('Ошибка соединения', 'error');
    busy = false; $('btnOpen').disabled = false; $('btnOpen').textContent = 'Открыть кейс';
  }
}
</script>
</body>
</html>
