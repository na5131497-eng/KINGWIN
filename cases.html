<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0e14">
<title>KINGWIN — Cases</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-main: #090a10; --bg-panel: #151922;
    --accent: #00e5ff; --accent-green: #00ff88; --gold: #f1c40f;
    --text-main: #fff; --text-muted: #8b92a5;
    --border: rgba(255,255,255,0.1); --red: #ff4d4d;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Montserrat', sans-serif; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; background: var(--bg-main); color: var(--text-main); }
  .app { display: flex; flex-direction: column; height: 100vh; height: 100dvh; }

  .float-menu-btn { position: fixed; top: 15px; left: 15px; z-index: 1000; background: #181a24; border: 1px solid var(--accent); color: var(--accent); width: 44px; height: 44px; border-radius: 10px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 24px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); transition: 0.3s; }
  .float-menu { position: fixed; top: 15px; left: 70px; z-index: 999; background: rgba(17,18,26,0.95); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; padding: 10px; display: flex; flex-direction: column; gap: 6px; width: 180px; box-shadow: 0 10px 30px rgba(0,0,0,0.6); transform: translateX(-20px); opacity: 0; pointer-events: none; transition: 0.3s; }
  .float-menu.show { transform: translateX(0); opacity: 1; pointer-events: auto; }
  .float-menu a { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 10px; text-decoration: none; color: #8b92a5; font-size: 12px; font-weight: 700; transition: 0.2s; text-transform: uppercase; border: 1px solid transparent; }
  .float-menu a:hover { background: rgba(0,229,255,0.1); color: var(--accent); border-color: rgba(0,229,255,0.3); }

  .topbar { height: 60px; background: var(--bg-panel); border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; padding: 0 20px; padding-left: 70px; flex-shrink: 0; z-index: 100; }
  .logo { font-size: 18px; font-weight: 900; letter-spacing: 2px; background: linear-gradient(135deg, #00e5ff, #0077ff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-decoration: none; }
  .top-actions { display: flex; align-items: center; gap: 10px; }
  .balance-pill { background: rgba(0,255,136,0.12); border: 1px solid rgba(0,255,136,0.35); color: var(--accent-green); padding: 8px 16px; border-radius: 8px; font-weight: 900; font-size: 13px; white-space: nowrap; }

  .main-body { flex: 1; overflow-y: auto; padding: 20px; }
  .section-title { font-size: 13px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1.5px; font-weight: 800; margin-bottom: 16px; }
  .cases-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; margin-bottom: 30px; }

  .case-card { background: linear-gradient(160deg, #1a1f2e, #11141d); border: 1px solid var(--border); border-radius: 16px; padding: 20px 16px; text-align: center; transition: 0.25s; position: relative; overflow: hidden; }
  .case-card:hover { border-color: rgba(0,229,255,0.5); transform: translateY(-4px); box-shadow: 0 12px 30px rgba(0,0,0,0.5); }
  .case-card.locked { opacity: 0.55; }
  .case-card.locked::after { content: '🔒'; position: absolute; top: 10px; right: 12px; font-size: 18px; }
  .case-img { width: 80px; height: 80px; margin: 0 auto 14px; display: flex; align-items: center; justify-content: center; font-size: 48px; background: radial-gradient(circle, rgba(0,229,255,0.15), transparent 70%); border-radius: 50%; }
  .case-name { font-size: 15px; font-weight: 900; margin-bottom: 6px; color: #fff; }
  .case-price { font-size: 13px; font-weight: 700; color: var(--accent-green); margin-bottom: 14px; }
  .case-price .currency { color: var(--text-muted); font-weight: 600; }
  .btn-open { width: 100%; background: linear-gradient(135deg, var(--accent), #0077ff); color: #000; border: none; border-radius: 10px; padding: 12px; font-size: 13px; font-weight: 900; text-transform: uppercase; cursor: pointer; transition: 0.3s; }
  .btn-open:hover:not(:disabled) { transform: scale(1.02); box-shadow: 0 6px 20px rgba(0,229,255,0.35); }
  .btn-open:disabled { opacity: 0.5; cursor: not-allowed; background: #333; color: #888; }

  .history-list { background: var(--bg-panel); border: 1px solid var(--border); border-radius: 14px; padding: 6px 16px; }
  .history-row { display: flex; justify-content: space-between; align-items: center; padding: 11px 0; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 13px; }
  .history-row:last-child { border-bottom: none; }
  .history-row .name { color: var(--text-muted); font-weight: 600; }
  .history-row .prize { font-weight: 900; color: var(--accent-green); }
  .history-row .prize.lose { color: var(--text-muted); }

  /* Модалка результата */
  .result-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.88); backdrop-filter: blur(6px); display: none; align-items: center; justify-content: center; z-index: 99999; padding: 20px; }
  .result-backdrop.show { display: flex; }
  .result-card { background: linear-gradient(135deg, #111625, #0a0d14); border: 1px solid rgba(0,229,255,0.3); border-radius: 24px; max-width: 420px; width: 100%; padding: 36px 28px; text-align: center; box-shadow: 0 20px 60px rgba(0,0,0,0.8); animation: pop 0.4s ease; }
  @keyframes pop { from { transform: scale(0.85); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .result-prize { font-size: 48px; font-weight: 900; margin: 10px 0 20px; background: linear-gradient(135deg, #f1c40f, #fff8b0); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .result-title { font-size: 16px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1.5px; font-weight: 800; }
  .result-case { font-size: 15px; color: #fff; font-weight: 700; margin-bottom: 6px; }
  .result-btn { width: 100%; margin-top: 24px; background: linear-gradient(135deg, var(--accent), #0077ff); color: #000; border: none; border-radius: 12px; padding: 14px; font-size: 14px; font-weight: 900; text-transform: uppercase; cursor: pointer; }

  .toast-container { position: fixed; top: 80px; right: 20px; z-index: 999999; display: flex; flex-direction: column; gap: 10px; pointer-events: none; }
  .toast { background: rgba(24,26,36,0.95); border-left: 4px solid var(--accent); padding: 16px 20px; border-radius: 8px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); min-width: 250px; transform: translateX(120%); transition: 0.3s; font-weight: 600; font-size: 14px; color: #fff; }
  .toast.show { transform: translateX(0); }
  .toast.success { border-left-color: var(--accent-green); }
  .toast.error { border-left-color: var(--red); }

  @media (max-width: 900px) {
    .main-body { padding: 14px; }
    .cases-grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
    .case-card { padding: 16px 12px; }
    .case-img { width: 60px; height: 60px; font-size: 38px; margin-bottom: 10px; }
    .case-name { font-size: 13px; }
    .toast-container { top: 60px; right: 10px; left: 10px; }
    .toast { width: 100%; min-width: 0; transform: translateY(-120%); }
    .toast.show { transform: translateY(0); }
  }
</style>
</head>
<body>

<div class="toast-container" id="toastContainer"></div>

<button class="float-menu-btn" onclick="document.getElementById('floatMenu').classList.toggle('show')">☰</button>
<div class="float-menu" id="floatMenu">
  <a href="/">Главная</a>
  <a href="/crash.html">Crash</a>
  <a href="/cases.html">Cases</a>
  <a href="/miner.html">Miner</a>
</div>

<div class="app">
  <div class="topbar">
    <a href="/" class="logo">KINGWIN</a>
    <div class="top-actions">
      <div class="balance-pill"><span id="balanceVal">0.00</span> ₽</div>
    </div>
  </div>

  <div class="main-body">
    <div class="section-title">Кейсы</div>
    <div class="cases-grid" id="casesGrid"></div>

    <div class="section-title">Последние дропы</div>
    <div class="history-list" id="historyList"><div class="history-row"><span class="name">Загрузка...</span></div></div>
  </div>
</div>

<div class="result-backdrop" id="resultModal" onclick="if(event.target.id==='resultModal')closeResult()">
  <div class="result-card">
    <div class="result-title">Вы выиграли</div>
    <div class="result-case" id="resultCaseName"></div>
    <div class="result-prize" id="resultPrize">0 ₽</div>
    <button class="result-btn" onclick="closeResult()">Забрать</button>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
let currentPlayer = null;
let balance = 0;
let casesList = [];
let busy = false;

const CASE_EMOJI = {
  'Новичок': '📦',
  'Сильвер': '🥈',
  'Голд': '🥇',
  'Платина': '💎',
  'Королевский': '👑'
};

function showToast(text, type='success') {
  const container = $('toastContainer');
  const toast = document.createElement('div');
  toast.className = `toast ${type}`;
  toast.textContent = text;
  container.appendChild(toast);
  setTimeout(() => toast.classList.add('show'), 10);
  setTimeout(() => { toast.classList.remove('show'); setTimeout(() => toast.remove(), 300); }, 3000);
}

function applyBalanceFromResponse(d) {
  if (!d) return;
  if (typeof d.balance === 'number') balance = d.balance;
  else if (typeof d.new_balance === 'number') balance = d.new_balance;
  else if (typeof d.deposit_balance === 'number' || typeof d.bonus_balance === 'number') {
    balance = (parseFloat(d.deposit_balance) || 0) + (parseFloat(d.bonus_balance) || 0);
  } else return;
  $('balanceVal').textContent = balance.toFixed(2);
}

function loadMe() {
  try {
    const urlParams = new URLSearchParams(window.location.search);
    const urlId = urlParams.get('id');
    if (urlId) { localStorage.setItem('kingwin_guest_id', urlId); return { guestId: String(urlId) }; }
    const raw = localStorage.getItem('kingwin_guest');
    if (raw) { const g = JSON.parse(raw); if (g && g.id) return { guestId: String(g.id) }; }
    const savedId = localStorage.getItem('kingwin_guest_id');
    if (savedId) return { guestId: String(savedId) };
  } catch(e) {}
  return null;
}

async function refreshBalance() {
  if (!currentPlayer) return;
  try {
    const r = await fetch('/api/guest/me?id=' + encodeURIComponent(currentPlayer.guestId));
    if (!r.ok) return;
    const data = await r.json();
    if (data.balance && typeof data.balance.total === 'number') balance = data.balance.total;
    else if (data.guest) balance = (parseFloat(data.guest.deposit_balance) || 0) + (parseFloat(data.guest.bonus_balance) || 0);
    $('balanceVal').textContent = balance.toFixed(2);
  } catch(e) {}
}

async function loadCases() {
  try {
    const r = await fetch('/api/cases/list?guest_id=' + encodeURIComponent(currentPlayer.guestId));
    if (!r.ok) return;
    casesList = await r.json();
    renderCases();
  } catch(e) { console.error('loadCases:', e); }
}

function renderCases() {
  const grid = $('casesGrid');
  grid.innerHTML = '';
  casesList.forEach(c => {
    const card = document.createElement('div');
    card.className = 'case-card' + (c.available ? '' : ' locked');

    const img = document.createElement('div');
    img.className = 'case-img';
    img.textContent = CASE_EMOJI[c.name] || '📦';

    const name = document.createElement('div');
    name.className = 'case-name';
    name.textContent = c.name;

    const price = document.createElement('div');
    price.className = 'case-price';
    price.innerHTML = c.price.toFixed(2) + ' <span class="currency">₽</span>';

    const btn = document.createElement('button');
    btn.className = 'btn-open';
    btn.textContent = c.available ? 'Открыть' : 'Недоступен';
    btn.disabled = !c.available || busy;
    btn.onclick = () => openCase(c.name);

    card.appendChild(img);
    card.appendChild(name);
    card.appendChild(price);
    card.appendChild(btn);
    grid.appendChild(card);
  });
}

async function openCase(caseName) {
  if (busy) return;
  if (!currentPlayer) { showToast('Войдите в аккаунт', 'error'); return; }
  const c = casesList.find(x => x.name === caseName);
  if (!c || !c.available) { showToast('Кейс недоступен', 'error'); return; }
  if (balance < c.price) { showToast(`Недостаточно средств. Нужно ${c.price.toFixed(2)} ₽`, 'error'); return; }

  busy = true;
  document.querySelectorAll('.btn-open').forEach(b => b.disabled = true);
  try {
    const r = await fetch('/api/cases/open', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ guest_id: currentPlayer.guestId, case_name: caseName })
    });
    const d = await r.json();
    if (!r.ok) { showToast(d.error || 'Ошибка', 'error'); return; }
    applyBalanceFromResponse(d);
    showResult(caseName, d.prize);
    loadHistory();
  } catch(e) {
    showToast('Ошибка соединения', 'error');
  } finally {
    busy = false;
    renderCases();
  }
}

function showResult(caseName, prize) {
  $('resultCaseName').textContent = caseName;
  $('resultPrize').textContent = prize.toFixed(2) + ' ₽';
  $('resultModal').classList.add('show');
}
function closeResult() { $('resultModal').classList.remove('show'); }

async function loadHistory() {
  try {
    const r = await fetch('/api/cases/last-drops');
    if (!r.ok) return;
    const rows = await r.json();
    const list = $('historyList');
    if (!rows.length) { list.innerHTML = '<div class="history-row"><span class="name">Пока нет дропов</span></div>'; return; }
    list.innerHTML = rows.map(row => {
      const name = (row.guest_name || 'Гость').slice(0, 12);
      const prize = parseFloat(row.prize) || 0;
      const cls = prize > 0 ? 'prize' : 'prize lose';
      return `<div class="history-row"><span class="name">${escapeHtml(name)} — ${escapeHtml(row.case_name || '')}</span><span class="${cls}">+${prize.toFixed(2)} ₽</span></div>`;
    }).join('');
  } catch(e) {}
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, ch => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[ch]));
}

window.onload = async () => {
  currentPlayer = loadMe();
  if (!currentPlayer) {
    showToast('Войдите в аккаунт на главной странице', 'error');
    setTimeout(() => { window.location.href = '/'; }, 1500);
    return;
  }
  await refreshBalance();
  await loadCases();
  await loadHistory();
  setInterval(refreshBalance, 3000);
};
</script>
</body>
</html>
