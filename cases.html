<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>KINGWIN — Кейсы</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-main: #0c0e14; 
    --bg-panel: #151822; 
    --bg-dark: #0a0c11;
    --accent: #00e5ff; 
    --accent-green: #00ff88;
    --text-main: #fff; 
    --text-muted: #8b92a5;
    --border: rgba(255,255,255,0.05);
    --red: #ff4d4d; 
  }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Montserrat', sans-serif; }
  body { background: var(--bg-main); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; }

  /* TOPBAR */
  .topbar { display: flex; justify-content: space-between; align-items: center; padding: 15px 30px; background: var(--bg-dark); border-bottom: 1px solid var(--border); }
  .topbar-left { display: flex; align-items: center; gap: 20px; }
  .topbar-logo { font-size: 20px; font-weight: 900; letter-spacing: 2px; background: linear-gradient(135deg, #00e5ff, #0077ff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .back-btn { color: var(--text-muted); text-decoration: none; font-size: 14px; font-weight: 600; transition: 0.2s; display: flex; align-items: center; gap: 8px; }
  .back-btn:hover { color: #fff; }
  
  .balance-badge { display: flex; align-items: center; gap: 8px; background: rgba(0,0,0,0.5); border: 1px solid rgba(0,229,255,0.3); padding: 8px 16px; border-radius: 20px; font-size: 14px; font-weight: 700; cursor: pointer; transition: 0.3s; }
  .balance-badge:hover { border-color: var(--accent); }
  .balance-badge span { color: var(--accent); }

  /* MAIN CONTENT */
  .container { max-width: 1200px; margin: 0 auto; padding: 40px 20px; flex: 1; width: 100%; }
  .section-title { font-size: 24px; font-weight: 900; text-transform: uppercase; letter-spacing: 2px; text-align: center; margin-bottom: 30px; color: #fff; }

  /* CASES GRID */
  .cases-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 15px; margin-bottom: 40px; }
  
  .case-card { background: var(--bg-panel); border: 1px solid var(--border); border-radius: 16px; padding: 20px 10px; display: flex; flex-direction: column; align-items: center; text-align: center; cursor: pointer; transition: 0.3s; position: relative; overflow: hidden; }
  .case-card:hover { transform: translateY(-5px); border-color: rgba(255,255,255,0.2); box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
  
  .case-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 4px; background: #333; transition: 0.3s; }
  .case-card[data-rank="0"]::before { background: #cd7f32; }
  .case-card[data-rank="1"]::before { background: #c0c0c0; }
  .case-card[data-rank="2"]::before { background: #f1c40f; }
  .case-card[data-rank="3"]::before { background: #e5e4e2; }
  .case-card[data-rank="4"]::before { background: #b9f2ff; }
  .case-card[data-rank="5"]::before { background: #d4af37; }

  .case-name { font-size: 11px; font-weight: 800; text-transform: uppercase; color: var(--text-muted); margin-bottom: 15px; letter-spacing: 1px; }
  .case-img { width: 70px; height: 70px; margin-bottom: 15px; position: relative; display: flex; justify-content: center; align-items: center; }
  .case-img svg { width: 100%; height: 100%; filter: drop-shadow(0 5px 15px rgba(0,0,0,0.5)); }
  
  .case-price { font-size: 14px; font-weight: 900; color: var(--accent-green); margin-bottom: 15px; }
  
  .btn-select { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: #fff; padding: 8px 15px; border-radius: 8px; font-size: 12px; font-weight: 700; width: 100%; cursor: pointer; transition: 0.2s; text-transform: uppercase; }
  .case-card:hover .btn-select { background: rgba(255,255,255,0.1); }

  /* --- ПОЛНОЭКРАННЫЙ ОВЕРЛЕЙ ДЛЯ ОТКРЫТИЯ --- */
  .fullscreen-spin { position: fixed; inset: 0; background: #090a10; z-index: 2000; display: none; flex-direction: column; justify-content: center; align-items: center; overflow: hidden; }
  .fullscreen-spin.show { display: flex; animation: fadeIn 0.3s ease; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  /* Кнопка закрытия */
  .close-fs { position: absolute; top: 20px; right: 20px; background: rgba(255,255,255,0.1); border: 1px solid var(--border); color: #fff; width: 40px; height: 40px; border-radius: 50%; font-size: 20px; cursor: pointer; display: flex; justify-content: center; align-items: center; z-index: 100; transition: 0.2s; }
  .close-fs:hover { background: rgba(255,77,77,0.2); border-color: var(--red); color: var(--red); }

  .fs-title { font-size: 32px; font-weight: 900; text-transform: uppercase; margin-bottom: 40px; text-shadow: 0 0 20px rgba(0,229,255,0.3); }
  
  .fs-spin-window { width: 100%; max-width: 1200px; height: 200px; background: var(--bg-panel); border-top: 4px solid var(--accent); border-bottom: 4px solid var(--accent); position: relative; overflow: hidden; box-shadow: 0 0 50px rgba(0,229,255,0.2); }
  .fs-spin-track { display: flex; align-items: center; gap: 15px; height: 100%; padding: 0 20px; position: absolute; left: 0; }
  
  .fs-spin-item { flex-shrink: 0; width: 140px; height: 140px; border-radius: 16px; background: #1e2230; border: 2px solid var(--border); display: flex; flex-direction: column; justify-content: center; align-items: center; font-weight: 900; font-size: 24px; gap: 6px; position: relative; }
  
  /* Курсор по центру */
  .fs-pointer { position: absolute; top: 0; bottom: 0; left: 50%; width: 6px; background: var(--accent-green); z-index: 10; transform: translateX(-50%); box-shadow: 0 0 20px var(--accent-green); }
  .fs-pointer::before, .fs-pointer::after { content: ''; position: absolute; left: 50%; transform: translateX(-50%); border-left: 12px solid transparent; border-right: 12px solid transparent; }
  .fs-pointer::before { top: 0; border-top: 15px solid var(--accent-green); }
  .fs-pointer::after { bottom: 0; border-bottom: 15px solid var(--accent-green); }

  /* Цвета призов */
  .fs-spin-item.r0 { color: #fff; }
  .fs-spin-item.r1 { border-color: rgba(63,191,127,0.5); color: #3fbf7f; background: rgba(63,191,127,0.1); }
  .fs-spin-item.r2 { border-color: rgba(0,119,255,0.5); color: #00e5ff; background: rgba(0,119,255,0.1); }
  .fs-spin-item.r3 { border-color: rgba(168,85,247,0.5); color: #d8b4fe; background: rgba(168,85,247,0.1); }
  .fs-spin-item.r4 { border-color: rgba(255,215,0,0.5); color: #ffd700; background: rgba(255,215,0,0.1); box-shadow: 0 0 20px rgba(255,215,0,0.3); }

  /* МОДАЛКА СОДЕРЖИМОГО КЕЙСА */
  .content-modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(5px); display: none; justify-content: center; align-items: center; z-index: 3000; padding: 20px; }
  .content-modal-overlay.show { display: flex; }
  .content-modal-box { background: var(--bg-panel); border: 1px solid var(--border); border-radius: 24px; padding: 30px; max-width: 600px; width: 100%; text-align: center; animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); max-height: 90vh; overflow-y: auto; }
  @keyframes popIn { from { transform: scale(0.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .content-modal-box h2 { font-size: 24px; font-weight: 900; margin-bottom: 20px; text-transform: uppercase; }
  
  .prizes-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 10px; margin-bottom: 25px; }
  .prize-item { background: #1e2230; border: 1px solid var(--border); border-radius: 12px; padding: 15px 5px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-weight: 900; font-size: 16px; }
  .prize-item.r0 { border-color: rgba(255,255,255,0.1); color: #fff; }
  .prize-item.r1 { border-color: rgba(63,191,127,0.5); color: #3fbf7f; background: rgba(63,191,127,0.1); }
  .prize-item.r2 { border-color: rgba(0,119,255,0.5); color: #00e5ff; background: rgba(0,119,255,0.1); }
  .prize-item.r3 { border-color: rgba(168,85,247,0.5); color: #d8b4fe; background: rgba(168,85,247,0.1); }
  .prize-item.r4 { border-color: rgba(255,215,0,0.5); color: #ffd700; background: rgba(255,215,0,0.1); box-shadow: 0 0 15px rgba(255,215,0,0.2); }

  .modal-actions { display: flex; gap: 10px; }
  .modal-actions button { flex: 1; padding: 15px; border-radius: 12px; font-size: 16px; font-weight: 900; cursor: pointer; border: none; transition: 0.2s; }
  .btn-cancel { background: rgba(255,255,255,0.1); color: #fff; }
  .btn-cancel:hover { background: rgba(255,255,255,0.2); }
  .btn-spin { background: linear-gradient(135deg, #00ff88, #00b366); color: #000; box-shadow: 0 0 20px rgba(0,255,136,0.3); }
  .btn-spin:hover { transform: translateY(-2px); box-shadow: 0 0 30px rgba(0,255,136,0.5); }

  /* УВЕДОМЛЕНИЕ СВЕРХУ */
  .top-toast { position: fixed; top: -100px; left: 50%; transform: translateX(-50%); background: var(--bg-panel); border: 2px solid var(--accent-green); border-radius: 16px; padding: 20px 40px; text-align: center; box-shadow: 0 10px 40px rgba(0,255,136,0.3); z-index: 4000; transition: top 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); min-width: 300px; }
  .top-toast.show { top: 20px; }
  .top-toast .t-title { font-size: 14px; color: var(--text-muted); text-transform: uppercase; font-weight: 700; margin-bottom: 5px; }
  .top-toast .t-amount { font-size: 36px; font-weight: 900; color: var(--accent-green); text-shadow: 0 0 20px rgba(0,255,136,0.5); }

  @media (max-width: 900px) {
    .cases-grid { grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .case-name { font-size: 10px; }
    .case-img { width: 50px; height: 50px; }
    .case-price { font-size: 12px; }
    .btn-select { font-size: 10px; padding: 6px; }
    .topbar { padding: 15px; }
    
    .fs-title { font-size: 24px; margin-bottom: 20px; }
    .fs-spin-window { height: 120px; }
    .fs-spin-item { width: 90px; height: 90px; font-size: 18px; }
    .content-modal-box { padding: 20px; }
  }
  @media (max-width: 500px) {
    .cases-grid { grid-template-columns: repeat(2, 1fr); }
    .top-toast { min-width: 90%; padding: 15px; }
    .top-toast .t-amount { font-size: 28px; }
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-left">
    <div class="topbar-logo">KINGWIN</div>
    <a href="/" class="back-btn">← На главную</a>
  </div>
  <div class="balance-badge" id="balanceBadge">
    Баланс: <span id="balanceVal">0.00</span> ₽
  </div>
</div>

<div class="container">
  <div class="section-title">Кейсы</div>
  <div class="cases-grid" id="casesGrid"></div>
</div>

<!-- МОДАЛКА СОДЕРЖИМОГО -->
<div class="content-modal-overlay" id="contentModalOverlay">
  <div class="content-modal-box">
    <h2 id="contentModalTitle">Содержимое кейса</h2>
    <div class="prizes-grid" id="contentPrizesGrid"></div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeContentModal()">Отмена</button>
      <button class="btn-spin" id="contentBtnSpin">Крутить</button>
    </div>
  </div>
</div>

<!-- ПОЛНОЭКРАННЫЙ ОВЕРЛЕЙ -->
<div class="fullscreen-spin" id="fsSpinOverlay">
  <button class="close-fs" onclick="closeFullscreenSpin()">✕</button>
  <div class="fs-title" id="fsTitle">Открытие кейса...</div>
  
  <div class="fs-spin-window">
    <div class="fs-pointer"></div>
    <div class="fs-spin-track" id="fsSpinTrack"></div>
  </div>
</div>

<!-- ВСПЛЫВАЮЩЕЕ УВЕДОМЛЕНИЕ СВЕРХУ -->
<div class="top-toast" id="topToast">
  <div class="t-title">Ваш выигрыш</div>
  <div class="t-amount" id="toastAmount">+0 ₽</div>
</div>

<script>
const PLAYER_KEY = 'kingwin_player_id';
let playerId = localStorage.getItem(PLAYER_KEY);
let casesData = [];
let selectedCase = null;
let isSpinning = false;

function fmt(n){ return (Math.round((n||0)*100)/100).toLocaleString('ru-RU'); }

function getRarityClass(val) {
  if (val >= 1000) return 'r4';
  if (val >= 200) return 'r3';
  if (val >= 50) return 'r2';
  if (val > 0) return 'r1';
  return 'r0';
}

const caseIcons = {
  'Новичок': '<svg viewBox="0 0 100 100" fill="none"><circle cx="50" cy="50" r="40" fill="rgba(205,127,50,0.2)" stroke="#cd7f32" stroke-width="2"/><path d="M50 20 L55 45 L80 50 L55 55 L50 80 L45 55 L20 50 L45 45 Z" fill="#cd7f32"/></svg>',
  'Бронза': '<svg viewBox="0 0 100 100" fill="none"><circle cx="50" cy="50" r="40" fill="rgba(192,192,192,0.2)" stroke="#c0c0c0" stroke-width="2"/><path d="M50 20 L55 45 L80 50 L55 55 L50 80 L45 55 L20 50 L45 45 Z" fill="#c0c0c0"/></svg>',
  'Сильвер': '<svg viewBox="0 0 100 100" fill="none"><circle cx="50" cy="50" r="40" fill="rgba(241,196,15,0.2)" stroke="#f1c40f" stroke-width="2"/><path d="M50 20 L55 45 L80 50 L55 55 L50 80 L45 55 L20 50 L45 45 Z" fill="#f1c40f"/></svg>',
  'Голд': '<svg viewBox="0 0 100 100" fill="none"><circle cx="50" cy="50" r="40" fill="rgba(229,228,226,0.2)" stroke="#e5e4e2" stroke-width="2"/><path d="M50 20 L55 45 L80 50 L55 55 L50 80 L45 55 L20 50 L45 45 Z" fill="#e5e4e2"/></svg>',
  'Платина': '<svg viewBox="0 0 100 100" fill="none"><circle cx="50" cy="50" r="40" fill="rgba(185,242,255,0.2)" stroke="#b9f2ff" stroke-width="2"/><path d="M50 20 L55 45 L80 50 L55 55 L50 80 L45 55 L20 50 L45 45 Z" fill="#b9f2ff"/></svg>',
  'Алмаз': '<svg viewBox="0 0 100 100" fill="none"><circle cx="50" cy="50" r="40" fill="rgba(212,175,55,0.2)" stroke="#d4af37" stroke-width="2"/><path d="M50 20 L55 45 L80 50 L55 55 L50 80 L45 55 L20 50 L45 45 Z" fill="#d4af37"/></svg>',
  'Королевский': '<svg viewBox="0 0 100 100" fill="none"><circle cx="50" cy="50" r="40" fill="rgba(255,215,0,0.2)" stroke="#ffd700" stroke-width="2"/><path d="M50 20 L55 45 L80 50 L55 55 L50 80 L45 55 L20 50 L45 45 Z" fill="#ffd700"/></svg>'
};

async function loadBalance() {
  if (!playerId) return;
  try {
    const r = await fetch('/api/guest/me?id=' + encodeURIComponent(playerId));
    const d = await r.json();
    if (r.ok && d.guest) {
      const total = (parseFloat(d.guest.bonus_balance) || 0) + (parseFloat(d.guest.deposit_balance) || 0);
      document.getElementById('balanceVal').textContent = total.toFixed(2);
    }
  } catch(e) {}
}

async function initCases() {
  await loadBalance();
  
  if (!playerId) {
    document.getElementById('casesGrid').innerHTML = `<div style="grid-column: 1/-1; text-align:center; padding:40px; color:#8b92a5;">Войдите в аккаунт, чтобы играть</div>`;
    return;
  }

  try {
    const r = await fetch('/api/cases/list?guest_id=' + encodeURIComponent(playerId));
    casesData = await r.json();
    casesData.sort((a,b) => a.price - b.price);

    const grid = document.getElementById('casesGrid');
    grid.innerHTML = '';

    casesData.forEach((c, idx) => {
      const div = document.createElement('div');
      div.className = 'case-card';
      div.dataset.rank = c.minRank;
      
      div.onclick = () => { 
        if(c.available) {
          openContentModal(c);
        } else {
          // Просто визуально ничего не делаем или показываем тост, но без алертов
        }
      };

      div.innerHTML = `
        <div class="case-name">${c.name}</div>
        <div class="case-img">${caseIcons[c.name] || ''}</div>
        <div class="case-price">${fmt(c.price)} ₽</div>
        <button class="btn-select">Открыть</button>
      `;

      grid.appendChild(div);
    });
  } catch(e) {
    console.error(e);
  }
}

// Открытие модалки с содержимым
function openContentModal(c) {
  selectedCase = c;
  
  document.getElementById('contentModalTitle').textContent = `Содержимое кейса "${c.name}"`;
  
  const grid = document.getElementById('contentPrizesGrid');
  grid.innerHTML = c.prizes.map(p => {
    const rar = getRarityClass(p);
    return `
      <div class="prize-item ${rar}">
        ${p} ₽
      </div>
    `;
  }).join('');

  const btn = document.getElementById('contentBtnSpin');
  btn.textContent = `Крутить за ${fmt(c.price)} ₽`;
  
  document.getElementById('contentModalOverlay').classList.add('show');
}

function closeContentModal() {
  document.getElementById('contentModalOverlay').classList.remove('show');
}

// Нажатие на кнопку "Крутить" в модалке
document.getElementById('contentBtnSpin').onclick = () => {
  closeContentModal();
  startSpin(selectedCase);
};

function startSpin(c) {
  if (isSpinning) return;
  
  document.getElementById('fsSpinOverlay').classList.add('show');
  document.getElementById('fsTitle').textContent = c.name;
  
  const track = document.getElementById('fsSpinTrack');
  track.innerHTML = '';
  track.style.transition = 'none';
  track.style.transform = 'translateX(0)';

  // Визуальные заглушки
  const fakePrizes = [5, 10, 15, 20, 30, 50, 75, 100, 175, 500];
  for(let i=0; i<40; i++){
    const fakeVal = fakePrizes[Math.floor(Math.random()*fakePrizes.length)];
    const rar = getRarityClass(fakeVal);
    track.innerHTML += `
      <div class="fs-spin-item ${rar}">
        ${fakeVal} ₽
      </div>
    `;
  }

  executeSpin();
}

async function executeSpin() {
  if (isSpinning || !selectedCase) return;
  isSpinning = true;

  try {
    const res = await fetch('/api/cases/open', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ guest_id: playerId, case_name: selectedCase.name })
    });
    const data = await res.json();
    
    if (!res.ok) {
      closeFullscreenSpin();
      isSpinning = false;
      return;
    }

    const prize = data.prize;
    
    // Сразу обновляем баланс (чтобы показать, что деньги списались)
    loadBalance();

    const track = document.getElementById('fsSpinTrack');
    track.innerHTML = '';
    const fakePrizes = [5, 10, 15, 20, 30, 50, 75, 100, 175, 500];
    
    for(let i=0; i<40; i++){
      let val = fakePrizes[Math.floor(Math.random()*fakePrizes.length)];
      if (i === 35) val = prize; 
      
      const rar = getRarityClass(val);
      track.innerHTML += `
        <div class="fs-spin-item ${rar}">
          ${val} ₽
        </div>
      `;
    }

    const containerWidth = document.querySelector('.fs-spin-window').clientWidth;
    const itemWidth = 155; 
    const centerOffset = containerWidth / 2;
    const randomOffset = (Math.random() * 40) - 20;
    const targetScroll = (35 * itemWidth) - centerOffset + (itemWidth / 2) + randomOffset;

    setTimeout(() => {
      track.style.transition = 'transform 5.5s cubic-bezier(0.1, 0.8, 0.1, 1)';
      track.style.transform = `translateX(-${targetScroll}px)`;
    }, 50);

    setTimeout(() => {
      document.getElementById('fsSpinOverlay').classList.remove('show');
      showTopToast(prize);
      loadBalance(); // Обновляем баланс после начисления выигрыша
      isSpinning = false;
    }, 5600);

  } catch(e) {
    closeFullscreenSpin();
    isSpinning = false;
  }
}

function closeFullscreenSpin() {
  if (isSpinning) return;
  document.getElementById('fsSpinOverlay').classList.remove('show');
}

// Показ верхнего уведомления
function showTopToast(prize) {
  const toast = document.getElementById('topToast');
  document.getElementById('toastAmount').textContent = `+${fmt(prize)} ₽`;
  toast.classList.add('show');
  
  setTimeout(() => {
    toast.classList.remove('show');
  }, 4000);
}

initCases();
</script>
</body>
</html>
