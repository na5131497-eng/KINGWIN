<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🪜 ЛЕСЕНКА — KINGWIN</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  .float-menu-btn { position: fixed; top: 15px; left: 15px; z-index: 1000; background: #181a24; border: 1px solid #00e5ff; color: #00e5ff; width: 44px; height: 44px; border-radius: 10px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 24px; }
  .float-menu { position: fixed; top: 15px; left: 70px; z-index: 999; background: rgba(17,18,26,0.95); border-radius: 16px; padding: 10px; display: flex; flex-direction: column; gap: 6px; width: 180px; transform: translateX(-20px); opacity: 0; pointer-events: none; transition: 0.3s; }
  .float-menu.show { transform: translateX(0); opacity: 1; pointer-events: auto; }
  .float-menu a { display: flex; padding: 10px 12px; border-radius: 10px; color: #8b92a5; font-size: 12px; font-weight: 700; text-decoration: none; }

  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Montserrat', sans-serif; }
  body { background: radial-gradient(circle at top center, #1a1c29 0%, #090a10 60%); color: #fff; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
  .topbar { height: 70px; display: flex; justify-content: space-between; align-items: center; padding: 0 20px; padding-left: 70px; border-bottom: 1px solid rgba(255,255,255,0.06); }
  .logo { font-size: 20px; font-weight: 900; background: linear-gradient(135deg, #00e5ff, #0077ff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-decoration: none; }
  .balance-badge { padding: 8px 16px; background: #181a24; border-radius: 20px; font-weight: 700; color: #00ff88; }
  
  .content { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 20px; }
  .icon { font-size: 80px; filter: drop-shadow(0 0 20px rgba(0,229,255,0.6)); animation: float 3s ease-in-out infinite; margin-bottom: 20px; }
  @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-15px); } }
  h1 { font-size: 38px; font-weight: 900; letter-spacing: 4px; margin-bottom: 10px; }
  p { font-size: 16px; color: #8b92a5; max-width: 500px; margin-bottom: 30px; }
  .badge { background: rgba(0,229,255,0.1); border: 1px solid rgba(0,229,255,0.3); color: #00e5ff; padding: 8px 20px; border-radius: 20px; font-size: 13px; font-weight: 800; text-transform: uppercase; margin-bottom: 30px; }
  .btn { background: linear-gradient(135deg, #00e5ff, #0077ff); color: #000; padding: 16px 40px; border-radius: 12px; font-weight: 900; text-decoration: none; text-transform: uppercase; }

  @media (max-width: 768px) {
    .topbar { padding-left: 65px; height: 60px; }
    h1 { font-size: 28px; }
    .icon { font-size: 60px; }
    p { font-size: 14px; }
  }
</style>
</head>
<body>
<button class="float-menu-btn" onclick="document.getElementById('floatMenu').classList.toggle('show')">☰</button>
<div class="float-menu" id="floatMenu">
  <a href="/">Главная</a><a href="/crash.html">Crash</a><a href="/cases.html">Cases</a><a href="/miner.html">Miner</a><a href="/ladder.html">Ladder</a>
</div>

<div class="topbar">
  <a href="/" class="logo">KINGWIN</a>
  <div class="balance-badge" id="topBalance">0.00 ₽</div>
</div>

<div class="content">
  <div class="icon">🪜</div>
  <div class="badge">Скоро в эфире</div>
  <h1>LADDER</h1>
  <p>Мы обновляем механику Лесенки, чтобы она работала идеально на телефонах и ПК. Игра вернется на эту страницу в ближайшее время!</p>
  <a href="/" class="btn">На главную</a>
</div>

<script>
  async function loadBalance() {
    const playerId = localStorage.getItem('kingwin_player_id');
    if(!playerId) return;
    try {
      const r = await fetch('/api/guest/me?id=' + encodeURIComponent(playerId));
      const d = await r.json();
      if(r.ok && d.guest) {
        const total = (parseFloat(d.guest.bonus_balance) || 0) + (parseFloat(d.guest.deposit_balance) || 0);
        document.getElementById('topBalance').textContent = total.toFixed(2) + ' ₽';
      }
    } catch(e) {}
  }
  loadBalance();
  setInterval(loadBalance, 5000);
</script>
</body>
</html>
