<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🪜 ЛЕСЕНКА — KINGWIN</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Georgia,serif; -webkit-tap-highlight-color: transparent;}
body{background: radial-gradient(ellipse at 50% 0%, #5a0f0f 0%, #2a0808 40%, #150505 70%, #0a0202 100%); color:#fff;min-height:100vh;padding:10px;display:flex;justify-content:center;align-items:center;overflow:hidden;}

.layout{display:grid;grid-template-columns:280px 1fr;gap:20px;max-width:1000px;width:100%;height:95vh;}

/* ЛЕВАЯ ПАНЕЛЬ */
.sidebar{background:linear-gradient(180deg,rgba(42,8,8,.95),rgba(10,2,2,.98));border:2px solid #d4af37;border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:15px;box-shadow:0 0 30px rgba(212,175,55,.2);}
.sidebar h2{font-size:0.75em;color:#d4af37;letter-spacing:1px;text-transform:uppercase;font-weight:700;}
.sidebar .bet-input{display:flex;align-items:center;background:rgba(0,0,0,0.4);border:1px solid rgba(212,175,55,0.3);border-radius:10px;padding:12px;margin-bottom:5px;}
.sidebar .bet-input input{background:transparent;border:none;color:#fff;font-size:1.4em;font-weight:900;width:100%;outline:none;font-family:Arial;}
.sidebar .bet-input span{color:#d4af37;font-size:0.9em;font-weight:700;}
.quick-bets{display:flex;gap:5px;flex-wrap:wrap;}
.qbet{background:rgba(212,175,55,0.1);border:1px solid rgba(212,175,55,0.3);color:#d4af37;padding:6px 10px;border-radius:6px;font-size:0.75em;font-weight:700;cursor:pointer;transition:all 0.2s;font-family:Arial;}
.qbet:hover{background:rgba(212,175,55,0.3);color:#fff;}

.stones-select{display:flex;gap:5px;flex-wrap:wrap;}
.stone-btn{width:34px;height:34px;border-radius:8px;background:rgba(212,175,55,0.1);border:1px solid rgba(212,175,55,0.3);color:#d4af37;font-weight:900;font-family:Arial;cursor:pointer;transition:all 0.2s;}
.stone-btn:hover{background:rgba(212,175,55,0.3);color:#fff;}
.stone-btn.active{background:#d4af37;color:#0a0505;}

.btn-cashout-main{width:100%;padding:16px;border-radius:10px;background:linear-gradient(180deg,#ffd700,#b8860b);color:#0a0505;border:2px solid #ffd700;font-size:1.1em;font-weight:900;cursor:pointer;transition:all 0.2s;margin-top:auto;font-family:Georgia; box-shadow:0 4px 0 #7a5a10;text-transform:uppercase;letter-spacing:1px;}
.btn-cashout-main:hover{transform:translateY(-2px);box-shadow:0 6px 0 #7a5a10, 0 0 20px rgba(255,215,0,0.6);}
.btn-cashout-main:disabled{background:#333;color:#666;border-color:#333;cursor:not-allowed;box-shadow:none;transform:none;}

/* ИГРОВОЕ ПОЛЕ */
.game-area{display:flex;justify-content:center;align-items:center;position:relative; background:rgba(15,5,5,0.6); border:2px solid rgba(212,175,55,0.15); border-radius:16px; padding:10px;}

/* МНОЖИТЕЛИ */
.multipliers{position:absolute;left:15px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:6px;font-family:Arial;font-weight:900;font-size:0.75em;color:#8a6a10;z-index:10;}
.multipliers .m-val{background:#1a0505;padding:4px 8px;border-radius:4px;border:1px solid #4a1a1a;text-align:center;width:55px;}
.multipliers .m-val.active{background:#d4af37;color:#0a0505;border-color:#ffd700;box-shadow:0 0 10px rgba(255,215,0,0.6);}
.multipliers .m-val.passed{color:#1dd1a1;border-color:#1dd1a1;}

/* СЕТКА */
.grid-scroll { 
    max-height: 100%; 
    overflow-y: auto; 
    padding-left: 80px; 
    padding-right: 20px;
    scrollbar-width: none;
    display: flex;
    justify-content: center;
}
.grid-scroll::-webkit-scrollbar { display: none; }

.grid-wrap{display:flex;flex-direction:column;gap:6px;padding:10px 0;}
.row{display:flex;gap:4px;justify-content:center;}
.cell{width:28px;height:28px;border-radius:6px;background:linear-gradient(160deg,#2a0808,#1a0505);border:1px solid #4a2a5a;cursor:pointer;transition:all 0.15s;position:relative;display:flex;justify-content:center;align-items:center;font-size:0.9em;}

.cell:hover:not(:disabled):not(.opened){ border-color: #d4af37; }

/* СТИЛИ ДЛЯ КЛЕТОК */
.cell.opened{background:#1a0505;border-color:#4a2a5a;cursor:default;}
.cell.opened.stone{background:#ff4444;border-color:#ff4444;box-shadow:0 0 10px rgba(255,68,68,0.5);}
.cell.opened.diamond{background:#0a3a2a;border-color:#1dd1a1; box-shadow: inset 0 0 10px rgba(29,209,161,0.3);}

/* ПОДСВЕТКА ТОЛЬКО КОГДА ИГРОК СХОДИЛ */
.cell.selected { border-width: 2px; transform: scale(1.15); z-index: 5; box-shadow: 0 0 15px currentColor; }
.cell.selected.safe { background: #1dd1a1; border-color: #fff; color: #1dd1a1; }
.cell.selected.boom { background: #ff4444; border-color: #fff; color: #ff4444; animation: shake 0.4s; }

/* ТЕКУЩАЯ СТУПЕНЬ */
.cell.current{background:#d4af37;border-color:#ffd700;animation:pulse 1s infinite;cursor:pointer;box-shadow:0 0 10px rgba(255,215,0,0.6);}

/* ИКОНКИ */
.cell.stone-icon::after { content:'💣'; font-size: 1em; }
.cell.diamond-icon::after { content:'💎'; font-size: 0.9em; }

@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
.shake{animation:shake 0.4s;}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

/* УВЕДОМЛЕНИЯ */
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%) translateY(-100px);background:#1dd1a1;color:#0a1a14;padding:10px 20px;border-radius:8px;font-weight:900;transition:all 0.3s;z-index:1000;opacity:0;}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0);}
.toast.error{background:#ff6b6b;color:#fff;}

/* КНОПКИ И БАЛАНС */
.back-btn { position: fixed; top: 20px; left: 20px; color: #d4af37; text-decoration: none; font-size: 0.85em; font-weight: 700; letter-spacing: 1px; display: flex; align-items: center; gap: 6px; padding: 8px 14px; border-radius: 8px; background: rgba(212, 175, 55, 0.1); border: 1px solid rgba(212, 175, 55, 0.3); transition: all 0.2s; z-index: 100;}
.back-btn:hover { color: #ffd700; background: rgba(212, 175, 55, 0.2); border-color: #ffd700; box-shadow: 0 0 15px rgba(212, 175, 55, 0.4); }

.bal-box{position:fixed;top:20px;right:20px;display:flex;align-items:center;gap:8px;padding:9px 16px;background:linear-gradient(180deg,#2a0808,#1a0505);border:3px solid #d4af37;border-radius:12px;box-shadow:0 0 0 1px #8a6a10 inset,0 0 22px rgba(212,175,55,.5);min-width:150px;z-index:100;}
.bal-box .lbl{font-size:.55em;font-weight:700;letter-spacing:2px;color:#d4af37;margin-bottom:2px;text-transform:uppercase;}
.bal-box .num{font-size:1.1em;font-weight:700;background:linear-gradient(180deg,#fff8d0,#ffd700 50%,#b8860b);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;font-variant-numeric:tabular-nums; font-family: Arial;}

@media(max-width:800px){
  body { padding: 5px; align-items: flex-start; }
  .layout{grid-template-columns:1fr; height:auto; gap: 10px;}
  .multipliers{display:none;}
  .grid-scroll{padding-left:0; padding-right:0; max-height: 60vh;}
  .cell{width:22px; height:22px;}
  .sidebar { padding: 15px; }
  .bal-box { top: 10px; right: 10px; padding: 5px 10px; min-width: 100px; }
  .back-btn { top: 10px; left: 10px; padding: 5px 10px; font-size: 0.75em; }
}
</style>
</head>
<body>

<a href="index.html" class="back-btn">← НА ГЛАВНУЮ</a>

<div class="bal-box">
  <span style="font-size:1.2em;">👑</span>
  <div>
    <div class="lbl">Баланс</div>
    <div class="num">₽<span id="bal">0</span></div>
  </div>
</div>

<div class="toast" id="toast">Сообщение</div>

<div class="layout">
  <div class="sidebar">
    <h2>Сумма ставки</h2>
    <div class="bet-input">
      <span>₽</span>
      <input type="text" id="betInput" value="100">
    </div>
    
    <div class="quick-bets">
      <button class="qbet" onclick="setBet(10)">10</button>
      <button class="qbet" onclick="setBet(100)">100</button>
      <button class="qbet" onclick="setBet(500)">500</button>
      <button class="qbet" onclick="setBet(1000)">1000</button>
    </div>

    <h2 style="margin-top:10px;">Количество камней</h2>
    <div class="stones-select" id="stonesSelect">
      <button class="stone-btn" data-stones="1">1</button>
      <button class="stone-btn" data-stones="2">2</button>
      <button class="stone-btn" data-stones="3">3</button>
      <button class="stone-btn" data-stones="4">4</button>
      <button class="stone-btn" data-stones="5">5</button>
      <button class="stone-btn active" data-stones="6">6</button>
      <button class="stone-btn" data-stones="7">7</button>
    </div>

    <button class="btn-cashout-main" id="mainBtn" onclick="handleMainBtn()">СДЕЛАТЬ СТАВКУ</button>
  </div>

  <div class="game-area">
    <div class="multipliers" id="multipliers"></div>
    <div class="grid-scroll" id="gridScroll">
        <div class="grid-wrap" id="gridWrap"></div>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<script>
var firebaseConfig = {
  apiKey: "AIzaSyC8PI8bCzGB_tODO6MnOKAjkxXaASbA3vM",
  authDomain: "kingwin-260a8.firebaseapp.com",
  databaseURL: "https://kingwin-260a8-default-rtdb.firebaseio.com",
  projectId: "kingwin-260a8",
  storageBucket: "kingwin-260a8.firebasestorage.app",
  messagingSenderId: "1085884746167",
  appId: "1:1085884746167:web:9962cbc9eb5c876ae78032"
};

firebase.initializeApp(firebaseConfig);
var db = firebase.database();
var auth = firebase.auth();

var CURRENT_USER_KEY = 'kw_current_user';
var B = 0;

var STEP_WIDTHS = [20, 19, 19, 18, 20, 16, 18, 15, 19, 10, 9, 8];
var TOTAL_STEPS = STEP_WIDTHS.length;
var TOTAL_STONES = 6; 
var playing = false;
var currentBet = 0;
var currentStep = 0;
var stonePositions = []; 
var isWaiting = false;

function $(id){ return document.getElementById(id); }
function fmt(n){ 
  var r = Math.round(n*100)/100;
  if(r%1===0) return Math.floor(r).toLocaleString('ru-RU');
  return r.toFixed(2).replace('.',',').replace(/\B(?=(\d{3})+(?!\d))/g,' ');
}

function showToast(text, isError) {
  var t = $('toast');
  t.textContent = text;
  t.className = 'toast on' + (isError ? ' error' : '');
  setTimeout(function() { t.classList.remove('on'); }, 2000);
}

// ==================== БАЛАНС ====================
function loadBalance(){
  var uid = localStorage.getItem(CURRENT_USER_KEY);
  if(!uid){ window.location.replace('auth.html?need_auth=1'); return; }
  db.ref('users/' + uid).once('value').then(function(snapshot){
    var user = snapshot.val();
    if(user){
      B = (user.realBalance || 0) + (user.bonusBalance || 0);
      $('bal').textContent = fmt(B);
    }
  });
}

function setBalDisplay(newTotal){
  B = newTotal;
  $('bal').textContent = fmt(B);
}

async function safeChangeBalance(delta){
  var uid = localStorage.getItem(CURRENT_USER_KEY);
  if(!uid) return null;
  var ref = db.ref('users/' + uid);
  try {
    var result = await ref.transaction(function(user) {
      if (!user) return user;
      var real = user.realBalance || 0;
      var bonus = user.bonusBalance || 0;
      if (delta < 0) {
        var toTake = -delta;
        var fromReal = Math.min(real, toTake);
        toTake -= fromReal;
        var fromBonus = Math.min(bonus, toTake);
        if (fromReal + fromBonus < -delta) return;
        user.realBalance = real - fromReal;
        user.bonusBalance = bonus - fromBonus;
      } else {
        user.realBalance = real + delta;
      }
      return user;
    });
    if (!result.committed) return null;
    var u = result.snapshot.val();
    return (u.realBalance || 0) + (u.bonusBalance || 0);
  } catch(e) { return null; }
}

// ==================== ЛОГИКА ====================
function getStepChance(stepIndex){
    var cellsCount = STEP_WIDTHS[stepIndex];
    return (cellsCount - TOTAL_STONES) / cellsCount;
}

function calcMult(step){
  if(step === 0) return 1;
  var m = 1;
  for(var i=0; i<step; i++){
      m = m / getStepChance(i);
  }
  return Math.min(m * 0.97, 10000); 
}

function setBet(v){ if(playing || isWaiting) return; $('betInput').value = v; }

$('stonesSelect').addEventListener('click', function(e){
  var btn = e.target.closest('.stone-btn');
  if(!btn || playing || isWaiting) return;
  var v = parseInt(btn.dataset.stones);
  document.querySelectorAll('.stone-btn').forEach(function(b){ b.classList.remove('active'); });
  btn.classList.add('active');
  TOTAL_STONES = v;
  renderGrid();
});

function renderGrid(){
  var mHtml = '';
  // ИСПРАВЛЕНИЕ: Генерируем множители СНИЗУ ВВЕРХ, чтобы они совпадали со ступенями
  for(var i = TOTAL_STEPS; i >= 1; i--){
    var m = calcMult(i);
    var isPassed = (i <= currentStep && playing);
    var isCurrent = (i === currentStep + 1 && playing);
    mHtml += '<div class="m-val ' + (isPassed ? 'passed' : '') + ' ' + (isCurrent ? 'active' : '') + '">x' + m.toFixed(2) + '</div>';
  }
  $('multipliers').innerHTML = mHtml;

  var grid = $('gridWrap');
  grid.innerHTML = '';
  
  // Рисуем сетку снизу вверх
  for(var step = TOTAL_STEPS - 1; step >= 0; step--){
    var row = document.createElement('div');
    row.className = 'row';
    row.dataset.step = step;
    
    var cellsInRow = STEP_WIDTHS[step];
    
    for(var c = 0; c < cellsInRow; c++){
        var cell = document.createElement('div');
        cell.className = 'cell';
        
        if (step < currentStep) {
            cell.classList.add('opened', 'diamond', 'selected', 'safe');
        } else if (step === currentStep && playing) {
            cell.classList.add('current');
            (function(s, idx){
                cell.onclick = function() { clickCell(s, idx, cell); };
            })(step, c);
        }
        
        row.appendChild(cell);
    }
    grid.appendChild(row);
  }
  
  if(playing && currentStep > 0){
      var visualIndex = TOTAL_STEPS - 1 - currentStep;
      var currentRow = grid.children[visualIndex];
      if(currentRow){
          currentRow.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }
  }
}

async function clickCell(step, cellIdx, cellEl){
  if(!playing || step !== currentStep || isWaiting) return;
  
  isWaiting = true;
  
  var currentRow = cellEl.parentElement;
  var rowCells = currentRow.children;
  for(var i=0; i<rowCells.length; i++){
      rowCells[i].classList.remove('current');
  }
  
  var isStone = stonePositions[step] && stonePositions[step].indexOf(cellIdx) !== -1;
  
  if(isStone){
    cellEl.classList.add('opened', 'selected', 'boom');
    cellEl.classList.add('stone-icon');
    showToast('💥 Камень! Вы проиграли', true);
    playing = false;
  } else {
    cellEl.classList.add('opened', 'selected', 'safe');
    cellEl.classList.add('diamond-icon');
  }
  
  setTimeout(function(){
    if(isStone){
        var grid = $('gridWrap');
        for(var r=0; r<TOTAL_STEPS; r++){
            var visualIndex = TOTAL_STEPS - 1 - r;
            var row = grid.children[visualIndex];
            if(!row) continue;
            var cells = row.children;
            for(var c=0; c<cells.length; c++){
                cells[c].classList.remove('current');
                cells[c].classList.add('opened');
                if(stonePositions[r] && stonePositions[r].indexOf(c) !== -1){
                    cells[c].classList.add('stone', 'stone-icon');
                    cells[c].classList.remove('diamond-icon', 'safe');
                } else {
                    cells[c].classList.add('diamond', 'diamond-icon');
                    cells[c].classList.remove('safe');
                }
            }
        }
        
        $('mainBtn').textContent = 'СДЕЛАТЬ СТАВКУ';
        $('mainBtn').style.background = '#48dbfb';
        
        setTimeout(function(){
            playing = false;
            isWaiting = false;
            currentStep = 0;
            currentBet = 0;
            renderGrid();
            $('mainBtn').textContent = 'СДЕЛАТЬ СТАВКУ';
            $('mainBtn').style.background = '#48dbfb';
        }, 2500);
    } else {
        currentStep++;
        isWaiting = false;
        
        if(currentStep >= TOTAL_STEPS){
            cashOut();
            return;
        }
        
        var newMult = calcMult(currentStep);
        var winAmt = Math.floor(currentBet * newMult);
        $('mainBtn').textContent = 'ЗАБРАТЬ ₽' + fmt(winAmt);
        $('mainBtn').style.background = '#1dd1a1';
        
        renderGrid();
    }
  }, 400);
}

async function handleMainBtn(){
  if(playing){
    cashOut();
    return;
  }
  
  if(isWaiting) return;

  var bet = parseInt($('betInput').value) || 0;
  if(bet < 1){ showToast('Мин. ставка 1₽', true); return; }
  if(bet > 10000){ showToast('Макс. ставка 10 000₽', true); return; }
  if(bet > B){ showToast('Мало денег', true); return; }

  var newTotal = await safeChangeBalance(-bet);
  if(newTotal === null){ showToast('Ошибка списания', true); return; }
  
  setBalDisplay(newTotal);
  currentBet = bet;
  currentStep = 0;
  playing = true;

  stonePositions = [];
  for(var s=0; s<TOTAL_STEPS; s++){
      var cellsCount = STEP_WIDTHS[s];
      var positions = [];
      var stonesToPlace = Math.min(TOTAL_STONES, cellsCount - 1);
      
      while(positions.length < stonesToPlace){
          var p = Math.floor(Math.random() * cellsCount);
          if(positions.indexOf(p) === -1) positions.push(p);
      }
      stonePositions.push(positions);
  }

  $('mainBtn').textContent = 'ЗАБРАТЬ ₽' + fmt(currentBet * calcMult(currentStep));
  $('mainBtn').style.background = '#48dbfb';
  
  renderGrid();
}

async function cashOut(){
  if(!playing || currentStep === 0 || isWaiting) return;
  
  var win = Math.floor(currentBet * calcMult(currentStep));
  var newTotal = await safeChangeBalance(win);
  if(newTotal !== null) setBalDisplay(newTotal);
  
  showToast('✅ Вы забрали ₽' + fmt(win), false);
  
  var grid = $('gridWrap');
  for(var r=0; r<TOTAL_STEPS; r++){
        var visualIndex = TOTAL_STEPS - 1 - r;
        var row = grid.children[visualIndex];
        if(!row) continue;
        var cells = row.children;
        for(var c=0; c<cells.length; c++){
            cells[c].classList.remove('current');
            if(r < currentStep){
                cells[c].classList.add('opened', 'diamond', 'selected', 'safe');
            }
        }
    }
  
  $('mainBtn').textContent = 'СДЕЛАТЬ СТАВКУ';
  $('mainBtn').style.background = '#48dbfb';
  
  setTimeout(function(){
      playing = false;
      currentStep = 0;
      currentBet = 0;
      renderGrid();
      $('mainBtn').textContent = 'СДЕЛАТЬ СТАВКУ';
      $('mainBtn').style.background = '#48dbfb';
  }, 2000);
}

// ==================== СТАРТ ====================
renderGrid();

auth.onAuthStateChanged(function(user){
  if(user){
    localStorage.setItem(CURRENT_USER_KEY, user.uid);
    loadBalance();
  } else {
    window.location.replace('auth.html?need_auth=1');
  }
});

$('betInput').addEventListener('input', function() {
  this.value = this.value.replace(/[^0-9]/g, '');
});
</script>
</body>
</html>
