<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0e14">
<title>KINGWIN — Ladder</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-main: #090a10; --bg-panel: #151922; --bg-card: #1a1f2b;
    --accent: #00e5ff; --accent-green: #00ff88; --gold: #f1c40f;
    --text-main: #fff; --text-muted: #8b92a5;
    --border: rgba(255,255,255,0.06); --red: #ff4d4d;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Montserrat', sans-serif; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; background: var(--bg-main); color: var(--text-main); }
  
  .app { display: flex; height: 100vh; height: 100dvh; }

  /* ЛЕВАЯ ПАНЕЛЬ */
  .sidebar { width: 300px; background: var(--bg-panel); border-right: 1px solid var(--border); display: flex; flex-direction: column; padding: 20px; flex-shrink: 0; z-index: 10; }
  .sidebar h3 { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; font-weight: 800; margin-bottom: 10px; margin-top: 5px; }
  
  .input-group { background: rgba(0,0,0,0.4); border: 1px solid var(--border); border-radius: 10px; padding: 10px 15px; margin-bottom: 20px; display: flex; align-items: center; gap: 10px; }
  .input-group input { flex: 1; background: transparent; border: none; color: #fff; font-size: 22px; font-weight: 900; outline: none; font-family: inherit; min-width: 0; }
  .input-group .currency { color: var(--text-muted); font-size: 14px; font-weight: 700; }

  .quick-bets { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 25px; }
  .quick-bets button { flex: 1; min-width: 40px; background: rgba(255,255,255,0.05); border: 1px solid var(--border); color: var(--text-muted); padding: 10px 5px; border-radius: 8px; font-weight: 700; font-size: 12px; cursor: pointer; transition: 0.2s; }
  .quick-bets button:hover { background: rgba(255,255,255,0.1); color: #fff; }
  .quick-bets button.active { border-color: var(--accent); color: var(--accent); background: rgba(0,229,255,0.1); }

  .mines-grid { display: flex; gap: 6px; margin-bottom: 30px; }
  .mine-btn { flex: 1; background: transparent; border: 1px solid var(--border); color: var(--text-muted); padding: 12px 0; border-radius: 8px; font-weight: 700; font-size: 13px; cursor: pointer; transition: 0.2s; }
  .mine-btn:hover { background: rgba(255,255,255,0.05); color: #fff; }
  .mine-btn.active { border-color: var(--accent); color: #fff; background: rgba(0,229,255,0.1); box-shadow: 0 0 10px rgba(0,229,255,0.2); }

  .btn-start { width: 100%; background: linear-gradient(135deg, var(--accent), #0077ff); color: #000; border: none; border-radius: 12px; padding: 16px; font-size: 15px; font-weight: 900; text-transform: uppercase; cursor: pointer; transition: 0.3s; margin-top: auto; }
  .btn-start:hover { box-shadow: 0 0 25px rgba(0,229,255,0.5); }

  .btn-cashout { width: 100%; background: linear-gradient(135deg, var(--accent-green), #00b85c); color: #000; border: none; border-radius: 12px; padding: 14px 16px; font-size: 15px; font-weight: 900; text-transform: uppercase; cursor: pointer; transition: 0.3s; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; margin-top: auto; }
  .btn-cashout span { font-size: 11px; font-weight: 800; opacity: 0.8; }
  .btn-cashout strong { font-size: 22px; font-weight: 900; }
  .btn-cashout:hover:not(:disabled) { box-shadow: 0 0 25px rgba(0,255,136,0.5); }
  .btn-cashout:disabled { opacity: 0.5; cursor: not-allowed; background: #333; }

  .link-bottom { text-align: center; color: var(--text-muted); font-size: 11px; margin-top: 15px; cursor: pointer; }
  .link-bottom:hover { color: #fff; }

  /* ПРАВАЯ ПАНЕЛЬ (ИГРА) */
  .game-area { flex: 1; display: flex; position: relative; overflow: hidden; background: radial-gradient(circle at center, #1a2332, #090a10 80%); }
  
  .game-area::before { content: ''; position: absolute; inset: 0; background-image: linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px); background-size: 40px 40px; pointer-events: none; }

  .multiplier-column { width: 80px; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; padding-bottom: 40px; gap: 10px; z-index: 2; padding-right: 10px; }
  .mult-item { width: 100%; height: 50px; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 800; color: var(--text-muted); background: transparent; border-radius: 8px; transition: 0.3s; }
  .mult-item.active { background: #102a3d; color: #fff; border: 1px solid var(--accent); box-shadow: 0 0 15px rgba(0,229,255,0.3); }

  .ladder-container { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; padding-bottom: 40px; gap: 10px; z-index: 2; position: relative; overflow-y: auto; }
  
  .step-row { display: flex; gap: 15px; }
  .cell { width: 60px; height: 50px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.2s; position: relative; }
  
  .cell:hover:not(:disabled) { background: rgba(255,255,255,0.1); border-color: var(--accent); }
  .cell:disabled { cursor: not-allowed; }
  
  .cell.current { background: rgba(0,229,255,0.1); border-color: var(--accent); animation: pulse 1.5s infinite; cursor: pointer; }
  .cell.safe { background: rgba(0,255,136,0.1); border-color: var(--accent-green); }
  .cell.mine { background: rgba(255,77,77,0.1); border-color: var(--red); }
  .cell.dimmed { opacity: 0.2; background: rgba(255,255,255,0.02); }

  @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(0,229,255,0.4); } 70% { box-shadow: 0 0 0 8px rgba(0,229,255,0); } 100% { box-shadow: 0 0 0 0 rgba(0,229,255,0); } }

  .icon { width: 60%; height: 60%; display: flex; align-items: center; justify-content: center; }
  .icon svg { width: 100%; height: 100%; }

  /* Мобильная адаптация */
  @media (max-width: 900px) {
    .app { flex-direction: column; }
    .sidebar { width: 100%; height: auto; border-right: none; border-bottom: 1px solid var(--border); padding: 15px; }
    .btn-start, .btn-cashout { margin-top: 15px; }
    .game-area { flex-direction: column; justify-content: flex-end; padding: 10px 0; }
    .multiplier-column { flex-direction: row; width: 100%; justify-content: center; padding-bottom: 10px; gap: 5px; padding-right: 0; }
    .mult-item { width: 60px; height: auto; padding: 8px 0; font-size: 10px; }
    .ladder-container { padding-bottom: 10px; gap: 6px; }
    .cell { width: 50px; height: 45px; }
    .step-row { gap: 10px; }
  }
</style>
</head>
<body>

<div class="app">
  <!-- ЛЕВАЯ ПАНЕЛЬ -->
  <div class="sidebar">
    <h3>Сумма ставки</h3>
    <div class="input-group">
      <input type="number" id="betAmount" value="25.00" min="10" max="1000" step="1">
      <span class="currency">₽</span>
    </div>
    
    <div class="quick-bets" id="quickBets">
      <button onclick="setBet(10)">10</button>
      <button onclick="setBet(25)" class="active">25</button>
      <button onclick="setBet(50)">50</button>
      <button onclick="setBet(100)">100</button>
    </div>

    <h3>Количество камней</h3>
    <div class="mines-grid" id="minesGrid">
      <button class="mine-btn" onclick="setMines(3)">3</button>
      <button class="mine-btn" onclick="setMines(4)">4</button>
      <button class="mine-btn" onclick="setMines(5)">5</button>
      <button class="mine-btn active" onclick="setMines(6)">6</button>
      <button class="mine-btn" onclick="setMines(7)">7</button>
    </div>

    <button class="btn-start" id="btnStart" onclick="startGame()">Играть</button>
    
    <button class="btn-cashout" id="btnCashout" onclick="cashout()" style="display:none;">
      <span>Забрать</span>
      <strong id="cashoutAmount">0 ₽</strong>
    </button>

    <div class="link-bottom" onclick="alert('Правила: угадай безопасную клетку с короной, чтобы подняться выше. Попал на сломанную — проиграл.')">Как играть?</div>
  </div>

  <!-- ПРАВАЯ ПАНЕЛЬ -->
  <div class="game-area">
    <div class="multiplier-column" id="multipliers"></div>
    <div class="ladder-container" id="ladder"></div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
let currentPlayer = null;
let balance = 0;
let sessionId = null;
let currentStep = 0;
let totalSteps = 6;
let currentBet = 25;
let busy = false;
let stepsData = [];

// Множители для 3-9 ступеней (примерно как на скрине)
const MULT_TABLE = {
  3: [1.24, 1.70, 2.36],
  4: [1.24, 1.70, 2.36, 3.30],
  5: [1.24, 1.70, 2.36, 3.30, 4.78],
  6: [1.24, 1.70, 2.36, 3.30, 4.78, 7.21],
  7: [1.24, 1.70, 2.36, 3.30, 4.78, 7.21, 11.50],
  8: [1.24, 1.70, 2.36, 3.30, 4.78, 7.21, 11.50, 19.47],
  9: [1.24, 1.70, 2.36, 3.30, 4.78, 7.21, 11.50, 19.47, 37.95]
};

// SVG Короны из Miner
const SVG_CROWN = `<svg viewBox="0 0 64 64" fill="none"><defs><linearGradient id="crownGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff8b0"/><stop offset="0.5" stop-color="#f1c40f"/><stop offset="1" stop-color="#b8860b"/></linearGradient></defs><path d="M8 48 L8 22 L20 34 L32 14 L44 34 L56 22 L56 48 Z" fill="url(#crownGrad)" stroke="#fff8b0" stroke-width="1.5" stroke-linejoin="round"/><circle cx="8" cy="20" r="3" fill="#00e5ff" stroke="#fff" stroke-width="1"/><circle cx="32" cy="12" r="3.5" fill="#00e5ff" stroke="#fff" stroke-width="1"/><circle cx="56" cy="20" r="3" fill="#00e5ff" stroke="#fff" stroke-width="1"/><rect x="8" y="46" width="48" height="4" fill="#b8860b" stroke="#fff8b0" stroke-width="1"/></svg>`;
const SVG_BROKEN = `<svg viewBox="0 0 64 64" fill="none"><defs><linearGradient id="brokenGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff9b9b"/><stop offset="0.5" stop-color="#ff4d4d"/><stop offset="1" stop-color="#8b0000"/></linearGradient></defs><path d="M6 48 L6 22 L18 34 L26 24 L30 34 L30 48 Z" fill="url(#brokenGrad)" stroke="#ff9b9b" stroke-width="1.5" stroke-linejoin="round"/><path d="M36 48 L36 38 L42 32 L50 34 L58 22 L58 48 Z" fill="url(#brokenGrad)" stroke="#ff9b9b" stroke-width="1.5" stroke-linejoin="round" opacity="0.7"/><path d="M30 30 L34 36 L32 42 L36 48" stroke="#fff" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.8"/><circle cx="30" cy="20" r="1.5" fill="#ff9b9b"/><circle cx="38" cy="26" r="1.5" fill="#ff9b9b"/><circle cx="42" cy="18" r="1.5" fill="#ff9b9b"/><path d="M20 12 L22 16 M44 10 L46 14 M28 8 L28 12" stroke="#ff4d4d" stroke-width="1.5" stroke-linecap="round"/></svg>`;

function loadMe() {
  try {
    const raw = localStorage.getItem('kingwin_guest');
    if (!raw) return null;
    const g = JSON.parse(raw);
    if (!g || !g.id) return null;
    return { guestId: String(g.id), name: String(g.name || '') };
  } catch(e) { return null; }
}

async function refreshBalance() {
  if (!currentPlayer) return;
  try {
    const r = await fetch('/api/guest/summary?id=' + encodeURIComponent(currentPlayer.guestId));
    if (!r.ok) return;
    const d = await r.json();
    balance = (parseFloat(d.deposit_balance) || 0) + (parseFloat(d.bonus_balance) || 0);
  } catch(e) {}
}

function setBet(val) {
  if (sessionId) return;
  currentBet = val;
  $('betAmount').value = val.toFixed(2);
  document.querySelectorAll('#quickBets button').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');
}

function setMines(val) {
  if (sessionId) return;
  totalSteps = val;
  document.querySelectorAll('#minesGrid button').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');
  renderBoard(); // Обновить превью
}

function renderBoard() {
  const ladder = $('ladder');
  const mults = $('multipliers');
  ladder.innerHTML = '';
  mults.innerHTML = '';

  const multArr = MULT_TABLE[totalSteps] || MULT_TABLE[6];

  for (let i = totalSteps - 1; i >= 0; i--) {
    const row = document.createElement('div');
    row.className = 'step-row';
    
    for (let side = 0; side < 2; side++) {
      const cell = document.createElement('div');
      cell.className = 'cell';
      
      const stepInfo = stepsData[i] || { safe: -1 };
      const isPassed = (i < currentStep);
      const isCurrent = (i === currentStep);
      
      if (isPassed) {
        if (stepInfo.safe === side) {
          cell.classList.add('safe');
          cell.innerHTML = `<div class="icon">${SVG_CROWN}</div>`;
        } else {
          cell.classList.add('dimmed');
        }
      } else if (isCurrent) {
        cell.classList.add('current');
        cell.onclick = () => clickCell(i, side);
      } else {
        cell.classList.add('dimmed');
      }
      
      row.appendChild(cell);
    }
    ladder.appendChild(row);

    const mEl = document.createElement('div');
    mEl.className = 'mult-item' + (i === currentStep ? ' active' : '');
    mEl.textContent = 'x' + multArr[i].toFixed(2);
    mults.appendChild(mEl);
  }

  setTimeout(() => {
    const activeMult = mults.querySelector('.active');
    if (activeMult) activeMult.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }, 50);
}

async function startGame() {
  if (busy || sessionId) return;
  if (!currentPlayer) { alert('Войдите в аккаунт'); return; }
  
  currentBet = parseFloat($('betAmount').value) || 0;
  if (currentBet < 10) { alert('Мин. ставка 10 ₽'); return; }
  if (balance < currentBet) { alert('Недостаточно средств'); return; }

  busy = true;
  $('btnStart').disabled = true;
  $('btnStart').textContent = 'Загрузка...';

  try {
    const r = await fetch('/api/ladder/start', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ guest_id: currentPlayer.guestId, bet: currentBet, steps: totalSteps })
    });
    const d = await r.json();
    if (!r.ok) { alert(d.error); busy = false; $('btnStart').disabled = false; $('btnStart').textContent = 'Играть'; return; }

    sessionId = d.session_id;
    stepsData = d.ladder; // [{ safe: 0, mine: 1 }, ...]
    currentStep = 0;
    
    $('btnStart').style.display = 'none';
    $('btnCashout').style.display = 'flex';
    $('btnCashout').disabled = true;
    $('cashoutAmount').textContent = '0 ₽';
    
    renderBoard();
    refreshBalance();
  } catch(e) {
    alert('Ошибка соединения');
    $('btnStart').disabled = false; $('btnStart').textContent = 'Играть';
  }
  busy = false;
}

async function clickCell(stepIdx, side) {
  if (busy || !sessionId || stepIdx !== currentStep) return;
  busy = true;

  try {
    const r = await fetch('/api/ladder/step', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ guest_id: currentPlayer.guestId, session_id: sessionId, cell: side })
    });
    const d = await r.json();
    if (!r.ok) { alert(d.error); busy = false; return; }

    if (d.result === 'safe') {
      currentStep = d.next_step;
      renderBoard();
      $('btnCashout').disabled = false;
      const multArr = MULT_TABLE[totalSteps] || MULT_TABLE[6];
      const nextWin = currentBet * multArr[currentStep - 1];
      $('cashoutAmount').textContent = nextWin.toFixed(2) + ' ₽';
    } else if (d.result === 'lose') {
      stepsData[currentStep] = { safe: d.correct_cell };
      renderBoard();
      setTimeout(() => {
        alert('Вы попали на сломанную корону! Ставка сгорела.');
        resetGame();
      }, 500);
    } else if (d.result === 'win') {
      alert(`Победа! Вы забрали ${d.win.toFixed(2)} ₽`);
      resetGame();
      refreshBalance();
    }
  } catch(e) {
    alert('Ошибка соединения');
  }
  busy = false;
}

async function cashout() {
  if (busy || !sessionId || currentStep === 0) return;
  // Временное решение для UI, серверный кешаут нужно дописать в server.js
  alert('Вы забрали выигрыш!');
  resetGame();
}

function resetGame() {
  sessionId = null;
  currentStep = 0;
  stepsData = [];
  $('btnStart').style.display = 'block';
  $('btnStart').disabled = false;
  $('btnStart').textContent = 'Играть';
  $('btnCashout').style.display = 'none';
  renderBoard();
  refreshBalance();
}

window.onload = () => {
  currentPlayer = loadMe();
  if (currentPlayer) {
    refreshBalance();
    setInterval(refreshBalance, 5000);
    renderBoard(); // Показать превью
  } else {
    alert('Войдите в аккаунт на главной странице');
    window.location.href = '/';
  }
};
</script>
</body>
</html>
