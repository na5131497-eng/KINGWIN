<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>KINGWIN — Минёр</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root { --bg-main:#090a10; --bg-panel:#181a24; --bg-dark:#11121a; --accent:#00e5ff; --accent-green:#00ff88; --text-main:#fff; --text-muted:#8b92a5; --border:rgba(255,255,255,0.06); --red:#ff4d4d; --yellow:#f1c40f; --gold:#ffd700; }
  * { box-sizing:border-box; margin:0; padding:0; font-family:'Montserrat',sans-serif; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; }
  body { background:var(--bg-main); color:var(--text-main); min-height:100vh; min-height:100dvh; display:flex; flex-direction:column; overflow-x:hidden; }

  .float-menu-btn { position:fixed; top:15px; left:15px; z-index:1000; background:#181a24; border:1px solid #00e5ff; color:#00e5ff; width:44px; height:44px; border-radius:10px; cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:24px; box-shadow:0 4px 15px rgba(0,0,0,0.5); }
  .float-menu-btn:hover { background:rgba(0,229,255,0.1); }
  .float-menu { position:fixed; top:15px; left:70px; z-index:999; background:rgba(17,18,26,0.95); backdrop-filter:blur(10px); border:1px solid rgba(255,255,255,0.1); border-radius:16px; padding:10px; display:flex; flex-direction:column; gap:6px; width:180px; box-shadow:0 10px 30px rgba(0,0,0,0.6); transform:translateX(-20px); opacity:0; pointer-events:none; transition:0.3s; }
  .float-menu.show { transform:translateX(0); opacity:1; pointer-events:auto; }
  .float-menu a { display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:10px; text-decoration:none; color:#8b92a5; font-size:12px; font-weight:700; text-transform:uppercase; }
  .float-menu a:hover { background:rgba(0,229,255,0.1); color:#00e5ff; }

  .topbar { display:flex; justify-content:space-between; align-items:center; padding:10px 16px; padding-left:70px; background:var(--bg-panel); border-bottom:1px solid var(--border); flex-shrink:0; }
  .topbar-logo { font-size:18px; font-weight:900; letter-spacing:2px; background:linear-gradient(135deg,#00e5ff,#0077ff); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
  .balance-badge { display:flex; align-items:center; gap:6px; background:rgba(0,0,0,0.5); border:1px solid rgba(0,229,255,0.35); padding:6px 12px; border-radius:20px; font-size:12px; font-weight:700; }
  .balance-badge .lbl { color:var(--text-muted); font-size:10px; text-transform:uppercase; letter-spacing:1px; }
  .balance-badge .val { color:var(--accent); font-weight:900; font-size:13px; }

  .miner-layout { flex:1; display:flex; flex-direction:column; max-width:560px; margin:0 auto; padding:16px; gap:14px; width:100%; }

  .stats-row { display:flex; gap:10px; }
  .stat-box { flex:1; background:var(--bg-panel); border:1px solid var(--border); border-radius:14px; padding:12px; text-align:center; }
  .stat-box .lbl { font-size:10px; color:var(--text-muted); text-transform:uppercase; letter-spacing:1px; font-weight:700; margin-bottom:4px; }
  .stat-box .val { font-size:20px; font-weight:900; color:#fff; }
  .stat-box .val.cyan { color:var(--accent); }
  .stat-box .val.green { color:var(--accent-green); }

  .field-wrap { background:linear-gradient(180deg,#131624,#090a10); border:1px solid var(--border); border-radius:20px; padding:16px; box-shadow:inset 0 0 40px rgba(0,0,0,0.4); }
  .field { display:grid; grid-template-columns:repeat(5,1fr); gap:8px; }
  .cell { aspect-ratio:1; background:var(--bg-dark); border:1px solid var(--border); border-radius:12px; display:flex; align-items:center; justify-content:center; font-size:28px; cursor:pointer; transition:0.15s; user-select:none; }
  .cell:hover:not(.opened):not(.mine):not(.disabled) { background:#1e2230; border-color:rgba(0,229,255,0.4); transform:scale(1.03); }
  .cell.opened { background:rgba(0,255,136,0.12); border-color:rgba(0,255,136,0.5); cursor:default; }
  .cell.opened::after { content:'💎'; font-size:24px; }
  .cell.mine { background:rgba(255,77,77,0.2); border-color:var(--red); animation:shake 0.3s; cursor:default; }
  .cell.mine::after { content:'💣'; font-size:26px; }
  .cell.disabled { cursor:not-allowed; opacity:0.5; }

  @keyframes shake {
    0%,100% { transform:translateX(0); }
    25% { transform:translateX(-4px); }
    75% { transform:translateX(4px); }
  }

  .status-msg { text-align:center; font-size:13px; font-weight:700; color:var(--text-muted); min-height:20px; text-transform:uppercase; letter-spacing:1px; }
  .status-msg.win { color:var(--accent-green); }
  .status-msg.lose { color:var(--red); }
  .status-msg.fly { color:var(--accent); }

  .control-panel { background:var(--bg-panel); border:1px solid var(--border); border-radius:20px; padding:14px; display:flex; flex-direction:column; gap:10px; }
  .amount-row { display:flex; gap:8px; }
  .amount-input-wrap { flex:1; display:flex; align-items:center; background:rgba(0,0,0,0.4); border:1px solid var(--border); border-radius:12px; padding:4px; min-width:0; }
  .amount-input-wrap button { width:36px; height:36px; border-radius:8px; background:rgba(255,255,255,0.05); border:none; color:#fff; font-size:18px; cursor:pointer; font-weight:700; }
  .amount-input-wrap button:hover { background:rgba(255,255,255,0.1); }
  .amount-input-wrap input { flex:1; min-width:0; background:transparent; border:none; color:#fff; text-align:center; font-size:18px; font-weight:800; outline:none; font-family:inherit; }
  .amount-input-wrap input:disabled { opacity:0.6; }

  .btn-action { flex:1; border:none; border-radius:12px; font-size:15px; font-weight:900; cursor:pointer; text-transform:uppercase; letter-spacing:1px; display:flex; flex-direction:column; align-items:center; justify-content:center; line-height:1.2; padding:12px 10px; }
  .btn-action .subtext { font-size:11px; font-weight:600; opacity:0.9; margin-top:3px; }
  .btn-bet { background:var(--yellow); color:#000; }
  .btn-bet:hover { background:#f7d341; }
  .btn-bet:disabled { opacity:0.5; cursor:not-allowed; }

  .btn-cashout { background:linear-gradient(135deg,#0a1a3a,#1a3a6b 50%,#0a1a3a); color:#00e5ff; border:2px solid #00e5ff; box-shadow:0 0 15px rgba(0,229,255,0.45); }
  .btn-cashout:hover { background:linear-gradient(135deg,#102a5a,#2a5a9b 50%,#102a5a); }
  .btn-cashout:disabled { opacity:0.5; cursor:not-allowed; }

  .quick-bets { display:flex; gap:6px; }
  .quick-bets button { flex:1; background:rgba(255,255,255,0.05); border:1px solid var(--border); color:var(--text-muted); padding:6px; border-radius:8px; font-size:11px; font-weight:700; cursor:pointer; font-family:inherit; }
  .quick-bets button:hover { background:rgba(255,255,255,0.1); color:#fff; }
  .quick-bets button:disabled { opacity:0.4; cursor:not-allowed; }

  .toast-container { position:fixed; top:60px; right:16px; z-index:99999; display:flex; flex-direction:column; gap:8px; pointer-events:none; }
  .toast { background:rgba(24,26,36,0.95); border-left:4px solid var(--accent); padding:12px 16px; border-radius:8px; box-shadow:0 10px 30px rgba(0,0,0,0.5); min-width:220px; transform:translateX(120%); transition:transform 0.3s; font-size:13px; font-weight:600; pointer-events:auto; }
  .toast.show { transform:translateX(0); }
  .toast.success { border-left-color:var(--accent-green); }
  .toast.error { border-left-color:var(--red); }
</style>
</head>
<body>

<button class="float-menu-btn" onclick="document.getElementById('floatMenu').classList.toggle('show')">☰</button>
<div class="float-menu" id="floatMenu">
  <a href="/">🏠 Главная</a>
  <a href="/crash.html">🚀 Crash</a>
  <a href="/cases.html">🎁 Cases</a>
  <a href="/miner.html">💣 Miner</a>
</div>

<div class="topbar">
  <div class="topbar-logo">KINGWIN</div>
  <div class="balance-badge">
    <span class="lbl">Баланс</span>
    <span class="val" id="balanceVal">0.00 ₽</span>
  </div>
</div>

<div class="miner-layout">

  <div class="stats-row">
    <div class="stat-box">
      <div class="lbl">Множитель</div>
      <div class="val cyan" id="multVal">x1.00</div>
    </div>
    <div class="stat-box">
      <div class="lbl">Возможный выигрыш</div>
      <div class="val green" id="potentialVal">0 ₽</div>
    </div>
  </div>

  <div class="status-msg" id="statusMsg">Сделайте ставку</div>

  <div class="field-wrap">
    <div class="field" id="field"></div>
  </div>

  <div class="control-panel">
    <div class="amount-row">
      <div class="amount-input-wrap">
        <button onclick="adjustBet(-10)">−</button>
        <input type="number" id="betInput" value="10" min="1">
        <button onclick="adjustBet(10)">+</button>
      </div>
      <button class="btn-action btn-bet" id="btnBet" onclick="onBetClick()">
        Начать игру
        <span class="subtext">Ставка 10 ₽</span>
      </button>
    </div>
    <div class="quick-bets">
      <button onclick="setBet(10)">10 ₽</button>
      <button onclick="setBet(50)">50 ₽</button>
      <button onclick="setBet(100)">100 ₽</button>
      <button onclick="setBet(500)">500 ₽</button>
    </div>
  </div>

</div>

<div class="toast-container" id="toastContainer"></div>

<script>
let currentPlayer = null;
let inGame = false;
let gameId = null;
let step = 0;
let bet = 0;
let currentMult = 1.0;
const TOTAL_CELLS = 25;

const fieldEl = document.getElementById('field');
const betInput = document.getElementById('betInput');
const btnBet = document.getElementById('btnBet');
const multVal = document.getElementById('multVal');
const potentialVal = document.getElementById('potentialVal');
const statusMsg = document.getElementById('statusMsg');

window.onload = async () => {
  const id = localStorage.getItem('kingwin_guest_id');
  if (!id) { window.location.href = '/'; return; }
  currentPlayer = { id };
  await loadBalance();
  buildEmptyField();
  betInput.addEventListener('input', updateBetPreview);
};

async function loadBalance() {
  try {
    const r = await fetch('/api/guest/me?id=' + encodeURIComponent(currentPlayer.id));
    const d = await r.json();
    if (d.balance) {
      document.getElementById('balanceVal').textContent = d.balance.total.toFixed(2) + ' ₽';
    }
  } catch(e){}
}

function buildEmptyField() {
  fieldEl.innerHTML = '';
  for (let i = 0; i < TOTAL_CELLS; i++) {
    const c = document.createElement('div');
    c.className = 'cell disabled';
    c.dataset.idx = i;
    c.onclick = () => openCell(i, c);
    fieldEl.appendChild(c);
  }
}

function buildActiveField() {
  fieldEl.innerHTML = '';
  for (let i = 0; i < TOTAL_CELLS; i++) {
    const c = document.createElement('div');
    c.className = 'cell';
    c.dataset.idx = i;
    c.onclick = () => openCell(i, c);
    fieldEl.appendChild(c);
  }
}

function adjustBet(d) {
  let v = (parseFloat(betInput.value) || 0) + d;
  if (v < 1) v = 1;
  betInput.value = v;
  updateBetPreview();
}
function setBet(v) { betInput.value = v; updateBetPreview(); }
function updateBetPreview() {
  if (!inGame) {
    const v = parseFloat(betInput.value) || 0;
    btnBet.querySelector('.subtext').textContent = 'Ставка ' + v + ' ₽';
  }
}

function showToast(text, type = 'success') {
  const c = document.getElementById('toastContainer');
  const t = document.createElement('div');
  t.className = 'toast ' + type;
  t.textContent = text;
  c.appendChild(t);
  setTimeout(() => t.classList.add('show'), 10);
  setTimeout(() => { t.classList.remove('show'); setTimeout(() => t.remove(), 300); }, 3000);
}

async function onBetClick() {
  if (inGame) {
    await cashout();
    return;
  }
  await startGame();
}

async function startGame() {
  const amount = parseFloat(betInput.value) || 0;
  if (amount < 1) return showToast('Мин 1 ₽', 'error');

  btnBet.disabled = true;
  try {
    const r = await fetch('/api/miner/start', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ guest_id: currentPlayer.id, bet: amount })
    });
    const d = await r.json();
    if (!d.ok) {
      showToast(d.error || 'Ошибка', 'error');
      btnBet.disabled = false;
      return;
    }

    inGame = true;
    gameId = d.game_id;
    step = 0;
    bet = amount;
    currentMult = 1.0;
    betInput.disabled = true;
    document.querySelectorAll('.quick-bets button').forEach(b => b.disabled = true);
    buildActiveField();
    updateUI();
    statusMsg.textContent = 'Открывайте ячейки';
    statusMsg.className = 'status-msg fly';
    btnBet.className = 'btn-action btn-cashout';
    btnBet.disabled = true;
    btnBet.innerHTML = 'Забрать <span class="subtext">x1.00</span>';
    await loadBalance();
  } catch(e) {
    showToast('Ошибка сети', 'error');
    btnBet.disabled = false;
  }
}

async function openCell(idx, cellEl) {
  if (!inGame) return;
  if (cellEl.classList.contains('opened') || cellEl.classList.contains('mine') || cellEl.classList.contains('disabled')) return;

  cellEl.classList.add('disabled');

  try {
    const r = await fetch('/api/miner/step', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ guest_id: currentPlayer.id, game_id: gameId, cell_index: idx })
    });
    const d = await r.json();
    if (!d.ok) {
      showToast(d.error || 'Ошибка', 'error');
      return;
    }

    if (d.survive) {
      cellEl.classList.remove('disabled');
      cellEl.classList.add('opened');
      step = d.steps;
      currentMult = d.mult;
      updateUI();
      btnBet.disabled = false;
      btnBet.innerHTML = 'Забрать <span class="subtext">x' + currentMult.toFixed(2) + '</span>';
      statusMsg.textContent = '💎 Безопасно! Продолжайте или забирайте';
      statusMsg.className = 'status-msg fly';
    } else {
      // Взрыв — сервер говорит где была мина
      cellEl.classList.add('mine');
      inGame = false;
      step = 0;
      statusMsg.textContent = '💥 Взрыв! Ставка потеряна';
      statusMsg.className = 'status-msg lose';
      btnBet.className = 'btn-action btn-bet';
      btnBet.disabled = false;
      btnBet.innerHTML = 'Начать игру <span class="subtext">Ставка ' + (parseFloat(betInput.value)||0) + ' ₽</span>';
      betInput.disabled = false;
      document.querySelectorAll('.quick-bets button').forEach(b => b.disabled = false);
      revealMines(d.mine_pos, idx);
      await loadBalance();
      setTimeout(() => {
        buildEmptyField();
        multVal.textContent = 'x1.00';
        potentialVal.textContent = '0 ₽';
        statusMsg.textContent = 'Сделайте ставку';
        statusMsg.className = 'status-msg';
      }, 2200);
    }
  } catch(e) {
    showToast('Ошибка сети', 'error');
  }
}

async function cashout() {
  if (!inGame || step === 0) return;

  btnBet.disabled = true;
  try {
    const r = await fetch('/api/miner/cashout', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ guest_id: currentPlayer.id, game_id: gameId })
    });
    const d = await r.json();
    if (!d.ok) {
      showToast(d.error || 'Ошибка', 'error');
      btnBet.disabled = false;
      return;
    }

    showToast('✅ Выигрыш: ' + d.win.toFixed(2) + ' ₽', 'success');
    inGame = false;
    statusMsg.textContent = '💰 Забрано ' + d.win.toFixed(2) + ' ₽';
    statusMsg.className = 'status-msg win';
    btnBet.className = 'btn-action btn-bet';
    btnBet.disabled = false;
    btnBet.innerHTML = 'Начать игру <span class="subtext">Ставка ' + (parseFloat(betInput.value)||0) + ' ₽</span>';
    betInput.disabled = false;
    document.querySelectorAll('.quick-bets button').forEach(b => b.disabled = false);
    await loadBalance();
    setTimeout(() => {
      buildEmptyField();
      multVal.textContent = 'x1.00';
      potentialVal.textContent = '0 ₽';
      statusMsg.textContent = 'Сделайте ставку';
      statusMsg.className = 'status-msg';
    }, 2200);
  } catch(e) {
    showToast('Ошибка сети', 'error');
    btnBet.disabled = false;
  }
}

function updateUI() {
  multVal.textContent = 'x' + currentMult.toFixed(2);
  const potential = bet * currentMult;
  potentialVal.textContent = potential.toFixed(2) + ' ₽';
  if (inGame) {
    btnBet.innerHTML = 'Забрать <span class="subtext">x' + currentMult.toFixed(2) + '</span>';
  }
}

function revealMines(minePos, clickedIdx) {
  // Открываем все мины (обычно одна)
  document.querySelectorAll('.cell').forEach(c => {
    const idx = parseInt(c.dataset.idx);
    if (idx === minePos && !c.classList.contains('mine')) {
      c.classList.add('mine');
      c.classList.remove('disabled', 'opened');
    } else if (idx !== clickedIdx && !c.classList.contains('opened')) {
      c.classList.add('disabled');
    }
  });
}
</script>
</body>
</html>
