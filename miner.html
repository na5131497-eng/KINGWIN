<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0e14">
<title>KINGWIN — Miner</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-main: #090a10; --bg-panel: #151922;
    --accent: #00e5ff; --accent-green: #00ff88;
    --text-main: #fff; --text-muted: #8b92a5;
    --border: rgba(255,255,255,0.1); --red: #ff4d4d;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Montserrat', sans-serif; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; background: var(--bg-main); color: var(--text-main); }
  .app { display: flex; flex-direction: column; height: 100vh; height: 100dvh; }

  .float-menu-btn { position: fixed; top: 15px; left: 15px; z-index: 1000; background: #181a24; border: 1px solid var(--accent); color: var(--accent); width: 44px; height: 44px; border-radius: 10px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 24px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); transition: 0.3s; }
  .float-menu { position: fixed; top: 15px; left: 70px; z-index: 999; background: rgba(17,18,26,0.95); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; padding: 10px; display: flex; flex-direction: column; gap: 6px; width: 180px; box-shadow: 0 10px 30px rgba(0,0,0,0.6); transform: translateX(-20px); opacity: 0; pointer-events: none; transition: 0.3s; }
  .float-menu.show { transform: translateX(0); opacity: 1; pointer-events: auto; }
  .float-menu a { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 10px; text-decoration: none; color: #8b92a5; font-size: 12px; font-weight: 700; transition: 0.2s; text-transform: uppercase; border: 1px solid transparent; }
  .float-menu a:hover { background: rgba(0,229,255,0.1); color: var(--accent); border-color: rgba(0,229,255,0.3); }

  .topbar { height: 60px; background: var(--bg-panel); border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; padding: 0 20px; padding-left: 70px; flex-shrink: 0; z-index: 100; }
  .logo { font-size: 18px; font-weight: 900; letter-spacing: 2px; background: linear-gradient(135deg, #00e5ff, #0077ff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-decoration: none; }
  .top-actions { display: flex; align-items: center; gap: 10px; }
  .balance-pill { background: rgba(0,255,136,0.12); border: 1px solid rgba(0,255,136,0.35); color: var(--accent-green); padding: 8px 16px; border-radius: 8px; font-weight: 900; font-size: 13px; white-space: nowrap; }

  .main-body { display: flex; flex: 1; overflow: hidden; }
  .sidebar { width: 280px; background: var(--bg-panel); border-right: 1px solid var(--border); display: flex; flex-direction: column; padding: 20px; flex-shrink: 0; z-index: 10; overflow-y: auto; }
  .sidebar h3 { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; font-weight: 800; margin-bottom: 10px; margin-top: 5px; }
  .input-group { background: rgba(0,0,0,0.4); border: 1px solid var(--border); border-radius: 10px; padding: 10px 15px; margin-bottom: 15px; display: flex; align-items: center; gap: 10px; }
  .input-group input { flex: 1; background: transparent; border: none; color: #fff; font-size: 20px; font-weight: 900; outline: none; font-family: inherit; min-width: 0; }
  .input-group .currency { color: var(--text-muted); font-size: 14px; font-weight: 700; }
  .quick-bets { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 20px; }
  .quick-bets button { flex: 1; min-width: 40px; background: rgba(255,255,255,0.05); border: 1px solid var(--border); color: var(--text-muted); padding: 8px 0; border-radius: 8px; font-weight: 700; font-size: 11px; cursor: pointer; transition: 0.2s; }
  .quick-bets button.active { border-color: var(--accent); color: var(--accent); background: rgba(0,229,255,0.1); }
  .mines-grid { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 20px; }
  .mine-btn { flex: 1; min-width: 32px; background: transparent; border: 1px solid var(--border); color: var(--text-muted); padding: 8px 0; border-radius: 6px; font-weight: 700; font-size: 11px; cursor: pointer; transition: 0.2s; }
  .mine-btn.active { border-color: var(--accent); color: #fff; background: rgba(0,229,255,0.1); }
  .btn-start { width: 100%; background: linear-gradient(135deg, var(--accent), #0077ff); color: #000; border: none; border-radius: 10px; padding: 14px; font-size: 14px; font-weight: 900; text-transform: uppercase; cursor: pointer; transition: 0.3s; margin-top: auto; flex-shrink: 0; }
  .btn-start:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-cashout { width: 100%; background: linear-gradient(135deg, var(--accent-green), #00b85c); color: #000; border: none; border-radius: 10px; padding: 10px 14px; font-size: 14px; font-weight: 900; text-transform: uppercase; cursor: pointer; transition: 0.3s; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; margin-top: auto; flex-shrink: 0; }
  .btn-cashout span { font-size: 10px; font-weight: 800; opacity: 0.8; text-transform: uppercase; letter-spacing: 1px; }
  .btn-cashout strong { font-size: 20px; font-weight: 900; }
  .btn-cashout:disabled { opacity: 0.5; cursor: not-allowed; background: #333; }

  .game-area { flex: 1; display: flex; flex-direction: column; position: relative; overflow: hidden; background: radial-gradient(circle at center, #121826, #090a10 80%); padding: 20px; }
  .mult-display { text-align: center; margin-bottom: 20px; flex-shrink: 0; }
  .mult-display .label { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; font-weight: 800; margin-bottom: 6px; }
  .mult-display .value { font-size: 36px; font-weight: 900; background: linear-gradient(135deg, #00e5ff, #0077ff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .grid-wrap { flex: 1; display: flex; align-items: center; justify-content: center; overflow: auto; }
  .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; width: 100%; max-width: 520px; aspect-ratio: 1; }
  .cell { aspect-ratio: 1; background: #1a1f2b; border: 1px solid rgba(0,229,255,0.3); border-radius: 10px; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.2s; box-shadow: inset 0 0 8px rgba(0,229,255,0.08); font-size: 28px; user-select: none; }
  .cell:hover:not(:disabled):not(.opened):not(.mine) { background: rgba(0,229,255,0.15); border-color: var(--accent); transform: scale(1.05); }
  .cell.opened { background: rgba(0,255,136,0.15); border-color: var(--accent-green); cursor: default; }
  .cell.mine { background: rgba(255,77,77,0.2); border-color: var(--red); cursor: default; }
  .cell.dimmed { opacity: 0.35; cursor: default; }
  .cell:disabled { cursor: default; }

  .toast-container { position: fixed; top: 80px; right: 20px; z-index: 999999; display: flex; flex-direction: column; gap: 10px; pointer-events: none; }
  .toast { background: rgba(24,26,36,0.95); border-left: 4px solid var(--accent); padding: 16px 20px; border-radius: 8px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); min-width: 250px; transform: translateX(120%); transition: 0.3s; font-weight: 600; font-size: 14px; color: #fff; }
  .toast.show { transform: translateX(0); }
  .toast.success { border-left-color: var(--accent-green); }
  .toast.error { border-left-color: var(--red); }

  @media (max-width: 900px) {
    .main-body { flex-direction: column; }
    .sidebar { width: 100%; height: auto; flex-direction: row; flex-wrap: wrap; border-right: none; border-bottom: 1px solid var(--border); padding: 10px; align-items: center; justify-content: space-between; gap: 10px; }
    .sidebar h3 { display: none; }
    .input-group { margin-bottom: 0; flex: 1; min-width: 120px; }
    .quick-bets { margin-bottom: 0; flex: 2; min-width: 200px; }
    .mines-grid { margin-bottom: 0; flex: 2; min-width: 200px; }
    .btn-start, .btn-cashout { width: auto; min-width: 120px; margin-top: 0; flex: 1; padding: 10px; }
    .game-area { padding: 10px; }
    .mult-display .value { font-size: 28px; }
    .grid { gap: 5px; max-width: 100%; }
    .toast-container { top: 60px; right: 10px; left: 10px; }
    .toast { width: 100%; min-width: 0; transform: translateY(-120%); }
    .toast.show { transform: translateY(0); }
  }
</style>
</head>
<body>

<div class="toast-container" id="toastContainer"></div>

<button class="float-menu-btn" onclick="document.getElementById('floatMenu').classList.toggle('show')">☰</button>
<div class="float-menu" id="floatMenu">
  <a href="/">Главная</a>
  <a href="/crash.html">Crash</a>
  <a href="/cases.html">Cases</a>
  <a href="/miner.html">Miner</a>
</div>

<div class="app">
  <div class="topbar">
    <a href="/" class="logo">KINGWIN</a>
    <div class="top-actions">
      <div class="balance-pill"><span id="balanceVal">0.00</span> ₽</div>
    </div>
  </div>

  <div class="main-body">
    <div class="sidebar">
      <h3>Сумма ставки</h3>
      <div class="input-group">
        <input type="number" id="betAmount" value="10.00" min="5" step="1">
        <span class="currency">₽</span>
      </div>
      <div class="quick-bets" id="quickBets">
        <button onclick="setBet(5)">5</button>
        <button onclick="setBet(10)" class="active">10</button>
        <button onclick="setBet(25)">25</button>
        <button onclick="setBet(50)">50</button>
        <button onclick="setBet(100)">100</button>
      </div>
      <h3>Количество мин</h3>
      <div class="mines-grid" id="minesGrid">
        <button class="mine-btn" onclick="setMines(1)">1</button>
        <button class="mine-btn active" onclick="setMines(3)">3</button>
        <button class="mine-btn" onclick="setMines(5)">5</button>
        <button class="mine-btn" onclick="setMines(7)">7</button>
        <button class="mine-btn" onclick="setMines(10)">10</button>
        <button class="mine-btn" onclick="setMines(15)">15</button>
        <button class="mine-btn" onclick="setMines(24)">24</button>
      </div>
      <button class="btn-start" id="btnStart" onclick="startGame()">Играть</button>
      <button class="btn-cashout" id="btnCashout" onclick="cashout()" style="display:none;">
        <span>Забрать</span>
        <strong id="cashoutAmount">0 ₽</strong>
      </button>
    </div>

    <div class="game-area">
      <div class="mult-display">
        <div class="label">Множитель</div>
        <div class="value" id="multVal">x1.00</div>
      </div>
      <div class="grid-wrap">
        <div class="grid" id="grid"></div>
      </div>
    </div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
let currentPlayer = null;
let balance = 0;
let sessionId = null;
let betAmount = 10;
let minesCount = 3;
let revealed = [];
let busy = false;
let gameActive = false;

function showToast(text, type='success') {
  const container = $('toastContainer');
  const toast = document.createElement('div');
  toast.className = `toast ${type}`;
  toast.textContent = text;
  container.appendChild(toast);
  setTimeout(() => toast.classList.add('show'), 10);
  setTimeout(() => { toast.classList.remove('show'); setTimeout(() => toast.remove(), 300); }, 3000);
}

function applyBalanceFromResponse(d) {
  if (!d) return;
  if (typeof d.balance === 'number') balance = d.balance;
  else if (typeof d.deposit_balance === 'number' || typeof d.bonus_balance === 'number') {
    balance = (parseFloat(d.deposit_balance) || 0) + (parseFloat(d.bonus_balance) || 0);
  } else return;
  $('balanceVal').textContent = balance.toFixed(2);
}

function loadMe() {
  try {
    const urlParams = new URLSearchParams(window.location.search);
    const urlId = urlParams.get('id');
    if (urlId) { localStorage.setItem('kingwin_guest_id', urlId); return { guestId: String(urlId) }; }
    const raw = localStorage.getItem('kingwin_guest');
    if (raw) { const g = JSON.parse(raw); if (g && g.id) return { guestId: String(g.id) }; }
    const savedId = localStorage.getItem('kingwin_guest_id');
    if (savedId) return { guestId: String(savedId) };
  } catch(e) {}
  return null;
}

async function refreshBalance() {
  if (!currentPlayer) return;
  try {
    const r = await fetch('/api/guest/me?id=' + encodeURIComponent(currentPlayer.guestId));
    if (!r.ok) return;
    const data = await r.json();
    if (data.balance && typeof data.balance.total === 'number') balance = data.balance.total;
    else if (data.guest) balance = (parseFloat(data.guest.deposit_balance) || 0) + (parseFloat(data.guest.bonus_balance) || 0);
    $('balanceVal').textContent = balance.toFixed(2);
  } catch(e) {}
}

function setBet(v) {
  if (gameActive) return;
  betAmount = v;
  $('betAmount').value = v.toFixed(2);
  document.querySelectorAll('#quickBets button').forEach(b => b.classList.remove('active'));
  if (event && event.target) event.target.classList.add('active');
}
function setMines(v) {
  if (gameActive) return;
  minesCount = v;
  document.querySelectorAll('#minesGrid button').forEach(b => b.classList.remove('active'));
  if (event && event.target) event.target.classList.add('active');
  renderGrid();
}

function renderGrid() {
  const grid = $('grid');
  grid.innerHTML = '';
  for (let i = 0; i < 25; i++) {
    const cell = document.createElement('div');
    cell.className = 'cell';
    cell.dataset.idx = i;
    if (revealed.includes(i)) {
      cell.classList.add('opened');
      cell.textContent = '💎';
    } else if (!gameActive) {
      cell.classList.add('dimmed');
    } else {
      cell.onclick = () => openCell(i);
    }
    grid.appendChild(cell);
  }
}

async function startGame() {
  if (busy || gameActive) return;
  if (!currentPlayer) { showToast('Войдите в аккаунт', 'error'); return; }
  betAmount = parseFloat($('betAmount').value) || 0;
  if (betAmount < 5) { showToast('Мин. ставка 5 ₽', 'error'); return; }
  await refreshBalance();
  if (balance < betAmount) { showToast(`Недостаточно средств. Баланс: ${balance.toFixed(2)} ₽`, 'error'); return; }

  busy = true;
  $('btnStart').disabled = true;
  try {
    const r = await fetch('/api/miner/start', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ guest_id: currentPlayer.guestId, bet: betAmount, mines: minesCount })
    });
    const d = await r.json();
    if (!r.ok) { showToast(d.error || 'Ошибка', 'error'); busy = false; $('btnStart').disabled = false; return; }
    sessionId = d.session_id;
    revealed = [];
    gameActive = true;
    applyBalanceFromResponse(d);
    $('btnStart').style.display = 'none';
    $('btnCashout').style.display = 'flex';
    $('btnCashout').disabled = true;
    $('cashoutAmount').textContent = '0 ₽';
    $('multVal').textContent = 'x1.00';
    renderGrid();
  } catch(e) {
    showToast('Ошибка соединения', 'error');
  }
  busy = false;
}

async function openCell(idx) {
  if (busy || !sessionId || !gameActive) return;
  if (revealed.includes(idx)) return;
  busy = true;
  try {
    const r = await fetch('/api/miner/open', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ guest_id: currentPlayer.guestId, session_id: sessionId, cell: idx })
    });
    const d = await r.json();
    if (!r.ok) { showToast(d.error || 'Ошибка', 'error'); busy = false; return; }
    applyBalanceFromResponse(d);

    if (d.mine) {
      // Показать все мины
      const grid = $('grid');
      [...grid.children].forEach(cell => {
        const i = parseInt(cell.dataset.idx, 10);
        cell.onclick = null;
        cell.classList.remove('dimmed');
        if (d.mines.includes(i)) { cell.classList.add('mine'); cell.textContent = '💣'; }
        else if (revealed.includes(i)) { cell.classList.add('opened'); cell.textContent = '💎'; }
      });
      gameActive = false;
      setTimeout(() => {
        showToast('Вы попали на мину! Ставка сгорела.', 'error');
        resetGame();
      }, 1200);
    } else {
      revealed = d.revealed;
      const cell = $('grid').children[idx];
      if (cell) { cell.classList.add('opened'); cell.textContent = '💎'; cell.onclick = null; }
      $('multVal').textContent = 'x' + d.multiplier.toFixed(2);
      $('cashoutAmount').textContent = (betAmount * d.multiplier).toFixed(2) + ' ₽';
      $('btnCashout').disabled = false;

      if (d.auto_cashout) {
        gameActive = false;
        showToast(`Победа! Вы забрали ${d.win.toFixed(2)} ₽`, 'success');
        setTimeout(resetGame, 800);
      }
    }
  } catch(e) {
    showToast('Ошибка соединения', 'error');
  }
  busy = false;
}

async function cashout() {
  if (busy || !sessionId || !gameActive || revealed.length === 0) return;
  busy = true;
  $('btnCashout').disabled = true;
  try {
    const r = await fetch('/api/miner/cashout', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ guest_id: currentPlayer.guestId, session_id: sessionId })
    });
    const d = await r.json();
    if (!r.ok) { showToast(d.error || 'Ошибка', 'error'); busy = false; return; }
    applyBalanceFromResponse(d);
    showToast(`Вы забрали ${d.win.toFixed(2)} ₽!`, 'success');
    gameActive = false;
    resetGame();
  } catch(e) {
    showToast('Ошибка соединения', 'error');
  }
  busy = false;
}

function resetGame() {
  sessionId = null;
  revealed = [];
  gameActive = false;
  $('btnStart').style.display = 'block';
  $('btnStart').disabled = false;
  $('btnCashout').style.display = 'none';
  $('multVal').textContent = 'x1.00';
  renderGrid();
  refreshBalance();
}

window.onload = () => {
  currentPlayer = loadMe();
  if (currentPlayer) {
    refreshBalance();
    setInterval(refreshBalance, 3000);
    renderGrid();
  } else {
    showToast('Войдите в аккаунт на главной странице', 'error');
    setTimeout(() => { window.location.href = '/'; }, 1500);
  }
};
</script>
</body>
</html>
