<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>KINGWIN — Empire of Gold</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-main: #05070e; --bg-panel: rgba(15, 19, 26, 0.85);
    --accent: #00e5ff; --gold: #f1c40f; --gold-glow: rgba(241, 196, 15, 0.6);
    --text-main: #fff; --text-muted: #8b92a5;
    --border: rgba(241, 196, 15, 0.3); --red: #ff4d4d;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Montserrat', sans-serif; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; background: var(--bg-main); color: var(--text-main); }
  
  .app { 
    display: flex; flex-direction: column; height: 100vh; height: 100dvh; 
    background-image: url('/empire_bg.jpg'); /* ТВОЙ ФОН */
    background-size: cover; background-position: center; 
  }

  /* Затемняющий слой поверх фона, чтобы барабаны читались */
  .overlay { position: absolute; inset: 0; background: rgba(5, 7, 14, 0.4); z-index: 1; pointer-events: none; }

  /* Топбар */
  .topbar { height: 60px; background: rgba(5, 7, 14, 0.8); backdrop-filter: blur(10px); border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; padding: 0 20px; flex-shrink: 0; z-index: 100; position: relative; }
  .logo { font-size: 18px; font-weight: 900; letter-spacing: 2px; background: linear-gradient(135deg, #00e5ff, #0077ff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-decoration: none; }
  .balance-pill { background: rgba(0,255,136,0.12); border: 1px solid rgba(0,255,136,0.35); color: #00ff88; padding: 8px 16px; border-radius: 8px; font-weight: 900; font-size: 13px; box-shadow: 0 0 10px rgba(0,255,136,0.2); }
  .back-btn { background: rgba(255,255,255,0.1); border: 1px solid var(--border); color: var(--gold); padding: 8px 12px; border-radius: 8px; cursor: pointer; font-weight: 800; font-size: 12px; text-decoration: none; transition: 0.2s; }
  .back-btn:hover { background: rgba(241,196,15,0.2); }

  /* Игровое поле */
  .game-area { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; z-index: 2; padding: 15px; }
  
  /* Слот машина (Стеклянная с золотом) */
  .slot-machine { 
    background: rgba(10, 13, 20, 0.6); 
    backdrop-filter: blur(8px);
    border: 2px solid var(--gold); 
    border-radius: 20px; padding: 8px; 
    box-shadow: 0 0 30px rgba(241,196,15,0.3), inset 0 0 20px rgba(0,0,0,0.8); 
    max-width: 100%; width: 550px; 
    display: flex; flex-direction: column; overflow: hidden; 
  }
  
  .reels-wrap { flex: 1; display: flex; gap: 6px; background: rgba(0,0,0,0.6); border-radius: 12px; overflow: hidden; border: 1px solid rgba(241,196,15,0.2); position: relative; aspect-ratio: 5 / 3; padding: 6px; }
  
  .reel { flex: 1; display: flex; flex-direction: column; gap: 6px; position: relative; }
  
  /* Символы (Ячейки) */
  .symbol { 
    flex: 1; 
    background: linear-gradient(180deg, rgba(30,35,50,0.8) 0%, rgba(15,20,30,0.9) 100%);
    border-radius: 8px; 
    display: flex; justify-content: center; align-items: center; 
    font-size: 40px; font-weight: 900; 
    border: 1px solid rgba(241,196,15,0.15); 
    box-shadow: inset 0 0 10px rgba(0,0,0,0.8);
    text-shadow: 0 0 15px currentColor;
  }
  
  /* Цвета символов в стиле логотипа */
  .sym-low { color: #00e5ff; } /* Голубые (10, J, Q, K, A) */
  .sym-mid { color: #f1c40f; } /* Золотые (Скарабей, Корона) */
  .sym-wild { color: #fff; text-shadow: 0 0 20px #00e5ff, 0 0 10px #f1c40f; } /* Бело-золотой Wild */
  .sym-coin { 
    background: radial-gradient(circle, #f1c40f, #b8860b); 
    color: #000; border-radius: 50%; width: 70%; height: 70%; 
    font-size: 16px; border: 2px solid #fff; 
    box-shadow: 0 0 20px rgba(241,196,15,0.8); 
    margin: auto; display: flex; justify-content: center; align-items: center; 
    text-shadow: none;
  }

  /* Анимация размытия */
  .spinning .symbol { filter: blur(4px); opacity: 0.8; }

  /* Панель управления */
  .controls { width: 100%; max-width: 550px; margin-top: 20px; background: rgba(15, 19, 26, 0.85); backdrop-filter: blur(10px); border: 1px solid var(--border); border-radius: 16px; padding: 15px; display: flex; flex-direction: column; gap: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
  
  .bet-row { display: flex; justify-content: space-between; align-items: center; }
  .bet-display { background: rgba(0,0,0,0.6); border: 1px solid var(--gold); padding: 8px 16px; border-radius: 8px; font-weight: 900; font-size: 18px; color: var(--gold); display: flex; align-items: center; gap: 12px; box-shadow: 0 0 10px rgba(241,196,15,0.2); }
  .bet-display button { background: rgba(241,196,15,0.2); border: none; color: var(--gold); width: 30px; height: 30px; border-radius: 50%; cursor: pointer; font-weight: 900; font-size: 18px; display: flex; justify-content: center; align-items: center; transition: 0.2s; }
  .bet-display button:hover { background: rgba(241,196,15,0.4); }

  .spin-row { display: flex; gap: 10px; }
  
  /* Кнопка Крутить (Золотая) */
  .btn-spin { flex: 2; background: linear-gradient(135deg, #f1c40f, #e67e22); color: #000; border: none; border-radius: 12px; padding: 18px; font-size: 18px; font-weight: 900; text-transform: uppercase; cursor: pointer; transition: 0.2s; box-shadow: 0 4px 15px rgba(241,196,15,0.4); text-shadow: 0 1px 2px rgba(255,255,255,0.5); }
  .btn-spin:hover { transform: translateY(-2px); box-shadow: 0 6px 25px rgba(241,196,15,0.6); }
  .btn-spin:disabled { opacity: 0.5; cursor: not-allowed; background: #333; box-shadow: none; }
  
  /* Кнопка Бонус (Голубая) */
  .btn-buy { flex: 1; background: rgba(0,229,255,0.1); border: 1px solid var(--accent); color: var(--accent); border-radius: 12px; padding: 15px; font-size: 12px; font-weight: 900; cursor: pointer; text-transform: uppercase; transition: 0.2s; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; box-shadow: 0 0 10px rgba(0,229,255,0.2); }
  .btn-buy:hover { background: rgba(0,229,255,0.25); box-shadow: 0 0 20px rgba(0,229,255,0.4); }
  .btn-buy span { font-size: 10px; opacity: 0.8; }

  /* Уведомления */
  .toast-container { position: fixed; top: 80px; right: 20px; z-index: 999999; display: flex; flex-direction: column; gap: 10px; pointer-events: none; }
  .toast { background: rgba(15, 19, 26, 0.95); border-left: 4px solid var(--accent); padding: 16px 20px; border-radius: 8px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); min-width: 250px; transform: translateX(120%); transition: 0.3s; font-weight: 600; font-size: 14px; color: #fff; }
  .toast.show { transform: translateX(0); }
  .toast.success { border-left-color: var(--gold); }
  .toast.error { border-left-color: var(--red); }

  @media (max-width: 600px) {
    .slot-machine { width: 100%; padding: 4px; border-radius: 12px; }
    .reels-wrap { gap: 4px; padding: 4px; }
    .symbol { font-size: 28px; border-radius: 6px; }
    .sym-coin { font-size: 12px; width: 80%; height: 80%; }
    .controls { padding: 10px; border-radius: 12px; }
    .btn-spin { padding: 14px; font-size: 16px; }
    .btn-buy { padding: 10px; font-size: 10px; }
    .bet-display { font-size: 16px; padding: 6px 10px; }
    .bet-display button { width: 26px; height: 26px; font-size: 16px; }
  }
</style>
</head>
<body>

<div class="toast-container" id="toastContainer"></div>

<div class="app">
  <div class="overlay"></div>
  
  <div class="topbar">
    <a href="/" class="back-btn">← Назад</a>
    <a href="/" class="logo">KINGWIN</a>
    <div class="balance-pill"><span id="balanceVal">0.00</span> ₽</div>
  </div>

  <div class="game-area">
    <div class="slot-machine" id="slotMachine">
      <div class="reels-wrap" id="reelsWrap">
        <!-- Барабаны генерируются в JS -->
      </div>
    </div>

    <div class="controls">
      <div class="bet-row">
        <div style="font-size: 12px; color: var(--text-muted); font-weight: 800; letter-spacing: 1px;">СТАВКА</div>
        <div class="bet-display">
          <button onclick="changeBet(-10)">-</button>
          <span id="betAmount">10</span> ₽
          <button onclick="changeBet(10)">+</button>
        </div>
      </div>
      
      <div class="spin-row">
        <button class="btn-spin" id="btnSpin" onclick="spin()">Крутить</button>
        <button class="btn-buy" onclick="buyBonus()">
          Купить бонус
          <span>100x от ставки</span>
        </button>
      </div>
    </div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
let currentPlayer = null;
let balance = 0;
let bet = 10;
let isSpinning = false;

// Символы. В будущем можно заменить текст на картинки через <img>
const SYMBOLS = [
  { id: '10', class: 'sym-low', val: '10' },
  { id: 'J', class: 'sym-low', val: 'J' },
  { id: 'Q', class: 'sym-low', val: 'Q' },
  { id: 'K', class: 'sym-low', val: 'K' },
  { id: 'A', class: 'sym-low', val: 'A' },
  { id: 'crown', class: 'sym-mid', val: '👑' },
  { id: 'scarab', class: 'sym-mid', val: '🪲' },
  { id: 'wild', class: 'sym-wild', val: 'W' },
  { id: 'coin', class: 'sym-coin', val: '2x' } // Монета для бонуса
];

// Генерация пустого поля
function renderReels() {
  const wrap = $('reelsWrap');
  wrap.innerHTML = '';
  for (let i = 0; i < 5; i++) {
    const reel = document.createElement('div');
    reel.className = 'reel';
    for (let j = 0; j < 3; j++) {
      const sym = SYMBOLS[Math.floor(Math.random() * SYMBOLS.length)];
      const el = document.createElement('div');
      el.className = `symbol ${sym.class}`;
      el.textContent = sym.val;
      reel.appendChild(el);
    }
    wrap.appendChild(reel);
  }
}

// Анимация прокрутки
function animateSpin(finalBoard) {
  const wrap = $('reelsWrap');
  wrap.classList.add('spinning');
  
  let ticks = 0;
  const interval = setInterval(() => {
    renderReels(); // Быстрая смена символов
    ticks++;
    if (ticks > 15) {
      clearInterval(interval);
      wrap.classList.remove('spinning');
      applyFinalBoard(finalBoard); // Ставим финальный результат
    }
  }, 80);
}

function applyFinalBoard(board) {
  const wrap = $('reelsWrap');
  wrap.innerHTML = '';
  for (let i = 0; i < 5; i++) {
    const reel = document.createElement('div');
    reel.className = 'reel';
    for (let j = 0; j < 3; j++) {
      // В реальности тут будет браться символ из board[i][j]
      const sym = SYMBOLS[Math.floor(Math.random() * SYMBOLS.length)];
      const el = document.createElement('div');
      el.className = `symbol ${sym.class}`;
      el.textContent = sym.val;
      reel.appendChild(el);
    }
    wrap.appendChild(reel);
  }
}

function changeBet(amount) {
  if (isSpinning) return;
  bet = Math.max(10, bet + amount);
  $('betAmount').textContent = bet;
}

async function spin() {
  if (isSpinning) return;
  if (!currentPlayer) { showToast('Войдите в аккаунт', 'error'); return; }
  if (balance < bet) { showToast('Недостаточно средств', 'error'); return; }
  
  isSpinning = true;
  $('btnSpin').disabled = true;
  
  // Заглушка. Тут будет запрос к серверу:
  // const r = await fetch('/api/slots/empire/spin', { ... });
  
  // Имитация ответа сервера
  setTimeout(() => {
    // Генерируем случайную доску (в будущем придет с сервера)
    const fakeBoard = Array(5).fill().map(() => Array(3).fill().map(() => SYMBOLS[Math.floor(Math.random() * SYMBOLS.length)]));
    
    animateSpin(fakeBoard);
    
    setTimeout(() => {
      isSpinning = false;
      $('btnSpin').disabled = false;
      // Имитация выигрыша (потом тут будет реальный расчет)
      showToast('Выигрыш: 0 ₽', 'info'); 
    }, 1500);
  }, 300);
}

function buyBonus() {
  if (isSpinning) return;
  const cost = bet * 100;
  if (balance < cost) { showToast(`Нужно ${cost} ₽ для покупки бонуса`, 'error'); return; }
  showToast('Покупка бонуса пока в разработке', 'info');
}

function showToast(text, type='success') {
  const container = $('toastContainer');
  const toast = document.createElement('div');
  toast.className = `toast ${type}`;
  toast.textContent = text;
  container.appendChild(toast);
  setTimeout(() => toast.classList.add('show'), 10);
  setTimeout(() => { toast.classList.remove('show'); setTimeout(() => toast.remove(), 300); }, 3000);
}

function loadMe() {
  try {
    const urlParams = new URLSearchParams(window.location.search);
    const urlId = urlParams.get('id');
    if (urlId) { localStorage.setItem('kingwin_guest_id', urlId); return { guestId: String(urlId) }; }
    const savedId = localStorage.getItem('kingwin_guest_id');
    if (savedId) return { guestId: String(savedId) };
  } catch(e) {}
  return null;
}

async function refreshBalance() {
  if (!currentPlayer) return;
  try {
    const r = await fetch('/api/guest/me?id=' + encodeURIComponent(currentPlayer.guestId));
    if (!r.ok) return;
    const data = await r.json();
    if (data.balance && typeof data.balance.total === 'number') balance = data.balance.total;
    else if (data.guest) balance = (parseFloat(data.guest.deposit_balance) || 0) + (parseFloat(data.guest.bonus_balance) || 0);
    $('balanceVal').textContent = balance.toFixed(2);
  } catch(e) {}
}

window.onload = () => {
  currentPlayer = loadMe();
  if (currentPlayer) {
    refreshBalance();
    setInterval(refreshBalance, 3000);
  } else {
    showToast('Войдите в аккаунт на главной странице', 'error');
    setTimeout(() => { window.location.href = '/'; }, 1500);
  }
  renderReels();
};
</script>
</body>
</html>
