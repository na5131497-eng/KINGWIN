<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>KINGWIN — Empire of Gold</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-dark: #1a0b2e; /* Темно-фиолетовый фон как на референсе */
    --gold-light: #ffe066;
    --gold-mid: #f1c40f;
    --gold-dark: #b8860b;
    --panel-bg: #2a1240;
    --text-main: #fff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Montserrat', sans-serif; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; background: var(--bg-dark); color: var(--text-main); }
  
  .app { display: flex; flex-direction: column; height: 100vh; height: 100dvh; background: radial-gradient(circle at center, #2e1352, #0d041a 90%); }

  /* Верхняя панель (Home, Баланс, Buy/Deal) */
  .topbar { height: 60px; background: linear-gradient(180deg, #4a2c7a, #2a1240); border-bottom: 3px solid var(--gold-mid); display: flex; justify-content: space-between; align-items: center; padding: 0 15px; flex-shrink: 0; z-index: 100; box-shadow: 0 5px 15px rgba(0,0,0,0.8); }
  
  .balance-panel { background: #000; border: 2px solid var(--gold-mid); border-radius: 20px; padding: 5px 15px; display: flex; align-items: center; gap: 10px; font-weight: 900; font-size: 14px; color: var(--gold-light); box-shadow: inset 0 0 10px rgba(0,0,0,0.8); }
  .balance-panel .coin-icon { width: 20px; height: 20px; background: var(--gold-mid); border-radius: 50%; display: flex; justify-content: center; align-items: center; color: #000; font-size: 12px; border: 1px solid #fff; }
  .balance-panel button { background: #00c853; border: 2px solid #69f0ae; color: #fff; border-radius: 50%; width: 20px; height: 20px; font-weight: 900; cursor: pointer; display: flex; justify-content: center; align-items: center; padding: 0; margin-left: 5px; }

  .action-buttons { display: flex; gap: 10px; }
  .btn-action { padding: 8px 20px; border-radius: 20px; font-weight: 900; font-size: 12px; border: 2px solid rgba(255,255,255,0.2); cursor: pointer; text-transform: uppercase; box-shadow: 0 4px 0 rgba(0,0,0,0.5); }
  .btn-buy { background: linear-gradient(180deg, #00c853, #009624); color: #fff; text-shadow: 0 1px 2px #000; }
  .btn-deal { background: linear-gradient(180deg, #d50000, #9b0000); color: #fff; text-shadow: 0 1px 2px #000; }

  /* Игровое поле */
  .game-area { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 10px; position: relative; }
  
  /* Машина с золотыми рамками */
  .slot-machine { 
    background: linear-gradient(180deg, #fceabb, #f8b500);
    padding: 8px; 
    border-radius: 15px; 
    box-shadow: 0 10px 30px rgba(0,0,0,0.8), inset 0 0 10px #fff;
    max-width: 100%; width: 600px; 
    position: relative;
  }
  
  /* Внутренняя темная зона с барабанами */
  .reels-wrap { 
    display: flex; gap: 6px; 
    background: #1e0a33; 
    border-radius: 8px; 
    padding: 10px; 
    border: 3px solid #5a3d82;
    box-shadow: inset 0 0 40px rgba(0,0,0,0.9);
    aspect-ratio: 5 / 3;
  }
  
  .reel { flex: 1; display: flex; flex-direction: column; gap: 6px; }
  
  /* Ячейки */
  .symbol { 
    flex: 1; 
    background: rgba(255,255,255,0.05);
    border-radius: 10px; 
    display: flex; justify-content: center; align-items: center; 
    font-size: 48px; /* Размер эмодзи */
    border: 1px solid rgba(255,255,255,0.1);
    box-shadow: inset 0 0 15px rgba(0,0,0,0.8);
    text-shadow: 0 4px 10px rgba(0,0,0,0.5);
  }
  
  /* Wild Буква */
  .sym-wild-text {
    background: linear-gradient(180deg, #f1c40f, #b8860b);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    font-weight: 900;
    font-size: 36px;
    text-shadow: 0 0 10px rgba(241,196,15,0.8);
    border: 2px solid var(--gold-mid);
    border-radius: 10px;
    padding: 5px 15px;
  }

  /* Панель управления (Снизу) */
  .controls { 
    width: 100%; max-width: 600px; margin-top: 15px; 
    background: linear-gradient(180deg, #e0b04b, #9e6d19); /* Золотая панель */
    border-radius: 15px; padding: 10px; 
    display: flex; justify-content: space-between; align-items: center; gap: 10px;
    box-shadow: 0 8px 0 #553800, 0 15px 20px rgba(0,0,0,0.6);
  }
  
  .info-btn { width: 45px; height: 45px; border-radius: 50%; background: linear-gradient(180deg, #e53935, #b71c1c); border: 3px solid #fff; color: #fff; font-weight: 900; font-size: 20px; cursor: pointer; box-shadow: 0 4px 0 #7f0000; display: flex; justify-content: center; align-items: center; }
  
  .bet-panel { background: #000; border: 2px solid #fff; border-radius: 10px; padding: 5px 15px; display: flex; align-items: center; gap: 10px; flex-direction: column; }
  .bet-label { font-size: 10px; color: #8b92a5; font-weight: 800; text-transform: uppercase; }
  .bet-val { font-size: 18px; color: #fff; font-weight: 900; }
  .bet-plus { width: 35px; height: 35px; border-radius: 50%; background: linear-gradient(180deg, #29b6f6, #0288d1); border: 2px solid #fff; color: #fff; font-size: 20px; font-weight: 900; cursor: pointer; box-shadow: 0 4px 0 #01579b; display: flex; justify-content: center; align-items: center; }

  .win-panel { background: #000; border: 2px solid #fff; border-radius: 10px; padding: 5px 20px; display: flex; align-items: center; gap: 10px; flex-direction: column; }
  .win-label { font-size: 10px; color: #8b92a5; font-weight: 800; text-transform: uppercase; }
  .win-val { font-size: 18px; color: var(--gold-light); font-weight: 900; }

  .btn-spin { 
    width: 100px; height: 80px; 
    border-radius: 40px; 
    background: linear-gradient(180deg, #00c853, #009624); 
    border: 4px solid #fff; 
    color: #fff; font-weight: 900; font-size: 20px; 
    cursor: pointer; box-shadow: 0 8px 0 #004d00, 0 10px 15px rgba(0,0,0,0.5); 
    text-transform: uppercase;
    display: flex; flex-direction: column; justify-content: center; align-items: center;
    line-height: 1.1;
  }
  .btn-spin small { font-size: 9px; font-weight: 700; opacity: 0.9; }
  .btn-spin:active { transform: translateY(5px); box-shadow: 0 3px 0 #004d00; }
  .btn-spin:disabled { filter: grayscale(1); cursor: not-allowed; transform: translateY(5px); box-shadow: 0 3px 0 #004d00; }

  /* Анимация */
  .spinning .symbol { filter: blur(4px); opacity: 0.8; }

  /* Адаптация под телефон */
  @media (max-width: 600px) {
    .slot-machine { padding: 4px; border-radius: 10px; }
    .reels-wrap { gap: 3px; padding: 5px; border-radius: 5px; }
    .symbol { font-size: 32px; border-radius: 6px; }
    .sym-wild-text { font-size: 24px; padding: 2px 8px; }
    
    .controls { padding: 8px; gap: 5px; border-radius: 10px; }
    .info-btn { width: 35px; height: 35px; font-size: 16px; }
    .bet-panel, .win-panel { padding: 3px 8px; flex: 1; }
    .bet-val, .win-val { font-size: 14px; }
    .bet-plus { width: 28px; height: 28px; font-size: 16px; }
    .btn-spin { width: 80px; height: 60px; font-size: 16px; border-width: 3px; }
    .btn-spin small { font-size: 7px; }
    
    .topbar { padding: 0 8px; height: 50px; }
    .btn-action { padding: 5px 10px; font-size: 10px; }
    .balance-panel { font-size: 12px; padding: 3px 10px; }
  }

  /* Уведомления */
  .toast-container { position: fixed; top: 70px; right: 10px; z-index: 999999; display: flex; flex-direction: column; gap: 10px; pointer-events: none; }
  .toast { background: rgba(24,26,36,0.95); border-left: 4px solid var(--gold-mid); padding: 16px 20px; border-radius: 8px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); min-width: 250px; transform: translateX(120%); transition: 0.3s; font-weight: 600; font-size: 14px; color: #fff; }
  .toast.show { transform: translateX(0); }
  .toast.success { border-left-color: #00ff88; }
  .toast.error { border-left-color: #ff4d4d; }
</style>
</head>
<body>

<div class="toast-container" id="toastContainer"></div>

<div class="app">
  <!-- Верхнее меню в стиле референса -->
  <div class="topbar">
    <a href="/" style="color:#fff; text-decoration:none; font-size: 24px; display:flex; align-items:center;">🏠</a>
    
    <div class="balance-panel">
      <div class="coin-icon">$</div>
      <span id="balanceVal">0.00</span>
      <button onclick="window.location.href='/'">+</button>
    </div>

    <div class="action-buttons">
      <button class="btn-action btn-buy">BUY</button>
      <button class="btn-action btn-deal">DEAL</button>
    </div>
  </div>

  <!-- Игровое поле -->
  <div class="game-area">
    <div class="slot-machine" id="slotMachine">
      <div class="reels-wrap" id="reelsWrap">
        <!-- Барабаны генерируются в JS -->
      </div>
    </div>

    <!-- Панель управления -->
    <div class="controls">
      <div class="info-btn">i</div>
      
      <div class="bet-panel">
        <div class="bet-label">Total Bet</div>
        <div class="bet-val" id="betAmount">10</div>
      </div>
      
      <div class="bet-plus" onclick="changeBet(10)">+</div>

      <div class="win-panel">
        <div class="win-label">Total Win</div>
        <div class="win-val" id="winAmount">0</div>
      </div>

      <button class="btn-spin" id="btnSpin" onclick="spin()">
        SPIN
        <small>HOLD FOR AUTOSPIN</small>
      </button>
    </div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
let currentPlayer = null;
let balance = 0;
let bet = 10;
let isSpinning = false;

// Символы (пока используем эмодзи, которые выглядят как 3D-иконки)
const SYMBOLS = [
  { id: 'cherry', val: '🍒' },
  { id: 'lemon', val: '🍋' },
  { id: 'grape', val: '🍇' },
  { id: 'watermelon', val: '🍉' },
  { id: 'bar', val: '🅱️' }, // Заглушка для BAR
  { id: 'seven', val: '7️⃣' },
  { id: 'bell', val: '🔔' },
  { id: 'diamond', val: '💎' },
  { id: 'horseshoe', val: '🧲' }, // Похож на подкову
  { id: 'wild', val: 'WILD', isWild: true }
];

// Генерация поля
function renderReels() {
  const wrap = $('reelsWrap');
  wrap.innerHTML = '';
  for (let i = 0; i < 5; i++) {
    const reel = document.createElement('div');
    reel.className = 'reel';
    for (let j = 0; j < 3; j++) {
      const sym = SYMBOLS[Math.floor(Math.random() * SYMBOLS.length)];
      const el = document.createElement('div');
      el.className = 'symbol';
      
      if (sym.isWild) {
        el.innerHTML = `<div class="sym-wild-text">WILD</div>`;
      } else {
        el.textContent = sym.val;
      }
      
      reel.appendChild(el);
    }
    wrap.appendChild(reel);
  }
}

// Анимация прокрутки
function animateSpin(finalBoard) {
  const wrap = $('reelsWrap');
  wrap.classList.add('spinning');
  
  let ticks = 0;
  const interval = setInterval(() => {
    renderReels();
    ticks++;
    if (ticks > 15) {
      clearInterval(interval);
      wrap.classList.remove('spinning');
      applyFinalBoard(finalBoard);
    }
  }, 80);
}

// Отрисовка финального результата (пока рандом)
function applyFinalBoard(board) {
  const wrap = $('reelsWrap');
  wrap.innerHTML = '';
  for (let i = 0; i < 5; i++) {
    const reel = document.createElement('div');
    reel.className = 'reel';
    for (let j = 0; j < 3; j++) {
      const sym = SYMBOLS[Math.floor(Math.random() * SYMBOLS.length)];
      const el = document.createElement('div');
      el.className = 'symbol';
      
      if (sym.isWild) {
        el.innerHTML = `<div class="sym-wild-text">WILD</div>`;
      } else {
        el.textContent = sym.val;
      }
      
      reel.appendChild(el);
    }
    wrap.appendChild(reel);
  }
}

// Изменение ставки
function changeBet(amount) {
  if (isSpinning) return;
  bet += amount;
  if (bet > 1000) bet = 1000;
  $('betAmount').textContent = bet;
}

// Запуск игры
async function spin() {
  if (isSpinning) return;
  if (!currentPlayer) { showToast('Войдите в аккаунт', 'error'); return; }
  if (balance < bet) { showToast('Недостаточно средств', 'error'); return; }
  
  isSpinning = true;
  $('btnSpin').disabled = true;
  $('winAmount').textContent = '0';
  
  try {
    // Стучимся на сервер (код сервера мы добавляли ранее)
    const r = await fetch('/api/slots/empire/spin', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ guest_id: currentPlayer.guestId, bet: bet })
    });
    const d = await r.json();
    
    if (!r.ok) {
      showToast(d.error || 'Ошибка', 'error');
      isSpinning = false;
      $('btnSpin').disabled = false;
      return;
    }
    
    // Крутим визуально
    const fakeBoard = Array(5).fill().map(() => Array(3).fill().map(() => SYMBOLS[Math.floor(Math.random() * SYMBOLS.length)]));
    animateSpin(fakeBoard);
    
    // Ждем окончания
    setTimeout(() => {
      isSpinning = false;
      $('btnSpin').disabled = false;
      
      // Показываем выигрыш
      if (d.win > 0) {
        $('winAmount').textContent = d.win.toFixed(2);
        showToast(`ВЫИГРЫШ: ${d.win.toFixed(2)} ₽`, 'success');
      } else {
        showToast('Попробуйте еще раз', 'info');
      }
      
      // Обновляем баланс
      balance = d.balance;
      $('balanceVal').textContent = balance.toFixed(2);
      
    }, 1500);
  } catch(e) {
    showToast('Ошибка соединения', 'error');
    isSpinning = false;
    $('btnSpin').disabled = false;
  }
}

function showToast(text, type='success') {
  const container = $('toastContainer');
  const toast = document.createElement('div');
  toast.className = `toast ${type}`;
  toast.textContent = text;
  container.appendChild(toast);
  setTimeout(() => toast.classList.add('show'), 10);
  setTimeout(() => { toast.classList.remove('show'); setTimeout(() => toast.remove(), 300); }, 3000);
}

function loadMe() {
  try {
    const urlParams = new URLSearchParams(window.location.search);
    const urlId = urlParams.get('id');
    if (urlId) { localStorage.setItem('kingwin_guest_id', urlId); return { guestId: String(urlId) }; }
    const savedId = localStorage.getItem('kingwin_guest_id');
    if (savedId) return { guestId: String(savedId) };
  } catch(e) {}
  return null;
}

async function refreshBalance() {
  if (!currentPlayer) return;
  try {
    const r = await fetch('/api/guest/me?id=' + encodeURIComponent(currentPlayer.guestId));
    if (!r.ok) return;
    const data = await r.json();
    if (data.balance && typeof data.balance.total === 'number') balance = data.balance.total;
    else if (data.guest) balance = (parseFloat(data.guest.deposit_balance) || 0) + (parseFloat(data.guest.bonus_balance) || 0);
    $('balanceVal').textContent = balance.toFixed(2);
  } catch(e) {}
}

window.onload = () => {
  currentPlayer = loadMe();
  if (currentPlayer) {
    refreshBalance();
    setInterval(refreshBalance, 3000);
  } else {
    showToast('Войдите в аккаунт на главной странице', 'error');
    setTimeout(() => { window.location.href = '/'; }, 1500);
  }
  renderReels();
};
</script>
</body>
</html>
