<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KINGWIN — Live Стол 1</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0a0d14;--panel:rgba(18,24,38,.85);--line:rgba(255,255,255,.05);
    --text:#fff;--muted:#a0aec0;--accent:#00e5ff;--green:#3fbf7f;--red:#ff4d4d;--gold:#d4af37}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Montserrat',sans-serif;color:var(--text);
    background:radial-gradient(circle at top left,#1a2332,#0a0d14);min-height:100vh;padding:15px}
  .topbar{display:flex;justify-content:space-between;align-items:center;
    margin-bottom:12px;gap:10px;flex-wrap:wrap;max-width:900px;margin-left:auto;margin-right:auto}
  .topbar .brand{font-size:18px;font-weight:800;letter-spacing:2px;
    background:linear-gradient(135deg,var(--accent),#0077ff);
    -webkit-background-clip:text;-webkit-text-fill-color:transparent}
  .topbar .info{color:var(--muted);font-size:12px}
  .stage{position:relative;width:100%;max-width:900px;margin:0 auto;aspect-ratio:16/9;
    background:#000;border-radius:12px;overflow:hidden;border:1px solid var(--line)}
  .stage video{width:100%;height:100%;object-fit:cover;display:block}
  .stage .placeholder{position:absolute;inset:0;display:flex;align-items:center;
    justify-content:center;color:var(--muted);font-size:14px}
  .live-badge{position:absolute;top:10px;left:10px;background:rgba(255,77,77,.9);
    color:#fff;padding:4px 12px;border-radius:20px;font-size:11px;font-weight:800;
    display:none;align-items:center;gap:5px}
  .live-badge.show{display:flex}
  .live-badge .dot{width:7px;height:7px;border-radius:50%;background:#fff;
    animation:pulse 1.2s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

  .panel{background:var(--panel);border:1px solid var(--line);
    border-radius:12px;padding:14px;margin:12px auto;max-width:900px;backdrop-filter:blur(10px)}
  .panel h3{font-size:14px;margin-bottom:10px;font-weight:600}
  .dealer-row{text-align:center;padding:10px;background:rgba(0,0,0,.3);border-radius:10px}
  .dealer-row .total{font-size:20px;font-weight:800;color:var(--gold)}
  .cards-row{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:6px 0}
  .card{background:#fff;color:#000;border-radius:5px;padding:6px 8px;
    font-weight:800;font-size:14px;min-width:36px;text-align:center}
  .card.hidden{background:linear-gradient(135deg,#1a3a5a,#0a1a2a);color:#00e5ff}
  .phase{font-size:11px;color:var(--muted);text-transform:uppercase;
    letter-spacing:1px;text-align:center;margin-bottom:8px}

  .seats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
  .seat{background:rgba(0,0,0,.3);border:1px solid var(--line);border-radius:10px;
    padding:10px;text-align:center;font-size:12px;color:var(--muted);
    cursor:pointer;transition:.2s;min-height:80px;
    display:flex;flex-direction:column;justify-content:center;gap:4px}
  .seat:hover{border-color:var(--accent);background:rgba(0,229,255,.05)}
  .seat.occupied{border-color:var(--accent);background:rgba(0,229,255,.1);
    color:var(--accent);cursor:not-allowed}
  .seat.mine{border-color:var(--green);background:rgba(63,191,127,.12);
    color:var(--green);cursor:not-allowed}
  .seat .name{font-weight:800;font-size:13px;color:var(--text)}

  .controls{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;justify-content:center}
  button{background:var(--accent);color:#000;border:none;border-radius:8px;
    padding:10px 16px;font-weight:700;font-size:13px;cursor:pointer;
    font-family:inherit;transition:.3s}
  button:hover{filter:brightness(1.1)}
  button:disabled{opacity:.4;cursor:not-allowed}
  button.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
  button.ghost:hover{border-color:var(--accent);color:var(--accent)}
  button.danger{background:var(--red);color:#fff}
  button.green{background:var(--green);color:#000}
  .status-line{font-size:13px;color:var(--muted);margin-top:12px;text-align:center;
    padding:10px 14px;background:rgba(0,0,0,.3);border-radius:8px}
  .status-line.ok{color:var(--green)}
  .status-line.err{color:var(--red)}

  .bet-row{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:8px}
  .bet-chip{background:rgba(0,229,255,.1);border:1px solid var(--accent);
    color:var(--accent);border-radius:8px;padding:8px 14px;font-weight:700;
    font-size:13px;cursor:pointer;transition:.2s}
  .bet-chip:hover{background:rgba(0,229,255,.2)}
  .bet-input{background:rgba(0,0,0,.3);border:1px solid var(--line);color:#fff;
    border-radius:8px;padding:8px 12px;font-size:13px;font-family:inherit;width:100px}
  .my-cards{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:8px 0}
  .my-total{font-size:22px;font-weight:800;color:var(--gold);text-align:center}
  .result-banner{text-align:center;font-size:18px;font-weight:800;margin-top:8px;padding:10px;
    border-radius:8px;background:rgba(0,0,0,.3)}
  .result-banner.win{color:var(--green)}
  .result-banner.lose{color:var(--red)}
  .result-banner.push{color:var(--gold)}
  .waiting-hint{text-align:center;font-size:12px;color:var(--muted);
    padding:10px;background:rgba(0,0,0,.3);border-radius:8px;margin-top:8px}

  @media(max-width:600px){
    h1{font-size:16px}
    .panel{padding:10px}
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">KINGWIN · LIVE</div>
  <div class="info" id="phaseInfo">—</div>
</div>

<div class="stage">
  <video id="dealerVideo" autoplay playsinline></video>
  <div class="placeholder" id="placeholder">Ожидание дилера...</div>
  <div class="live-badge" id="liveBadge"><span class="dot"></span> LIVE</div>
</div>

<div class="panel">
  <h3>🎴 Дилер</h3>
  <div class="dealer-row">
    <div class="cards-row" id="dealerCards"></div>
    <div class="total" id="dealerTotal">—</div>
  </div>
</div>

<div class="panel">
  <h3>🪑 Места</h3>
  <div class="seats" id="seatsView"></div>
  <div class="controls">
    <button id="btnLeave" class="ghost" disabled>Встать из-за стола</button>
  </div>
</div>

<div class="panel" id="myPanel" style="display:none;">
  <h3>🎲 Ваша игра</h3>
  <div class="my-cards" id="myCards"></div>
  <div class="my-total" id="myTotal">—</div>
  <div class="result-banner" id="resultBanner" style="display:none;"></div>

  <div id="betSection" style="margin-top:12px;display:none;">
    <div style="text-align:center;font-size:12px;color:var(--muted);margin-bottom:6px;">Сделать ставку</div>
    <div class="bet-row">
      <div class="bet-chip" onclick="placeBet(10)">10 ₽</div>
      <div class="bet-chip" onclick="placeBet(50)">50 ₽</div>
      <div class="bet-chip" onclick="placeBet(100)">100 ₽</div>
      <div class="bet-chip" onclick="placeBet(500)">500 ₽</div>
      <div class="bet-chip" onclick="placeBet(1000)">1000 ₽</div>
      <input type="number" id="betInput" class="bet-input" placeholder="Своя" min="10" max="5000">
      <div class="bet-chip" onclick="placeBetCustom()">OK</div>
    </div>
  </div>

  <div id="actionSection" style="margin-top:12px;display:none;">
    <div class="controls">
      <button id="btnHit" class="green">Ещё</button>
      <button id="btnStand" class="danger">Стоп</button>
      <button id="btnDouble" class="ghost">Удвоить</button>
    </div>
  </div>

  <div id="waitingHint" class="waiting-hint" style="display:none;"></div>
</div>

<div class="panel">
  <div class="status-line" id="status">Подключение...</div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="https://cdn.jsdelivr.net/npm/livekit-client/dist/livekit-client.umd.min.js"></script>
<script>
const $ = id => document.getElementById(id);
function setStatus(t, cls){
  const el = $('status'); el.textContent = t;
  el.className = 'status-line' + (cls ? ' '+cls : '');
}

/* ===== Идентификация игрока ===== */
function getMe(){
  try {
    const raw = localStorage.getItem('kingwin_guest');
    if (!raw) return null;
    const g = JSON.parse(raw);
    return { guestId: String(g.id), name: g.name };
  } catch(e) { return null; }
}
const me = getMe();

/* ===== LiveKit ===== */
let room = null;
const identity = 'player-' + (me ? me.guestId : Math.random().toString(36).slice(2, 8));

async function connectLiveKit(){
  try {
    const r = await fetch(`/api/livekit/token?identity=${identity}&role=player`);
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || 'token error');

    room = new LivekitClient.Room({ adaptiveStream: true, dynacast: true });

    room.on(LivekitClient.RoomEvent.TrackSubscribed, (track, pub) => {
      if (track.kind === LivekitClient.Track.Kind.Video) {
        track.attach($('dealerVideo'));
        $('placeholder').style.display = 'none';
        $('liveBadge').classList.add('show');
      }
    });
    room.on(LivekitClient.RoomEvent.TrackUnsubscribed, (track) => {
      if (track.kind === LivekitClient.Track.Kind.Video) {
        track.detach($('dealerVideo'));
        $('placeholder').style.display = 'flex';
        $('liveBadge').classList.remove('show');
      }
    });
    room.on(LivekitClient.RoomEvent.Disconnected, () => {
      $('placeholder').style.display = 'flex';
      $('liveBadge').classList.remove('show');
    });

    await room.connect(data.url, data.token);

    for (const p of room.remoteParticipants.values()){
      for (const pub of p.trackPublications.values()){
        if (pub.track && pub.kind === LivekitClient.Track.Kind.Video && pub.isSubscribed){
          pub.track.attach($('dealerVideo'));
          $('placeholder').style.display = 'none';
          $('liveBadge').classList.add('show');
        }
      }
    }
  } catch(e) {
    console.error(e);
    setStatus('Видео: ' + e.message, 'err');
  }
}
connectLiveKit();

/* ===== Socket.IO ===== */
const socket = io();
let mySeat = null;
let latestState = null;

const PHASE_LABEL = {
  waiting: 'Ожидание',
  betting: 'Приём ставок',
  dealing: 'Раздача',
  playing: 'Игровой раунд',
  dealer: 'Ход дилера',
  payout: 'Результаты'
};

function renderCards(cards){
  return (cards || []).map(c => {
    if (c.r === '?') return `<div class="card hidden">?</div>`;
    return `<div class="card">${c.r}${c.s}</div>`;
  }).join('');
}

function renderAll(st){
  latestState = st;
  $('phaseInfo').textContent = PHASE_LABEL[st.phase] || st.phase;

  $('dealerCards').innerHTML = renderCards(st.dealerCards);
  $('dealerTotal').textContent = st.dealerTotal || '—';

  $('seatsView').innerHTML = st.seats.map((s, i) => {
    if (!s) {
      return `<div class="seat" data-seat="${i}" onclick="sitOn(${i})">
        <div class="name">Место ${i+1}</div><div>Занять</div></div>`;
    }
    const cls = s.isMe ? 'mine' : 'occupied';
    const cards = s.cards && s.cards.length
      ? `<div class="cards-row">${s.cards.map(c => `<div class="card">${c.r}${c.s}</div>`).join('')}</div>`
      : '';
    return `<div class="seat ${cls}">
      <div class="name">${s.name}${s.isMe ? ' (вы)' : ''}</div>
      ${cards}
      <div>${s.bet > 0 ? 'ставка ' + s.bet + ' ₽' : 'сидит'}</div>
      <div style="font-weight:800;">${s.total || ''}${s.busted ? ' BUST' : ''}</div>
      ${s.result ? `<div style="margin-top:4px;font-size:11px;">${s.result.toUpperCase()}</div>` : ''}
    </div>`;
  }).join('');

  const mySeatData = st.seats.find(s => s && s.isMe);
  if (mySeatData) {
    mySeat = mySeatData.idx;
    $('myPanel').style.display = 'block';
    $('btnLeave').disabled = false;

    $('myCards').innerHTML = renderCards(mySeatData.cards);
    $('myTotal').textContent = mySeatData.total || '—';

    // баннер результата
    const banner = $('resultBanner');
    if (mySeatData.result) {
      const map = {
        win: ['ВЫИГРАЛИ!', 'win'],
        blackjack: ['БЛЭКДЖЕК! 3:2', 'win'],
        push: ['НИЧЬЯ (возврат)', 'push'],
        lose: ['Проигрыш', 'lose'],
        bust: ['Перебор', 'lose']
      };
      const [txt, cls] = map[mySeatData.result] || ['', ''];
      banner.textContent = txt;
      banner.className = 'result-banner ' + cls;
      banner.style.display = 'block';
    } else {
      banner.style.display = 'none';
    }

    // секция ставок
    const canBet = st.phase === 'betting' && mySeatData.bet === 0;
    $('betSection').style.display = canBet ? 'block' : 'none';

    // секция действий (Ещё/Стоп/Удвоить)
    const canAct = ['dealing','playing'].includes(st.phase) &&
                   mySeatData.bet > 0 &&
                   mySeatData.cards.length >= 2 &&
                   !mySeatData.stood &&
                   !mySeatData.busted;
    $('actionSection').style.display = canAct ? 'block' : 'none';
    if (canAct) {
      $('btnDouble').style.display = mySeatData.cards.length === 2 ? 'inline-block' : 'none';
    }

    // подсказка, чего ждём
    const hint = $('waitingHint');
    if (st.phase === 'dealing' && mySeatData.cards.length < 2) {
      hint.textContent = 'Дилер раздаёт карты...';
      hint.style.display = 'block';
    } else if (st.phase === 'dealing' && mySeatData.cards.length >= 2 && !mySeatData.stood && !mySeatData.busted && mySeatData.wantsCard) {
      hint.textContent = 'Ждём дилера — он даёт вам карту...';
      hint.style.display = 'block';
    } else if (st.phase === 'betting' && mySeatData.bet > 0) {
      hint.textContent = `Ставка ${mySeatData.bet} ₽ принята. Ждём начала раздачи...`;
      hint.style.display = 'block';
    } else if (st.phase === 'payout') {
      hint.textContent = 'Раунд завершён. Через несколько секунд — новый приём ставок.';
      hint.style.display = 'block';
    } else {
      hint.style.display = 'none';
    }
  } else {
    mySeat = null;
    $('myPanel').style.display = 'none';
    $('btnLeave').disabled = true;
  }
}

socket.on('connect', () => setStatus('Подключено к столу', 'ok'));
socket.on('disconnect', () => setStatus('Соединение потеряно', 'err'));
socket.on('state', renderAll);
socket.on('err', (msg) => setStatus(msg, 'err'));
socket.on('roundResult', (st) => {
  renderAll(st);
  setStatus('Раунд завершён', 'ok');
});
socket.on('dealerMsg', (msg) => {
  // можно показать в консоли или в отдельном логе — не обязательно
  console.log('[dealer]', msg);
});

/* ===== Действия ===== */
function sitOn(seat){
  if (!me) {
    setStatus('Сначала войдите как гость (profile2.html)', 'err');
    return;
  }
  socket.emit('sit', { guestId: me.guestId, name: me.name, seat });
  setStatus('Садимся...');
}

function placeBet(amount){
  socket.emit('bet', { amount });
}
function placeBetCustom(){
  const v = parseInt($('betInput').value, 10) || 0;
  if (v > 0) socket.emit('bet', { amount: v });
}

$('btnLeave').onclick = () => {
  socket.emit('leave');
};
$('btnHit').onclick = () => socket.emit('hit');
$('btnStand').onclick = () => socket.emit('stand');
$('btnDouble').onclick = () => socket.emit('double');

if (!me) setStatus('Войдите как гость, чтобы играть', 'err');
</script>
</body>
</html>
