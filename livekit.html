<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KINGWIN — Live Стол (дилер)</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0a0d14;--panel:rgba(18,24,38,.85);--line:rgba(255,255,255,.05);
    --text:#fff;--muted:#a0aec0;--accent:#00e5ff;--green:#3fbf7f;--red:#ff4d4d;--gold:#d4af37}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Montserrat',sans-serif;color:var(--text);
    background:radial-gradient(circle at top left,#1a2332,#0a0d14);min-height:100vh;padding:20px}
  h1{font-size:24px;margin-bottom:6px}
  .sub{color:var(--muted);font-size:13px;margin-bottom:20px}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:15px;
    padding:18px;margin-bottom:16px;backdrop-filter:blur(10px)}
  .panel h3{font-size:15px;margin-bottom:12px;font-weight:600}
  .stage{position:relative;width:100%;aspect-ratio:16/9;background:#000;
    border-radius:12px;overflow:hidden;border:1px solid var(--line)}
  .stage video{width:100%;height:100%;object-fit:cover;display:block}
  .stage .badge{position:absolute;top:12px;left:12px;background:rgba(255,77,77,.9);
    color:#fff;padding:6px 14px;border-radius:20px;font-size:12px;font-weight:800;
    display:none;align-items:center;gap:6px}
  .badge.show{display:flex}
  .badge .dot{width:8px;height:8px;border-radius:50%;background:#fff;animation:pulse 1.2s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
  .controls{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
  button{background:var(--accent);color:#000;border:none;border-radius:8px;
    padding:10px 16px;font-weight:700;font-size:13px;cursor:pointer;
    font-family:inherit;transition:.3s}
  button:hover{filter:brightness(1.1)}
  button:disabled{opacity:.4;cursor:not-allowed}
  button.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
  button.ghost:hover{border-color:var(--accent);color:var(--accent)}
  button.danger{background:var(--red);color:#fff}
  button.green{background:var(--green);color:#000}
  .status-line{font-size:13px;color:var(--muted);margin-top:12px;
    padding:10px 14px;background:rgba(0,0,0,.3);border-radius:8px}
  .status-line.ok{color:var(--green)}
  .status-line.err{color:var(--red)}
  .seats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:8px}
  .seat{background:rgba(0,0,0,.3);border:1px solid var(--line);border-radius:10px;
    padding:10px;text-align:center;font-size:12px;color:var(--muted);min-height:80px}
  .seat.occupied{border-color:var(--accent);color:var(--accent);background:rgba(0,229,255,.08)}
  .seat .name{font-weight:800;font-size:13px;color:var(--text);margin-bottom:4px}
  .dealer-area{text-align:center;padding:15px;background:rgba(0,0,0,.3);
    border-radius:10px;margin-top:10px}
  .dealer-area .total{font-size:22px;font-weight:800;color:var(--gold)}
  .cards-row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:8px 0}
  .card{background:#fff;color:#000;border-radius:6px;padding:8px 10px;
    font-weight:800;font-size:16px;min-width:42px;text-align:center}
  .card.hidden{background:linear-gradient(135deg,#1a3a5a,#0a1a2a);color:#00e5ff}
  .phase{font-size:12px;color:var(--muted);text-transform:uppercase;
    letter-spacing:1px;margin-top:8px}
  @media(max-width:600px){
    .seats{grid-template-columns:repeat(2,1fr)}
    h1{font-size:20px}
  }
</style>
</head>
<body>

<h1>Live Стол 1 — дилер</h1>
<div class="sub">Видео + управление раундом</div>

<div class="panel">
  <h3>📹 Трансляция</h3>
  <div class="stage">
    <video id="cam" autoplay muted playsinline></video>
    <div class="badge" id="liveBadge"><span class="dot"></span> В ЭФИРЕ</div>
  </div>
  <div class="controls">
    <button id="btnStart" class="green">▶ Начать эфир</button>
    <button id="btnStop" class="danger" disabled>■ Остановить</button>
  </div>
  <div class="status-line" id="status">Не подключено</div>
</div>

<div class="panel">
  <h3>🎲 Раунд</h3>
  <div class="phase" id="phaseView">—</div>
  <div class="dealer-area">
    <div class="cards-row" id="dealerCards"></div>
    <div class="total" id="dealerTotal">—</div>
    <div style="font-size:11px;color:var(--muted);margin-top:4px;">Дилер</div>
  </div>
  <div class="controls">
    <button id="btnStartBetting" class="green">▶ Начать приём ставок</button>
    <button id="btnForceDealer" class="ghost">⏭ Дилер доигрывает</button>
  </div>
</div>

<div class="panel">
  <h3>🪑 Места</h3>
  <div class="seats" id="seatsView"></div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="https://cdn.jsdelivr.net/npm/livekit-client/dist/livekit-client.umd.min.js"></script>
<script>
const $ = id => document.getElementById(id);
function setStatus(t, cls){
  const el = $('status'); el.textContent = t;
  el.className = 'status-line' + (cls ? ' '+cls : '');
}

/* ===== LiveKit ===== */
let room = null, camPub = null, micPub = null;
async function startBroadcast(){
  try {
    setStatus('Получаю токен...');
    const r = await fetch('/api/livekit/token?identity=dealer&role=dealer');
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || 'token error');

    setStatus('Подключаюсь...');
    room = new LivekitClient.Room({ adaptiveStream: true, dynacast: true });
    room.on(LivekitClient.RoomEvent.Disconnected, () => {
      setStatus('Отключено', 'err');
      $('liveBadge').classList.remove('show');
    });
    await room.connect(data.url, data.token);

    const stream = await navigator.mediaDevices.getUserMedia({
      video: { width: 1280, height: 720, frameRate: 30 }, audio: true
    });
    $('cam').srcObject = stream;
    camPub = await room.localParticipant.publishTrack(stream.getVideoTracks()[0], {
      name: 'dealer-cam', source: LivekitClient.Track.Source.Camera
    });
    micPub = await room.localParticipant.publishTrack(stream.getAudioTracks()[0], {
      name: 'dealer-mic', source: LivekitClient.Track.Source.Microphone
    });
    $('liveBadge').classList.add('show');
    $('btnStart').disabled = true; $('btnStop').disabled = false;
    setStatus('В эфире', 'ok');
  } catch(e) {
    console.error(e); setStatus('Ошибка: ' + e.message, 'err');
  }
}
async function stopBroadcast(){
  try {
    if (camPub?.track) camPub.track.stop();
    if (micPub?.track) micPub.track.stop();
    if (room) await room.disconnect();
    $('cam').srcObject = null;
    room = null; camPub = null; micPub = null;
    $('liveBadge').classList.remove('show');
    $('btnStart').disabled = false; $('btnStop').disabled = true;
    setStatus('Эфир остановлен');
  } catch(e){ console.error(e); }
}
$('btnStart').onclick = startBroadcast;
$('btnStop').onclick = stopBroadcast;

/* ===== Socket.IO ===== */
const socket = io();

const PHASE_LABEL = {
  waiting: 'Ожидание',
  betting: 'Приём ставок',
  playing: 'Игроки ходят',
  dealer: 'Ход дилера',
  payout: 'Выплаты'
};

function renderCards(cards){
  return (cards || []).map(c => {
    if (c.r === '?') return `<div class="card hidden">?</div>`;
    return `<div class="card">${c.r}${c.s}</div>`;
  }).join('');
}

socket.on('state', (st) => {
  $('phaseView').textContent = PHASE_LABEL[st.phase] || st.phase;
  $('dealerCards').innerHTML = renderCards(st.dealerCards);
  $('dealerTotal').textContent = st.dealerTotal || '—';

  $('seatsView').innerHTML = st.seats.map((s, i) => {
    if (!s) return `<div class="seat"><div class="name">Место ${i+1}</div><div>свободно</div></div>`;
    const cards = s.cards && s.cards.length
      ? `<div class="cards-row">${s.cards.map(c => `<div class="card">${c.r}${c.s}</div>`).join('')}</div>`
      : '';
    return `<div class="seat occupied">
      <div class="name">${s.name}</div>
      ${cards}
      <div>${s.bet > 0 ? 'ставка ' + s.bet + ' ₽' : 'сидит'}</div>
      <div style="font-weight:800;">${s.total || ''}${s.busted ? ' BUST' : ''}</div>
      ${s.result ? `<div style="margin-top:4px;font-size:11px;">${s.result.toUpperCase()}</div>` : ''}
    </div>`;
  }).join('');
});

socket.on('err', (msg) => setStatus('Ошибка: ' + msg, 'err'));
socket.on('dealerMsg', (msg) => console.log('[dealer]', msg));

$('btnStartBetting').onclick = () => socket.emit('dealer:startBetting');
$('btnForceDealer').onclick = () => socket.emit('dealer:forceDealer');
</script>
</body>
</html>
