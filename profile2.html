<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KINGWIN — Профиль гостя</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Montserrat', sans-serif; background: radial-gradient(circle at top, #1a2332, #0a0d14);
    color: #fff; min-height: 100vh; display: flex; justify-content: center; padding: 24px 16px; }
  .wrap { width: 100%; max-width: 480px; }
  .logo { text-align: center; font-size: 28px; font-weight: 900; letter-spacing: 4px;
    background: linear-gradient(135deg, #00e5ff, #0077ff);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 4px; }
  .logo-sub { text-align: center; font-size: 10px; letter-spacing: 4px; color: #8fa2b8;
    text-transform: uppercase; margin-bottom: 22px; }

  .tabs { display: flex; gap: 6px; background: rgba(18,24,38,.9); border: 1px solid rgba(255,255,255,.06);
    padding: 6px; border-radius: 14px; margin-bottom: 16px; }
  .tab { flex: 1; padding: 11px 6px; text-align: center; border-radius: 10px; font-size: 11px;
    font-weight: 800; text-transform: uppercase; letter-spacing: .5px; cursor: pointer;
    color: #8fa2b8; transition: .3s; user-select: none; }
  .tab.active { background: rgba(0,229,255,.15); color: #00e5ff; box-shadow: 0 0 12px rgba(0,229,255,.3); }

  .page { display: none; animation: fadeIn .3s ease; }
  .page.active { display: block; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

  .card { background: rgba(18,24,38,.9); border: 1px solid rgba(255,255,255,.06);
    border-radius: 20px; padding: 24px; backdrop-filter: blur(10px); box-shadow: 0 20px 50px rgba(0,0,0,.5);
    margin-bottom: 16px; }

  .top-head { text-align: center; margin-bottom: 22px; }
  .top-head .name { font-size: 26px; font-weight: 900; letter-spacing: 1px; }
  .top-head .cid { font-size: 12px; color: #8fa2b8; font-family: 'Courier New', monospace;
    letter-spacing: 2px; margin-top: 4px; }
  .top-head .rank-badge { display: inline-block; margin-top: 12px; font-size: 12px; font-weight: 800;
    letter-spacing: 1px; text-transform: uppercase; padding: 8px 20px; border-radius: 20px;
    border: 1px solid rgba(255,255,255,.3); }
  .rank-badge.Bronze   { background: rgba(205,127,50,.25); color: #e8a76a; border-color: #cd7f32; }
  .rank-badge.Silver   { background: rgba(192,192,192,.2); color: #d9d9d9; border-color: #c0c0c0; }
  .rank-badge.Gold     { background: rgba(241,196,15,.2); color: #f1c40f; border-color: #f1c40f; }
  .rank-badge.Platinum { background: rgba(229,228,226,.2); color: #e5e4e2; border-color: #e5e4e2; }
  .rank-badge.Diamond  { background: rgba(185,242,255,.18); color: #b9f2ff; border-color: #b9f2ff; }
  .rank-badge.VIP      { background: rgba(212,175,55,.25); color: #ffe066; border-color: #d4af37;
    box-shadow: 0 0 12px rgba(212,175,55,.6); }

  .cats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 20px; }
  .cat { background: rgba(0,0,0,.35); border: 1px solid rgba(255,255,255,.06);
    border-radius: 14px; padding: 16px 8px; text-align: center; }
  .cat .lbl { font-size: 9px; color: #8fa2b8; text-transform: uppercase; letter-spacing: 1px;
    margin-bottom: 6px; font-weight: 700; }
  .cat .val { font-size: 22px; font-weight: 900; color: #00e5ff; }
  .cat.money .val { color: #3fbf7f; }
  .cat.rank  .val { font-size: 14px; color: #f1c40f; text-transform: uppercase; letter-spacing: .5px; }

  .progress-wrap { margin-top: 6px; }
  .progress-lbl { font-size: 11px; color: #8fa2b8; margin-bottom: 8px; display: flex; justify-content: space-between; }
  .progress { height: 12px; background: rgba(255,255,255,.08); border-radius: 8px; overflow: hidden; position: relative; }
  .progress > div { height: 100%; background: linear-gradient(90deg, #3fbf7f, #00e5ff); border-radius: 8px;
    transition: width .8s cubic-bezier(.4,0,.2,1); box-shadow: 0 0 14px rgba(0,229,255,.6); }

  .info-block { background: rgba(0,0,0,.3); border: 1px solid rgba(255,255,255,.06);
    border-radius: 14px; padding: 16px; margin-bottom: 14px; }
  .info-block .t { font-size: 11px; color: #8fa2b8; text-transform: uppercase; letter-spacing: 1px;
    margin-bottom: 10px; font-weight: 700; }
  .info-block .row { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 6px; }
  .info-block .row b { color: #fff; }

  .btn { width: 100%; background: #00e5ff; color: #000; border: none; border-radius: 10px;
    padding: 14px; font-size: 14px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px;
    cursor: pointer; font-family: inherit; transition: .3s; margin-top: 6px; }
  .btn:hover { box-shadow: 0 0 20px rgba(0,229,255,.5); }
  .btn.ghost { background: transparent; color: #a0aec0; border: 1px solid rgba(255,255,255,.15); }
  .btn.green { background: #3fbf7f; color: #000; }
  .btn.gold  { background: #d4af37; color: #000; }
  .btn:disabled { opacity: .4; cursor: not-allowed; }

  .daily-card { background: linear-gradient(135deg, rgba(0,229,255,.08), rgba(63,191,127,.06));
    border: 1px solid rgba(0,229,255,.25); border-radius: 18px; padding: 20px; margin-bottom: 16px; }
  .daily-title { font-size: 13px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px;
    color: #00e5ff; margin-bottom: 6px; display: flex; justify-content: space-between; align-items: center; }
  .daily-title .streak { font-size: 11px; color: #3fbf7f; }
  .daily-sub { font-size: 11px; color: #8fa2b8; margin-bottom: 16px; line-height: 1.5; }
  .daily-days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-bottom: 16px; }
  .daily-day { aspect-ratio: 1; border-radius: 10px; background: rgba(0,0,0,.4);
    border: 1px solid rgba(255,255,255,.06); display: flex; flex-direction: column;
    align-items: center; justify-content: center; font-size: 10px; color: #8fa2b8;
    font-weight: 700; transition: .3s; position: relative; }
  .daily-day .num { font-size: 9px; opacity: .6; }
  .daily-day .reward { font-size: 11px; font-weight: 900; margin-top: 3px; }
  .daily-day.done { background: rgba(63,191,127,.2); border-color: #3fbf7f; color: #3fbf7f; }
  .daily-day.done::after { content: '✓'; position: absolute; font-size: 9px; top: 2px; right: 4px; }
  .daily-day.today { background: rgba(0,229,255,.15); border-color: #00e5ff; color: #00e5ff;
    box-shadow: 0 0 14px rgba(0,229,255,.5); animation: pulseGlow 1.6s infinite; }
  @keyframes pulseGlow { 0%,100%{box-shadow: 0 0 12px rgba(0,229,255,.4);} 50%{box-shadow: 0 0 24px rgba(0,229,255,.85);} }

  .wheel-card { background: linear-gradient(135deg, rgba(212,175,55,.12), rgba(0,229,255,.06));
    border: 1px solid rgba(212,175,55,.35); border-radius: 18px; padding: 20px; margin-bottom: 16px;
    text-align: center; }
  .wheel-card .t { font-size: 13px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px;
    color: #d4af37; margin-bottom: 6px; }
  .wheel-card .s { font-size: 11px; color: #8fa2b8; margin-bottom: 16px; }
  .wheel-wrap { position: relative; width: 280px; height: 280px; margin: 0 auto 16px; }
  .wheel-pointer { position: absolute; top: -4px; left: 50%; transform: translateX(-50%);
    width: 0; height: 0; border-left: 12px solid transparent; border-right: 12px solid transparent;
    border-top: 22px solid #00e5ff; z-index: 10;
    filter: drop-shadow(0 0 8px rgba(0,229,255,.9)); }
  .wheel-canvas { display: block; width: 280px; height: 280px; border-radius: 50%;
    box-shadow: 0 0 40px rgba(212,175,55,.35), inset 0 0 30px rgba(0,0,0,.6); }
  .wheel-center { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
    width: 56px; height: 56px; border-radius: 50%; background: #0a0d14; border: 3px solid #00e5ff;
    display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 900;
    color: #00e5ff; letter-spacing: 1px; z-index: 5; pointer-events: none;
    box-shadow: 0 0 20px rgba(0,229,255,.5); }
  .wheel-result { font-size: 14px; font-weight: 800; min-height: 22px; color: #3fbf7f; margin-top: 10px; }

  .withdraw-block { background: rgba(0,0,0,.3); border: 1px solid rgba(255,255,255,.08);
    border-radius: 16px; padding: 20px; margin-bottom: 14px; }
  .withdraw-block h3 { font-size: 12px; font-weight: 800; text-transform: uppercase;
    letter-spacing: 1px; color: #00e5ff; margin-bottom: 12px; }
  .withdraw-block .amount { font-size: 34px; font-weight: 900; color: #3fbf7f; margin: 4px 0 16px;
    text-shadow: 0 0 20px rgba(63,191,127,.4); }
  .withdraw-block .amount.small { font-size: 28px; color: #00e5ff; text-shadow: 0 0 20px rgba(0,229,255,.4); }
  .withdraw-block .cond { font-size: 12px; color: #a0aec0; line-height: 1.8; margin-bottom: 14px; }
  .withdraw-block .cond .row { display: flex; justify-content: space-between; margin-bottom: 4px; }
  .withdraw-block .cond .ok  { color: #3fbf7f; font-weight: 700; }
  .withdraw-block .cond .bad { color: #ff8a8a; font-weight: 700; }
  .withdraw-block .cond .title { font-size: 11px; color: #8fa2b8; text-transform: uppercase;
    letter-spacing: 1px; margin-bottom: 8px; font-weight: 700; }

  .modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(8px);
    display: none; align-items: center; justify-content: center; z-index: 3000; padding: 20px; }
  .modal-backdrop.show { display: flex; }
  .modal { background: linear-gradient(135deg, #111625, #0a0d14); border: 2px solid #00e5ff;
    border-radius: 24px; padding: 36px 28px; max-width: 400px; width: 100%; text-align: center;
    box-shadow: 0 0 60px rgba(0,229,255,0.4); animation: slideUp .4s ease;
    position: relative; overflow: hidden; }
  @keyframes slideUp { from { transform: translateY(30px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  .modal.rank-up { border-color: #f1c40f; box-shadow: 0 0 70px rgba(241,196,15,.5); }
  .modal-logo { font-size: 36px; font-weight: 900; letter-spacing: 4px;
    background: linear-gradient(135deg, #00e5ff, #0077ff); -webkit-background-clip: text;
    -webkit-text-fill-color: transparent; margin-bottom: 6px; position: relative; z-index: 1; }
  .modal-sub { font-size: 10px; color: #8fa2b8; letter-spacing: 3px;
    text-transform: uppercase; margin-bottom: 22px; position: relative; z-index: 1; }
  .modal-title { font-size: 22px; font-weight: 900; margin-bottom: 12px; position: relative; z-index: 1; }
  .modal-title span { color: #3fbf7f; }
  .modal.rank-up .modal-title span { color: #f1c40f; }
  .modal-text { font-size: 14px; color: #a0aec0; line-height: 1.6; margin-bottom: 8px;
    position: relative; z-index: 1; }
  .modal-amount { font-size: 38px; font-weight: 900; color: #00e5ff;
    text-shadow: 0 0 20px rgba(0,229,255,.5); margin: 14px 0;
    position: relative; z-index: 1; }
  .modal.rank-up .modal-amount { color: #f1c40f; text-shadow: 0 0 25px rgba(241,196,15,.7); }
  .modal-hint { font-size: 12px; color: #8fa2b8; line-height: 1.6; margin-bottom: 18px;
    position: relative; z-index: 1; }
  .modal-btn { background: #00e5ff; color: #000; border: none; border-radius: 12px;
    padding: 14px 40px; font-size: 15px; font-weight: 900; text-transform: uppercase;
    letter-spacing: 1px; cursor: pointer; font-family: inherit;
    box-shadow: 0 0 20px rgba(0,229,255,.4); transition: .3s;
    position: relative; z-index: 1; }
  .modal-btn:hover { box-shadow: 0 0 30px rgba(0,229,255,.7); }
  .modal.rank-up .modal-btn { background: #f1c40f; box-shadow: 0 0 20px rgba(241,196,15,.5); }

  .login-form label { display: block; font-size: 11px; color: #8fa2b8; text-transform: uppercase;
    letter-spacing: 1px; margin: 14px 0 6px; font-weight: 600; }
  .login-form input { width: 100%; background: rgba(0,0,0,.4); border: 1px solid rgba(255,255,255,.1);
    border-radius: 10px; padding: 14px; font-size: 16px; color: #fff; font-family: inherit; }
  .login-form input:focus { outline: none; border-color: #00e5ff; box-shadow: 0 0 10px rgba(0,229,255,.3); }
  .err { background: rgba(255,77,77,.12); border: 1px solid rgba(255,77,77,.4); color: #ff8a8a;
    border-radius: 12px; padding: 14px; text-align: center; font-weight: 600; margin: 12px 0; }
  .footer { text-align: center; font-size: 11px; color: #6d819a; margin-top: 20px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="logo">KINGWIN</div>
  <div class="logo-sub">Guest Profile</div>
  <div id="content"><div class="card">Загрузка…</div></div>
  <div class="footer">© KINGWIN</div>
</div>

<!-- МОДАЛКА: повышение ранга -->
<div class="modal-backdrop" id="rankUpModal">
  <div class="modal rank-up">
    <div class="modal-logo">KINGWIN</div>
    <div class="modal-sub">Rank Up</div>
    <div class="modal-title">Ранг повышен! <span>🎉</span></div>
    <div class="modal-text" id="rankUpText">Поздравляем с достижением ранга Silver!</div>
    <div class="modal-amount" id="rankUpAmount">+50 ₽</div>
    <div class="modal-hint" id="rankUpHint">Чтобы забрать подарок — выполните задания отыгрыша в разделе «Бонусы».</div>
    <button class="modal-btn" onclick="closeRankUpModal()">Отлично</button>
  </div>
</div>

<!-- МОДАЛКА: ежедневный бонус получен -->
<div class="modal-backdrop" id="dailyModal">
  <div class="modal" style="border-color:#3fbf7f; box-shadow:0 0 60px rgba(63,191,127,.4);">
    <div class="modal-logo">KINGWIN</div>
    <div class="modal-sub">Daily Bonus</div>
    <div class="modal-title">Бонус <span style="color:#3fbf7f;">получен!</span></div>
    <div class="modal-text" id="dailyModalText">Ваш ежедневный бонус:</div>
    <div class="modal-amount" id="dailyModalAmount" style="color:#3fbf7f; text-shadow:0 0 20px rgba(63,191,127,.5);">+15 ₽</div>
    <div class="modal-hint" id="dailyModalHint">Накоплено в бонусах. Завтра награда вырастет!</div>
    <button class="modal-btn" style="background:#3fbf7f; box-shadow:0 0 20px rgba(63,191,127,.4);" onclick="closeDailyModal()">Забрать</button>
  </div>
</div>

<script>
/* ============================================================
   KINGWIN — Profile 2 v3.1 (фикс: daily/wheel не зацикливаются)
   ============================================================ */
const RANKS_INFO = {
  Bronze:   { next: 100,  label: 'Silver',   gift: 0    },
  Silver:   { next: 300,  label: 'Gold',     gift: 50   },
  Gold:     { next: 600,  label: 'Platinum', gift: 200  },
  Platinum: { next: 1000, label: 'Diamond',  gift: 500  },
  Diamond:  { next: 1500, label: 'VIP',      gift: 1000 },
  VIP:      { next: null, label: null,       gift: 3000 }
};

let session = null;
let summary = null;
let dailyState = null;
let wheelState = null;
let currentTab = 'profile';
let isSpinning = false;
let wheelRotation = 0;
let lastSeenRank = null;
let refreshTimer = null;
let spinLock = false;   // защита от двойного клика
let claimLock = false;  // защита от двойного клика

function esc(s){ return String(s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmt(n){ return (Math.round((n||0)*100)/100).toLocaleString('ru-RU'); }

/* ---------------- LOGIN ---------------- */
function renderLogin(prefillId){
  document.getElementById('content').innerHTML = `
    <div class="card">
      <h2 style="font-size:20px; font-weight:800; margin-bottom:6px; text-align:center;">Вход по карте</h2>
      <p style="font-size:12px;color:#8fa2b8;text-align:center;margin-bottom:8px;">Введите номер карты и пароль</p>
      <div class="login-form">
        <label>Номер карты</label>
        <input type="text" id="loginId" placeholder="12345678" value="${esc(prefillId||'')}">
        <label>Пароль</label>
        <input type="password" id="loginPass" placeholder="••••">
        <div class="err" id="loginErr" style="display:none;margin-top:14px;"></div>
        <button class="btn" onclick="doLogin()" style="margin-top:18px;">Войти</button>
      </div>
    </div>`;
  document.getElementById('loginPass').addEventListener('keypress', e=>{ if(e.key==='Enter') doLogin(); });
}

async function doLogin(){
  const id = document.getElementById('loginId').value.trim();
  const pass = document.getElementById('loginPass').value;
  const err = document.getElementById('loginErr');
  err.style.display = 'none';
  if(!id || !pass){ err.textContent = 'Введите номер и пароль'; err.style.display='block'; return; }
  try {
    const r = await fetch('/api/guest/login', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ id, pass })
    });
    const data = await r.json();
    if(!r.ok){ err.textContent = data.error || 'Ошибка'; err.style.display='block'; return; }
    session = data.guest;
    localStorage.setItem('kingwin_guest_id', id);
    await loadAll();
    startAutoRefresh();
  } catch(e){ err.textContent = 'Ошибка соединения'; err.style.display='block'; }
}

/* ---------------- LOAD ---------------- */
async function loadAll(){
  if(!session) return;
  await Promise.all([loadSummary(), loadDaily(), loadWheel()]);
  renderProfile();
}

async function loadSummary(){
  try {
    const r = await fetch('/api/guest/summary?id=' + encodeURIComponent(session.id));
    if(r.ok){ summary = await r.json(); checkRankUp(); }
  } catch(e){}
}
async function loadDaily(){
  try {
    const r = await fetch('/api/guest/daily?id=' + encodeURIComponent(session.id));
    if(r.ok) dailyState = await r.json();
  } catch(e){}
}
async function loadWheel(){
  try {
    const r = await fetch('/api/guest/wheel-state?id=' + encodeURIComponent(session.id));
    if(r.ok) wheelState = await r.json();
  } catch(e){}
}

function checkRankUp(){
  if(!summary) return;
  if(lastSeenRank === null){ lastSeenRank = summary.rank; return; }
  if(summary.rank !== lastSeenRank){
    const gift = RANKS_INFO[summary.rank]?.gift || 0;
    showRankUpModal(summary.rank, gift);
    lastSeenRank = summary.rank;
  }
}

function startAutoRefresh(){
  if(refreshTimer) clearInterval(refreshTimer);
  refreshTimer = setInterval(async ()=>{
    if(!session) return;
    await Promise.all([loadSummary(), loadDaily()]);
    renderProfile();
  }, 15000);
}

/* ---------------- RENDER ---------------- */
function renderProfile(){
  if(!session || !summary){ return; }
  const g = summary;
  const info = RANKS_INFO[g.rank] || RANKS_INFO.Bronze;
  const points = g.points || 0;
  const nextMin = g.next_min;
  let progress = 0;
  let progressLabel = '';
  const RANK_MIN = { Bronze:0, Silver:100, Gold:300, Platinum:600, Diamond:1000, VIP:1500 };
  if(info.next && nextMin !== null){
    const cur = RANK_MIN[g.rank] || 0;
    progress = Math.min(100, Math.round(((points - cur) / (nextMin - cur)) * 100));
    progressLabel = `${points} / ${nextMin}`;
  } else {
    progress = 100;
    progressLabel = 'Максимальный ранг';
  }

  const tabs = `
    <div class="tabs">
      <div class="tab ${currentTab==='profile'?'active':''}" onclick="switchTab('profile')">Профиль</div>
      <div class="tab ${currentTab==='bonus'?'active':''}" onclick="switchTab('bonus')">Бонусы</div>
      <div class="tab ${currentTab==='withdraw'?'active':''}" onclick="switchTab('withdraw')">Вывод</div>
    </div>`;

  let profilePage = `
    <div class="page ${currentTab==='profile'?'active':''}">
      <div class="card">
        <div class="top-head">
          <div class="name">${esc(g.name)}</div>
          <div class="cid">№ ${esc(g.id)}</div>
          <div class="rank-badge ${g.rank}">${g.rank}</div>
        </div>
        <div class="cats">
          <div class="cat"><div class="lbl">Баллы</div><div class="val">${points}</div></div>
          <div class="cat money"><div class="lbl">Рубли</div><div class="val">${fmt(g.deposit_balance)} ₽</div></div>
          <div class="cat rank"><div class="lbl">Ранг</div><div class="val">${g.rank}</div></div>
        </div>
        <div class="progress-wrap">
          <div class="progress-lbl"><span>Прогресс до ${info.label || 'максимума'}</span><span>${progressLabel}</span></div>
          <div class="progress"><div style="width:${progress}%"></div></div>
        </div>
      </div>

      <div class="info-block">
        <div class="t">Бонусные средства</div>
        <div class="row"><span>Бонусный баланс</span><b>${fmt(g.bonus_balance)} ₽</b></div>
        <div class="row"><span>Накоплено (daily + колесо)</span><b style="color:#00e5ff">${fmt(g.pending_bonus)} ₽</b></div>
        <div class="row"><span>Отыграно</span><b>${fmt(g.wagering_done)} / ${fmt(g.wagering_required)}</b></div>
      </div>

      ${g.bonus_text ? `
        <div class="info-block" style="background:linear-gradient(135deg,rgba(63,191,127,.12),rgba(0,229,255,.06));border-color:rgba(63,191,127,.35)">
          <div class="t" style="color:#3fbf7f">🎁 Подарок</div>
          <div style="font-size:14px;font-weight:600;line-height:1.4;margin-bottom:10px">${esc(g.bonus_text)}</div>
          ${g.bonus_code ? `<div style="display:inline-block;font-family:'Courier New';font-size:13px;font-weight:800;color:#00e5ff;letter-spacing:2px;background:rgba(0,0,0,.5);padding:6px 12px;border-radius:8px;border:1px dashed rgba(0,229,255,.4)">${esc(g.bonus_code)}</div>` : ''}
        </div>` : ''}

      <button class="btn ghost" onclick="doLogout()">Выйти</button>
    </div>`;

  let bonusPage = `
    <div class="page ${currentTab==='bonus'?'active':''}">
      ${renderDailyHtml()}
      ${renderWheelHtml()}
    </div>`;

  let withdrawPage = `
    <div class="page ${currentTab==='withdraw'?'active':''}">
      ${renderWithdrawHtml()}
    </div>`;

  document.getElementById('content').innerHTML = tabs + profilePage + bonusPage + withdrawPage;

  if(currentTab === 'bonus'){ drawWheelStatic(); }
}

/* ---------------- DAILY ---------------- */
function renderDailyHtml(){
  if(!dailyState){
    return `<div class="daily-card"><div class="daily-title">🔥 Ежедневный бонус</div>
      <div class="daily-sub">Загрузка…</div></div>`;
  }
  const level = dailyState.level || 0;
  const claimed = dailyState.claimed_today;
  const rewards = dailyState.rewards || [];
  const todayIdx = claimed ? Math.max(0, Math.min(6, level - 1)) : Math.min(6, level);

  let daysHtml = '';
  for(let i=0; i<7; i++){
    let cls = 'daily-day';
    if(i < level) cls += ' done';
    else if(i === todayIdx && !claimed) cls += ' today';
    daysHtml += `<div class="${cls}">
      <div class="num">Д${i+1}</div>
      <div class="reward">${fmt(rewards[i] || 0)}</div>
    </div>`;
  }

  const btnText = claimed ? '✓ Получено сегодня' : `Забрать ${fmt(dailyState.next_reward || 0)} ₽`;
  const streakText = `Streak: ${level} / 7`;

  return `<div class="daily-card">
    <div class="daily-title">
      <span>🔥 Ежедневный бонус</span>
      <span class="streak">${streakText}</span>
    </div>
    <div class="daily-sub">Заходи каждый день — награда растёт. Пропустишь день — серия сгорит и начнётся с 15 ₽.</div>
    <div class="daily-days">${daysHtml}</div>
    <div id="dailyMsg"></div>
    <button class="btn ${claimed?'ghost':'green'}" id="dailyBtn" ${claimed?'disabled':''} onclick="claimDaily()">${btnText}</button>
  </div>`;
}

async function claimDaily(){
  if(!dailyState || dailyState.claimed_today || claimLock) return;
  claimLock = true;

  const box = document.getElementById('dailyMsg');
  const btn = document.getElementById('dailyBtn');
  if(box) box.innerHTML = '';
  if(btn){ btn.disabled = true; btn.textContent = 'Отправка…'; }

  try {
    const r = await fetch('/api/guest/daily-claim', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ id: session.id })
    });
    const data = await r.json();
    if(!r.ok){
      if(box) box.innerHTML = `<div class="err">${esc(data.error || 'Ошибка')}</div>`;
      // если сервер сказал "уже забрали" — синхронизируем состояние
      await loadDaily();
      renderProfile();
      return;
    }

    // локально фиксируем успех сразу
    dailyState.claimed_today = true;
    dailyState.level = data.level;
    dailyState.next_reward = 0;
    dailyState.pending_bonus = data.pending_bonus;

    showDailyModal(data.reward, data.level, data.pending_bonus);
    renderProfile();

    // и синхронизируемся с сервером
    await Promise.all([loadSummary(), loadDaily()]);
    renderProfile();
  } catch(e){
    if(box) box.innerHTML = `<div class="err">Ошибка соединения</div>`;
    await loadDaily();
    renderProfile();
  } finally {
    claimLock = false;
  }
}

function showDailyModal(reward, level, pending){
  document.getElementById('dailyModalAmount').textContent = '+' + fmt(reward) + ' ₽';
  document.getElementById('dailyModalText').textContent = `День ${level} пройден! Ваш бонус:`;
  document.getElementById('dailyModalHint').textContent = `Всего накоплено: ${fmt(pending)} ₽. Завтра награда вырастет!`;
  document.getElementById('dailyModal').classList.add('show');
}
function closeDailyModal(){ document.getElementById('dailyModal').classList.remove('show'); }

/* ---------------- WHEEL ---------------- */
function renderWheelHtml(){
  if(!wheelState){
    return `<div class="wheel-card"><div class="t">🎡 Колесо фортуны</div>
      <div class="s">Загрузка…</div></div>`;
  }
  const canSpin = wheelState.can_spin;
  return `<div class="wheel-card">
    <div class="t">🎡 Колесо фортуны</div>
    <div class="s">${canSpin ? '1 бесплатное вращение в день' : 'Возвращайтесь завтра за новым вращением'}</div>
    <div class="wheel-wrap">
      <div class="wheel-pointer"></div>
      <canvas class="wheel-canvas" id="wheelCanvas" width="560" height="560"></canvas>
      <div class="wheel-center">SPIN</div>
    </div>
    <div class="wheel-result" id="wheelResult"></div>
    <button class="btn gold" id="spinBtn" ${canSpin?'':'disabled'} onclick="spinWheel()">
      ${canSpin ? 'Крутить!' : 'Уже крутили сегодня'}
    </button>
  </div>`;
}

function drawWheelStatic(){
  const canvas = document.getElementById('wheelCanvas');
  if(!canvas || !wheelState) return;
  const prizes = wheelState.prizes || [];
  if(!prizes.length) return;
  const dpr = window.devicePixelRatio || 1;
  const size = 280;
  canvas.width = size * dpr;
  canvas.height = size * dpr;
  canvas.style.width = size + 'px';
  canvas.style.height = size + 'px';
  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,size,size);

  const cx = size/2, cy = size/2, R = size/2 - 6;
  const totalW = prizes.reduce((a,p)=>a+(p.weight||1),0);
  let startAngle = -Math.PI/2;

  ctx.beginPath();
  ctx.arc(cx, cy, R+2, 0, Math.PI*2);
  ctx.fillStyle = 'rgba(0,0,0,.6)';
  ctx.fill();

  prizes.forEach((p) => {
    const slice = ((p.weight||1)/totalW) * Math.PI*2;
    const endAngle = startAngle + slice;

    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.arc(cx, cy, R, startAngle, endAngle);
    ctx.closePath();
    const grad = ctx.createRadialGradient(cx, cy, 30, cx, cy, R);
    grad.addColorStop(0, p.color || '#00e5ff');
    grad.addColorStop(1, shadeColor(p.color || '#00e5ff', -30));
    ctx.fillStyle = grad;
    ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,.5)';
    ctx.lineWidth = 2;
    ctx.stroke();

    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(startAngle + slice/2);
    ctx.textAlign = 'right';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = '#000';
    ctx.font = 'bold 15px Montserrat';
    ctx.fillText(p.label || '', R - 16, 0);
    ctx.restore();

    startAngle = endAngle;
  });

  ctx.strokeStyle = 'rgba(255,255,255,.15)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.arc(cx, cy, R-1, 0, Math.PI*2);
  ctx.stroke();

  canvas.style.transform = `rotate(${wheelRotation}rad)`;
}

function shadeColor(hex, percent){
  if(!hex) return '#00e5ff';
  const num = parseInt(hex.replace('#',''), 16);
  if(isNaN(num)) return hex;
  const r = Math.max(0, Math.min(255, ((num >> 16) & 0xFF) + percent));
  const g = Math.max(0, Math.min(255, ((num >> 8) & 0xFF) + percent));
  const b = Math.max(0, Math.min(255, (num & 0xFF) + percent));
  return `rgb(${r},${g},${b})`;
}

async function spinWheel(){
  if(isSpinning || spinLock || !wheelState || !wheelState.can_spin) return;
  spinLock = true;
  isSpinning = true;

  const canvas = document.getElementById('wheelCanvas');
  const resultBox = document.getElementById('wheelResult');
  const btn = document.getElementById('spinBtn');
  if(btn) btn.disabled = true;
  if(resultBox){ resultBox.textContent = ''; resultBox.style.color = '#3fbf7f'; }

  // страховка: если что-то пошло не так — разблокируем через 10 сек
  const safety = setTimeout(() => {
    spinLock = false;
    isSpinning = false;
    if(btn) btn.disabled = false;
  }, 10000);

  try {
    const r = await fetch('/api/guest/wheel-spin', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ id: session.id })
    });
    const data = await r.json();

    if(!r.ok){
      clearTimeout(safety);
      spinLock = false;
      isSpinning = false;
      if(btn) btn.disabled = false;
      if(resultBox){ resultBox.textContent = data.error || 'Ошибка'; resultBox.style.color = '#ff8a8a'; }
      // синхронизируем состояние (например, если уже крутили)
      await loadWheel();
      await loadSummary();
      renderProfile();
      return;
    }

    const prize = data.prize;
    const idx = prize.index;
    const prizes = wheelState.prizes || [];
    const totalW = prizes.reduce((a,p)=>a+(p.weight||1),0);

    let startAngle = -Math.PI/2;
    for(let i=0; i<idx; i++) startAngle += ((prizes[i].weight||1)/totalW) * Math.PI*2;
    const slice = ((prizes[idx].weight||1)/totalW) * Math.PI*2;
    const midAngle = startAngle + slice/2;
    const targetAngle = -Math.PI/2;
    const rotationRad = targetAngle - midAngle;
    const extraTurns = 5 + Math.floor(Math.random()*3);
    const finalRotation = wheelRotation + rotationRad + extraTurns*Math.PI*2;
    wheelRotation = finalRotation;

    canvas.style.transition = 'transform 4.5s cubic-bezier(.17,.67,.3,1)';
    canvas.style.transform = `rotate(${finalRotation}rad)`;

    // блокируем крутить дальше СРАЗУ после ответа сервера
    wheelState.can_spin = false;

    setTimeout(async ()=>{
      clearTimeout(safety);
      spinLock = false;
      isSpinning = false;

      if(resultBox){
        resultBox.innerHTML = `🎉 ${esc(prize.label)}!`;
        resultBox.style.color = prize.type === 'points' ? '#00e5ff' : '#3fbf7f';
      }

      // синхронизация
      await Promise.all([loadSummary(), loadDaily(), loadWheel()]);
      renderProfile();
    }, 4700);
  } catch(e){
    clearTimeout(safety);
    spinLock = false;
    isSpinning = false;
    if(btn) btn.disabled = false;
    if(resultBox){ resultBox.textContent = 'Ошибка соединения'; resultBox.style.color = '#ff8a8a'; }
    await loadWheel();
    renderProfile();
  }
}

/* ---------------- WITHDRAW ---------------- */
function renderWithdrawHtml(){
  const g = summary;
  if(!g) return '';
  const RANK_IDX = { Bronze:1, Silver:2, Gold:3, Platinum:4, Diamond:5, VIP:6 };
  const rankOk = (RANK_IDX[g.rank] || 1) >= 2;
  const wageringOk = (g.wagering_required === 0) || (g.wagering_done >= g.wagering_required);
  const pending = g.pending_bonus || 0;
  const deposit = g.deposit_balance || 0;
  const canToCasino = wageringOk && pending > 0;
  const canReal = rankOk && wageringOk && deposit > 0;
  const wageringLeft = Math.max(0, (g.wagering_required || 0) - (g.wagering_done || 0));

  return `
    <div class="withdraw-block">
      <h3>💰 На баланс онлайн-казино</h3>
      <div class="amount small">${fmt(pending)} ₽</div>
      <div class="cond">
        <div class="title">Условия</div>
        <div class="row"><span>Отыгрыш</span>
          ${wageringOk ? '<span class="ok">✓ выполнен</span>' : `<span class="bad">осталось ${fmt(wageringLeft)} баллов</span>`}
        </div>
        <div class="row"><span>Перевод</span><span style="color:#a0aec0">мгновенный</span></div>
      </div>
      <button class="btn green" ${canToCasino?'':'disabled'} onclick="withdrawToCasino()">
        Перевести на баланс
      </button>
      <div style="font-size:11px;color:#6d819a;margin-top:10px;line-height:1.5;">
        Средства сразу поступят на баланс казино и будут доступны для игры в Crash и кейсах.
      </div>
    </div>

    <div class="withdraw-block">
      <h3>🏦 Вывод реальных денег</h3>
      <div class="amount">${fmt(deposit)} ₽</div>
      <div class="cond">
        <div class="title">Условия вывода</div>
        <div class="row"><span>Ранг Silver или выше</span>
          ${rankOk ? '<span class="ok">✓ выполнен</span>' : '<span class="bad">не выполнен</span>'}
        </div>
        <div class="row"><span>Отыгрыш бонусов</span>
          ${wageringOk ? '<span class="ok">✓ выполнен</span>' : `<span class="bad">осталось ${fmt(wageringLeft)} баллов</span>`}
        </div>
        <div class="row"><span>Регистрация на Kingwin</span>
          <span class="ok">✓ активна</span>
        </div>
      </div>
      <button class="btn" ${canReal?'':'disabled'} onclick="withdrawReal()">
        Отправить заявку на вывод
      </button>
      <div style="font-size:11px;color:#6d819a;margin-top:10px;line-height:1.5;">
        Заявка уходит администратору на проверку.
      </div>
    </div>

    <div class="withdraw-block" style="background:rgba(0,229,255,.05);border-color:rgba(0,229,255,.25)">
      <h3>📖 Как получить ранг Silver</h3>
      <div class="cond">
        <div class="row"><span>Нужно баллов</span><b>100</b></div>
        <div class="row"><span>У вас</span><b>${g.points || 0}</b></div>
        <div class="row"><span>Начисление</span><span style="color:#a0aec0">0.2 балла за 1 ₽ ставки</span></div>
      </div>
      <button class="btn ghost" onclick="window.open('/index.html','_blank')">Перейти на Kingwin →</button>
    </div>
  `;
}

    });

    if(!r.ok){ alert(data.error || 'Ошибка'); return; }
    alert(`Переведено ${fmt(data.amount)} ₽ на баланс казино!`);
    await loadSummary();
    renderProfile();
  } catch(e){ alert('Ошибка соединения'); }
}

async function withdrawReal(){
  try {
    const r = await fetch('/api/guest/withdraw-real', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ id: session.id })
    });
    const data = await r.json();
    if(!r.ok){ alert(data.error || 'Ошибка'); return; }

function showRankUpModal(rank, gift){

  document.getElementById('rankUpAmount').textContent = '+' + fmt(gift) + ' ₽';

  document.getElementById('rankUpModal').classList.add('show');
}
function closeRankUpModal(){ document.getElementById('rankUpModal').classList.remove('show'); }

/* ---------------- LOGOUT ---------------- */
function doLogout(){
  if(refreshTimer) clearInterval(refreshTimer);
  session = null; summary = null; dailyState = null; wheelState = null;
  lastSeenRank = null; spinLock = false; claimLock = false;
  localStorage.removeItem('kingwin_guest_id');
  renderLogin('');
}

/* ---------------- INIT ---------------- */
(async function init(){
  const params = new URLSearchParams(location.search);
  const cardId = params.get('id');
  const saved = localStorage.getItem('kingwin_guest_id');
  const prefill = cardId || saved || '';
  if(prefill){
    renderLogin(prefill);
    if(saved && !cardId){
      try {
        const r = await fetch('/api/guest/me?id=' + encodeURIComponent(saved));
        if(r.ok){
          const data = await r.json();
          session = data.guest;
          await loadAll();
          startAutoRefresh();
        }
      } catch(e){}
    }
  } else {
    renderLogin('');
  }
})();
</script>
