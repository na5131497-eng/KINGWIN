<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KINGWIN — Профиль гостя</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Montserrat', sans-serif; background: radial-gradient(circle at top, #1a2332, #0a0d14);
    color: #fff; min-height: 100vh; display: flex; justify-content: center; padding: 24px 16px; }
  .wrap { width: 100%; max-width: 460px; }
  .logo { text-align: center; font-size: 28px; font-weight: 900; letter-spacing: 4px;
    background: linear-gradient(135deg, #00e5ff, #0077ff);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 4px; }
  .logo-sub { text-align: center; font-size: 10px; letter-spacing: 4px; color: #8fa2b8;
    text-transform: uppercase; margin-bottom: 22px; }

  .card { background: rgba(18,24,38,.9); border: 1px solid rgba(255,255,255,.06);
    border-radius: 20px; padding: 24px; backdrop-filter: blur(10px); box-shadow: 0 20px 50px rgba(0,0,0,.5);
    margin-bottom: 16px; }
  .head { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 18px; }
  .name { font-size: 24px; font-weight: 800; }
  .cid { font-size: 12px; color: #8fa2b8; font-family: 'Courier New', monospace; letter-spacing: 2px; margin-top: 4px; }
  .rank-badge { font-size: 11px; font-weight: 800; letter-spacing: 1px; text-transform: uppercase;
    padding: 6px 12px; border-radius: 20px; border: 1px solid rgba(255,255,255,.3); }
  .rank-badge.Bronze   { background: rgba(205,127,50,.25); color: #e8a76a; border-color: #cd7f32; }
  .rank-badge.Silver   { background: rgba(192,192,192,.2); color: #d9d9d9; border-color: #c0c0c0; }
  .rank-badge.Gold     { background: rgba(241,196,15,.2); color: #f1c40f; border-color: #f1c40f; }
  .rank-badge.Platinum { background: rgba(229,228,226,.2); color: #e5e4e2; border-color: #e5e4e2; }
  .rank-badge.Diamond  { background: rgba(185,242,255,.18); color: #b9f2ff; border-color: #b9f2ff; }
  .rank-badge.VIP      { background: rgba(212,175,55,.25); color: #ffe066; border-color: #d4af37;
    box-shadow: 0 0 12px rgba(212,175,55,.6); }

  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 18px; }
  .stat { background: rgba(0,0,0,.3); border: 1px solid rgba(255,255,255,.05); border-radius: 12px; padding: 14px; }
  .stat .lbl { font-size: 10px; color: #8fa2b8; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px; }
  .stat .val { font-size: 22px; font-weight: 800; color: #00e5ff; }
  .stat .val.green { color: #3fbf7f; }

  .progress-wrap { margin-bottom: 18px; }
  .progress-lbl { font-size: 11px; color: #8fa2b8; margin-bottom: 6px; display: flex; justify-content: space-between; }
  .progress { height: 8px; background: rgba(255,255,255,.08); border-radius: 4px; overflow: hidden; }
  .progress > div { height: 100%; background: linear-gradient(90deg, #3fbf7f, #00e5ff); border-radius: 4px; transition: width .4s; }

  .gift-block { background: linear-gradient(135deg, rgba(63,191,127,.12), rgba(0,229,255,.08));
    border: 1px solid rgba(63,191,127,.35); border-radius: 14px; padding: 16px; margin-bottom: 14px; }
  .gift-block .t { font-size: 11px; color: #3fbf7f; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px; font-weight: 700; }
  .gift-block .txt { font-size: 15px; font-weight: 600; margin-bottom: 10px; line-height: 1.4; }
  .gift-code { display: inline-block; font-family: 'Courier New', monospace; font-size: 14px;
    font-weight: 800; color: #00e5ff; letter-spacing: 2px; background: rgba(0,0,0,.5);
    padding: 6px 12px; border-radius: 8px; border: 1px dashed rgba(0,229,255,.4); }

  .cond-block { background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.1);
    border-radius: 14px; padding: 14px; margin-bottom: 14px; }
  .cond-block .t { font-size: 11px; color: #a0aec0; text-transform: uppercase; letter-spacing: 1px;
    margin-bottom: 8px; font-weight: 700; }
  .cond-block .row { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 6px; }
  .cond-block .row b { color: #fff; }

  .btn { width: 100%; background: #00e5ff; color: #000; border: none; border-radius: 10px;
    padding: 14px; font-size: 15px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px;
    cursor: pointer; font-family: inherit; transition: .3s; margin-top: 6px; }
  .btn:hover { box-shadow: 0 0 20px rgba(0,229,255,.5); }
  .btn.ghost { background: transparent; color: #a0aec0; border: 1px solid rgba(255,255,255,.15); }
  .btn.green { background: #3fbf7f; color: #000; }
  .btn.gold  { background: #d4af37; color: #000; }
  .btn:disabled { opacity: .4; cursor: not-allowed; }

  .footer { text-align: center; font-size: 11px; color: #6d819a; margin-top: 20px; line-height: 1.6; }
  .err { background: rgba(255,77,77,.12); border: 1px solid rgba(255,77,77,.4); color: #ff8a8a;
    border-radius: 12px; padding: 16px; text-align: center; font-weight: 600; margin-bottom: 14px; }
  .ok { background: rgba(63,191,127,.12); border: 1px solid rgba(63,191,127,.4); color: #3fbf7f;
    border-radius: 12px; padding: 12px; text-align: center; font-weight: 600; margin-bottom: 14px; font-size: 13px; }

  .login-form label { display: block; font-size: 11px; color: #8fa2b8; text-transform: uppercase;
    letter-spacing: 1px; margin: 14px 0 6px; font-weight: 600; }
  .login-form input { width: 100%; background: rgba(0,0,0,.4); border: 1px solid rgba(255,255,255,.1);
    border-radius: 10px; padding: 14px; font-size: 16px; color: #fff; font-family: inherit; }
  .login-form input:focus { outline: none; border-color: #00e5ff; box-shadow: 0 0 10px rgba(0,229,255,.3); }
  .live-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #3fbf7f;
    margin-right: 6px; animation: pulse 1.4s infinite; }
  @keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:.3;} }
  .live-label { font-size: 10px; color: #3fbf7f; text-align: center; margin-bottom: 10px; letter-spacing: 1px; text-transform: uppercase; }

  /* DAILY */
  .daily-card { background: linear-gradient(135deg, rgba(0,229,255,.08), rgba(63,191,127,.06));
    border: 1px solid rgba(0,229,255,.25); border-radius: 16px; padding: 18px; margin-bottom: 16px; }
  .daily-title { font-size: 13px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px;
    color: #00e5ff; margin-bottom: 4px; display: flex; justify-content: space-between; align-items: center; }
  .daily-title .streak { font-size: 11px; color: #3fbf7f; }
  .daily-sub { font-size: 11px; color: #8fa2b8; margin-bottom: 14px; }
  .daily-days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-bottom: 14px; }
  .daily-day { aspect-ratio: 1; border-radius: 8px; background: rgba(0,0,0,.4);
    border: 1px solid rgba(255,255,255,.06); display: flex; flex-direction: column;
    align-items: center; justify-content: center; font-size: 10px; color: #8fa2b8;
    font-weight: 700; transition: .3s; }
  .daily-day .num { font-size: 9px; opacity: .6; }
  .daily-day .reward { font-size: 11px; font-weight: 800; margin-top: 2px; }
  .daily-day.done { background: rgba(63,191,127,.18); border-color: #3fbf7f; color: #3fbf7f; }
  .daily-day.today { background: rgba(0,229,255,.15); border-color: #00e5ff; color: #00e5ff;
    box-shadow: 0 0 12px rgba(0,229,255,.5); animation: pulseGlow 1.6s infinite; }
  @keyframes pulseGlow { 0%,100%{box-shadow: 0 0 12px rgba(0,229,255,.4);} 50%{box-shadow: 0 0 22px rgba(0,229,255,.8);} }

  /* WHEEL */
  .wheel-card { background: linear-gradient(135deg, rgba(212,175,55,.12), rgba(0,229,255,.06));
    border: 1px solid rgba(212,175,55,.35); border-radius: 16px; padding: 18px; margin-bottom: 16px;
    text-align: center; }
  .wheel-card .t { font-size: 13px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px;
    color: #d4af37; margin-bottom: 6px; }
  .wheel-card .s { font-size: 11px; color: #8fa2b8; margin-bottom: 12px; }
  .wheel-wrap { position: relative; width: 220px; height: 220px; margin: 0 auto 12px; }
  .wheel-pointer { position: absolute; top: -6px; left: 50%; transform: translateX(-50%);
    font-size: 22px; color: #00e5ff; z-index: 5; filter: drop-shadow(0 0 6px rgba(0,229,255,.8)); }
  #wheelCanvas { display: block; width: 220px; height: 220px; border-radius: 50%;
    box-shadow: 0 0 30px rgba(212,175,55,.3), inset 0 0 20px rgba(0,0,0,.5); }
  .wheel-result { font-size: 13px; font-weight: 700; min-height: 20px; color: #3fbf7f; margin-top: 8px; }

  /* QR */
  .qr-card { background: rgba(18,24,38,.9); border: 1px solid rgba(255,255,255,.06);
    border-radius: 16px; padding: 18px; margin-bottom: 16px; text-align: center; }
  .qr-title { font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px;
    color: #00e5ff; margin-bottom: 10px; }
  .qr-box { display: inline-block; background: #fff; padding: 10px; border-radius: 12px; }
  #qrCanvas { display: block; }

  /* HISTORY */
  .hist-card { background: rgba(18,24,38,.9); border: 1px solid rgba(255,255,255,.06);
    border-radius: 16px; padding: 18px; margin-bottom: 16px; }
  .hist-title { font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px;
    color: #00e5ff; margin-bottom: 12px; }
  .hist-item { display: flex; justify-content: space-between; align-items: center;
    padding: 10px 12px; background: rgba(0,0,0,.25); border-radius: 10px; margin-bottom: 6px;
    font-size: 12px; }
  .hist-item .hl { color: #a0aec0; }
  .hist-item .hr { font-weight: 700; }
  .hist-item .hr.pos { color: #3fbf7f; }
  .hist-item .hr.neg { color: #ff8a8a; }
  .hist-empty { font-size: 12px; color: #6d819a; text-align: center; padding: 10px; font-style: italic; }

  /* MODAL */
  .modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(8px);
    display: none; align-items: center; justify-content: center; z-index: 3000; padding: 20px; }
  .modal-backdrop.show { display: flex; }
  .thanks-modal { background: linear-gradient(135deg, #111625, #0a0d14); border: 2px solid #00e5ff;
    border-radius: 24px; padding: 40px 32px; max-width: 400px; width: 100%; text-align: center;
    box-shadow: 0 0 60px rgba(0,229,255,0.35); animation: slideUp 0.4s ease; }
  @keyframes slideUp { from { transform: translateY(30px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  .thanks-logo { font-size: 42px; font-weight: 900; letter-spacing: 4px;
    background: linear-gradient(135deg, #00e5ff, #0077ff); -webkit-background-clip: text;
    -webkit-text-fill-color: transparent; margin-bottom: 8px; }
  .thanks-sub { font-size: 11px; color: #8fa2b8; letter-spacing: 3px;
    text-transform: uppercase; margin-bottom: 28px; }
  .thanks-title { font-size: 24px; font-weight: 900; color: #fff; margin-bottom: 12px; }
  .thanks-title span { color: #3fbf7f; }
  .thanks-text { font-size: 15px; color: #a0aec0; line-height: 1.6; margin-bottom: 8px; }
  .thanks-amount { display: inline-block; font-size: 34px; font-weight: 900; color: #00e5ff;
    text-shadow: 0 0 20px rgba(0,229,255,0.5); margin: 12px 0 20px; }
  .thanks-luck { font-size: 16px; color: #3fbf7f; font-weight: 800; letter-spacing: 1px; margin-bottom: 26px; }
  .thanks-btn { background: #00e5ff; color: #000; border: none; border-radius: 12px;
    padding: 14px 44px; font-size: 16px; font-weight: 900; text-transform: uppercase;
    letter-spacing: 1px; cursor: pointer; font-family: inherit; transition: 0.3s;
    box-shadow: 0 0 20px rgba(0,229,255,0.4); }
  .thanks-btn:hover { box-shadow: 0 0 30px rgba(0,229,255,0.7); transform: translateY(-2px); }
</style>
</head>
<body>
<div class="wrap">
  <div class="logo">KINGWIN</div>
  <div class="logo-sub">Guest Profile</div>
  <div id="content"><div class="card">Загрузка…</div></div>
  <div class="footer">© KINGWIN</div>
</div>

<!-- Модалка депозита -->
<div class="modal-backdrop" id="thanksModal">
  <div class="thanks-modal">
    <div class="thanks-logo">KINGWIN</div>
    <div class="thanks-sub">Club Card</div>
    <div class="thanks-title">Депозит <span>зачислен</span></div>
    <div class="thanks-text">Ваш баланс успешно пополнен на</div>
    <div class="thanks-amount" id="thanksAmount">+0 ₽</div>
    <div class="thanks-luck">Удачи в игре!</div>
    <button class="thanks-btn" onclick="closeThanksModal()">Отлично</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
<script>
/* ============================================================
   KINGWIN — Profile 2 (Guest) — рабочий локальный билд
   Daily reward и колесо работают через localStorage.
   Если появятся серверные API — код сам переключится.
   ============================================================ */
const RANKS_INFO = {
  Bronze:   { next: 100,  label: 'Silver',   gift: 0    },
  Silver:   { next: 300,  label: 'Gold',     gift: 50   },
  Gold:     { next: 600,  label: 'Platinum', gift: 200  },
  Platinum: { next: 1000, label: 'Diamond',  gift: 500  },
  Diamond:  { next: 1500, label: 'VIP',      gift: 1000 },
  VIP:      { next: null, label: null,       gift: 3000 }
};

const DAILY_REWARDS = [50, 75, 100, 150, 200, 300, 500];

const WHEEL_PRIZES = [
  { label: '50 ₽',      value: 50,  type: 'bonus',  weight: 25, color: '#00e5ff' },
  { label: '100 ₽',     value: 100, type: 'bonus',  weight: 20, color: '#3fbf7f' },
  { label: '10 баллов', value: 10,  type: 'points', weight: 20, color: '#d4af37' },
  { label: '25 баллов', value: 25,  type: 'points', weight: 15, color: '#ff8a8a' },
  { label: '200 ₽',     value: 200, type: 'bonus',  weight: 8,  color: '#b9f2ff' },
  { label: '500 ₽',     value: 500, type: 'bonus',  weight: 3,  color: '#ffe066' },
  { label: 'Пусто',     value: 0,   type: 'none',   weight: 9,  color: '#6d819a' }
];

let session = null;
let refreshTimer = null;
let pendingDeposits = [];
let dailyState = null;
let wheelState = null;
let isSpinning = false;
let wheelRotation = 0;

function esc(s){ return String(s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmt(n){ return (Math.round((n||0)*100)/100).toLocaleString('ru-RU'); }
function todayStr(){ return new Date().toISOString().slice(0,10); }

function lsKey(suffix){ return 'kw_' + suffix + '_' + (session ? session.id : 'anon'); }
function lsGet(k, def){ try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : def; } catch(e){ return def; } }
function lsSet(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }

/* ---------------- LOGIN ---------------- */
function renderLogin(prefillId){
  document.getElementById('content').innerHTML = `
    <div class="card">
      <h2 style="font-size:20px; font-weight:800; margin-bottom:6px; text-align:center;">Вход по карте</h2>
      <p style="font-size:12px;color:#8fa2b8;text-align:center;margin-bottom:8px;">Введите номер карты и пароль</p>
      <div class="login-form">
        <label>Номер карты</label>
        <input type="text" id="loginId" placeholder="12345678" value="${esc(prefillId||'')}">
        <label>Пароль</label>
        <input type="password" id="loginPass" placeholder="••••">
        <div class="err" id="loginErr" style="display:none;margin-top:14px;"></div>
        <button class="btn" onclick="doLogin()" style="margin-top:18px;">Войти</button>
      </div>
    </div>`;
  document.getElementById('loginPass').addEventListener('keypress', e=>{ if(e.key==='Enter') doLogin(); });
}

async function doLogin(){
  const id = document.getElementById('loginId').value.trim();
  const pass = document.getElementById('loginPass').value;
  const err = document.getElementById('loginErr');
  err.style.display = 'none';
  if(!id || !pass){ err.textContent = 'Введите номер и пароль'; err.style.display='block'; return; }
  try {
    const r = await fetch('/api/guest/login', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ id, pass })
    });
    const data = await r.json();
    if(!r.ok){ err.textContent = data.error || 'Ошибка'; err.style.display='block'; return; }
    session = data.guest;
    localStorage.setItem('kingwin_guest_id', id);
    await loadMe();
    startAutoRefresh();
  } catch(e){ err.textContent = 'Ошибка соединения'; err.style.display='block'; }
}

/* ---------------- LOAD ---------------- */
async function loadMe(){
  if(!session) return;
  try {
    const r = await fetch('/api/guest/me?id=' + encodeURIComponent(session.id));
    if(r.ok){
      const data = await r.json();
      session = data.guest;
      if (data.unseen_deposits && data.unseen_deposits.length > 0) {
        pendingDeposits = data.unseen_deposits;
        showThanksModal(pendingDeposits[0]);
      }
    }
  } catch(e){}

  // daily — сервер или локально
  await loadDaily();
  // wheel — сервер или локально
  await loadWheel();
  // history — сервер или локально
  await loadHistory();

  renderProfile();
}

function startAutoRefresh(){
  if(refreshTimer) clearInterval(refreshTimer);
  refreshTimer = setInterval(loadMe, 5000);
}

/* ---------------- DAILY ---------------- */
async function loadDaily(){
  // пробуем сервер
  try {
    const r = await fetch('/api/guest/daily?id=' + encodeURIComponent(session.id));
    if(r.ok){
      const data = await r.json();
      dailyState = {
        streak: data.streak || 0,
        claimed_today: !!data.claimed_today,
        rewards: Array.isArray(data.rewards) && data.rewards.length === 7 ? data.rewards : DAILY_REWARDS,
        source: 'server'
      };
      return;
    }
  } catch(e){}

  // локально
  const key = lsKey('daily');
  let demo = lsGet(key, { streak: 0, last_claim: null });
  const todayS = todayStr();
  if(demo.last_claim){
    const diff = (new Date(todayS) - new Date(demo.last_claim)) / 86400000;
    if(diff > 1){ demo.streak = 0; lsSet(key, demo); }
  }
  dailyState = {
    streak: demo.streak || 0,
    claimed_today: demo.last_claim === todayS,
    rewards: DAILY_REWARDS,
    source: 'local'
  };
}

async function claimDaily(){
  if(!session || !dailyState || dailyState.claimed_today) return;
  const box = document.getElementById('dailyMsg');
  if(box) box.innerHTML = '';

  // пробуем сервер
  try {
    const r = await fetch('/api/guest/daily-claim', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ id: session.id })
    });
    if(r.ok){
      const data = await r.json();
      await loadMe();
      if(box && data.reward) box.innerHTML = `<div class="ok">+${fmt(data.reward)} ₽ зачислено! Streak: ${data.streak} 🔥</div>`;
      return;
    }
  } catch(e){}

  // локально
  const key = lsKey('daily');
  let demo = lsGet(key, { streak: 0, last_claim: null });
  const todayS = todayStr();
  if(demo.last_claim === todayS) return;

  let streak = demo.streak || 0;
  if(demo.last_claim){
    const diff = (new Date(todayS) - new Date(demo.last_claim)) / 86400000;
    streak = diff === 1 ? streak + 1 : 1;
  } else {
    streak = 1;
  }
  if(streak > 7) streak = 1;

  const reward = DAILY_REWARDS[streak - 1] || 0;
  demo.streak = streak;
  demo.last_claim = todayS;
  lsSet(key, demo);

  session.bonus_balance = (parseFloat(session.bonus_balance) || 0) + reward;

  // пишем в локальную историю
  addLocalHistory({ date: new Date().toLocaleString('ru-RU'), label: `Daily бонус (день ${streak})`, sum: reward, status: 'зачислено' });

  dailyState.streak = streak;
  dailyState.claimed_today = true;
  renderProfile();
  const box2 = document.getElementById('dailyMsg');
  if(box2) box2.innerHTML = `<div class="ok">+${fmt(reward)} ₽ зачислено! Streak: ${streak} 🔥</div>`;
}

function renderDailyHtml(){
  if(!dailyState){
    return `<div class="daily-card">
      <div class="daily-title">🔥 Ежедневный бонус</div>
      <div class="daily-sub">Заходи каждый день — серия растёт, награды тоже.</div>
      <div class="err" style="margin:0">Загрузка…</div>
    </div>`;
  }
  const cur = dailyState.streak;
  const claimed = dailyState.claimed_today;
  const todayIdx = claimed ? Math.max(0, Math.min(6, cur - 1)) : Math.min(6, cur);
  const rewards = dailyState.rewards;

  let daysHtml = '';
  for(let i=0; i<7; i++){
    let cls = 'daily-day';
    if(i < cur) cls += ' done';
    else if(i === todayIdx) cls += ' today';
    daysHtml += `<div class="${cls}">
      <div class="num">Д${i+1}</div>
      <div class="reward">${fmt(rewards[i] || 0)}</div>
    </div>`;
  }

  const btnText = claimed
    ? '✓ Получено сегодня'
    : `Забрать ${fmt(rewards[todayIdx] || 0)} ₽`;

  return `<div class="daily-card">
    <div class="daily-title">
      <span>🔥 Ежедневный бонус</span>
      <span class="streak">Streak: ${cur} дн.</span>
    </div>
    <div class="daily-sub">Заходи каждый день — серия растёт. Пропуск = сброс.</div>
    <div class="daily-days">${daysHtml}</div>
    <div id="dailyMsg"></div>
    <button class="btn ${claimed?'ghost':'green'}" ${claimed?'disabled':''} onclick="claimDaily()">${btnText}</button>
  </div>`;
}

/* ---------------- WHEEL ---------------- */
async function loadWheel(){
  // пробуем сервер
  try {
    const r = await fetch('/api/guest/wheel-state?id=' + encodeURIComponent(session.id));
    if(r.ok){
      const data = await r.json();
      wheelState = { can_spin: !!data.can_spin, source: 'server' };
      return;
    }
  } catch(e){}

  // локально
  const key = lsKey('wheel');
  const demo = lsGet(key, { last_spin: null });
  wheelState = {
    can_spin: demo.last_spin !== todayStr(),
    source: 'local'
  };
}

function drawWheelStatic(){
  const canvas = document.getElementById('wheelCanvas');
  if(!canvas) return;
  const dpr = window.devicePixelRatio || 1;
  const size = 220;
  canvas.width = size * dpr;
  canvas.height = size * dpr;
  canvas.style.width = size + 'px';
  canvas.style.height = size + 'px';
  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,size,size);
  const cx = size/2, cy = size/2, R = size/2 - 4;
  const totalW = WHEEL_PRIZES.reduce((a,p)=>a+(p.weight||1),0);
  let startAngle = -Math.PI/2;
  WHEEL_PRIZES.forEach((p) => {
    const slice = ((p.weight||1)/totalW) * Math.PI*2;
    const endAngle = startAngle + slice;
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.arc(cx, cy, R, startAngle, endAngle);
    ctx.closePath();
    ctx.fillStyle = p.color || '#00e5ff';
    ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,.4)';
    ctx.lineWidth = 2;
    ctx.stroke();

    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(startAngle + slice/2);
    ctx.textAlign = 'right';
    ctx.fillStyle = '#000';
    ctx.font = 'bold 11px Montserrat';
    ctx.fillText(p.label || '', R - 10, 4);
    ctx.restore();

    startAngle = endAngle;
  });
  ctx.beginPath();
  ctx.arc(cx, cy, 26, 0, Math.PI*2);
  ctx.fillStyle = '#0a0d14';
  ctx.fill();
  ctx.strokeStyle = '#00e5ff';
  ctx.lineWidth = 3;
  ctx.stroke();
  ctx.fillStyle = '#00e5ff';
  ctx.font = 'bold 11px Montserrat';
  ctx.textAlign = 'center';
  ctx.fillText('SPIN', cx, cy+4);

  // восстановим поворот после перерисовки
  canvas.style.transform = `rotate(${wheelRotation}rad)`;
}

function pickWeightedIndex(){
  const totalW = WHEEL_PRIZES.reduce((a,p)=>a+(p.weight||1),0);
  let r = Math.random() * totalW;
  for(let i=0; i<WHEEL_PRIZES.length; i++){
    r -= (WHEEL_PRIZES[i].weight||1);
    if(r <= 0) return i;
  }
  return WHEEL_PRIZES.length - 1;
}

async function spinWheel(){
  if(isSpinning || !session || !wheelState || !wheelState.can_spin) return;
  isSpinning = true;
  const canvas = document.getElementById('wheelCanvas');
  const resultBox = document.getElementById('wheelResult');
  const btn = document.getElementById('spinBtn');
  if(btn) btn.disabled = true;
  if(resultBox) resultBox.textContent = '';

  let idx;
  let serverPrize = null;

  // пробуем сервер
  try {
    const r = await fetch('/api/guest/wheel-spin', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ id: session.id })
    });
    if(r.ok){
      const data = await r.json();
      if(data && data.prize && typeof data.prize.index === 'number'){
        serverPrize = data.prize;
        idx = data.prize.index;
      }
    }
  } catch(e){}

  if(idx === undefined) idx = pickWeightedIndex();
  const prize = serverPrize || WHEEL_PRIZES[idx];

  // угол
  const totalW = WHEEL_PRIZES.reduce((a,p)=>a+(p.weight||1),0);
  let startAngle = -Math.PI/2;
  for(let i=0; i<idx; i++) startAngle += ((WHEEL_PRIZES[i].weight||1)/totalW) * Math.PI*2;
  const slice = ((WHEEL_PRIZES[idx].weight||1)/totalW) * Math.PI*2;
  const midAngle = startAngle + slice/2;
  const targetAngle = -Math.PI/2;
  const rotationRad = targetAngle - midAngle;
  const extraTurns = 4 + Math.floor(Math.random()*3);
  const finalRotation = wheelRotation + rotationRad + extraTurns*Math.PI*2;
  wheelRotation = finalRotation;

  canvas.style.transition = 'transform 4s cubic-bezier(.17,.67,.3,1)';
  canvas.style.transform = `rotate(${finalRotation}rad)`;

  setTimeout(() => {
    isSpinning = false;
    if(btn) btn.disabled = false;

    // применяем локально, если сервер не ответил
    if(!serverPrize){
      if(prize.type === 'bonus'){
        session.bonus_balance = (parseFloat(session.bonus_balance) || 0) + prize.value;
        addLocalHistory({ date: new Date().toLocaleString('ru-RU'), label: `Колесо: ${prize.label}`, sum: prize.value, status: 'зачислено' });
      } else if(prize.type === 'points'){
        session.points = (parseInt(session.points) || 0) + prize.value;
        addLocalHistory({ date: new Date().toLocaleString('ru-RU'), label: `Колесо: ${prize.label}`, sum: 0, status: 'баллы +' + prize.value });
      }
      // отмечаем спин
      lsSet(lsKey('wheel'), { last_spin: todayStr() });
      wheelState.can_spin = false;
    }

    if(resultBox){
      if(prize.type === 'none'){
        resultBox.innerHTML = `Пусто 😔 Попробуйте завтра!`;
        resultBox.style.color = '#a0aec0';
      } else {
        resultBox.innerHTML = `🎉 Выигрыш: <b>${esc(prize.label || prize.value)}</b>`;
        resultBox.style.color = '#3fbf7f';
      }
    }
    renderProfile();
  }, 4200);
}

function renderWheelHtml(){
  if(!wheelState){
    return `<div class="wheel-card">
      <div class="t">🎡 Колесо фортуны</div>
      <div class="s">Загрузка…</div>
    </div>`;
  }
  const canSpin = wheelState.can_spin;
  return `<div class="wheel-card">
    <div class="t">🎡 Колесо фортуны</div>
    <div class="s">${canSpin ? '1 бесплатное вращение в день' : 'Возвращайтесь завтра за новым вращением'}</div>
    <div class="wheel-wrap">
      <div class="wheel-pointer">▼</div>
      <canvas id="wheelCanvas"></canvas>
    </div>
    <div class="wheel-result" id="wheelResult"></div>
    <button class="btn gold" id="spinBtn" ${canSpin?'':'disabled'} onclick="spinWheel()">
      ${canSpin ? 'Крутить!' : 'Уже крутили сегодня'}
    </button>
  </div>`;
}

/* ---------------- HISTORY ---------------- */
function addLocalHistory(entry){
  const key = lsKey('hist');
  const list = lsGet(key, []);
  list.unshift(entry);
  if(list.length > 30) list.length = 30;
  lsSet(key, list);
}

async function loadHistory(){
  try {
    const r = await fetch('/api/guest/history?id=' + encodeURIComponent(session.id));
    if(r.ok){
      const data = await r.json();
      if(Array.isArray(data)){ window._serverHistory = data; return; }
    }
  } catch(e){}
  window._serverHistory = null;
}

function renderHistoryHtml(){
  let list = window._serverHistory;
  if(!list) list = lsGet(lsKey('hist'), []);
  if(!list || !list.length) return '';
  return `<div class="hist-card">
    <div class="hist-title">📋 История операций</div>
    ${list.slice(0,8).map(h=>{
      const sum = parseFloat(h.sum) || 0;
      const isPos = sum >= 0;
      const label = h.label || h.type || 'операция';
      return `<div class="hist-item">
        <div class="hl">${esc(h.date||'')} · ${esc(label)}</div>
        <div class="hr ${isPos?'pos':'neg'}">${sum ? (isPos?'+':'')+fmt(sum)+' ₽' : esc(h.status||'')}</div>
      </div>`;
    }).join('')}
  </div>`;
}

/* ---------------- QR ---------------- */
function renderQrHtml(){
  return `<div class="qr-card">
    <div class="qr-title">📱 Карта для входа</div>
    <div class="qr-box"><canvas id="qrCanvas" width="160" height="160"></canvas></div>
    <div style="font-size:11px;color:#8fa2b8;margin-top:10px;">Покажите QR на кассе — вас найдут по номеру карты</div>
  </div>`;
}
function drawQr(){
  const canvas = document.getElementById('qrCanvas');
  if(!canvas) return;
  const url = location.origin + location.pathname + '?id=' + encodeURIComponent(session.id);
  if(window.QRCode && QRCode.toCanvas){
    QRCode.toCanvas(canvas, url, { width: 160, margin: 1, color: { dark: '#0a0d14', light: '#ffffff' } }, (err)=>{
      if(err) drawQrFallback(canvas, session.id);
    });
  } else {
    drawQrFallback(canvas, session.id);
  }
}
function drawQrFallback(canvas, text){
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#fff';
  ctx.fillRect(0,0,160,160);
  ctx.fillStyle = '#0a0d14';
  ctx.font = 'bold 14px Courier New';
  ctx.textAlign = 'center';
  ctx.fillText('CARD', 80, 70);
  ctx.font = 'bold 16px Courier New';
  ctx.fillText(String(text), 80, 95);
}

/* ---------------- PROFILE ---------------- */
function renderProfile(){
  const g = session;
  const info = RANKS_INFO[g.rank] || RANKS_INFO.Bronze;
  const points = parseInt(g.points) || 0;
  const progress = info.next ? Math.min(100, Math.round((points / info.next) * 100)) : 100;
  const bonusBalance = parseFloat(g.bonus_balance) || 0;
  const wageringRequired = parseFloat(g.wagering_required) || 0;
  const wageringDone = parseFloat(g.wagering_done) || 0;
  const wageringLeft = Math.max(0, wageringRequired - wageringDone);
  const canWithdraw = wageringRequired > 0 && wageringDone >= wageringRequired && bonusBalance > 0;

  const hasGift = g.bonus_text && g.bonus_text.trim() !== '';
  const giftHtml = hasGift ? `
    <div class="gift-block">
      <div class="t">Ваш подарок</div>
      <div class="txt">${esc(g.bonus_text)}</div>
      ${g.bonus_code ? `<div class="gift-code">${esc(g.bonus_code)}</div>` : ''}
    </div>` : '';

  const condHtml = (wageringRequired > 0) ? `
    <div class="cond-block">
      <div class="t">Условие для вывода</div>
      <div class="row"><span>Требуется</span><b>${fmt(wageringRequired)} баллов</b></div>
      <div class="row"><span>Выполнено</span><b>${fmt(wageringDone)} баллов</b></div>
      <div class="row"><span>Осталось</span><b>${fmt(wageringLeft)} баллов</b></div>
    </div>` : '';

  const withdrawBtn = (bonusBalance > 0)
    ? `<button class="btn" onclick="withdrawBonus()" ${canWithdraw ? '' : 'disabled'}>
         Вывести ${fmt(bonusBalance)} ₽ на баланс
       </button>`
    : '';

  document.getElementById('content').innerHTML = `
    <div class="live-label"><span class="live-dot"></span>Автообновление · каждые 5 сек</div>

    ${renderDailyHtml()}

    <div class="card">
      <div class="head">
        <div>
          <div class="name">${esc(g.name)}</div>
          <div class="cid">№ ${esc(g.id)}</div>
        </div>
        <div class="rank-badge ${g.rank}">${g.rank}</div>
      </div>

      <div class="stats">
        <div class="stat"><div class="lbl">Баллы</div><div class="val">${points}</div></div>
        <div class="stat"><div class="lbl">Визиты</div><div class="val">${g.visits || 0}</div></div>
      </div>

      <div class="stats">
        <div class="stat"><div class="lbl">Бонусные рубли</div><div class="val green">${fmt(bonusBalance)} ₽</div></div>
        <div class="stat"><div class="lbl">До ранга ${info.label || '—'}</div><div class="val">${info.next ? `${points} / ${info.next}` : 'MAX'}</div></div>
      </div>

      <div class="progress-wrap">
        <div class="progress-lbl">
          <span>Прогресс ранга</span>
          <span>${info.next ? `${points} / ${info.next}` : 'Максимальный ранг'}</span>
        </div>
        <div class="progress"><div style="width:${progress}%"></div></div>
      </div>

      ${giftHtml}
      ${condHtml}
      <div id="withdrawMsg"></div>
      ${withdrawBtn}

      <button class="btn ghost" onclick="doLogout()">Выйти</button>
    </div>

    ${renderWheelHtml()}
    ${renderQrHtml()}
    ${renderHistoryHtml()}
  `;

  drawWheelStatic();
  drawQr();
}

/* ---------------- WITHDRAW ---------------- */
async function withdrawBonus(){
  if(!session) return;
  const g = session;
  const amt = parseFloat(g.bonus_balance) || 0;
  if(amt <= 0) return;
  const box = document.getElementById('withdrawMsg');
  box.innerHTML = '';
  try {
    const r = await fetch('/api/guest/withdraw', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ id: g.id, sum: amt })
    });
    const data = await r.json();
    if(!r.ok){ box.innerHTML = `<div class="err">${esc(data.error || 'Ошибка')}</div>`; return; }
    box.innerHTML = `<div class="ok">Заявка создана! Админ подтвердит вывод.</div>`;
    await loadMe();
  } catch(e){
    box.innerHTML = `<div class="err">Ошибка соединения</div>`;
  }
}

/* ---------------- DEPOSIT MODAL ---------------- */
function showThanksModal(dep) {
  if (!dep) return;
  document.getElementById('thanksAmount').textContent = '+' + fmt(dep.sum) + ' ₽';
  document.getElementById('thanksModal').classList.add('show');
}
async function closeThanksModal() {
  document.getElementById('thanksModal').classList.remove('show');
  if (pendingDeposits.length > 0) {
    const dep = pendingDeposits.shift();
    try { await fetch('/api/deposits/' + dep.id + '/seen', { method: 'POST' }); } catch(e) {}
    if (pendingDeposits.length > 0) setTimeout(() => showThanksModal(pendingDeposits[0]), 500);
  }
}

/* ---------------- LOGOUT ---------------- */
function doLogout(){
  if(refreshTimer) clearInterval(refreshTimer);
  session = null;
  window._serverHistory = null;
  localStorage.removeItem('kingwin_guest_id');
  renderLogin('');
}

/* ---------------- INIT ---------------- */
(function init(){
  const params = new URLSearchParams(location.search);
  const cardId = params.get('id');
  const saved = localStorage.getItem('kingwin_guest_id');
  if(cardId) renderLogin(cardId);
  else if(saved) renderLogin(saved);
  else renderLogin('');
})();
</script>
