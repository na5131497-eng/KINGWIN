<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0b0e14">
<title>KINGWIN — История рулетки</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-main: #0b0e14; --bg-panel: #151922;
    --accent: #00e5ff;
    --text-main: #fff; --text-muted: #8b92a5;
    --red: #ff4d4d; --green: #3fbf7f;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Montserrat', sans-serif; -webkit-tap-highlight-color: transparent; }
  body { background: radial-gradient(circle at top left, #1a2332, #0a0d14); color: var(--text-main); min-height: 100dvh; padding: 20px; }

  .container { max-width: 700px; margin: 0 auto; padding-top: 40px; }

  .back-btn {
    display: inline-flex; align-items: center; gap: 8px;
    background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.15);
    color: #a0aec0; padding: 10px 18px; border-radius: 10px;
    text-decoration: none; font-size: 13px; font-weight: 700;
    margin-bottom: 30px; transition: .2s;
  }
  .back-btn:hover { border-color: #00e5ff; color: #00e5ff; }

  /* История — без рамки, без шапки */
  .history-wrap {
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px 0;
    overflow: hidden;
    position: relative;
  }

  .history-track {
    display: flex;
    gap: 12px;
    transition: transform .5s cubic-bezier(.4, 0, .2, 1);
    will-change: transform;
  }

  .history-ball {
    width: 64px;
    height: 64px;
    flex-shrink: 0;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    font-weight: 900;
    color: #fff;
    border: 2px solid rgba(255,255,255,.12);
    transition: transform .3s;
    cursor: default;
    position: relative;
  }
  .history-ball:hover { transform: scale(1.08); }
  .history-ball.red {
    background: linear-gradient(135deg, #ff4d4d, #c0392b);
    box-shadow: 0 6px 20px rgba(255,77,77,.4), inset 0 2px 4px rgba(255,255,255,.2);
  }
  .history-ball.black {
    background: linear-gradient(135deg, #3a3a3a, #000);
    box-shadow: 0 6px 20px rgba(0,0,0,.6), inset 0 2px 4px rgba(255,255,255,.1);
  }
  .history-ball.green {
    background: linear-gradient(135deg, #3fbf7f, #1e7a4a);
    box-shadow: 0 6px 20px rgba(63,191,127,.4), inset 0 2px 4px rgba(255,255,255,.2);
  }

  /* Анимация появления нового шара (слева) */
  .history-ball.new {
    animation: ballDrop .6s cubic-bezier(.34, 1.56, .64, 1);
  }
  @keyframes ballDrop {
    0% {
      transform: translateX(-80px) scale(0) rotate(-180deg);
      opacity: 0;
    }
    60% {
      transform: translateX(8px) scale(1.15) rotate(10deg);
      opacity: 1;
    }
    100% {
      transform: translateX(0) scale(1) rotate(0deg);
      opacity: 1;
    }
  }

  /* Свечение при появлении */
  .history-ball.new::after {
    content: '';
    position: absolute;
    inset: -4px;
    border-radius: 50%;
    background: inherit;
    opacity: 0;
    animation: glowPulse .8s ease-out;
    z-index: -1;
  }
  @keyframes glowPulse {
    0% { opacity: .8; transform: scale(1); }
    100% { opacity: 0; transform: scale(1.6); }
  }

  /* Пустое состояние */
  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: #8fa2b8;
    font-size: 13px;
    font-style: italic;
  }

  @media (max-width: 700px) {
    body { padding: 12px; }
    .container { padding-top: 20px; }
    .history-ball { width: 48px; height: 48px; font-size: 16px; }
    .history-track { gap: 8px; }
  }
  @media (max-width: 500px) {
    .history-ball { width: 42px; height: 42px; font-size: 14px; }
    .history-track { gap: 6px; }
  }
</style>
</head>
<body>

<div class="container">

  <a href="/" class="back-btn">← На главную</a>

  <div class="history-wrap">
    <div class="history-track" id="historyTrack"></div>
  </div>
  <div class="empty-state" id="emptyState" style="display:none;">Пока нет выпадений</div>

</div>

<script>
let lastFirstId = null;
let currentList = [];

async function loadHistory() {
  try {
    const r = await fetch('/api/roulette/history?limit=20', { cache: 'no-store' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const list = await r.json();

    const track = document.getElementById('historyTrack');
    const empty = document.getElementById('emptyState');

    if (!Array.isArray(list) || list.length === 0) {
      track.innerHTML = '';
      if (empty) empty.style.display = 'block';
      return;
    }

    if (empty) empty.style.display = 'none';

    const firstId = list[0].id;
    const isNew = lastFirstId !== null && firstId !== lastFirstId;

    // Создаём шары. Первый (новый) — с анимацией, остальные — без
    track.innerHTML = list.map((x, i) => {
      const colorClass = x.result_color === 'red' ? 'red' : x.result_color === 'black' ? 'black' : 'green';
      const newClass = (i === 0 && isNew) ? ' new' : '';
      return `<div class="history-ball ${colorClass}${newClass}" title="${x.result_color === 'red' ? 'Красное' : x.result_color === 'black' ? 'Чёрное' : 'Зеро'}">${x.result_number}</div>`;
    }).join('');

    // Сдвиг вправо — все шары «приехали» на свои места
    if (isNew) {
      // Сначала сдвигаем весь трек на позицию нового шара, потом плавно возвращаем
      track.style.transform = 'translateX(' + (track.children[0]?.offsetWidth + 12) + 'px)';
      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          track.style.transform = 'translateX(0)';
        });
      });
    }

    lastFirstId = firstId;
    currentList = list;
  } catch (e) {
    console.warn('loadHistory error:', e);
  }
}

loadHistory();
setInterval(loadHistory, 10000);
</script>

</body>
</html>
