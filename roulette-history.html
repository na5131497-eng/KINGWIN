<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0b0e14">
<title>KINGWIN — История рулетки</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-main: #0b0e14; --bg-panel: #151922;
    --accent: #00e5ff;
    --text-main: #fff; --text-muted: #8b92a5;
    --red: #ff4d4d; --green: #3fbf7f;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Montserrat', sans-serif; -webkit-tap-highlight-color: transparent; }
  body { background: radial-gradient(circle at top left, #1a2332, #0a0d14); color: var(--text-main); min-height: 100dvh; padding: 20px; }

  .container { max-width: 750px; margin: 0 auto; position: relative; }

  /* Кнопки сверху */
  .top-actions {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 30px;
    gap: 10px;
  }

  .back-btn {
    display: inline-flex; align-items: center; gap: 8px;
    background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.15);
    color: #a0aec0; padding: 10px 18px; border-radius: 10px;
    text-decoration: none; font-size: 13px; font-weight: 700;
    transition: .2s;
  }
  .back-btn:hover { border-color: #00e5ff; color: #00e5ff; }

  .fullscreen-btn {
    display: inline-flex; align-items: center; justify-content: center;
    gap: 8px;
    background: rgba(0,229,255,.1);
    border: 1px solid rgba(0,229,255,.4);
    color: #00e5ff;
    padding: 10px 18px;
    border-radius: 10px;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
    transition: .2s;
    flex-shrink: 0;
  }
  .fullscreen-btn:hover {
    background: rgba(0,229,255,.2);
    border-color: #00e5ff;
    box-shadow: 0 0 15px rgba(0,229,255,.3);
  }
  .fullscreen-btn svg { width: 16px; height: 16px; fill: currentColor; }

  /* Заголовок */
  .history-title {
    text-align: center;
    margin-bottom: 28px;
  }
  .history-title h1 {
    font-size: 26px;
    font-weight: 900;
    letter-spacing: 0.5px;
    line-height: 1.2;
    margin-bottom: 6px;
  }
  .history-title .sub {
    font-size: 13px;
    color: #8fa2b8;
    font-weight: 600;
  }

  /* Лента */
  .history-wrap {
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 10px 0;
    overflow: hidden;
    position: relative;
    min-height: 84px;
  }

  .history-track {
    display: flex;
    gap: 12px;
    transition: transform .5s cubic-bezier(.4, 0, .2, 1);
    will-change: transform;
  }

  .history-ball {
    width: 64px;
    height: 64px;
    flex-shrink: 0;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    font-weight: 900;
    color: #fff;
    border: 2px solid rgba(255,255,255,.12);
    transition: transform .3s;
    cursor: default;
    position: relative;
  }
  .history-ball:hover { transform: scale(1.08); }
  .history-ball.red {
    background: linear-gradient(135deg, #ff4d4d, #c0392b);
    box-shadow: 0 6px 20px rgba(255,77,77,.4), inset 0 2px 4px rgba(255,255,255,.2);
  }
  .history-ball.black {
    background: linear-gradient(135deg, #3a3a3a, #000);
    box-shadow: 0 6px 20px rgba(0,0,0,.6), inset 0 2px 4px rgba(255,255,255,.1);
  }
  .history-ball.green {
    background: linear-gradient(135deg, #3fbf7f, #1e7a4a);
    box-shadow: 0 6px 20px rgba(63,191,127,.4), inset 0 2px 4px rgba(255,255,255,.2);
  }

  .history-ball.new {
    animation: ballDrop .6s cubic-bezier(.34, 1.56, .64, 1);
  }
  @keyframes ballDrop {
    0% { transform: translateX(-80px) scale(0) rotate(-180deg); opacity: 0; }
    60% { transform: translateX(8px) scale(1.15) rotate(10deg); opacity: 1; }
    100% { transform: translateX(0) scale(1) rotate(0deg); opacity: 1; }
  }

  .history-ball.new::after {
    content: '';
    position: absolute;
    inset: -4px;
    border-radius: 50%;
    background: inherit;
    opacity: 0;
    animation: glowPulse .8s ease-out;
    z-index: -1;
  }
  @keyframes glowPulse {
    0% { opacity: .8; transform: scale(1); }
    100% { opacity: 0; transform: scale(1.6); }
  }

  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: #8fa2b8;
    font-size: 13px;
    font-style: italic;
  }

  /* === ПОЛНОЭКРАННЫЙ РЕЖИМ === */
  .fullscreen-active .top-actions { display: none; }
  .fullscreen-active .container {
    max-width: none;
    width: 100%;
    height: 100vh;
    padding: 40px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
  }
  .fullscreen-active .history-title { margin-bottom: 60px; }
  .fullscreen-active .history-title h1 { font-size: 64px; }
  .fullscreen-active .history-title .sub { font-size: 22px; }
  .fullscreen-active .history-wrap { width: 100%; min-height: 180px; }
  .fullscreen-active .history-track { gap: 24px; }
  .fullscreen-active .history-ball {
    width: 140px;
    height: 140px;
    font-size: 48px;
    border-width: 4px;
  }
  .fullscreen-active .history-ball:hover { transform: none; }

  @media (max-width: 700px) {
    body { padding: 12px; }
    .history-title h1 { font-size: 20px; }
    .history-title .sub { font-size: 12px; }
    .history-ball { width: 48px; height: 48px; font-size: 16px; }
    .history-track { gap: 8px; }
    .history-wrap { min-height: 64px; }
    .top-actions { margin-bottom: 20px; }
    .fullscreen-btn { padding: 8px 14px; font-size: 12px; }
    .back-btn { padding: 8px 14px; font-size: 12px; }
  }
  @media (max-width: 500px) {
    .history-ball { width: 42px; height: 42px; font-size: 14px; }
    .history-track { gap: 6px; }
    .history-title h1 { font-size: 18px; }
  }
</style>
</head>
<body>

<div class="container">

  <div class="top-actions">
    <a href="/" class="back-btn">← На главную</a>
    <button class="fullscreen-btn" onclick="toggleFullscreen()">
      <svg viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
      <span id="fsBtnText">На весь экран</span>
    </button>
  </div>

  <div class="history-title">
    <h1>История выпадений</h1>
    <div class="sub">Последние <span style="color:#00e5ff;font-weight:800;">10</span> раундов</div>
  </div>

  <div class="history-wrap">
    <div class="history-track" id="historyTrack"></div>
  </div>
  <div class="empty-state" id="emptyState" style="display:none;">Пока нет выпадений</div>

</div>

<script>
let lastFirstId = null;

/* === ПОЛНОЭКРАННЫЙ РЕЖИМ === */
function toggleFullscreen() {
  const doc = document.documentElement;

  if (!document.fullscreenElement && !document.webkitFullscreenElement) {
    // Заходим в полноэкранный режим
    if (doc.requestFullscreen) {
      doc.requestFullscreen().catch(() => {
        // Fallback для iOS Safari — просто разворачиваем на весь экран через CSS
        activateCssFullscreen();
      });
    } else if (doc.webkitRequestFullscreen) {
      doc.webkitRequestFullscreen();
    } else {
      // Браузер не поддерживает — включаем CSS-режим
      activateCssFullscreen();
    }
  } else {
    // Выходим из полноэкранного режима
    if (document.exitFullscreen) {
      document.exitFullscreen();
    } else if (document.webkitExitFullscreen) {
      document.webkitExitFullscreen();
    }
    deactivateCssFullscreen();
  }
}

function activateCssFullscreen() {
  document.body.classList.add('fullscreen-active');
  document.getElementById('fsBtnText').textContent = 'Выйти';
  // На iOS Safari — прячем адресную строку скроллом
  setTimeout(() => window.scrollTo(0, 1), 100);
}

function deactivateCssFullscreen() {
  document.body.classList.remove('fullscreen-active');
  document.getElementById('fsBtnText').textContent = 'На весь экран';
}

/* Следим за сменой состояния fullscreen (в т.ч. по Esc) */
document.addEventListener('fullscreenchange', () => {
  if (document.fullscreenElement) {
    document.getElementById('fsBtnText').textContent = 'Выйти';
    document.body.classList.add('fullscreen-active');
  } else {
    deactivateCssFullscreen();
  }
});
document.addEventListener('webkitfullscreenchange', () => {
  if (document.webkitFullscreenElement) {
    document.getElementById('fsBtnText').textContent = 'Выйти';
    document.body.classList.add('fullscreen-active');
  } else {
    deactivateCssFullscreen();
  }
});

/* === ИСТОРИЯ === */
async function loadHistory() {
  try {
    const r = await fetch('/api/roulette/history?limit=10', { cache: 'no-store' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const list = await r.json();

    const track = document.getElementById('historyTrack');
    const empty = document.getElementById('emptyState');

    if (!Array.isArray(list) || list.length === 0) {
      track.innerHTML = '';
      if (empty) empty.style.display = 'block';
      return;
    }

    if (empty) empty.style.display = 'none';

    const firstId = list[0].id;
    const isNew = lastFirstId !== null && firstId !== lastFirstId;

    track.innerHTML = list.map((x, i) => {
      const colorClass = x.result_color === 'red' ? 'red' : x.result_color === 'black' ? 'black' : 'green';
      const newClass = (i === 0 && isNew) ? ' new' : '';
      return `<div class="history-ball ${colorClass}${newClass}" title="${x.result_color === 'red' ? 'Красное' : x.result_color === 'black' ? 'Чёрное' : 'Зеро'}">${x.result_number}</div>`;
    }).join('');

    if (isNew) {
      const ballWidth = track.children[0]?.offsetWidth || 64;
      const gap = document.body.classList.contains('fullscreen-active') ? 24 : 12;
      track.style.transform = 'translateX(' + (ballWidth + gap) + 'px)';
      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          track.style.transform = 'translateX(0)';
        });
      });
    }

    lastFirstId = firstId;
  } catch (e) {
    console.warn('loadHistory error:', e);
  }
}

loadHistory();
setInterval(loadHistory, 10000);
</script>

</body>
</html>
