<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0b0e14">
<title>KINGWIN — История рулетки</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-main: #0b0e14; --bg-panel: #151922; --bg-card: #1a1f2b;
    --accent: #00e5ff;
    --text-main: #fff; --text-muted: #8b92a5;
    --red: #ff4d4d; --green: #3fbf7f; --gold: #f1c40f;
    --border: rgba(255,255,255,0.05);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Montserrat', sans-serif; -webkit-tap-highlight-color: transparent; }
  body { background: radial-gradient(circle at top left, #1a2332, #0a0d14); color: var(--text-main); min-height: 100dvh; padding: 20px; }

  .container { max-width: 1200px; margin: 0 auto; }

  .top-actions {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
    gap: 10px;
  }

  .back-btn {
    display: inline-flex; align-items: center; gap: 8px;
    background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.15);
    color: #a0aec0; padding: 10px 18px; border-radius: 10px;
    text-decoration: none; font-size: 13px; font-weight: 700;
    transition: .2s;
  }
  .back-btn:hover { border-color: #00e5ff; color: #00e5ff; }

  .fullscreen-btn {
    display: inline-flex; align-items: center; justify-content: center;
    gap: 8px;
    background: rgba(0,229,255,.1);
    border: 1px solid rgba(0,229,255,.4);
    color: #00e5ff;
    padding: 10px 18px;
    border-radius: 10px;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
    transition: .2s;
    flex-shrink: 0;
  }
  .fullscreen-btn:hover {
    background: rgba(0,229,255,.2);
    border-color: #00e5ff;
    box-shadow: 0 0 15px rgba(0,229,255,.3);
  }
  .fullscreen-btn svg { width: 16px; height: 16px; fill: currentColor; }

  /* === БАННЕР === */
  .hero-banner {
    position: relative;
    width: 100%;
    border-radius: 20px;
    overflow: hidden;
    margin-bottom: 24px;
    background: linear-gradient(135deg, #1c2230, #0f1219);
    border: 1px solid var(--border);
    min-height: 240px;
    display: flex;
    align-items: center;
  }
  .hero-banner img.bg-img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center 30%;
    z-index: 1;
  }
  .hero-banner .overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(90deg, rgba(11,14,20,0.85) 0%, rgba(11,14,20,0.4) 50%, transparent 100%);
    z-index: 2;
  }
  .hero-content {
    position: relative;
    z-index: 3;
    padding: 40px;
    max-width: 500px;
  }
  .hero-content h1 {
    font-size: 36px;
    font-weight: 900;
    color: #fff;
    line-height: 1.15;
    margin-bottom: 10px;
    text-shadow: 0 2px 10px rgba(0,0,0,0.8);
  }
  .hero-content p {
    font-size: 16px;
    font-weight: 600;
    color: #d0d5e0;
    line-height: 1.4;
    text-shadow: 0 2px 5px rgba(0,0,0,0.8);
  }

  /* === СЕТКА === */
  .main-grid {
    display: grid;
    grid-template-columns: 1fr 340px;
    gap: 20px;
    align-items: start;
  }

  /* === ИСТОРИЯ === */
  .history-block {
    background: rgba(18,24,38,.85);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 28px;
    backdrop-filter: blur(10px);
  }
  .history-title {
    text-align: center;
    margin-bottom: 24px;
  }
  .history-title h2 {
    font-size: 24px;
    font-weight: 900;
    letter-spacing: 0.5px;
    line-height: 1.2;
    margin-bottom: 6px;
    color: var(--accent);
  }
  .history-title .sub {
    font-size: 13px;
    color: #8fa2b8;
    font-weight: 600;
  }

  .history-wrap {
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 10px 0;
    overflow: hidden;
    position: relative;
    min-height: 84px;
  }

  .history-track {
    display: flex;
    gap: 12px;
    transition: transform .5s cubic-bezier(.4, 0, .2, 1);
    will-change: transform;
  }

  .history-ball {
    width: 60px;
    height: 60px;
    flex-shrink: 0;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    font-weight: 900;
    color: #fff;
    border: 2px solid rgba(255,255,255,.12);
    transition: transform .3s;
    cursor: default;
    position: relative;
  }
  .history-ball:hover { transform: scale(1.08); }
  .history-ball.red {
    background: linear-gradient(135deg, #ff4d4d, #c0392b);
    box-shadow: 0 6px 20px rgba(255,77,77,.4), inset 0 2px 4px rgba(255,255,255,.2);
  }
  .history-ball.black {
    background: linear-gradient(135deg, #3a3a3a, #000);
    box-shadow: 0 6px 20px rgba(0,0,0,.6), inset 0 2px 4px rgba(255,255,255,.1);
  }
  .history-ball.green {
    background: linear-gradient(135deg, #3fbf7f, #1e7a4a);
    box-shadow: 0 6px 20px rgba(63,191,127,.4), inset 0 2px 4px rgba(255,255,255,.2);
  }
  .history-ball.new {
    animation: ballDrop .6s cubic-bezier(.34, 1.56, .64, 1);
  }
  @keyframes ballDrop {
    0% { transform: translateX(-80px) scale(0) rotate(-180deg); opacity: 0; }
    60% { transform: translateX(8px) scale(1.15) rotate(10deg); opacity: 1; }
    100% { transform: translateX(0) scale(1) rotate(0deg); opacity: 1; }
  }
  .history-ball.new::after {
    content: '';
    position: absolute;
    inset: -4px;
    border-radius: 50%;
    background: inherit;
    opacity: 0;
    animation: glowPulse .8s ease-out;
    z-index: -1;
  }
  @keyframes glowPulse {
    0% { opacity: .8; transform: scale(1); }
    100% { opacity: 0; transform: scale(1.6); }
  }

  .empty-state {
    text-align: center;
    padding: 40px 20px;
    color: #8fa2b8;
    font-size: 13px;
    font-style: italic;
  }

  /* === ТУРНИР === */
  .tournament-banner {
    background: linear-gradient(135deg, rgba(241,196,15,.18), rgba(255,77,77,.08));
    border: 2px solid rgba(241,196,15,.5);
    border-radius: 20px;
    padding: 22px;
    display: flex;
    flex-direction: column;
    position: relative;
    overflow: hidden;
    cursor: pointer;
    transition: .3s;
    min-height: 320px;
    text-decoration: none;
    color: #fff;
  }
  .tournament-banner:hover {
    border-color: #f1c40f;
    transform: translateY(-3px);
    box-shadow: 0 12px 40px rgba(241,196,15,.3);
  }
  .tournament-banner::before {
    content: '🏆';
    position: absolute;
    top: 10px; right: 15px;
    font-size: 80px;
    opacity: .15;
    transform: rotate(15deg);
    pointer-events: none;
  }
  .tournament-banner .t-label {
    font-size: 11px;
    color: #f1c40f;
    text-transform: uppercase;
    letter-spacing: 2px;
    font-weight: 800;
    margin-bottom: 6px;
  }
  .tournament-banner .t-title {
    font-size: 20px;
    font-weight: 900;
    line-height: 1.2;
    margin-bottom: 6px;
    color: #fff;
  }
  .tournament-banner .t-prize {
    font-size: 40px;
    font-weight: 900;
    color: #f1c40f;
    line-height: 1;
    margin-bottom: 4px;
    text-shadow: 0 0 20px rgba(241,196,15,.5);
  }
  .tournament-banner .t-sub {
    font-size: 11px;
    color: #d0d5e0;
    margin-bottom: 14px;
  }
  .tournament-banner .t-info {
    display: flex;
    flex-direction: column;
    gap: 6px;
    margin-bottom: 14px;
  }
  .tournament-banner .t-info-row {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    padding: 6px 10px;
    background: rgba(0,0,0,.3);
    border-radius: 8px;
  }
  .tournament-banner .t-info-row span:first-child { color: #8fa2b8; }
  .tournament-banner .t-info-row b { color: #fff; }
  .tournament-banner .t-timer {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: auto;
    padding: 10px 14px;
    background: rgba(255,77,77,.15);
    border: 1px solid rgba(255,77,77,.4);
    border-radius: 10px;
    font-size: 12px;
    font-weight: 800;
    color: #ff8a8a;
  }
  .tournament-banner .t-timer .t-dot {
    width: 8px; height: 8px;
    background: #ff4d4d;
    border-radius: 50%;
    animation: pulseDot 1.5s infinite;
    flex-shrink: 0;
  }
  @keyframes pulseDot {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: .5; transform: scale(1.3); }
  }

  /* === ПОЛНОЭКРАННЫЙ РЕЖИМ — ВСЁ ВИДНО === */
  .fullscreen-active body,
  body.fullscreen-active { padding: 20px; }
  body.fullscreen-active .container { max-width: none; width: 100%; }
  body.fullscreen-active .top-actions { display: none; }
  body.fullscreen-active .hero-banner { min-height: 220px; border-radius: 24px; margin-bottom: 24px; }
  body.fullscreen-active .hero-content h1 { font-size: 42px; }
  body.fullscreen-active .hero-content p { font-size: 18px; }
  body.fullscreen-active .main-grid { grid-template-columns: 1fr 380px; gap: 24px; }
  body.fullscreen-active .history-block { padding: 40px; }
  body.fullscreen-active .history-title h2 { font-size: 36px; }
  body.fullscreen-active .history-title .sub { font-size: 16px; }
  body.fullscreen-active .history-wrap { min-height: 140px; }
  body.fullscreen-active .history-track { gap: 18px; }
  body.fullscreen-active .history-ball { width: 100px; height: 100px; font-size: 34px; border-width: 3px; }
  body.fullscreen-active .tournament-banner { min-height: 420px; padding: 32px; }
  body.fullscreen-active .tournament-banner .t-title { font-size: 28px; }
  body.fullscreen-active .tournament-banner .t-prize { font-size: 64px; }
  body.fullscreen-active .tournament-banner .t-sub { font-size: 14px; }
  body.fullscreen-active .tournament-banner .t-info-row { font-size: 14px; padding: 10px 14px; }
  body.fullscreen-active .tournament-banner .t-timer { font-size: 14px; padding: 14px 18px; }

  @media (max-width: 900px) {
    .main-grid { grid-template-columns: 1fr; }
    .tournament-banner { min-height: auto; }
    .hero-content { padding: 28px; }
    .hero-content h1 { font-size: 26px; }
    .hero-content p { font-size: 14px; }
  }

  @media (max-width: 600px) {
    body { padding: 12px; }
    .hero-banner { min-height: 180px; border-radius: 16px; }
    .hero-content { padding: 20px; }
    .hero-content h1 { font-size: 20px; }
    .hero-content p { font-size: 12px; }
    .history-block { padding: 20px 16px; border-radius: 16px; }
    .history-title h2 { font-size: 20px; }
    .history-title .sub { font-size: 12px; }
    .history-ball { width: 44px; height: 44px; font-size: 15px; }
    .history-track { gap: 8px; }
    .history-wrap { min-height: 64px; }
    .top-actions { margin-bottom: 14px; }
    .fullscreen-btn { padding: 8px 14px; font-size: 12px; }
    .back-btn { padding: 8px 14px; font-size: 12px; }
  }
  @media (max-width: 500px) {
    .history-ball { width: 40px; height: 40px; font-size: 13px; }
    .history-track { gap: 6px; }
  }
</style>
</head>
<body>

<div class="container">

  <div class="top-actions">
    <a href="/" class="back-btn">← На главную</a>
    <button class="fullscreen-btn" onclick="toggleFullscreen()">
      <svg viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
      <span id="fsBtnText">На весь экран</span>
    </button>
  </div>

  <div class="hero-banner">
    <img src="/main_banner.jpg" class="bg-img" alt="KINGWIN Bonus" onerror="this.style.display='none'">
    <div class="overlay"></div>
    <div class="hero-content">
      <h1>Удачи в раундах! 🍀</h1>
      <p>История последних выпадений рулетки — следи за числами и лови свою удачу.</p>
    </div>
  </div>

  <div class="main-grid">

    <div class="history-block">
      <div class="history-title">
        <h2>История выпадений</h2>
        <div class="sub">Последние <span style="color:#00e5ff;font-weight:800;">10</span> раундов</div>
      </div>
      <div class="history-wrap">
        <div class="history-track" id="historyTrack"></div>
      </div>
      <div class="empty-state" id="emptyState" style="display:none;">Пока нет выпадений</div>
    </div>

    <a href="/tournament.html" class="tournament-banner">
      <div class="t-label">🏆 Турнир</div>
      <div class="t-title" id="tTitle">Розыгрыш недели</div>
      <div class="t-prize" id="tPrize">100 ₽</div>
      <div class="t-sub">бонусными фишками · вейджер x3</div>
      <div class="t-info">
        <div class="t-info-row"><span>Вход</span><b style="color:#3fbf7f;">Бесплатный</b></div>
        <div class="t-info-row"><span>Условие</span><b>5 ставок от 30₽</b></div>
        <div class="t-info-row"><span>Участников</span><b id="tParticipants">—</b></div>
      </div>
      <div class="t-timer">
        <span class="t-dot"></span>
        <span id="tTimerText">Загрузка...</span>
      </div>
    </a>

  </div>

</div>

<script>
let lastFirstId = null;

/* === ПОЛНОЭКРАННЫЙ РЕЖИМ === */
function toggleFullscreen() {
  const doc = document.documentElement;
  if (!document.fullscreenElement && !document.webkitFullscreenElement) {
    if (doc.requestFullscreen) {
      doc.requestFullscreen().catch(() => activateCssFullscreen());
    } else if (doc.webkitRequestFullscreen) {
      doc.webkitRequestFullscreen();
    } else {
      activateCssFullscreen();
    }
  } else {
    if (document.exitFullscreen) document.exitFullscreen();
    else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
    deactivateCssFullscreen();
  }
}
function activateCssFullscreen() {
  document.body.classList.add('fullscreen-active');
  document.getElementById('fsBtnText').textContent = 'Выйти';
  setTimeout(() => window.scrollTo(0, 1), 100);
}
function deactivateCssFullscreen() {
  document.body.classList.remove('fullscreen-active');
  document.getElementById('fsBtnText').textContent = 'На весь экран';
}
document.addEventListener('fullscreenchange', () => {
  if (document.fullscreenElement) {
    document.getElementById('fsBtnText').textContent = 'Выйти';
    document.body.classList.add('fullscreen-active');
  } else {
    deactivateCssFullscreen();
  }
});
document.addEventListener('webkitfullscreenchange', () => {
  if (document.webkitFullscreenElement) {
    document.getElementById('fsBtnText').textContent = 'Выйти';
    document.body.classList.add('fullscreen-active');
  } else {
    deactivateCssFullscreen();
  }
});

/* === ИСТОРИЯ === */
async function loadHistory() {
  try {
    const r = await fetch('/api/roulette/history?limit=10', { cache: 'no-store' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const list = await r.json();

    const track = document.getElementById('historyTrack');
    const empty = document.getElementById('emptyState');

    if (!Array.isArray(list) || list.length === 0) {
      track.innerHTML = '';
      if (empty) empty.style.display = 'block';
      return;
    }

    if (empty) empty.style.display = 'none';

    const firstId = list[0].id;
    const isNew = lastFirstId !== null && firstId !== lastFirstId;

    track.innerHTML = list.map((x, i) => {
      const colorClass = x.result_color === 'red' ? 'red' : x.result_color === 'black' ? 'black' : 'green';
      const newClass = (i === 0 && isNew) ? ' new' : '';
      return `<div class="history-ball ${colorClass}${newClass}" title="${x.result_color === 'red' ? 'Красное' : x.result_color === 'black' ? 'Чёрное' : 'Зеро'}">${x.result_number}</div>`;
    }).join('');

    if (isNew) {
      const ballWidth = track.children[0]?.offsetWidth || 60;
      const gap = document.body.classList.contains('fullscreen-active') ? 18 : 12;
      track.style.transform = 'translateX(' + (ballWidth + gap) + 'px)';
      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          track.style.transform = 'translateX(0)';
        });
      });
    }

    lastFirstId = firstId;
  } catch (e) {
    console.warn('loadHistory error:', e);
  }
}

/* === ТУРНИР === */
async function loadTournament() {
  try {
    const r = await fetch('/api/tournament/active', { cache: 'no-store' });
    const data = await r.json();
    if (!data || !data.tournament) {
      document.getElementById('tTitle').textContent = 'Скоро новый турнир';
      document.getElementById('tPrize').textContent = '—';
      document.getElementById('tParticipants').textContent = '—';
      document.getElementById('tTimerText').textContent = 'Ожидание';
      return;
    }
    const t = data.tournament;
    document.getElementById('tTitle').textContent = t.title || 'Розыгрыш недели';
    document.getElementById('tPrize').textContent = t.prize_pool + ' ₽';
    document.getElementById('tParticipants').textContent = data.participants || 0;
    if (t.end_at) {
      const end = new Date(t.end_at).getTime();
      const nowT = Date.now();
      const diff = Math.max(0, end - nowT);
      const days = Math.floor(diff / (1000 * 60 * 60 * 24));
      const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      const mins = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
      document.getElementById('tTimerText').textContent =
        diff <= 0 ? 'Завершён' : (days > 0 ? `До конца: ${days}д ${hours}ч` : `До конца: ${hours}ч ${mins}м`);
    }
  } catch(e) {
    document.getElementById('tTimerText').textContent = 'Турнир';
  }
}

loadHistory();
loadTournament();
setInterval(loadHistory, 10000);
setInterval(loadTournament, 30000);
</script>

</body>
</html>
