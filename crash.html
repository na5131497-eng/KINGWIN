<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>KINGWIN — Crash</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root { --bg-main: #090a10; --bg-panel: #181a24; --bg-dark: #11121a; --accent: #00e5ff; --accent-green: #00ff88; --text-main: #fff; --text-muted: #8b92a5; --border: rgba(255,255,255,0.06); --red: #ff4d4d; --yellow: #f1c40f; --gold: #ffd700; }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Montserrat', sans-serif; }
  html, body { height: 100%; }
  body { background: var(--bg-main); color: var(--text-main); height: 100vh; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }

  .float-menu-btn { position: fixed; top: 15px; left: 15px; z-index: 1000; background: #181a24; border: 1px solid #00e5ff; color: #00e5ff; width: 44px; height: 44px; border-radius: 10px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 24px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); transition: 0.3s; }
  .float-menu-btn:hover { background: rgba(0,229,255,0.1); transform: scale(1.05); }
  .float-menu { position: fixed; top: 15px; left: 70px; z-index: 999; background: rgba(17,18,26,0.95); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; padding: 10px; display: flex; flex-direction: column; gap: 6px; width: 180px; box-shadow: 0 10px 30px rgba(0,0,0,0.6); transform: translateX(-20px); opacity: 0; pointer-events: none; transition: 0.3s; }
  .float-menu.show { transform: translateX(0); opacity: 1; pointer-events: auto; }
  .float-menu a { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 10px; text-decoration: none; color: #8b92a5; font-size: 12px; font-weight: 700; transition: 0.2s; text-transform: uppercase; border: 1px solid transparent; }
  .float-menu a:hover { background: rgba(0,229,255,0.1); color: #00e5ff; border-color: rgba(0,229,255,0.3); }
  .float-menu a svg { width: 18px; height: 18px; fill: currentColor; }

  .topbar { display: flex; justify-content: space-between; align-items: center; padding: 10px 16px; padding-left: 70px; background: var(--bg-panel); border-bottom: 1px solid var(--border); flex-shrink: 0; z-index: 100; }
  .topbar-logo { font-size: 18px; font-weight: 900; letter-spacing: 2px; background: linear-gradient(135deg, #00e5ff, #0077ff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; flex-shrink: 0; }
  .balance-badge { display: flex; align-items: center; gap: 6px; background: rgba(0,0,0,0.5); border: 1px solid rgba(0,229,255,0.35); padding: 6px 12px; border-radius: 20px; font-size: 12px; font-weight: 700; transition: 0.3s; white-space: nowrap; }
  .balance-badge .lbl { color: var(--text-muted); font-weight: 600; font-size: 10px; text-transform: uppercase; letter-spacing: 1px; }
  .balance-badge .val { color: var(--accent); font-weight: 900; font-size: 13px; }

  .crash-layout { display: flex; width: 100%; flex: 1; min-height: 0; padding: 16px; gap: 16px; max-width: 1400px; margin: 0 auto; overflow: hidden; }
  .sidebar-bets { width: 320px; background: var(--bg-panel); border: 1px solid var(--border); border-radius: 20px; display: flex; flex-direction: column; flex-shrink: 0; overflow: hidden; }
  .bets-header { display: grid; grid-template-columns: 2.2fr 1fr 1fr 1.3fr; padding: 10px 14px; font-size: 10px; color: var(--text-muted); font-weight: 700; text-transform: uppercase; border-bottom: 1px solid var(--border); }
  .bets-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; }
  .bet-row { display: grid; grid-template-columns: 2.2fr 1fr 1fr 1.3fr; padding: 10px 14px; align-items: center; font-size: 12px; border-bottom: 1px solid rgba(255,255,255,0.02); }
  .bet-user { display: flex; align-items: center; gap: 8px; font-weight: 600; min-width: 0; }
  .user-avatar { width: 24px; height: 24px; border-radius: 50%; background: linear-gradient(135deg, #00e5ff, #0077ff); display: flex; justify-content: center; align-items: center; font-size: 9px; font-weight: 900; color: #fff; flex-shrink: 0; }
  .user-name { font-weight: 700; font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bet-amount { color: var(--text-muted); font-weight: 600; font-size: 11px; }
  .bet-mult { display: inline-block; padding: 2px 6px; border-radius: 6px; font-weight: 800; font-size: 11px; text-align: center; }
  .bet-mult.win { background: rgba(63,191,127,0.2); color: var(--accent-green); }
  .bet-cashout { text-align: right; font-weight: 800; color: var(--accent-green); font-size: 11px; }

  .game-area { flex: 1; display: flex; flex-direction: column; gap: 12px; min-width: 0; min-height: 0; }
  .history-bar { display: flex; align-items: center; gap: 10px; background: var(--bg-panel); border: 1px solid var(--border); border-radius: 20px; padding: 10px 16px; flex-shrink: 0; }
  .history-title { font-size: 12px; font-weight: 700; color: var(--text-muted); margin-right: 6px; flex-shrink: 0; }
  .history-list { display: flex; gap: 6px; overflow-x: auto; flex: 1; scrollbar-width: none; }
  .history-item { padding: 5px 12px; border-radius: 20px; font-size: 12px; font-weight: 800; flex-shrink: 0; }
  .history-item.red { background: rgba(255,77,77,0.2); color: #ff8a8a; border: 1px solid rgba(255,77,77,0.45); }
  .history-item.blue { background: rgba(0,119,255,0.2); color: #66b3ff; border: 1px solid rgba(0,119,255,0.45); }
  .history-item.purple { background: rgba(168,85,247,0.2); color: #d8b4fe; border: 1px solid rgba(168,85,247,0.45); }
  .history-item.gold { background: rgba(241,196,15,0.2); color: #ffe066; border: 1px solid rgba(241,196,15,0.55); box-shadow: 0 0 10px rgba(241,196,15,0.35); }

  .canvas-container { flex: 1; background: linear-gradient(180deg, #131624, #090a10); border: 1px solid var(--border); border-radius: 20px; position: relative; overflow: hidden; display: flex; justify-content: center; align-items: center; box-shadow: inset 0 0 50px rgba(0,0,0,0.5); min-height: 200px; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .multiplier-display { position: absolute; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center; pointer-events: none; }
  .mult-value { font-size: 72px; font-weight: 900; color: #fff; text-shadow: 0 5px 30px rgba(0,229,255,0.4); line-height: 1; transition: color 0.3s, text-shadow 0.3s; }
  .mult-value.crashed { color: var(--red); text-shadow: 0 5px 30px rgba(255,77,77,0.4); }
  .mult-value.golden { color: var(--gold); text-shadow: 0 5px 30px rgba(255,215,0,0.6); }
  .mult-label { font-size: 13px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 2px; margin-top: 10px; font-weight: 700; min-height: 16px; }

  .control-panel { background: var(--bg-panel); border: 1px solid var(--border); border-radius: 20px; padding: 16px; display: flex; gap: 16px; flex-shrink: 0; }
  .bet-box { flex: 1; background: var(--bg-dark); border: 1px solid var(--border); border-radius: 16px; padding: 12px; display: flex; flex-direction: column; gap: 10px; min-width: 0; position: relative; }
  .bet-box.queued { border-color: rgba(0,229,255,0.4); box-shadow: 0 0 18px rgba(0,229,255,0.12); }

  .amount-row { display: flex; gap: 8px; }
  .amount-input-wrap { flex: 1; display: flex; align-items: center; background: rgba(0,0,0,0.4); border: 1px solid var(--border); border-radius: 12px; padding: 4px; min-width: 0; }
  .amount-input-wrap button { width: 36px; height: 36px; border-radius: 8px; background: rgba(255,255,255,0.05); border: none; color: #fff; font-size: 18px; cursor: pointer; font-weight: 700; transition: 0.2s; flex-shrink: 0; }
  .amount-input-wrap button:hover { background: rgba(255,255,255,0.1); }
  .amount-input-wrap input { flex: 1; min-width: 0; background: transparent; border: none; color: #fff; text-align: center; font-size: 18px; font-weight: 800; outline: none; font-family: inherit; }
  .amount-input-wrap input:disabled { opacity: 0.6; cursor: not-allowed; }

  .btn-action { flex: 1; border: none; border-radius: 12px; font-size: 16px; font-weight: 900; cursor: pointer; text-transform: uppercase; letter-spacing: 1px; transition: 0.2s; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.2; min-width: 0; padding: 8px 10px; }
  .btn-action .subtext { font-size: 11px; font-weight: 600; opacity: 0.9; margin-top: 3px; }
  .btn-bet { background: var(--yellow); color: #000; box-shadow: 0 0 20px rgba(241,196,15,0.2); }
  .btn-bet:hover { background: #f7d341; }
  .btn-bet:disabled { opacity: 0.5; cursor: not-allowed; box-shadow: none; }
  .btn-cancel { background: var(--red); color: #fff; box-shadow: 0 0 20px rgba(255,77,77,0.2); }
  .btn-cancel:hover { background: #ff3333; }

  .btn-cashout {
    background: linear-gradient(135deg, #0a1a3a 0%, #1a3a6b 50%, #0a1a3a 100%);
    color: #00e5ff; border: 2px solid #00e5ff;
    box-shadow: 0 0 15px rgba(0,229,255,0.45), 0 0 30px rgba(0,229,255,0.2), inset 0 0 15px rgba(0,229,255,0.08);
    text-shadow: 0 0 10px rgba(0,229,255,0.7);
    animation: cashoutPulse 1.6s ease-in-out infinite;
    position: relative; overflow: hidden;
  }
  .btn-cashout:hover { background: linear-gradient(135deg, #102a5a 0%, #2a5a9b 50%, #102a5a 100%); border-color: #33ebff; color: #33ebff; }
  @keyframes cashoutPulse { 0%, 100% { box-shadow: 0 0 15px rgba(0,229,255,0.45), 0 0 30px rgba(0,229,255,0.2), inset 0 0 15px rgba(0,229,255,0.08); } 50% { box-shadow: 0 0 25px rgba(0,229,255,0.75), 0 0 45px rgba(0,229,255,0.35), inset 0 0 20px rgba(0,229,255,0.15); } }

  .quick-bets { display: flex; gap: 6px; }
  .quick-bets button { flex: 1; background: rgba(255,255,255,0.05); border: 1px solid var(--border); color: var(--text-muted); padding: 6px; border-radius: 8px; font-size: 11px; font-weight: 700; cursor: pointer; }
  .quick-bets button:hover { background: rgba(255,255,255,0.1); color: #fff; }
  .quick-bets button:disabled { opacity: 0.4; cursor: not-allowed; }

  .toast-container { position: fixed; top: 60px; right: 16px; z-index: 9999; display: flex; flex-direction: column; gap: 8px; }
  .toast { background: rgba(24,26,36,0.95); border-left: 4px solid var(--accent); padding: 12px 16px; border-radius: 8px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); min-width: 220px; transform: translateX(120%); transition: transform 0.3s; display: flex; align-items: center; gap: 10px; }
  .toast.show { transform: translateX(0); }
  .toast.success { border-left-color: var(--accent-green); }
  .toast.error { border-left-color: var(--red); }

  .wait-timer { position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%); font-size: 14px; font-weight: 800; color: var(--accent); letter-spacing: 2px; text-transform: uppercase; text-shadow: 0 0 10px rgba(0,229,255,0.5); z-index: 11; }

  @media (max-width: 900px) {
    html, body { height: auto; min-height: 100%; overflow: auto; }
    body { height: auto; min-height: 100dvh; overflow-y: auto; display: block; }
    .topbar { padding: 10px 14px; padding-left: 70px; }
    .balance-badge .lbl { display: none; }
    .crash-layout { display: flex; flex-direction: column; padding: 10px; gap: 10px; max-width: none; min-height: auto; height: auto; overflow: visible; }
    .game-area { flex: none; display: flex; flex-direction: column; gap: 10px; min-height: auto; order: 1; }
    .history-bar { padding: 8px 12px; border-radius: 14px; }
    .history-item { padding: 4px 10px; font-size: 11px; }
    .canvas-container { flex: none; width: 100%; height: 42vh; min-height: 220px; max-height: 340px; border-radius: 16px; }
    .mult-value { font-size: 52px; }
    .control-panel { flex-direction: column; padding: 10px; gap: 10px; border-radius: 16px; }
    .sidebar-bets { width: 100%; height: 260px; min-height: 200px; order: 2; flex-shrink: 0; border-radius: 16px; }
    .toast-container { top: 60px; right: 8px; left: 8px; }
    .toast { min-width: 0; width: 100%; transform: translateY(-120%); }
    .toast.show { transform: translateY(0); }
  }

  @media (max-width: 480px) {
    .crash-layout { padding: 8px; gap: 8px; }
    .canvas-container { height: 38vh; min-height: 200px; max-height: 300px; }
    .mult-value { font-size: 42px; }
    .amount-input-wrap { padding: 3px; }
    .amount-input-wrap button { width: 32px; height: 32px; font-size: 16px; }
    .amount-input-wrap input { font-size: 16px; }
    .btn-action { font-size: 13px; padding: 6px 6px; }
    .btn-action .subtext { font-size: 10px; }
    .quick-bets button { font-size: 10px; padding: 5px 4px; }
    .sidebar-bets { height: 220px; min-height: 180px; }
    .bets-header { padding: 8px 10px; font-size: 9px; }
    .bet-row { padding: 8px 10px; font-size: 11px; }
    .wait-timer { font-size: 12px; bottom: 10px; }
  }
</style>
</head>
<body>

<button class="float-menu-btn" onclick="document.getElementById('floatMenu').classList.toggle('show')">☰</button>
<div class="float-menu" id="floatMenu">
  <a href="/"><svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg> Главная</a>
  <a href="/crash.html"><svg viewBox="0 0 24 24"><path d="M16 6l2.29 2.29-4.88 4.88-4-4L2 16.59 3.41 18l6-6 4 4 6.3-6.29L22 12V6z"/></svg> Crash</a>
</div>

<div class="topbar">
  <div class="topbar-logo">KINGWIN</div>
  <div class="balance-badge">
    <span class="lbl">Баланс</span>
    <span class="val" id="balanceVal">0.00 ₽</span>
  </div>
</div>

<div class="toast-container" id="toastContainer"></div>

<div class="crash-layout">
  <aside class="sidebar-bets">
    <div class="bets-header">
      <div>Игрок</div>
      <div>Ставка</div>
      <div>Множ.</div>
      <div style="text-align:right">Выигрыш</div>
    </div>
    <div class="bets-list" id="betsList"></div>
  </aside>

  <div class="game-area">
    <div class="history-bar">
      <div class="history-title">История</div>
      <div class="history-list" id="historyList"></div>
    </div>

    <div class="canvas-container">
      <canvas id="gameCanvas"></canvas>
      <div class="multiplier-display">
        <div class="mult-value" id="multValue">1.00x</div>
        <div class="mult-label" id="multLabel">Ожидание первой ставки...</div>
      </div>
      <div class="wait-timer" id="waitTimer"></div>
    </div>

    <div class="control-panel">
      <div class="bet-box" id="betBox1">
        <div class="amount-row">
          <div class="amount-input-wrap">
            <button id="btnMinus1" onclick="changeAmount(1, -1)">−</button>
            <input type="number" id="betAmount1" value="10" min="1" max="200">
            <button id="btnPlus1" onclick="changeAmount(1, 1)">+</button>
          </div>
          <button class="btn-action btn-bet" id="btnBet1" onclick="placeBet(1)">
            Ставка
            <div class="subtext" id="subtext1">10 ₽</div>
          </button>
        </div>
        <div class="quick-bets">
          <button onclick="setAmount(1, 10)">10</button>
          <button onclick="setAmount(1, 50)">50</button>
          <button onclick="setAmount(1, 100)">100</button>
          <button onclick="setAmount(1, 200)">200</button>
        </div>
      </div>

      <div class="bet-box" id="betBox2">
        <div class="amount-row">
          <div class="amount-input-wrap">
            <button id="btnMinus2" onclick="changeAmount(2, -1)">−</button>
            <input type="number" id="betAmount2" value="10" min="1" max="200">
            <button id="btnPlus2" onclick="changeAmount(2, 1)">+</button>
          </div>
          <button class="btn-action btn-bet" id="btnBet2" onclick="placeBet(2)">
            Ставка
            <div class="subtext" id="subtext2">10 ₽</div>
          </button>
        </div>
        <div class="quick-bets">
          <button onclick="setAmount(2, 10)">10</button>
          <button onclick="setAmount(2, 50)">50</button>
          <button onclick="setAmount(2, 100)">100</button>
          <button onclick="setAmount(2, 200)">200</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
/* ==================== НАСТРОЙКИ ==================== */
const MIN_BET = 1;
const MAX_BET = 200;
const BETTING_SECONDS = 11;   // ← приём ставок 11 секунд
const CRASH_GROWTH = 1.00006; // скорость роста множителя

/* ==================== СОСТОЯНИЕ ==================== */
let balance = 1000;

// bet[слот] = { amount, cashed } | null
let bets = { 1: null, 2: null };

// queued[слот] = { amount } | null — ставка на следующий раунд
let queued = { 1: null, 2: null };

let round = {
  id: 0,
  status: 'betting',     // 'betting' | 'flying' | 'crashed'
  crashPoint: 1,
  startTime: 0,          // timestamp старта полёта
  bettingEndTime: 0,     // timestamp конца приёма ставок
  elapsed: 0,
  mult: 1
};

let history = [];
let graphPoints = [];

let localCrashTime = 0; // для анимации краша

/* ==================== CANVAS ==================== */
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const multValueEl = document.getElementById('multValue');
const multLabelEl = document.getElementById('multLabel');
const waitTimerEl = document.getElementById('waitTimer');

function resizeCanvas() {
  const p = canvas.parentElement;
  const dpr = window.devicePixelRatio || 1;
  canvas.width = p.clientWidth * dpr;
  canvas.height = p.clientHeight * dpr;
  canvas.style.width = p.clientWidth + 'px';
  canvas.style.height = p.clientHeight + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener('resize', resizeCanvas);
window.addEventListener('orientationchange', () => setTimeout(resizeCanvas, 200));
resizeCanvas();

/* ==================== УТИЛИТЫ ==================== */
function genCrashPoint() {
  // Простая модель: 97% — 1.00–2.00x, 3% — до 10x, редкие — до 50x
  const r = Math.random();
  if (r < 0.5) return 1.00 + Math.random() * 0.5;          // 50%: 1.00–1.50
  if (r < 0.8) return 1.50 + Math.random() * 1.0;          // 30%: 1.50–2.50
  if (r < 0.95) return 2.50 + Math.random() * 2.5;         // 15%: 2.50–5.00
  if (r < 0.99) return 5.00 + Math.random() * 5.0;         // 4%:  5.00–10.00
  return 10.00 + Math.random() * 40.0;                     // 1%:  10–50
}

function historyColorClass(m) {
  if (m >= 10) return 'gold';
  if (m >= 4) return 'purple';
  if (m > 1.50) return 'blue';
  return 'red';
}

/* ==================== ЖИЗНЕННЫЙ ЦИКЛ РАУНДА ==================== */
function startBettingPhase() {
  round.id++;
  round.status = 'betting';
  round.mult = 1;
  round.crashPoint = genCrashPoint();
  round.elapsed = 0;
  round.startTime = 0;
  round.bettingEndTime = Date.now() + BETTING_SECONDS * 1000;
  graphPoints = [];
  localCrashTime = 0;

  // Переносим queued-ставки в активные
  [1, 2].forEach(id => {
    if (queued[id]) {
      bets[id] = { amount: queued[id].amount, cashed: false };
      queued[id] = null;
      balance -= bets[id].amount;
    }
  });

  updateBalanceUI();
  updateBetButtons();
  renderBetsList();
  multLabelEl.textContent = 'Приём ставок...';
  multValueEl.classList.remove('crashed', 'golden');
}

function startFlyingPhase() {
  round.status = 'flying';
  round.startTime = Date.now();
  round.elapsed = 0;
  round.mult = 1;
  graphPoints = [{ x: 0, y: 1 }];
  multLabelEl.textContent = '';
  waitTimerEl.textContent = '';
}

function crashRound() {
  round.status = 'crashed';
  round.mult = round.crashPoint;
  history.unshift(round.crashPoint);
  if (history.length > 20) history.pop();

  // Проигравшие ставки — списываем уже при постановке, тут просто помечаем
  [1, 2].forEach(id => {
    if (bets[id] && !bets[id].cashed) {
      bets[id].lost = true;
    }
  });

  renderHistory();
  renderBetsList();
  updateBetButtons();
}

/* ==================== ГЛАВНЫЙ ЦИКЛ ==================== */
function gameLoop() {
  const now = Date.now();

  if (round.status === 'betting') {
    const left = Math.max(0, Math.ceil((round.bettingEndTime - now) / 1000));
    waitTimerEl.textContent = left + ' сек до старта';
    multValueEl.textContent = '1.00x';
    multValueEl.style.opacity = '0.4';
    if (left <= 0) {
      startFlyingPhase();
    }
  } else if (round.status === 'flying') {
    multValueEl.style.opacity = '1';
    const elapsed = now - round.startTime;
    const mult = Math.pow(CRASH_GROWTH, elapsed);

    if (mult >= round.crashPoint) {
      crashRound();
    } else {
      round.mult = mult;
      round.elapsed = elapsed;
      // добавляем точку в график
      const t = elapsed / 1000;
      const last = graphPoints[graphPoints.length - 1];
      if (!last || t > last.x + 0.05) {
        graphPoints.push({ x: t, y: mult });
        if (graphPoints.length > 2000) graphPoints.shift();
      } else if (last) {
        last.y = mult;
      }
    }
  } else if (round.status === 'crashed') {
    // ждём 2 секунды после краша и запускаем новый приём ставок
    localCrashTime += 16;
    if (localCrashTime >= 2000) {
      startBettingPhase();
    }
  }

  renderMultiplier();
  drawGraph();
  updateBetButtonsLive();
  requestAnimationFrame(gameLoop);
}

/* ==================== РЕНДЕР ==================== */
function renderMultiplier() {
  if (round.status === 'betting') {
    multValueEl.textContent = '1.00x';
    multValueEl.classList.remove('crashed', 'golden');
    multValueEl.style.opacity = '0.4';
  } else if (round.status === 'flying') {
    multValueEl.textContent = round.mult.toFixed(2) + 'x';
    multValueEl.style.opacity = '1';
    multValueEl.classList.toggle('golden', round.mult >= 10);
    multValueEl.classList.remove('crashed');
  } else if (round.status === 'crashed') {
    multValueEl.textContent = round.crashPoint.toFixed(2) + 'x';
    multValueEl.classList.add('crashed');
    multValueEl.classList.remove('golden');
    multValueEl.style.opacity = '1';
    multLabelEl.textContent = 'КРАШ';
  }
}

function drawGraph() {
  const W = canvas.width / (window.devicePixelRatio || 1);
  const H = canvas.height / (window.devicePixelRatio || 1);
  ctx.clearRect(0, 0, W, H);

  ctx.strokeStyle = 'rgba(255,255,255,0.05)';
  ctx.lineWidth = 1;
  for (let i = 0; i < H; i += 60) { ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(W, i); ctx.stroke(); }
  for (let i = 0; i < W; i += 60) { ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, H); ctx.stroke(); }

  if ((round.status === 'flying' || round.status === 'crashed') && graphPoints.length > 1) {
    const paddingL = 30, paddingR = 20, paddingT = 30, paddingB = 30;
    const drawW = W - paddingL - paddingR;
    const drawH = H - paddingT - paddingB;
    const lastX = graphPoints[graphPoints.length - 1].x;
    const maxX = Math.max(3, lastX);
    const maxY = Math.max(round.mult * 1.15, 1.5);

    let lineColor = '#00e5ff';
    let shadowColor = 'rgba(0,229,255,0.5)';
    if (round.status === 'crashed') { lineColor = '#ff4d4d'; shadowColor = 'rgba(255,77,77,0.5)'; }
    else if (round.mult >= 10) { lineColor = '#ffd700'; shadowColor = 'rgba(255,215,0,0.6)'; }

    ctx.beginPath();
    ctx.strokeStyle = lineColor;
    ctx.lineWidth = 3;
    ctx.lineJoin = 'round';
    ctx.shadowBlur = 10;
    ctx.shadowColor = shadowColor;

    for (let i = 0; i < graphPoints.length; i++) {
      const p = graphPoints[i];
      const px = paddingL + (p.x / maxX) * drawW;
      const py = paddingT + drawH - ((p.y - 1) / (maxY - 1)) * drawH;
      if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.stroke();
    ctx.shadowBlur = 0;

    const lastP = graphPoints[graphPoints.length - 1];
    const lx = paddingL + (lastP.x / maxX) * drawW;
    const ly = paddingT + drawH - ((lastP.y - 1) / (maxY - 1)) * drawH;
    ctx.beginPath();
    ctx.fillStyle = lineColor;
    ctx.arc(lx, ly, 5, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 18;
    ctx.shadowColor = shadowColor;
    ctx.beginPath();
    ctx.arc(lx, ly, 5, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
  }
}

function renderHistory() {
  const list = document.getElementById('historyList');
  list.innerHTML = history.map(m => {
    const cls = historyColorClass(m);
    return `<div class="history-item ${cls}">${m.toFixed(2)}x</div>`;
  }).join('');
}

function renderBetsList() {
  const list = document.getElementById('betsList');
  const rows = [];
  [1, 2].forEach(id => {
    const b = bets[id];
    if (b) {
      let multHtml = '--', winHtml = '--', rowClass = '';
      if (b.cashed) {
        multHtml = `<span class="bet-mult win">${b.cashMult.toFixed(2)}x</span>`;
        winHtml = `${(b.amount * b.cashMult).toFixed(2)} ₽`;
      } else if (round.status === 'crashed' || b.lost) {
        multHtml = `<span style="color:#ff4d4d;font-size:10px">проигрыш</span>`;
        winHtml = '--';
      }
      rows.push(`<div class="bet-row">
        <div class="bet-user">
          <div class="user-avatar">ВЫ</div>
          <div class="user-name">Вы (слот ${id})</div>
        </div>
        <div class="bet-amount">${b.amount.toFixed(2)} ₽</div>
        <div>${multHtml}</div>
        <div class="bet-cashout">${winHtml}</div>
      </div>`);
    }
  });
  list.innerHTML = rows.join('') || '<div style="padding:20px;text-align:center;color:#8b92a5;font-size:12px">Нет активных ставок</div>';
}

/* ==================== UI / КНОПКИ ==================== */
function updateBalanceUI() {
  document.getElementById('balanceVal').textContent = balance.toFixed(2) + ' ₽';
}

function updateBetButtons() {
  [1, 2].forEach(id => {
    const btn = document.getElementById('btnBet' + id);
    const input = document.getElementById('betAmount' + id);
    const b = bets[id];
    const q = queued[id];
    const isBetting = round.status === 'betting';
    const isFlying = round.status === 'flying';
    const isCrashed = round.status === 'crashed';

    const locked = !!b || !!q;
    input.disabled = locked;
    document.getElementById('btnMinus' + id).disabled = locked;
    document.getElementById('btnPlus' + id).disabled = locked;

    if (q) {
      btn.className = 'btn-action btn-bet';
      btn.innerHTML = `В очереди <div class="subtext">${q.amount} ₽</div>`;
      btn.disabled = false;
      btn.onclick = () => { queued[id] = null; updateBetButtons(); };
      return;
    }

    if (b && b.cashed) {
      btn.className = 'btn-action btn-bet';
      btn.innerHTML = `Выведено <div class="subtext">✓</div>`;
      btn.disabled = true;
      return;
    }

    if (b && isFlying) {
      btn.className = 'btn-action btn-cashout';
      btn.disabled = false;
      btn.onclick = () => doCashout(id);
      return;
    }

    if (b && isCrashed) {
      btn.className = 'btn-action btn-bet';
      btn.innerHTML = `Проигрыш <div class="subtext">${b.amount} ₽</div>`;
      btn.disabled = true;
      return;
    }

    if (b && isBetting) {
      btn.className = 'btn-action btn-cancel';
      btn.innerHTML = `Отмена <div class="subtext">${b.amount} ₽</div>`;
      btn.disabled = false;
      btn.onclick = () => cancelBet(id);
      return;
    }

    // Свободный слот
    const amt = parseInt(input.value) || MIN_BET;
    if (isBetting) {
      btn.className = 'btn-action btn-bet';
      btn.innerHTML = `Ставка <div class="subtext">${amt} ₽</div>`;
      btn.disabled = false;
      btn.onclick = () => placeBet(id);
    } else {
      btn.className = 'btn-action btn-bet';
      btn.innerHTML = `След. раунд <div class="subtext">${amt} ₽</div>`;
      btn.disabled = false;
      btn.onclick = () => queueBet(id, amt);
    }
  });
}

function updateBetButtonsLive() {
  if (round.status !== 'flying') return;
  [1, 2].forEach(id => {
    const b = bets[id];
    if (!b || b.cashed) return;
    const btn = document.getElementById('btnBet' + id);
    const val = (b.amount * round.mult).toFixed(2);
    const html = `Забрать <div class="subtext">${val} ₽</div>`;
    if (btn.innerHTML !== html) btn.innerHTML = html;
  });
}

/* ==================== ДЕЙСТВИЯ ==================== */
function changeAmount(id, diff) {
  if (bets[id] || queued[id]) return;
  const input = document.getElementById('betAmount' + id);
  let v = (parseInt(input.value) || MIN_BET) + diff;
  v = Math.max(MIN_BET, Math.min(MAX_BET, v));
  input.value = v;
  document.getElementById('subtext' + id).textContent = v + ' ₽';
  updateBetButtons();
}

function setAmount(id, val) {
  if (bets[id] || queued[id]) return;
  val = Math.max(MIN_BET, Math.min(MAX_BET, val));
  document.getElementById('betAmount' + id).value = val;
  document.getElementById('subtext' + id).textContent = val + ' ₽';
  updateBetButtons();
}

function placeBet(id) {
  if (bets[id] || round.status !== 'betting') return;
  const amt = parseInt(document.getElementById('betAmount' + id).value) || MIN_BET;
  if (amt < MIN_BET || amt > MAX_BET) { showToast('Ставка от 1 до 200 ₽', 'error'); return; }
  if (amt > balance) { showToast('Недостаточно средств', 'error'); return; }
  bets[id] = { amount: amt, cashed: false };
  balance -= amt;
  updateBalanceUI();
  updateBetButtons();
  renderBetsList();
  showToast(`Ставка ${amt} ₽ принята`, 'success');
}

function cancelBet(id) {
  if (!bets[id] || round.status !== 'betting') return;
  balance += bets[id].amount;
  bets[id] = null;
  updateBalanceUI();
  updateBetButtons();
  renderBetsList();
  showToast('Ставка отменена', 'info');
}

function queueBet(id, amt) {
  if (bets[id] || round.status === 'betting') return;
  if (amt < MIN_BET || amt > MAX_BET) { showToast('Ставка от 1 до 200 ₽', 'error'); return; }
  if (amt > balance) { showToast('Недостаточно средств', 'error'); return; }
  queued[id] = { amount: amt };
  updateBetButtons();
  showToast(`Ставка ${amt} ₽ на след. раунд`, 'success');
}

function doCashout(id) {
  const b = bets[id];
  if (!b || b.cashed || round.status !== 'flying') return;
  const m = round.mult;
  const win = b.amount * m;
  balance += win;
  b.cashed = true;
  b.cashMult = m;
  updateBalanceUI();
  updateBetButtons();
  renderBetsList();
  showToast(`Выведено ${win.toFixed(2)} ₽ (x${m.toFixed(2)})`, 'success');
}

function showToast(text, type='success') {
  const c = document.getElementById('toastContainer');
  const t = document.createElement('div');
  t.className = `toast ${type}`;
  t.innerHTML = `<div style="font-size:13px;font-weight:600;color:#fff">${text}</div>`;
  c.appendChild(t);
  setTimeout(() => t.classList.add('show'), 10);
  setTimeout(() => { t.classList.remove('show'); setTimeout(() => t.remove(), 300); }, 3000);
}

/* ==================== СТАРТ ==================== */
updateBalanceUI();
startBettingPhase();
requestAnimationFrame(gameLoop);
</script>
