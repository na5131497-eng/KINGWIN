<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>KINGWIN — Crash</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-main: #090a10;
    --bg-panel: #181a24;
    --bg-dark: #11121a;
    --accent: #00e5ff;
    --accent-green: #00ff88;
    --text-main: #ffffff;
    --text-muted: #8b92a5;
    --border: rgba(255,255,255,0.06);
    --red: #ff4d4d;
    --blue: #0077ff;
    --purple: #a855f7;
    --gold: #f1c40f;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Montserrat', sans-serif; }
  body { background: var(--bg-main); color: var(--text-main); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
  
  /* HEADER */
  .header { height: 60px; background: var(--bg-panel); border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; padding: 0 20px; flex-shrink: 0; }
  .back-btn { background: rgba(255,255,255,0.05); border: 1px solid var(--border); color: #fff; padding: 8px 15px; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 13px; text-decoration: none; transition: 0.3s; }
  .back-btn:hover { background: rgba(255,255,255,0.1); }
  .user-info { display: flex; align-items: center; gap: 10px; }
  .user-id { font-size: 12px; color: var(--text-muted); font-weight: 600; }
  .balance { background: rgba(0,0,0,0.4); border: 1px solid var(--border); padding: 8px 16px; border-radius: 20px; font-size: 16px; font-weight: 800; color: var(--accent-green); }

  /* LAYOUT */
  .crash-layout { display: flex; width: 100%; flex: 1; padding: 15px; gap: 15px; max-width: 1400px; margin: 0 auto; overflow: hidden; }
  
  /* LEFT SIDEBAR (История ставок) */
  .sidebar-bets { width: 320px; background: var(--bg-panel); border: 1px solid var(--border); border-radius: 20px; display: flex; flex-direction: column; flex-shrink: 0; overflow: hidden; }
  
  .tabs { display: flex; padding: 15px; gap: 10px; border-bottom: 1px solid var(--border); background: var(--bg-dark); }
  .tab-btn { flex: 1; background: transparent; border: none; color: var(--text-muted); font-size: 12px; font-weight: 700; padding: 8px 0; cursor: pointer; border-radius: 8px; transition: 0.2s; text-transform: uppercase; }
  .tab-btn.active { background: rgba(255,255,255,0.1); color: #fff; }
  
  .bets-header { display: grid; grid-template-columns: 2fr 1fr 1fr 1.5fr; padding: 10px 15px; font-size: 11px; color: var(--text-muted); font-weight: 700; text-transform: uppercase; border-bottom: 1px solid var(--border); }
  
  .bets-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; }
  .bet-row { display: grid; grid-template-columns: 2fr 1fr 1fr 1.5fr; padding: 12px 15px; align-items: center; font-size: 13px; border-bottom: 1px solid rgba(255,255,255,0.02); }
  .bet-row:hover { background: rgba(255,255,255,0.03); }
  .bet-user { display: flex; align-items: center; gap: 8px; font-weight: 600; }
  .user-avatar { width: 24px; height: 24px; border-radius: 50%; background: #2a2d3e; display: flex; justify-content: center; align-items: center; font-size: 12px; color: var(--accent); }
  .bet-amount { color: var(--text-muted); font-weight: 600; }
  .bet-mult { display: inline-block; padding: 3px 8px; border-radius: 6px; font-weight: 800; font-size: 12px; text-align: center; }
  .bet-mult.win { background: rgba(63,191,127,0.2); color: var(--accent-green); }
  .bet-cashout { text-align: right; font-weight: 800; color: var(--accent-green); }
  
  /* RIGHT GAME AREA */
  .game-area { flex: 1; display: flex; flex-direction: column; gap: 15px; min-width: 0; }
  
  /* HISTORY BAR */
  .history-bar { display: flex; align-items: center; gap: 10px; background: var(--bg-panel); border: 1px solid var(--border); border-radius: 20px; padding: 15px 20px; }
  .history-title { font-size: 13px; font-weight: 700; color: var(--text-muted); margin-right: 10px; }
  .history-list { display: flex; gap: 8px; overflow-x: auto; flex: 1; scrollbar-width: none; }
  .history-list::-webkit-scrollbar { display: none; }
  .history-item { padding: 6px 14px; border-radius: 20px; font-size: 13px; font-weight: 800; flex-shrink: 0; }
  
  /* Цвета истории */
  .history-item.red { background: rgba(255,77,77,0.15); color: #ff4d4d; border: 1px solid rgba(255,77,77,0.3); }
  .history-item.blue { background: rgba(0,119,255,0.15); color: #3b82f6; border: 1px solid rgba(0,119,255,0.3); }
  .history-item.purple { background: rgba(168,85,247,0.15); color: #d8b4fe; border: 1px solid rgba(168,85,247,0.3); }
  .history-item.gold { background: rgba(241,196,15,0.15); color: #f1c40f; border: 1px solid rgba(241,196,15,0.3); box-shadow: 0 0 10px rgba(241,196,15,0.2); }
  
  /* GAME CANVAS */
  .canvas-container { flex: 1; background: linear-gradient(180deg, #131624, #090a10); border: 1px solid var(--border); border-radius: 20px; position: relative; overflow: hidden; display: flex; justify-content: center; align-items: center; box-shadow: inset 0 0 50px rgba(0,0,0,0.5); }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  
  /* Текущий множитель */
  .multiplier-display { position: absolute; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center; pointer-events: none; }
  .mult-value { font-size: 90px; font-weight: 900; color: #fff; text-shadow: 0 5px 30px rgba(0,229,255,0.4); line-height: 1; transition: color 0.3s; }
  .mult-value.crashed { color: var(--red); text-shadow: 0 5px 30px rgba(255,77,77,0.6); }
  
  /* Ракета и Взрыв */
  .rocket { position: absolute; z-index: 9; font-size: 60px; transform: translate(-50%, -50%) rotate(-45deg); transition: transform 0.1s linear; filter: drop-shadow(0 0 20px rgba(0,229,255,0.6)); display: none; }
  .explosion { position: absolute; z-index: 11; font-size: 100px; transform: translate(-50%, -50%) scale(0); opacity: 0; pointer-events: none; }
  .explosion.animate { animation: boom 0.6s ease-out forwards; }
  @keyframes boom {
    0% { transform: translate(-50%, -50%) scale(0.5); opacity: 1; filter: brightness(2); }
    100% { transform: translate(-50%, -50%) scale(2); opacity: 0; filter: brightness(1); }
  }

  /* BOTTOM CONTROL PANEL */
  .control-panel { background: var(--bg-panel); border: 1px solid var(--border); border-radius: 20px; padding: 15px; display: flex; gap: 15px; }
  
  .bet-box { flex: 1; background: var(--bg-dark); border: 1px solid var(--border); border-radius: 16px; padding: 15px; display: flex; flex-direction: column; gap: 12px; }
  
  .bet-options { display: flex; justify-content: space-between; align-items: center; }
  .check-group { display: flex; gap: 15px; }
  .check-label { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-muted); font-weight: 600; cursor: pointer; }
  .check-label input { accent-color: var(--accent); cursor: pointer; }
  .check-label input:disabled { opacity: 0.5; cursor: not-allowed; }
  
  .mult-input { font-size: 12px; color: var(--text-muted); font-weight: 700; }
  
  .amount-row { display: flex; gap: 10px; }
  .amount-input-wrap { flex: 1; display: flex; align-items: center; background: rgba(0,0,0,0.4); border: 1px solid var(--border); border-radius: 12px; padding: 5px; }
  .amount-input-wrap button { width: 40px; height: 40px; border-radius: 8px; background: rgba(255,255,255,0.05); border: none; color: #fff; font-size: 20px; cursor: pointer; font-weight: 700; transition: 0.2s; }
  .amount-input-wrap button:hover { background: rgba(255,255,255,0.1); }
  .amount-input-wrap input { flex: 1; background: transparent; border: none; color: #fff; text-align: center; font-size: 20px; font-weight: 800; outline: none; font-family: inherit; }
  
  .btn-action { flex: 1; border: none; border-radius: 12px; font-size: 18px; font-weight: 900; cursor: pointer; text-transform: uppercase; letter-spacing: 1px; transition: 0.2s; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.2; }
  .btn-action .subtext { font-size: 13px; font-weight: 700; margin-top: 4px; opacity: 0.9; }
  
  /* КНОПКИ */
  .btn-bet { 
    background: linear-gradient(135deg, #00e5ff, #0077ff); 
    color: #000; 
    box-shadow: 0 0 15px rgba(0,229,255,0.3); 
    animation: pulse-accent 2s infinite;
  }
  .btn-bet:hover { filter: brightness(1.2); box-shadow: 0 0 25px rgba(0,229,255,0.6); }
  .btn-bet:disabled { background: rgba(255,255,255,0.05); color: var(--text-muted); box-shadow: none; animation: none; cursor: not-allowed; }
  
  @keyframes pulse-accent {
    0% { box-shadow: 0 0 10px rgba(0,229,255,0.3); }
    50% { box-shadow: 0 0 25px rgba(0,229,255,0.8); }
    100% { box-shadow: 0 0 10px rgba(0,229,255,0.3); }
  }
  
  .btn-cashout { 
    background: var(--accent-green); 
    color: #000; 
    box-shadow: 0 0 20px rgba(0,255,136,0.5); 
    animation: pulse-green 1s infinite; 
  }
  .btn-cashout:hover { background: #33ffaa; box-shadow: 0 0 30px rgba(0,255,136,0.8); }
  @keyframes pulse-green {
    0% { transform: scale(1); box-shadow: 0 0 15px rgba(0,255,136,0.4); }
    50% { transform: scale(1.02); box-shadow: 0 0 30px rgba(0,255,136,0.8); }
    100% { transform: scale(1); box-shadow: 0 0 15px rgba(0,255,136,0.4); }
  }
  
  .btn-wait { background: rgba(255,255,255,0.05); color: var(--text-muted); cursor: not-allowed; }
  
  .quick-bets { display: flex; gap: 8px; }
  .quick-bets button { flex: 1; background: rgba(255,255,255,0.05); border: 1px solid var(--border); color: var(--text-muted); padding: 8px; border-radius: 8px; font-size: 12px; font-weight: 700; cursor: pointer; }
  .quick-bets button:hover { background: rgba(255,255,255,0.1); color: #fff; }

  /* TOASTS */
  .toast-container { position: fixed; top: 20px; right: 20px; z-index: 9999; display: flex; flex-direction: column; gap: 10px; }
  .toast { background: rgba(24,26,36,0.95); border-left: 4px solid var(--accent); padding: 16px 20px; border-radius: 8px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); min-width: 250px; transform: translateX(120%); transition: transform 0.3s; display: flex; align-items: center; gap: 12px; }
  .toast.show { transform: translateX(0); }
  .toast.success { border-left-color: var(--accent-green); }
  .toast.error { border-left-color: var(--red); }

  /* MOBILE */
  @media (max-width: 1024px) {
    .crash-layout { flex-direction: column; overflow-y: auto; padding: 10px; }
    .sidebar-bets { width: 100%; height: 250px; order: 2; }
    .game-area { order: 1; min-height: 400px; }
    .control-panel { flex-direction: column; }
    .mult-value { font-size: 60px; }
  }
</style>
</head>
<body>

<div class="toast-container" id="toastContainer"></div>

<!-- ШАПКА -->
<div class="header">
  <a href="/" class="back-btn">← На главную</a>
  <div class="user-info">
    <div class="user-id" id="userMaskedId">ID: ****</div>
    <div class="balance" id="topBalance">0.00 ₽</div>
  </div>
</div>

<div class="crash-layout">
  
  <!-- LEFT: BETS LIST -->
  <aside class="sidebar-bets">
    <div class="tabs">
      <button class="tab-btn active">Все ставки</button>
    </div>
    <div class="bets-header">
      <div>Игрок</div>
      <div>Ставка</div>
      <div>Множ.</div>
      <div style="text-align:right">Выигрыш</div>
    </div>
    <div class="bets-list" id="betsList"></div>
  </aside>

  <!-- RIGHT: GAME -->
  <div class="game-area">
    
    <div class="history-bar">
      <div class="history-title">История</div>
      <div class="history-list" id="historyList"></div>
    </div>

    <div class="canvas-container" id="canvasContainer">
      <canvas id="gameCanvas"></canvas>
      <div class="multiplier-display">
        <div class="mult-value" id="multValue">1.00x</div>
      </div>
      <div class="rocket" id="rocket">🚀</div>
      <div class="explosion" id="explosion">💥</div>
    </div>

    <div class="control-panel">
      <!-- BET 1 -->
      <div class="bet-box">
        <div class="bet-options">
          <div class="check-group">
            <label class="check-label"><input type="checkbox" id="autoCashout1" checked> Автовывод</label>
          </div>
          <div class="mult-input">x <input type="number" id="autoMult1" value="2.00" step="0.1" style="width: 50px; background: transparent; border: none; color: #fff; font-weight: 700; outline: none;"></div>
        </div>
        <div class="amount-row">
          <div class="amount-input-wrap">
            <button onclick="changeAmount(1, -10)">−</button>
            <input type="number" id="betAmount1" value="10" min="10">
            <button onclick="changeAmount(1, 10)">+</button>
          </div>
          <button class="btn-action btn-bet" id="btnBet1" onclick="placeBet(1)">Ставка</button>
        </div>
        <div class="quick-bets">
          <button onclick="setAmount(1, 10)">10</button>
          <button onclick="setAmount(1, 50)">50</button>
          <button onclick="setAmount(1, 100)">100</button>
          <button onclick="setAmount(1, 500)">500</button>
        </div>
      </div>

      <!-- BET 2 -->
      <div class="bet-box">
        <div class="bet-options">
          <div class="check-group">
            <label class="check-label"><input type="checkbox" id="autoCashout2" checked> Автовывод</label>
          </div>
          <div class="mult-input">x <input type="number" id="autoMult2" value="2.00" step="0.1" style="width: 50px; background: transparent; border: none; color: #fff; font-weight: 700; outline: none;"></div>
        </div>
        <div class="amount-row">
          <div class="amount-input-wrap">
            <button onclick="changeAmount(2, -10)">−</button>
            <input type="number" id="betAmount2" value="10" min="10">
            <button onclick="changeAmount(2, 10)">+</button>
          </div>
          <button class="btn-action btn-bet" id="btnBet2" onclick="placeBet(2)">Ставка</button>
        </div>
        <div class="quick-bets">
          <button onclick="setAmount(2, 10)">10</button>
          <button onclick="setAmount(2, 50)">50</button>
          <button onclick="setAmount(2, 100)">100</button>
          <button onclick="setAmount(2, 500)">500</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
/* ---------------- СОСТОЯНИЕ ИГРЫ ---------------- */
let gameState = 'waiting';
let currentMultiplier = 1.00;
let currentPlayer = null;
let localPoints = [];
let lastRoundId = null;

// Графика
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const rocketEl = document.getElementById('rocket');
const explosionEl = document.getElementById('explosion');
const multValueEl = document.getElementById('multValue');
const topBalanceEl = document.getElementById('topBalance');
const userMaskedIdEl = document.getElementById('userMaskedId');

let bets = {
  1: { active: false, amount: 10, cashedOut: false, cashoutMultiplier: 0, crashId: null },
  2: { active: false, amount: 10, cashedOut: false, cashoutMultiplier: 0, crashId: null }
};

function resizeCanvas() {
  const parent = canvas.parentElement;
  canvas.width = parent.clientWidth;
  canvas.height = parent.clientHeight;
}
window.addEventListener('resize', resizeCanvas);
setTimeout(resizeCanvas, 100);

/* ---------------- СИНХРОНИЗАЦИЯ С СЕРВЕРОМ ---------------- */
async function syncGame() {
  try {
    const res = await fetch('/api/crash/status');
    const state = await res.json();

    // Если начался новый раунд
    if (state.roundId !== lastRoundId) {
      lastRoundId = state.roundId;
      localPoints = [];
      bets[1].active = false; bets[1].cashedOut = false; bets[1].crashId = null;
      bets[2].active = false; bets[2].cashedOut = false; bets[2].crashId = null;
      document.getElementById('autoCashout1').disabled = false;
      document.getElementById('autoCashout2').disabled = false;
      explosionEl.classList.remove('animate');
      multValueEl.classList.remove('crashed');
      rocketEl.style.display = 'none';
    }

    gameState = state.status;
    currentMultiplier = state.currentMultiplier;

    // Отрисовка кэфа
    multValueEl.textContent = currentMultiplier.toFixed(2) + 'x';
    
    // Отрисовка истории (верхняя лента)
    if (state.history && state.history.length > 0) {
      const list = document.getElementById('historyList');
      // Перерисовываем только если изменилось количество
      if (list.children.length !== state.history.length) {
        list.innerHTML = '';
        state.history.forEach(mult => {
          const item = document.createElement('div');
          item.className = 'history-item';
          if (mult >= 10) item.classList.add('gold');
          else if (mult >= 4) item.classList.add('purple');
          else if (mult >= 1.5) item.classList.add('blue');
          else item.classList.add('red');
          item.textContent = mult.toFixed(2) + 'x';
          list.appendChild(item);
        });
      }
    }

    if (gameState === 'flying') {
      // Добавляем точку для графика
      localPoints.push({ x: localPoints.length * 0.1, y: currentMultiplier });
      if (localPoints.length > 500) localPoints.shift();
      
      drawGame();
      updateButtonAmounts();
      checkAutoCashout(1);
      checkAutoCashout(2);
    } else if (gameState === 'crashed') {
      multValueEl.classList.add('crashed');
      
      // Взрыв один раз
      if (!explosionEl.classList.contains('animate')) {
        const lastP = localPoints[localPoints.length - 1];
        if (lastP) {
          const maxX = lastP.x || 1;
          const maxY = lastP.y || 1;
          const drawW = canvas.width - 60;
          const drawH = canvas.height - 60;
          explosionEl.style.left = ((lastP.x / Math.max(maxX, 10)) * drawW) + 'px';
          explosionEl.style.top = (drawH - ((lastP.y / Math.max(maxY, 2)) * drawH)) + 'px';
          explosionEl.classList.add('animate');
        }
        rocketEl.style.display = 'none';
      }
    } else {
      drawGame();
    }

    updateBetButtons();
  } catch (e) {
    console.error('Sync error', e);
  }
}

// Запускаем опрос сервера каждые 100 мс
setInterval(syncGame, 100);

/* ---------------- АВТОРИЗАЦИЯ И ИСТОРИЯ ---------------- */
window.onload = () => {
  const savedId = localStorage.getItem('kingwin_player_id');
  if(savedId) {
    fetch('/api/guest/me?id=' + savedId)
      .then(r => r.json())
      .then(data => { 
        if(data.guest) {
          currentPlayer = data.guest; 
          updateBalanceUI();
          
          const card = String(currentPlayer.id);
          const masked = card.length > 4 
            ? card.slice(0, 2) + '****' + card.slice(-2) 
            : '****';
          userMaskedIdEl.textContent = 'ID: ' + masked;
        } 
      })
      .catch(() => {});
  }

  // Загружаем историю ставок с сервера
  fetch('/api/crash/history')
    .then(r => r.json())
    .then(data => {
      const list = document.getElementById('betsList');
      if(data && data.length) {
        data.forEach(item => {
          const row = document.createElement('div');
          row.className = 'bet-row';
          row.innerHTML = `
            <div class="bet-user"><div class="user-avatar">ID</div>${item.guest_masked || 'Гость'}</div>
            <div class="bet-amount">${item.bet} ₽</div>
            <div>${item.multiplier > 0 ? `<span class="bet-mult win">${parseFloat(item.multiplier).toFixed(2)}x</span>` : '--'}</div>
            <div class="bet-cashout">${item.status === 'win' ? `${parseFloat(item.win_amount).toFixed(2)} ₽` : (item.status === 'lose' ? 'Проигрыш' : '--')}</div>
          `;
          list.appendChild(row);
        });
      }
    })
    .catch(() => {});
    
    // Первичная синхронизация
    syncGame();
};

function updateBalanceUI() {
  if(currentPlayer) {
    topBalanceEl.textContent = parseFloat(currentPlayer.bonus_balance || 0).toFixed(2) + ' ₽';
  }
}

/* ---------------- ОТРИСОВКА ---------------- */
function drawGame() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  ctx.strokeStyle = 'rgba(255,255,255,0.05)';
  ctx.lineWidth = 1;
  for (let i = 0; i < canvas.height; i += 50) {
    ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(canvas.width, i); ctx.stroke();
  }
  for (let i = 0; i < canvas.width; i += 50) {
    ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, canvas.height); ctx.stroke();
  }

  if (localPoints.length > 1) {
    ctx.beginPath();
    let color = '#00e5ff';
    if (currentMultiplier >= 10) color = '#f1c40f';
    else if (currentMultiplier >= 4) color = '#a855f7';
    else if (currentMultiplier >= 1.5) color = '#3b82f6';
    else color = '#ff4d4d';
    if (gameState === 'crashed') color = '#ff4d4d';

    ctx.strokeStyle = color;
    ctx.lineWidth = 4;
    ctx.lineJoin = 'round';
    ctx.shadowBlur = 15;
    ctx.shadowColor = color;
    
    const maxX = localPoints[localPoints.length - 1].x || 1;
    const maxY = localPoints[localPoints.length - 1].y || 1;
    const drawW = canvas.width - 60;
    const drawH = canvas.height - 60;

    localPoints.forEach((p, i) => {
      const px = (p.x / Math.max(maxX, 10)) * drawW;
      const py = drawH - ((p.y / Math.max(maxY, 2)) * drawH);
      if (i === 0) ctx.moveTo(px, py);
      else ctx.lineTo(px, py);
    });
    ctx.stroke();

    const lastP = localPoints[localPoints.length - 1];
    const rx = (lastP.x / Math.max(maxX, 10)) * drawW;
    const ry = drawH - ((lastP.y / Math.max(maxY, 2)) * drawH);
    
    if (gameState === 'flying') {
      rocketEl.style.display = 'block';
      rocketEl.style.left = rx + 'px';
      rocketEl.style.top = ry + 'px';
    }
  }
}

/* ---------------- СТАВКИ ---------------- */
function changeAmount(id, diff) {
  const input = document.getElementById('betAmount' + id);
  let val = parseInt(input.value) || 10;
  val += diff;
  if (val < 10) val = 10;
  input.value = val;
  bets[id].amount = val;
  updateBetButtons();
}

function setAmount(id, val) {
  document.getElementById('betAmount' + id).value = val;
  bets[id].amount = val;
  updateBetButtons();
}

async function placeBet(id) {
  if (bets[id].active) {
    if (gameState === 'flying' && !bets[id].cashedOut) {
      cashOut(id);
    }
    return;
  }

  if (gameState === 'waiting') {
    if(!currentPlayer) { showToast('Войдите в аккаунт на главной!', 'error'); return; }
    
    bets[id].active = true;
    bets[id].cashedOut = false;
    bets[id].amount = parseInt(document.getElementById('betAmount' + id).value) || 10;
    
    if(parseFloat(currentPlayer.bonus_balance) < bets[id].amount) {
      showToast('Недостаточно средств!', 'error');
      bets[id].active = false;
      return;
    }

    document.getElementById('autoCashout' + id).disabled = true;

    try {
      const res = await fetch('/api/crash/bet', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ id: currentPlayer.id, bet: bets[id].amount })
      });
      const data = await res.json();
      
      if(res.ok) {
        currentPlayer.bonus_balance = parseFloat(currentPlayer.bonus_balance) - bets[id].amount;
        updateBalanceUI();
        bets[id].crashId = data.crash_id;
      } else {
        bets[id].active = false;
        document.getElementById('autoCashout' + id).disabled = false;
        showToast('Ошибка: ' + (data.error || 'сервер занят'), 'error');
        return;
      }
    } catch(e) {
      bets[id].active = false;
      document.getElementById('autoCashout' + id).disabled = false;
      showToast('Ошибка соединения', 'error');
      return;
    }

    showToast(`Ставка ${bets[id].amount} ₽ принята!`, 'success');
    updateBetButtons();
  }
}

async function cashOut(id) {
  if (!bets[id].active || bets[id].cashedOut) return;
  bets[id].cashedOut = true;
  bets[id].cashoutMultiplier = currentMultiplier;
  
  const winAmount = bets[id].amount * currentMultiplier;
  
  if(currentPlayer) {
    try {
      await fetch('/api/crash/cashout', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ 
          id: currentPlayer.id, 
          crash_id: bets[id].crashId,
          bet: bets[id].amount, 
          multiplier: currentMultiplier 
        })
      });
      currentPlayer.bonus_balance = parseFloat(currentPlayer.bonus_balance) + winAmount;
      updateBalanceUI();
    } catch(e) {}
  }
  
  showToast(`Выведено: ${winAmount.toFixed(2)} ₽`, 'success');
  updateBetButtons();
}

function checkAutoCashout(id) {
  if (!bets[id].active || bets[id].cashedOut) return;
  const isAuto = document.getElementById('autoCashout' + id).checked;
  const targetMult = parseFloat(document.getElementById('autoMult' + id).value) || 0;
  if (isAuto && currentMultiplier >= targetMult) cashOut(id);
}

/* ---------------- ОБНОВЛЕНИЕ КНОПОК ---------------- */
function updateBetButtons() {
  [1, 2].forEach(id => {
    const btn = document.getElementById('btnBet' + id);
    const bet = bets[id];
    
    if (gameState === 'waiting') {
      if (bet.active) {
        btn.className = 'btn-action btn-wait';
        btn.innerHTML = `Ожидание... <div class="subtext">${bet.amount} ₽</div>`;
        btn.disabled = true;
      } else {
        btn.className = 'btn-action btn-bet';
        btn.innerHTML = `Ставка <div class="subtext">${bet.amount} ₽</div>`;
        btn.disabled = false;
      }
    } else if (gameState === 'flying') {
      if (bet.active && !bet.cashedOut) {
        btn.className = 'btn-action btn-cashout';
        btn.innerHTML = `Забрать <div class="subtext">${(bet.amount * currentMultiplier).toFixed(2)} ₽</div>`;
        btn.disabled = false;
      } else if (bet.cashedOut) {
        btn.className = 'btn-action btn-wait';
        btn.innerHTML = `Выведено <div class="subtext">+${(bet.amount * bet.cashoutMultiplier).toFixed(2)} ₽</div>`;
        btn.disabled = true;
      } else {
        btn.className = 'btn-action btn-wait';
        btn.innerHTML = `Ждите...`;
        btn.disabled = true;
      }
    } else {
      btn.className = 'btn-action btn-wait';
      btn.innerHTML = `Краш!`;
      btn.disabled = true;
    }
  });
}

function updateButtonAmounts() {
  [1, 2].forEach(id => {
    if (bets[id].active && !bets[id].cashedOut && gameState === 'flying') {
      const btn = document.getElementById('btnBet' + id);
      if (btn.classList.contains('btn-cashout')) {
        btn.innerHTML = `Забрать <div class="subtext">${(bets[id].amount * currentMultiplier).toFixed(2)} ₽</div>`;
      }
    }
  });
}

/* ---------------- УВЕДОМЛЕНИЯ ---------------- */
function showToast(text, type='success') {
  const container = document.getElementById('toastContainer');
  const toast = document.createElement('div');
  toast.className = `toast ${type}`;
  toast.innerHTML = `<div style="font-size:14px;font-weight:600;color:#fff">${text}</div>`;
  container.appendChild(toast);
  setTimeout(() => toast.classList.add('show'), 10);
  setTimeout(() => {
    toast.classList.remove('show');
    setTimeout(() => toast.remove(), 300);
  }, 3000); 
}
</script>
