<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>KINGWIN — Crash</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root { --bg-main:#090a10; --bg-panel:#181a24; --bg-dark:#11121a; --accent:#00e5ff; --accent-green:#00ff88; --text-main:#fff; --text-muted:#8b92a5; --border:rgba(255,255,255,0.06); --red:#ff4d4d; --yellow:#f1c40f; --gold:#ffd700; }
  * { box-sizing:border-box; margin:0; padding:0; font-family:'Montserrat',sans-serif; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; }
  body { background:var(--bg-main); color:var(--text-main); height:100vh; height:100dvh; display:flex; flex-direction:column; overflow:hidden; }

  .topbar { display:flex; justify-content:space-between; align-items:center; padding:10px 16px; background:var(--bg-panel); border-bottom:1px solid var(--border); flex-shrink:0; z-index:100; }
  .topbar-logo { font-size:18px; font-weight:900; letter-spacing:2px; background:linear-gradient(135deg,#00e5ff,#0077ff); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
  .balance-badge { display:flex; align-items:center; gap:6px; background:rgba(0,0,0,0.5); border:1px solid rgba(0,229,255,0.35); padding:6px 12px; border-radius:20px; font-size:12px; font-weight:700; }
  .balance-badge .lbl { color:var(--text-muted); font-size:10px; text-transform:uppercase; letter-spacing:1px; }
  .balance-badge .val { color:var(--accent); font-weight:900; font-size:13px; }

  .crash-layout { display:flex; flex-direction:column; flex:1; min-height:0; padding:12px; gap:10px; max-width:900px; margin:0 auto; width:100%; }

  .round-info { display:flex; justify-content:space-between; align-items:center; background:var(--bg-panel); border:1px solid var(--border); border-radius:14px; padding:8px 14px; flex-shrink:0; }
  .round-info .lbl { font-size:11px; color:var(--text-muted); text-transform:uppercase; letter-spacing:1px; font-weight:700; }
  .round-info .val { font-size:14px; font-weight:900; color:var(--accent); }

  .history-bar { display:flex; align-items:center; gap:10px; background:var(--bg-panel); border:1px solid var(--border); border-radius:14px; padding:8px 12px; flex-shrink:0; }
  .history-title { font-size:11px; font-weight:700; color:var(--text-muted); text-transform:uppercase; }
  .history-list { display:flex; gap:6px; overflow-x:auto; flex:1; scrollbar-width:none; }
  .history-list::-webkit-scrollbar { display:none; }
  .history-item { padding:4px 10px; border-radius:14px; font-size:11px; font-weight:800; flex-shrink:0; }
  .history-item.red    { background:rgba(255,77,77,0.2);  color:#ff8a8a; border:1px solid rgba(255,77,77,0.45); }
  .history-item.blue   { background:rgba(0,119,255,0.2);  color:#66b3ff; border:1px solid rgba(0,119,255,0.45); }
  .history-item.purple { background:rgba(168,85,247,0.2); color:#d8b4fe; border:1px solid rgba(168,85,247,0.45); }
  .history-item.gold   { background:rgba(241,196,15,0.2); color:#ffe066; border:1px solid rgba(241,196,15,0.55); box-shadow:0 0 10px rgba(241,196,15,0.35); }

  .canvas-container { flex:1; background:linear-gradient(180deg,#131624,#090a10); border:1px solid var(--border); border-radius:20px; position:relative; overflow:hidden; display:flex; justify-content:center; align-items:center; box-shadow:inset 0 0 50px rgba(0,0,0,0.5); min-height:180px; }
  canvas { position:absolute; inset:0; width:100%; height:100%; display:block; }
  .multiplier-display { position:absolute; z-index:10; display:flex; flex-direction:column; align-items:center; justify-content:center; pointer-events:none; }
  .mult-value { font-size:64px; font-weight:900; color:#fff; text-shadow:0 5px 30px rgba(0,229,255,0.4); line-height:1; transition:color 0.3s, text-shadow 0.3s; }
  .mult-value.crashed { color:var(--red); text-shadow:0 5px 30px rgba(255,77,77,0.4); }
  .mult-label { font-size:12px; color:var(--text-muted); text-transform:uppercase; letter-spacing:2px; margin-top:8px; font-weight:700; min-height:16px; }

  .control-panel { background:var(--bg-panel); border:1px solid var(--border); border-radius:20px; padding:12px; flex-shrink:0; display:flex; flex-direction:column; gap:10px; }
  .amount-row { display:flex; gap:8px; }
  .amount-input-wrap { flex:1; display:flex; align-items:center; background:rgba(0,0,0,0.4); border:1px solid var(--border); border-radius:12px; padding:4px; }
  .amount-input-wrap button { width:36px; height:36px; border-radius:8px; background:rgba(255,255,255,0.05); border:none; color:#fff; font-size:18px; cursor:pointer; font-weight:700; }
  .amount-input-wrap button:hover { background:rgba(255,255,255,0.1); }
  .amount-input-wrap input { flex:1; min-width:0; background:transparent; border:none; color:#fff; text-align:center; font-size:18px; font-weight:800; outline:none; font-family:inherit; }
  .amount-input-wrap input:disabled { opacity:0.6; }

  .btn-action { flex:1; border:none; border-radius:12px; font-size:15px; font-weight:900; cursor:pointer; text-transform:uppercase; letter-spacing:1px; display:flex; flex-direction:column; align-items:center; justify-content:center; line-height:1.2; padding:12px 10px; font-family:inherit; }
  .btn-action .subtext { font-size:11px; font-weight:600; opacity:0.9; margin-top:3px; }
  .btn-bet { background:var(--yellow); color:#000; }
  .btn-bet:hover { background:#f7d341; }
  .btn-bet:disabled { opacity:0.5; cursor:not-allowed; }

  .btn-cashout {
    background:linear-gradient(135deg,#0a1a3a 0%,#1a3a6b 50%,#0a1a3a 100%);
    color:#00e5ff;
    border:2px solid #00e5ff;
    box-shadow:0 0 15px rgba(0,229,255,0.45),0 0 30px rgba(0,229,255,0.2);
    text-shadow:0 0 10px rgba(0,229,255,0.7);
    animation:cashoutPulse 1.6s ease-in-out infinite;
    position:relative;
    overflow:hidden;
  }
  .btn-cashout::before { content:''; position:absolute; top:-50%; left:-100%; width:50%; height:200%; background:linear-gradient(90deg,transparent,rgba(0,229,255,0.35),transparent); transform:skewX(-25deg); animation:cashoutShine 2.4s ease-in-out infinite; }
  .btn-cashout:hover { background:linear-gradient(135deg,#102a5a 0%,#2a5a9b 50%,#102a5a 100%); border-color:#33ebff; color:#33ebff; }
  @keyframes cashoutPulse { 0%,100% { box-shadow:0 0 15px rgba(0,229,255,0.45),0 0 30px rgba(0,229,255,0.2); } 50% { box-shadow:0 0 25px rgba(0,229,255,0.75),0 0 45px rgba(0,229,255,0.35); } }
  @keyframes cashoutShine { 0% { left:-100%; } 60%,100% { left:150%; } }

  .quick-bets { display:flex; gap:6px; }
  .quick-bets button { flex:1; background:rgba(255,255,255,0.05); border:1px solid var(--border); color:var(--text-muted); padding:6px; border-radius:8px; font-size:11px; font-weight:700; cursor:pointer; font-family:inherit; }
  .quick-bets button:hover { background:rgba(255,255,255,0.1); color:#fff; }
  .quick-bets button:disabled { opacity:0.4; cursor:not-allowed; }

  .queued-badge { display:none; position:absolute; top:-10px; right:12px; background:linear-gradient(135deg,#00e5ff,#0077ff); color:#000; font-size:9px; font-weight:900; padding:3px 10px; border-radius:10px; letter-spacing:1px; text-transform:uppercase; box-shadow:0 0 12px rgba(0,229,255,0.5); }
  .control-panel.has-queue .queued-badge { display:block; }

  .toast-container { position:fixed; top:70px; right:16px; z-index:99999; display:flex; flex-direction:column; gap:8px; pointer-events:none; }
  .toast { background:rgba(24,26,36,0.95); border-left:4px solid var(--accent); padding:12px 16px; border-radius:8px; box-shadow:0 10px 30px rgba(0,0,0,0.5); min-width:220px; transform:translateX(120%); transition:transform 0.3s; font-size:13px; font-weight:600; pointer-events:auto; }
  .toast.show { transform:translateX(0); }
  .toast.success { border-left-color:var(--accent-green); }
  .toast.error { border-left-color:var(--red); }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-logo">KINGWIN</div>
  <div class="balance-badge">
    <span class="lbl">Баланс</span>
    <span class="val" id="balanceVal">0.00 ₽</span>
  </div>
</div>

<div class="crash-layout">

  <div class="round-info">
    <span class="lbl">Раунд</span>
    <span class="val" id="roundId">#—</span>
  </div>

  <div class="history-bar">
    <div class="history-title">История:</div>
    <div class="history-list" id="historyList"></div>
  </div>

  <div class="canvas-container">
    <canvas id="crashCanvas"></canvas>
    <div class="multiplier-display">
      <div class="mult-value" id="multiplier">1.00x</div>
      <div class="mult-label" id="statusText">Ожидание...</div>
    </div>
  </div>

  <div class="control-panel" id="controlPanel">
    <div class="queued-badge">Ставка на следующий раунд</div>
    <div class="amount-row">
      <div class="amount-input-wrap">
        <button onclick="adjustBet(-10)">−</button>
        <input type="number" id="betInput" value="10" min="1">
        <button onclick="adjustBet(10)">+</button>
      </div>
      <button class="btn-action btn-bet" id="btnBet" onclick="onBetClick()">
        Сделать ставку
        <span class="subtext">В ожидании</span>
      </button>
    </div>
    <div class="quick-bets">
      <button onclick="setBet(10)">10 ₽</button>
      <button onclick="setBet(50)">50 ₽</button>
      <button onclick="setBet(100)">100 ₽</button>
      <button onclick="setBet(500)">500 ₽</button>
    </div>
  </div>

</div>

<div class="toast-container" id="toastContainer"></div>

<script>
let currentPlayer = null;
let isFlying = false;
let currentMult = 1.0;
let crashPoint = 0;
let flightStart = 0;
let flightLoop = null;
let currentRoundId = 0;
let activeBetId = null;        // ставка в текущем раунде
let activeBetAmount = 0;
let queuedBetAmount = 0;       // ставка на следующий раунд
let points = [];

const canvas = document.getElementById('crashCanvas');
const ctx = canvas.getContext('2d');
const rocketImg = new Image();
rocketImg.src = '/rocket.png';
const GROWTH = 1.06;

window.onload = async () => {
  const id = localStorage.getItem('kingwin_guest_id');
  if (!id) { window.location.href = '/'; return; }
  currentPlayer = { id };
  await loadBalance();
  resizeCanvas();
  window.addEventListener('resize', resizeCanvas);
  startRound();
};

function resizeCanvas() {
  if (!canvas.parentElement) return;
  canvas.width = canvas.parentElement.clientWidth;
  canvas.height = canvas.parentElement.clientHeight;
}

async function loadBalance() {
  if (!currentPlayer) return;
  try {
    const res = await fetch('/api/guest/me?id=' + encodeURIComponent(currentPlayer.id) + '&_t=' + Date.now());
    const data = await res.json();
    if (data.balance) {
      document.getElementById('balanceVal').textContent = data.balance.total.toFixed(2) + ' ₽';
    }
  } catch(e){}
}

function showToast(text, type = 'success') {
  const container = document.getElementById('toastContainer');
  const t = document.createElement('div');
  t.className = 'toast ' + type;
  t.textContent = text;
  container.appendChild(t);
  setTimeout(() => t.classList.add('show'), 10);
  setTimeout(() => { t.classList.remove('show'); setTimeout(() => t.remove(), 300); }, 3000);
}

// ============================================================
// РАУНДЫ
// ============================================================
async function startRound() {
  isFlying = false;
  currentMult = 1.0;
  crashPoint = 0;
  points = [];
  activeBetId = null;
  activeBetAmount = 0;
  clearInterval(flightLoop);
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  currentRoundId++;
  document.getElementById('roundId').textContent = '#' + currentRoundId;
  document.getElementById('statusText').textContent = 'Ожидание ставок...';
  document.getElementById('multiplier').textContent = '1.00x';
  document.getElementById('multiplier').className = 'mult-value';

  // Если была ставка в очереди — она «пойдёт» в этот раунд
  if (queuedBetAmount > 0) {
    // Уже списана при постановке в очередь (см. onBetClick)
    activeBetAmount = queuedBetAmount;
    activeBetId = 0;  // временно, реальный bet_id появится при старте полёта
    queuedBetAmount = 0;
    document.getElementById('controlPanel').classList.remove('has-queue');
    updateBetButtonQueued();
  }

  // Ждём 5 сек и стартуем
  setTimeout(() => startFlight(), 5000);
}

async function startFlight() {
  isFlying = true;
  flightStart = Date.now();
  currentMult = 1.0;
  points = [];

  // Получаем СВЕЖИЙ crash_point с сервера (никогда не залипает)
  let fetched = 0;
  try {
    const url = '/api/crash/peek?bet_id=' + (activeBetId || 0) + '&_t=' + Date.now();
    const res = await fetch(url, { cache: 'no-store' });
    if (res.ok) {
      const data = await res.json();
      if (data.crash_point && data.crash_point >= 1) fetched = data.crash_point;
    }
  } catch(e){}

  if (fetched > 0) {
    crashPoint = fetched;
  } else {
    // Fallback — рандом, не 2x
    const u1 = Math.random();
    crashPoint = u1 < 0.20 ? 1.00 : Math.max(1.01, Math.min(0.80 / (1 - (u1 - 0.20) / 0.80), 100));
  }

  // Если есть ставка — регистрируем её на сервере и получаем bet_id
  if (activeBetAmount > 0) {
    try {
      const res = await fetch('/api/crash/start', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ guest_id: currentPlayer.id, amount: activeBetAmount })
      });
      const data = await res.json();
      if (data.ok) {
        activeBetId = data.bet_id;
        loadBalance();
      } else {
        // Не хватило денег — отменяем
        activeBetAmount = 0;
        activeBetId = null;
        showToast(data.error || 'Ставка не принята', 'error');
      }
    } catch(e){}
  }

  document.getElementById('statusText').textContent = 'В ПОЛЁТЕ!';
  const multEl = document.getElementById('multiplier');
  multEl.classList.remove('crashed');

  // Кнопка «Забрать» если есть активная ставка
  if (activeBetId) {
    setButtonCashout();
  }

  clearInterval(flightLoop);
  flightLoop = setInterval(() => {
    const elapsed = (Date.now() - flightStart) / 1000;
    currentMult = Math.pow(GROWTH, elapsed);
    drawGraph(currentMult);

    if (activeBetId) {
      const btn = document.getElementById('btnBet');
      btn.querySelector('.subtext').textContent = 'x' + currentMult.toFixed(2);
    }

    if (currentMult >= crashPoint) {
      crashNow();
    } else {
      multEl.textContent = currentMult.toFixed(2) + 'x';
    }
  }, 50);
}

async function crashNow() {
  clearInterval(flightLoop);
  currentMult = crashPoint;
  const multEl = document.getElementById('multiplier');
  multEl.textContent = crashPoint.toFixed(2) + 'x';
  multEl.classList.add('crashed');
  document.getElementById('statusText').textContent = 'КРАШ!';

  addHistory(crashPoint.toFixed(2));

  // Если не кэшаутнулся — сервер фиксирует проигрыш
  if (activeBetId) {
    try { await fetch('/api/crash/result?bet_id=' + activeBetId + '&_t=' + Date.now()); } catch(e){}
  }

  activeBetId = null;
  activeBetAmount = 0;
  loadBalance();

  setTimeout(() => startRound(), 2500);
}

// ============================================================
// UI КНОПКИ
// ============================================================
function updateBetButtonQueued() {
  const btn = document.getElementById('btnBet');
  btn.className = 'btn-action btn-bet';
  btn.disabled = true;
  btn.innerHTML = 'Ставка в очереди <span class="subtext">Ждём раунд...</span>';
}

function setButtonCashout() {
  const btn = document.getElementById('btnBet');
  btn.className = 'btn-action btn-cashout';
  btn.disabled = false;
  btn.innerHTML = 'ЗАБРАТЬ <span class="subtext">x' + currentMult.toFixed(2) + '</span>';
}

function resetBetButton() {
  const btn = document.getElementById('btnBet');
  btn.disabled = false;
  btn.className = 'btn-action btn-bet';
  btn.innerHTML = 'Сделать ставку <span class="subtext">В ожидании</span>';
}

// ============================================================
// ОТРИСОВКА
// ============================================================
function drawGraph(mult) {
  const w = canvas.width;
  const h = canvas.height;
  const pad = 30;
  ctx.clearRect(0, 0, w, h);

  const maxMult = Math.max(crashPoint || 1.01, mult, 1.01);
  const t = Math.min(1, (mult - 1) / (maxMult - 1 || 1));

  const x0 = pad, y0 = h - pad;
  const x1 = w - pad, y1 = pad;
  const x = x0 + (x1 - x0) * t;
  const y = y0 + (y1 - y0) * t;

  if (!points.length) points.push({ x: x0, y: y0 });
  points.push({ x, y });
  if (points.length > 400) points.shift();

  const grad = ctx.createLinearGradient(x0, y0, x, y);
  grad.addColorStop(0, 'rgba(0,229,255,0.15)');
  grad.addColorStop(0.5, '#00e5ff');
  grad.addColorStop(1, '#00ff88');

  ctx.beginPath();
  ctx.moveTo(x0, y0);
  for (let i = 1; i < points.length; i++) ctx.lineTo(points[i].x, points[i].y);
  ctx.strokeStyle = grad;
  ctx.lineWidth = 4;
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';
  ctx.shadowBlur = 18;
  ctx.shadowColor = '#00e5ff';
  ctx.stroke();
  ctx.shadowBlur = 0;

  if (rocketImg.complete && rocketImg.naturalWidth > 0) {
    const size = Math.max(64, Math.min(96, w * 0.09));
    const angle = Math.atan2(y1 - y0, x1 - x0);
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(angle);
    ctx.shadowBlur = 30;
    ctx.shadowColor = 'rgba(0,229,255,0.95)';
    const pulse = 1 + Math.sin(Date.now() / 180) * 0.05;
    ctx.scale(pulse, pulse);
    ctx.drawImage(rocketImg, -size/2, -size/2, size, size);
    ctx.restore();
    ctx.shadowBlur = 0;
  }
}

// ============================================================
// ИСТОРИЯ
// ============================================================
function addHistory(val) {
  const v = parseFloat(val);
  let cls = 'red';
  if (v >= 10) cls = 'gold';
  else if (v >= 4) cls = 'purple';
  else if (v >= 1.50) cls = 'blue';
  const list = document.getElementById('historyList');
  const el = document.createElement('div');
  el.className = 'history-item ' + cls;
  el.textContent = v.toFixed(2) + 'x';
  list.prepend(el);
  while (list.children.length > 10) list.lastChild.remove();
}

// ============================================================
// СТАВКИ
// ============================================================
function adjustBet(d) {
  const input = document.getElementById('betInput');
  let v = (parseFloat(input.value) || 0) + d;
  if (v < 1) v = 1;
  input.value = v;
}
function setBet(v) { document.getElementById('betInput').value = v; }

async function onBetClick() {
  if (!currentPlayer) return;

  // 1) Если есть активная ставка и идёт полёт — кэшаут
  if (activeBetId && isFlying) {
    await cashout();
    return;
  }

  // 2) Если ставка уже в очереди — отменить
  if (queuedBetAmount > 0) {
    // Возврат делать не будем, ставка уже уйдёт в следующий раунд.
    // Просто отменяем визуально — на деле она сыграет.
    showToast('Ставка уже в очереди на следующий раунд', 'success');
    return;
  }

  // 3) Ставим на следующий раунд
  const amount = parseFloat(document.getElementById('betInput').value) || 0;
  if (amount < 1) return showToast('Мин 1 ₽', 'error');

  // Списываем СРАЗУ через /api/crash/start? Нет — списываем только в момент старта.
  // Проверяем баланс локально.
  try {
    const check = await fetch('/api/guest/me?id=' + encodeURIComponent(currentPlayer.id) + '&_t=' + Date.now());
    const me = await check.json();
    const bal = me.balance?.total || 0;
    if (bal < amount) return showToast('Недостаточно средств', 'error');
  } catch(e){}

  queuedBetAmount = amount;
  document.getElementById('controlPanel').classList.add('has-queue');
  updateBetButtonQueued();
  showToast('Ставка ' + amount + ' ₽ на следующий раунд', 'success');
}

async function cashout() {
  if (!activeBetId) return;
  const mult = currentMult;

  try {
    const res = await fetch('/api/crash/cashout', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        bet_id: activeBetId,
        guest_id: currentPlayer.id,
        mult: mult
      })
    });
    const data = await res.json();
    if (data.ok) {
      showToast(`✅ Забрано ${data.win.toFixed(2)} ₽ (x${mult.toFixed(2)})`, 'success');
      loadBalance();
      activeBetId = null;
      activeBetAmount = 0;
      resetBetButton();
    } else {
      showToast(data.error || 'Ошибка кэшаута', 'error');
    }
  } catch(e) {
    showToast('Ошибка сети', 'error');
  }
}
</script>
</body>
</html>
