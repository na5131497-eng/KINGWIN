<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>KINGWIN — Crash</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-main: #090a10; --bg-panel: #181a24; --bg-dark: #11121a;
    --accent: #00e5ff; --accent-green: #00ff88;
    --text-main: #fff; --text-muted: #8b92a5;
    --border: rgba(255,255,255,0.06);
    --red: #ff4d4d; --yellow: #f1c40f; --gold: #ffd700;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Montserrat', sans-serif; }
  html, body { height: 100%; }
  body { background: var(--bg-main); color: var(--text-main); height: 100vh; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }

  .topbar { display: flex; justify-content: space-between; align-items: center; padding: 10px 16px; background: var(--bg-panel); border-bottom: 1px solid var(--border); flex-shrink: 0; z-index: 100; }
  .topbar-left { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .topbar-logo { font-size: 18px; font-weight: 900; letter-spacing: 2px; background: linear-gradient(135deg, #00e5ff, #0077ff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; flex-shrink: 0; }
  .home-btn { display: flex; align-items: center; gap: 6px; background: rgba(255,255,255,0.05); border: 1px solid var(--border); color: var(--text-muted); padding: 6px 12px; border-radius: 8px; font-size: 11px; font-weight: 700; cursor: pointer; text-decoration: none; transition: 0.3s; white-space: nowrap; }
  .home-btn:hover { border-color: var(--accent); color: var(--accent); }
  .balance-badge { display: flex; align-items: center; gap: 6px; background: rgba(0,0,0,0.5); border: 1px solid rgba(0,229,255,0.35); padding: 6px 12px; border-radius: 20px; font-size: 12px; font-weight: 700; cursor: pointer; transition: 0.3s; white-space: nowrap; }
  .balance-badge:hover { border-color: var(--accent); }
  .balance-badge .lbl { color: var(--text-muted); font-weight: 600; font-size: 10px; text-transform: uppercase; letter-spacing: 1px; }
  .balance-badge .val { color: var(--accent); font-weight: 900; font-size: 13px; }

  .crash-layout { display: flex; width: 100%; flex: 1; min-height: 0; padding: 16px; gap: 16px; max-width: 1400px; margin: 0 auto; overflow: hidden; }

  .sidebar-bets { width: 320px; background: var(--bg-panel); border: 1px solid var(--border); border-radius: 20px; display: flex; flex-direction: column; flex-shrink: 0; overflow: hidden; }
  .tabs { display: flex; padding: 12px; gap: 8px; border-bottom: 1px solid var(--border); background: var(--bg-dark); }
  .tab-btn { flex: 1; background: transparent; border: none; color: var(--text-muted); font-size: 11px; font-weight: 700; padding: 7px 0; cursor: pointer; border-radius: 8px; transition: 0.2s; text-transform: uppercase; }
  .tab-btn.active { background: rgba(255,255,255,0.1); color: #fff; }
  .bets-header { display: grid; grid-template-columns: 2.2fr 1fr 1fr 1.3fr; padding: 10px 14px; font-size: 10px; color: var(--text-muted); font-weight: 700; text-transform: uppercase; border-bottom: 1px solid var(--border); }
  .bets-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; }
  .bet-row { display: grid; grid-template-columns: 2.2fr 1fr 1fr 1.3fr; padding: 10px 14px; align-items: center; font-size: 12px; border-bottom: 1px solid rgba(255,255,255,0.02); }
  .bet-row:hover { background: rgba(255,255,255,0.03); }
  .bet-user { display: flex; align-items: center; gap: 8px; font-weight: 600; min-width: 0; }
  .user-avatar { width: 24px; height: 24px; border-radius: 50%; background: linear-gradient(135deg, #00e5ff, #0077ff); display: flex; justify-content: center; align-items: center; font-size: 9px; font-weight: 900; color: #fff; letter-spacing: 0.3px; flex-shrink: 0; text-shadow: 0 1px 2px rgba(0,0,0,0.3); box-shadow: 0 0 8px rgba(0,229,255,0.3); }
  .user-meta { display: flex; flex-direction: column; min-width: 0; line-height: 1.2; }
  .user-name { font-weight: 700; font-size: 11px; letter-spacing: 0.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .user-rank { font-size: 9px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px; margin-top: 2px; }
  .user-rank.Bronze   { color: #e8a76a; }
  .user-rank.Silver   { color: #d9d9d9; }
  .user-rank.Gold     { color: #f1c40f; }
  .user-rank.Platinum { color: #e5e4e2; }
  .user-rank.Diamond  { color: #b9f2ff; }
  .user-rank.VIP      { color: #ffe066; text-shadow: 0 0 6px rgba(212,175,55,0.7); }
  .bet-amount { color: var(--text-muted); font-weight: 600; font-size: 11px; }
  .bet-mult { display: inline-block; padding: 2px 6px; border-radius: 6px; font-weight: 800; font-size: 11px; text-align: center; }
  .bet-mult.win { background: rgba(63,191,127,0.2); color: var(--accent-green); }
  .bet-mult.lose { background: transparent; color: var(--text-muted); }
  .bet-cashout { text-align: right; font-weight: 800; color: var(--accent-green); font-size: 11px; }

  .game-area { flex: 1; display: flex; flex-direction: column; gap: 12px; min-width: 0; min-height: 0; }

  .history-bar { display: flex; align-items: center; gap: 10px; background: var(--bg-panel); border: 1px solid var(--border); border-radius: 20px; padding: 10px 16px; flex-shrink: 0; }
  .history-title { font-size: 12px; font-weight: 700; color: var(--text-muted); margin-right: 6px; flex-shrink: 0; }
  .history-list { display: flex; gap: 6px; overflow-x: auto; flex: 1; scrollbar-width: none; }
  .history-list::-webkit-scrollbar { display: none; }
  .history-item { padding: 5px 12px; border-radius: 20px; font-size: 12px; font-weight: 800; flex-shrink: 0; }
  .history-item.red    { background: rgba(255,77,77,0.2);   color: #ff8a8a; border: 1px solid rgba(255,77,77,0.45); }
  .history-item.blue   { background: rgba(0,119,255,0.2);   color: #66b3ff; border: 1px solid rgba(0,119,255,0.45); }
  .history-item.purple { background: rgba(168,85,247,0.2);  color: #d8b4fe; border: 1px solid rgba(168,85,247,0.45); }
  .history-item.gold   { background: rgba(241,196,15,0.2);  color: #ffe066; border: 1px solid rgba(241,196,15,0.55); box-shadow: 0 0 10px rgba(241,196,15,0.35); }

  .canvas-container { flex: 1; background: linear-gradient(180deg, #131624, #090a10); border: 1px solid var(--border); border-radius: 20px; position: relative; overflow: hidden; display: flex; justify-content: center; align-items: center; box-shadow: inset 0 0 50px rgba(0,0,0,0.5); min-height: 200px; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .multiplier-display { position: absolute; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center; pointer-events: none; }
  .mult-value { font-size: 72px; font-weight: 900; color: #fff; text-shadow: 0 5px 30px rgba(0,229,255,0.4); line-height: 1; transition: color 0.3s, text-shadow 0.3s; }
  .mult-value.crashed { color: var(--red); text-shadow: 0 5px 30px rgba(255,77,77,0.4); }
  .mult-value.golden { color: var(--gold); text-shadow: 0 5px 30px rgba(255,215,0,0.6); }
  .mult-label { font-size: 13px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 2px; margin-top: 10px; font-weight: 700; min-height: 16px; }

  .control-panel { background: var(--bg-panel); border: 1px solid var(--border); border-radius: 20px; padding: 16px; display: flex; gap: 16px; flex-shrink: 0; }
  .bet-box { flex: 1; background: var(--bg-dark); border: 1px solid var(--border); border-radius: 16px; padding: 12px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
  .bet-options { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .check-group { display: flex; gap: 10px; }
  .check-label { display: flex; align-items: center; gap: 5px; font-size: 11px; color: var(--text-muted); font-weight: 600; cursor: pointer; }
  .check-label input { accent-color: var(--accent); cursor: pointer; }
  .mult-input { font-size: 11px; color: var(--text-muted); font-weight: 700; white-space: nowrap; }
  .mult-input input { width: 46px; background: transparent; border: none; color: #fff; font-weight: 700; outline: none; font-size: 12px; }
  .amount-row { display: flex; gap: 8px; }
  .amount-input-wrap { flex: 1; display: flex; align-items: center; background: rgba(0,0,0,0.4); border: 1px solid var(--border); border-radius: 12px; padding: 4px; min-width: 0; }
  .amount-input-wrap button { width: 36px; height: 36px; border-radius: 8px; background: rgba(255,255,255,0.05); border: none; color: #fff; font-size: 18px; cursor: pointer; font-weight: 700; transition: 0.2s; flex-shrink: 0; }
  .amount-input-wrap button:hover { background: rgba(255,255,255,0.1); }
  .amount-input-wrap input { flex: 1; min-width: 0; background: transparent; border: none; color: #fff; text-align: center; font-size: 18px; font-weight: 800; outline: none; font-family: inherit; }
  .btn-action { flex: 1; border: none; border-radius: 12px; font-size: 16px; font-weight: 900; cursor: pointer; text-transform: uppercase; letter-spacing: 1px; transition: 0.2s; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.2; min-width: 0; padding: 8px 10px; }
  .btn-action .subtext { font-size: 11px; font-weight: 600; opacity: 0.85; margin-top: 3px; }
  .btn-bet { background: var(--yellow); color: #000; box-shadow: 0 0 20px rgba(241,196,15,0.2); }
  .btn-bet:hover { background: #f7d341; }
  .btn-bet:disabled { opacity: 0.5; cursor: not-allowed; box-shadow: none; }
  .btn-cancel { background: var(--red); color: #fff; box-shadow: 0 0 20px rgba(255,77,77,0.2); }
  .btn-cancel:hover { background: #ff3333; }
  .quick-bets { display: flex; gap: 6px; }
  .quick-bets button { flex: 1; background: rgba(255,255,255,0.05); border: 1px solid var(--border); color: var(--text-muted); padding: 6px; border-radius: 8px; font-size: 11px; font-weight: 700; cursor: pointer; }
  .quick-bets button:hover { background: rgba(255,255,255,0.1); color: #fff; }

  .toast-container { position: fixed; top: 60px; right: 16px; z-index: 9999; display: flex; flex-direction: column; gap: 8px; }
  .toast { background: rgba(24,26,36,0.95); border-left: 4px solid var(--accent); padding: 12px 16px; border-radius: 8px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); min-width: 220px; transform: translateX(120%); transition: transform 0.3s; display: flex; align-items: center; gap: 10px; }
  .toast.show { transform: translateX(0); }
  .toast.success { border-left-color: var(--accent-green); }
  .toast.error { border-left-color: var(--red); }

  @media (max-width: 1200px) {
    .sidebar-bets { width: 280px; }
    .mult-value { font-size: 64px; }
  }

  @media (max-width: 900px) {
    html, body { height: auto; min-height: 100%; overflow: auto; }
    body { height: auto; min-height: 100dvh; overflow-y: auto; display: block; }
    .topbar { padding: 10px 14px; }
    .topbar-logo { font-size: 16px; letter-spacing: 1px; }
    .home-btn { padding: 6px 10px; font-size: 11px; }
    .balance-badge { padding: 6px 10px; font-size: 12px; }
    .balance-badge .lbl { display: none; }
    .balance-badge .val { font-size: 12px; }
    .crash-layout { display: flex; flex-direction: column; padding: 10px; gap: 10px; max-width: none; min-height: auto; height: auto; overflow: visible; }
    .game-area { flex: none; display: flex; flex-direction: column; gap: 10px; min-height: auto; order: 1; }
    .history-bar { padding: 8px 12px; border-radius: 14px; }
    .history-title { font-size: 11px; }
    .history-item { padding: 4px 10px; font-size: 11px; }
    .canvas-container { flex: none; width: 100%; height: 42vh; min-height: 220px; max-height: 340px; border-radius: 16px; }
    .mult-value { font-size: 52px; }
    .mult-label { font-size: 11px; letter-spacing: 1px; margin-top: 6px; }
    .control-panel { flex-direction: column; padding: 10px; gap: 10px; border-radius: 16px; }
    .bet-box { padding: 12px; gap: 10px; border-radius: 14px; }
    .sidebar-bets { width: 100%; height: 260px; min-height: 200px; order: 2; flex-shrink: 0; border-radius: 16px; }
    .toast-container { top: 60px; right: 8px; left: 8px; }
    .toast { min-width: 0; width: 100%; transform: translateY(-120%); }
    .toast.show { transform: translateY(0); }
  }

  @media (max-width: 480px) {
    .crash-layout { padding: 8px; gap: 8px; }
    .canvas-container { height: 38vh; min-height: 200px; max-height: 300px; }
    .mult-value { font-size: 42px; }
    .mult-label { font-size: 10px; letter-spacing: 0.5px; }
    .history-bar { padding: 6px 10px; }
    .history-title { font-size: 10px; }
    .history-item { padding: 3px 8px; font-size: 10px; }
    .amount-input-wrap { padding: 3px; }
    .amount-input-wrap button { width: 32px; height: 32px; font-size: 16px; }
    .amount-input-wrap input { font-size: 16px; }
    .btn-action { font-size: 13px; padding: 6px 6px; }
    .btn-action .subtext { font-size: 10px; }
    .quick-bets { gap: 4px; }
    .quick-bets button { font-size: 10px; padding: 5px 4px; }
    .bet-options { flex-wrap: wrap; gap: 6px; }
    .check-label { font-size: 10px; }
    .mult-input { font-size: 10px; }
    .mult-input input { width: 40px; font-size: 11px; }
    .sidebar-bets { height: 220px; min-height: 180px; }
    .bets-header { padding: 8px 10px; font-size: 9px; }
    .bet-row { padding: 8px 10px; font-size: 11px; }
    .user-avatar { width: 20px; height: 20px; font-size: 8px; }
    .user-name { font-size: 10px; }
    .user-rank { font-size: 8px; }
    .bet-amount { font-size: 10px; }
    .bet-mult { font-size: 10px; padding: 2px 5px; }
    .bet-cashout { font-size: 10px; }
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-left">
    <div class="topbar-logo">KINGWIN</div>
    <a href="/" class="home-btn">← На главную</a>
  </div>
  <div class="balance-badge" id="balanceBadge">
    <span class="lbl">Баланс</span>
    <span class="val" id="balanceVal">0.00 ₽</span>
  </div>
</div>

<div class="toast-container" id="toastContainer"></div>

<div class="crash-layout">
  <aside class="sidebar-bets">
    <div class="tabs">
      <button class="tab-btn active">Все ставки</button>
      <button class="tab-btn">Мои ставки</button>
      <button class="tab-btn">Топ</button>
    </div>
    <div class="bets-header">
      <div>Игрок</div>
      <div>Ставка</div>
      <div>Множ.</div>
      <div style="text-align:right">Выигрыш</div>
    </div>
    <div class="bets-list" id="betsList"></div>
  </aside>

  <div class="game-area">
    <div class="history-bar">
      <div class="history-title">История</div>
      <div class="history-list" id="historyList"></div>
    </div>

    <div class="canvas-container">
      <canvas id="gameCanvas"></canvas>
      <div class="multiplier-display">
        <div class="mult-value" id="multValue">1.00x</div>
        <div class="mult-label" id="multLabel">Ожидание первой ставки...</div>
      </div>
    </div>

    <div class="control-panel">
      <div class="bet-box">
        <div class="bet-options">
          <div class="check-group">
            <label class="check-label"><input type="checkbox" id="autoCashout1" checked> Автовывод</label>
          </div>
          <div class="mult-input">x <input type="number" id="autoMult1" value="2.00" step="0.1"></div>
        </div>
        <div class="amount-row">
          <div class="amount-input-wrap">
            <button onclick="changeAmount(1, -10)">−</button>
            <input type="number" id="betAmount1" value="10" min="10" max="100">
            <button onclick="changeAmount(1, 10)">+</button>
          </div>
          <button class="btn-action btn-bet" id="btnBet1" onclick="placeBet(1)">
            Ставка
            <div class="subtext" id="subtext1">10 ₽</div>
          </button>
        </div>
        <div class="quick-bets">
          <button onclick="setAmount(1, 10)">10</button>
          <button onclick="setAmount(1, 25)">25</button>
          <button onclick="setAmount(1, 50)">50</button>
          <button onclick="setAmount(1, 100)">100</button>
        </div>
      </div>

      <div class="bet-box">
        <div class="bet-options">
          <div class="check-group">
            <label class="check-label"><input type="checkbox" id="autoCashout2" checked> Автовывод</label>
          </div>
          <div class="mult-input">x <input type="number" id="autoMult2" value="2.00" step="0.1"></div>
        </div>
        <div class="amount-row">
          <div class="amount-input-wrap">
            <button onclick="changeAmount(2, -10)">−</button>
            <input type="number" id="betAmount2" value="10" min="10" max="100">
            <button onclick="changeAmount(2, 10)">+</button>
          </div>
          <button class="btn-action btn-bet" id="btnBet2" onclick="placeBet(2)">
            Ставка
            <div class="subtext" id="subtext2">10 ₽</div>
          </button>
        </div>
        <div class="quick-bets">
          <button onclick="setAmount(2, 10)">10</button>
          <button onclick="setAmount(2, 25)">25</button>
          <button onclick="setAmount(2, 50)">50</button>
          <button onclick="setAmount(2, 100)">100</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
const PLAYER_KEY = 'kingwin_player_id';
const MAX_BET = 100;
const MIN_BET = 10;
const POLL_MS = 300;

let playerId = localStorage.getItem(PLAYER_KEY);
let playerBalance = 0;

let myBetIds = { 1: null, 2: null };
let myCashed = { 1: false, 2: false };

let round = {
  id: null,
  status: 'waiting',
  startTime: 0,
  crashPoint: 1,
  serverMult: 1,
  bets: [],
  history: [],
  hasRealBet: false
};

let graphPoints = [];
let lastGraphRoundId = null;
let lastBetsSig = '';
let lastHistorySig = '';

let localCrashed = false;
let localCrashMult = 1;
let crashedRoundId = null;

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const multValueEl = document.getElementById('multValue');
const multLabelEl = document.getElementById('multLabel');

function resizeCanvas() {
  const p = canvas.parentElement;
  const dpr = window.devicePixelRatio || 1;
  canvas.width = p.clientWidth * dpr;
  canvas.height = p.clientHeight * dpr;
  canvas.style.width = p.clientWidth + 'px';
  canvas.style.height = p.clientHeight + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener('resize', resizeCanvas);
window.addEventListener('orientationchange', () => setTimeout(resizeCanvas, 200));
resizeCanvas();

function historyColorClass(mult) {
  if (mult >= 10) return 'gold';
  if (mult >= 4) return 'purple';
  if (mult > 1.50) return 'blue';
  return 'red';
}

function resetLocalCrash() {
  localCrashed = false;
  localCrashMult = 1;
  crashedRoundId = null;
  graphPoints = [];
  prevMult = 1;
}

async function loadBalance() {
  if (!playerId) {
    document.getElementById('balanceVal').textContent = '0.00 ₽';
    return;
  }
  try {
    const r = await fetch('/api/guest/me?id=' + encodeURIComponent(playerId));
    const d = await r.json();
    if (r.ok && d.guest) {
      playerBalance = parseFloat(d.guest.bonus_balance) || 0;
      document.getElementById('balanceVal').textContent = playerBalance.toFixed(2) + ' ₽';
    }
  } catch(e) {}
}
loadBalance();
setInterval(loadBalance, 5000);

document.getElementById('balanceBadge').addEventListener('click', () => {
  window.location.href = '/';
});

function currentLocalMultiplier() {
  if (localCrashed && crashedRoundId !== round.id) {
    resetLocalCrash();
  }

  if (round.status === 'waiting') return 1;
  if (round.status === 'crashed' || localCrashed) return localCrashMult;
  if (round.status === 'flying' && round.startTime) {
    const elapsed = Date.now() - round.startTime;
    return Math.pow(1.00006, elapsed);
  }
  return 1;
}

function rebuildGraphFromStart() {
  graphPoints = [];
  if (!round.startTime) return;

  const elapsedMs = Date.now() - round.startTime;
  if (elapsedMs <= 0) {
    graphPoints.push({ x: 0, y: 1 });
    return;
  }

  const stepMs = 80;
  const isCrashed = (round.status === 'crashed') || (localCrashed && crashedRoundId === round.id);
  const capMult = isCrashed ? round.crashPoint : Infinity;

  for (let t = 0; t <= elapsedMs; t += stepMs) {
    let m = Math.pow(1.00006, t);
    if (isCrashed && m >= round.crashPoint) {
      const crashMs = Math.log(round.crashPoint) / Math.log(1.00006);
      graphPoints.push({ x: crashMs / 1000, y: round.crashPoint });
      return;
    }
    graphPoints.push({ x: t / 1000, y: Math.min(m, capMult) });
  }

  const lastT = elapsedMs / 1000;
  const lastM = currentLocalMultiplier();
  const last = graphPoints[graphPoints.length - 1];
  if (!last || last.x < lastT) {
    graphPoints.push({ x: lastT, y: lastM });
  } else if (last) {
    last.y = lastM;
  }
}

async function pollRound() {
  try {
    const r = await fetch('/api/crash/current');
    const d = await r.json();
    applyServerState(d);
  } catch(e) {}
}

function applyServerState(d) {
  const isNewRound = round.id !== null && d.roundId !== round.id;
  const roundChanged = round.id !== d.roundId;

  if (isNewRound || roundChanged) {
    myBetIds = { 1: null, 2: null };
    myCashed = { 1: false, 2: false };
    resetLocalCrash();
    loadBalance();
  }

  const prevStatus = round.status;
  if (prevStatus === 'crashed' && d.status !== 'crashed') {
    resetLocalCrash();
  }

  round.id = d.roundId;
  round.status = d.status;
  round.startTime = d.startTime || 0;
  round.crashPoint = d.crashPoint || round.crashPoint || 1;
  round.serverMult = parseFloat(d.multiplier) || 1;
  round.bets = d.bets || [];
  round.history = d.history || [];
  round.hasRealBet = d.hasRealBet || false;

  if (d.status === 'crashed') {
    if (!localCrashed) {
      localCrashed = true;
      localCrashMult = round.crashPoint;
      crashedRoundId = round.id;
    }
  }

  if (roundChanged) {
    lastGraphRoundId = d.roundId;
    graphPoints = [];
    if ((d.status === 'flying' || d.status === 'crashed') && d.startTime) {
      rebuildGraphFromStart();
    }
  }

  renderBets(round.bets);
  renderHistory(round.history);
  updateBetButtons();
}

let prevMult = 1;

function frame() {
  if (localCrashed && crashedRoundId !== round.id) {
    resetLocalCrash();
  }

  const mult = currentLocalMultiplier();

  if (Math.abs(mult - prevMult) > 0.001) {
    multValueEl.textContent = mult.toFixed(2) + 'x';
    prevMult = mult;
  }

  const effStatus = localCrashed ? 'crashed' : round.status;

  if (effStatus === 'waiting') {
    multValueEl.classList.remove('crashed');
    multValueEl.classList.remove('golden');
    
    // СКРЫВАЕМ СТАРОЕ ЧИСЛО - ставим 1.00x
    multValueEl.style.opacity = '0.3'; 
    multValueEl.textContent = '1.00x';

    if (round.status === 'crashed') {
      multLabelEl.textContent = 'Готовимся к вылету...';
    } else if (!round.hasRealBet) {
      multLabelEl.textContent = 'Ожидание первой ставки...';
    } else {
      multLabelEl.textContent = 'Готовимся к росту...';
    }
    
    graphPoints = [];
  } else if (effStatus === 'flying') {
    multValueEl.classList.remove('crashed');
    multValueEl.style.opacity = '1';
    multLabelEl.textContent = ''; 
    
    if (mult >= 10) {
      multValueEl.classList.add('golden');
    } else {
      multValueEl.classList.remove('golden');
    }

    if (round.startTime) {
      const t = (Date.now() - round.startTime) / 1000;
      const last = graphPoints[graphPoints.length - 1];
      if (!last || t > last.x + 0.001) {
        graphPoints.push({ x: t, y: mult });
        if (graphPoints.length > 2000) graphPoints.shift();
      } else if (last) {
        last.y = mult;
      }
    }
    [1, 2].forEach(id => {
      if (myBetIds[id] && !myCashed[id]) {
        const box = document.getElementById('autoCashout' + id);
        const target = parseFloat(document.getElementById('autoMult' + id).value) || 0;
        if (box.checked && mult >= target) doCashout(id);
      }
    });
  } else if (effStatus === 'crashed') {
    multValueEl.classList.add('crashed');
    multValueEl.style.opacity = '1';
    multLabelEl.textContent = ''; // Убрали слово "КРАШ"
    
    if (round.startTime) {
      const crashSec = Math.log(round.crashPoint) / Math.log(1.00006) / 1000;
      const last = graphPoints[graphPoints.length - 1];
      if (!last || last.y < round.crashPoint - 0.001 || last.x < crashSec - 0.001) {
        graphPoints.push({ x: crashSec, y: round.crashPoint });
      }
    }
  }

  drawGraph(mult, effStatus);
  updateBetButtonsLive(mult, effStatus);

  requestAnimationFrame(frame);
}

function drawGraph(currentMult, status) {
  const W = canvas.width / (window.devicePixelRatio || 1);
  const H = canvas.height / (window.devicePixelRatio || 1);
  ctx.clearRect(0, 0, W, H);

  ctx.strokeStyle = 'rgba(255,255,255,0.05)';
  ctx.lineWidth = 1;
  for (let i = 0; i < H; i += 60) {
    ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(W, i); ctx.stroke();
  }
  for (let i = 0; i < W; i += 60) {
    ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, H); ctx.stroke();
  }

  if ((status === 'flying' || status === 'crashed') && graphPoints.length > 1) {
    const paddingL = 30, paddingR = 20, paddingT = 30, paddingB = 30;
    const drawW = W - paddingL - paddingR;
    const drawH = H - paddingT - paddingB;

    const lastX = graphPoints[graphPoints.length - 1].x;
    const maxX = Math.max(3, lastX);
    const maxY = Math.max(currentMult * 1.15, 1.5);

    let lineColor = '#00e5ff';
    let shadowColor = 'rgba(0,229,255,0.5)';
    
    if (status === 'crashed') {
      lineColor = '#ff4d4d';
      shadowColor = 'rgba(255,77,77,0.5)';
    } else if (currentMult >= 10) {
      lineColor = '#ffd700';
      shadowColor = 'rgba(255,215,0,0.6)';
    }

    ctx.beginPath();
    ctx.strokeStyle = lineColor;
    ctx.lineWidth = 3;
    ctx.lineJoin = 'round';
    ctx.shadowBlur = 10;
    ctx.shadowColor = shadowColor;

    for (let i = 0; i < graphPoints.length; i++) {
      const p = graphPoints[i];
      const px = paddingL + (p.x / maxX) * drawW;
      const py = paddingT + drawH - ((p.y - 1) / (maxY - 1)) * drawH;
      if (i === 0) ctx.moveTo(px, py);
      else ctx.lineTo(px, py);
    }
    ctx.stroke();
    ctx.shadowBlur = 0;

    const lastP = graphPoints[graphPoints.length - 1];
    const lx = paddingL + (lastP.x / maxX) * drawW;
    const ly = paddingT + drawH - ((lastP.y - 1) / (maxY - 1)) * drawH;
    
    ctx.beginPath();
    ctx.fillStyle = lineColor;
    ctx.arc(lx, ly, 5, 0, Math.PI * 2);
    ctx.fill();
    
    ctx.shadowBlur = 18;
    ctx.shadowColor = shadowColor;
    ctx.beginPath();
    ctx.arc(lx, ly, 5, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
  }
}

function renderBets(bets) {
  const sig = (bets || []).map(b => `${b.id}:${b.cashed_out ? b.cashout_mult : 'p'}`).join('|');
  if (sig === lastBetsSig) return;
  lastBetsSig = sig;

  const list = document.getElementById('betsList');
  if (!bets || !bets.length) { list.innerHTML = ''; return; }

  list.innerHTML = bets.map(b => {
    const isMine = b.player_id && String(b.player_id) === String(playerId);
    const masked = b.player_name || '••••';
    const rank = b.player_rank || '';
    const label = (isMine ? '★ ' : '') + masked;
    let multHtml = '--';
    let winHtml = '--';
    if (b.cashed_out) {
      const m = parseFloat(b.cashout_mult);
      const w = parseFloat(b.amount) * m;
      multHtml = `<span class="bet-mult win">${m.toFixed(2)}x</span>`;
      winHtml = `${w.toFixed(2)} ₽`;
    }
    return `
      <div class="bet-row">
        <div class="bet-user">
          <div class="user-avatar">KW</div>
          <div class="user-meta">
            <div class="user-name">${label}</div>
            ${rank ? `<div class="user-rank ${rank}">${rank}</div>` : ''}
          </div>
        </div>
        <div class="bet-amount">${parseFloat(b.amount).toFixed(2)} ₽</div>
        <div>${multHtml}</div>
        <div class="bet-cashout">${winHtml}</div>
      </div>
    `;
  }).join('');
}

function renderHistory(history) {
  const sig = (history || []).join('|');
  if (sig === lastHistorySig) return;
  lastHistorySig = sig;

  const list = document.getElementById('historyList');
  if (!history || !history.length) { list.innerHTML = ''; return; }
  list.innerHTML = history.map(m => {
    const cls = historyColorClass(m);
    return `<div class="history-item ${cls}">${parseFloat(m).toFixed(2)}x</div>`;
  }).join('');
}

function updateBetButtons() {
  const effStatus = localCrashed ? 'crashed' : round.status;
  [1, 2].forEach(id => {
    const btn = document.getElementById('btnBet' + id);
    const betId = myBetIds[id];
    const cashed = myCashed[id];

    if (effStatus === 'waiting') {
      if (betId) {
        btn.className = 'btn-action btn-cancel';
        btn.innerHTML = `Отмена <div class="subtext">Ожидание...</div>`;
        btn.disabled = false;
      } else {
        const amt = parseInt(document.getElementById('betAmount' + id).value) || 10;
        btn.className = 'btn-action btn-bet';
        btn.innerHTML = `Ставка <div class="subtext" id="subtext${id}">${amt} ₽</div>`;
        btn.disabled = false;
      }
    } else if (effStatus === 'flying') {
      if (betId && !cashed) {
        btn.className = 'btn-action btn-cancel';
        btn.disabled = false;
      } else if (cashed) {
        btn.className = 'btn-action btn-bet';
        btn.innerHTML = `Выведено <div class="subtext">✓</div>`;
        btn.disabled = true;
      } else {
        btn.className = 'btn-action btn-bet';
        btn.innerHTML = `Ставка <div class="subtext">Раунд идёт</div>`;
        btn.disabled = true;
      }
    } else {
      btn.className = 'btn-action btn-bet';
      btn.innerHTML = `Ставка <div class="subtext">Ждите</div>`;
      btn.disabled = true;
    }
  });
}

function updateBetButtonsLive(mult, effStatus) {
  [1, 2].forEach(id => {
    if (effStatus === 'flying' && myBetIds[id] && !myCashed[id]) {
      const btn = document.getElementById('btnBet' + id);
      const amt = getBetAmountById(myBetIds[id], round.bets);
      if (amt > 0) {
        const val = (amt * mult).toFixed(2);
        const html = `Забрать <div class="subtext">${val} ₽</div>`;
        if (btn.innerHTML !== html) btn.innerHTML = html;
      }
    }
  });
}

function getBetAmountById(betId, bets) {
  if (!bets) return 0;
  const b = bets.find(x => x.id === betId);
  return b ? parseFloat(b.amount) : 0;
}

function changeAmount(id, diff) {
  const input = document.getElementById('betAmount' + id);
  let val = parseInt(input.value) || MIN_BET;
  val += diff;
  if (val < MIN_BET) val = MIN_BET;
  if (val > MAX_BET) val = MAX_BET;
  input.value = val;
  document.getElementById('subtext' + id).textContent = val + ' ₽';
  if (round.status === 'waiting' && !myBetIds[id]) updateBetButtons();
}

function setAmount(id, val) {
  if (val < MIN_BET) val = MIN_BET;
  if (val > MAX_BET) val = MAX_BET;
  document.getElementById('betAmount' + id).value = val;
  document.getElementById('subtext' + id).textContent = val + ' ₽';
  if (round.status === 'waiting' && !myBetIds[id]) updateBetButtons();
}

async function placeBet(id) {
  if (myBetIds[id]) {
    if (round.status === 'flying' && !myCashed[id] && !localCrashed) return doCashout(id);
    if (round.status === 'waiting') {
      showToast('Ставка уже принята', 'error');
      return;
    }
    return;
  }

  if (!playerId) {
    showToast('Войдите в аккаунт', 'error');
    return;
  }
  const amt = parseInt(document.getElementById('betAmount' + id).value) || MIN_BET;
  if (amt < MIN_BET || amt > MAX_BET) {
    showToast(`Ставка от ${MIN_BET} до ${MAX_BET} ₽`, 'error');
    return;
  }

  const btn = document.getElementById('btnBet' + id);
  btn.disabled = true;

  try {
    const r = await fetch('/api/crash/bet', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ player_id: playerId, amount: amt })
    });
    const d = await r.json();
    if (!r.ok) {
      showToast(d.error || 'Ошибка ставки', 'error');
      btn.disabled = false;
      return;
    }
    myBetIds[id] = d.bet.id;
    myCashed[id] = false;
    if (d.bet.round_id !== crashedRoundId) {
      resetLocalCrash();
    }
    showToast(`Ставка ${amt} ₽ принята`, 'success');
    loadBalance();
    pollRound();
  } catch(e) {
    showToast('Ошибка соединения', 'error');
    btn.disabled = false;
  }
}

async function doCashout(id) {
  if (!myBetIds[id] || myCashed[id]) return;
  const betId = myBetIds[id];
  myCashed[id] = true;

  try {
    const r = await fetch('/api/crash/cashout', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ bet_id: betId })
    });
    const d = await r.json();
    if (!r.ok) {
      showToast(d.error || 'Ошибка вывода', 'error');
      myCashed[id] = false;
      return;
    }
    showToast(`Выведено ${d.win.toFixed(2)} ₽ (x${d.mult.toFixed(2)})`, 'success');
    loadBalance();
    pollRound();
  } catch(e) {
    showToast('Ошибка соединения', 'error');
    myCashed[id] = false;
  }
}

function showToast(text, type='success') {
  const c = document.getElementById('toastContainer');
  const t = document.createElement('div');
  t.className = `toast ${type}`;
  t.innerHTML = `<div style="font-size:13px;font-weight:600;color:#fff">${text}</div>`;
  c.appendChild(t);
  setTimeout(() => t.classList.add('show'), 10);
  setTimeout(() => {
    t.classList.remove('show');
    setTimeout(() => t.remove(), 300);
  }, 3000);
}

pollRound();
setInterval(pollRound, POLL_MS);
requestAnimationFrame(frame);
</script>
