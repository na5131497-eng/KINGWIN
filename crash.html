<style>
  :root { --bg-main: #090a10; --bg-panel: #181a24; --bg-dark: #11121a; --accent: #00e5ff; --accent-green: #00ff88; --text-main: #fff; --text-muted: #8b92a5; --border: rgba(255,255,255,0.06); --red: #ff4d4d; --yellow: #f1c40f; --gold: #ffd700; }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Montserrat', sans-serif; }
  html, body { height: 100%; }
  body { background: var(--bg-main); color: var(--text-main); height: 100vh; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }

  .float-menu-btn { position: fixed; top: 15px; left: 15px; z-index: 1000; background: #181a24; border: 1px solid #00e5ff; color: #00e5ff; width: 44px; height: 44px; border-radius: 10px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 24px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); transition: 0.3s; }

  .float-menu { position: fixed; top: 15px; left: 70px; z-index: 999; background: rgba(17,18,26,0.95); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; padding: 10px; display: flex; flex-direction: column; gap: 6px; width: 180px; box-shadow: 0 10px 30px rgba(0,0,0,0.6); transform: translateX(-20px); opacity: 0; pointer-events: none; transition: 0.3s; }

  .float-menu a:hover { background: rgba(0,229,255,0.1); color: #00e5ff; border-color: rgba(0,229,255,0.3); }

  .topbar { display: flex; justify-content: space-between; align-items: center; padding: 10px 16px; padding-left: 70px; background: var(--bg-panel); border-bottom: 1px solid var(--border); flex-shrink: 0; z-index: 100; }
  .topbar-logo { font-size: 18px; font-weight: 900; letter-spacing: 2px; background: linear-gradient(135deg, #00e5ff, #0077ff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; flex-shrink: 0; }
  .balance-badge { display: flex; align-items: center; gap: 6px; background: rgba(0,0,0,0.5); border: 1px solid rgba(0,229,255,0.35); padding: 6px 12px; border-radius: 20px; font-size: 12px; font-weight: 700; cursor: pointer; transition: 0.3s; white-space: nowrap; }
  .balance-badge .lbl { color: var(--text-muted); font-weight: 600; font-size: 10px; text-transform: uppercase; letter-spacing: 1px; }
  .balance-badge .val { color: var(--accent); font-weight: 900; font-size: 13px; }

  .crash-layout { display: flex; width: 100%; flex: 1; min-height: 0; padding: 16px; gap: 16px; max-width: 1400px; margin: 0 auto; overflow: hidden; }
  .sidebar-bets { width: 320px; background: var(--bg-panel); border: 1px solid var(--border); border-radius: 20px; display: flex; flex-direction: column; flex-shrink: 0; overflow: hidden; }
  .tabs { display: flex; padding: 12px; gap: 8px; border-bottom: 1px solid var(--border); background: var(--bg-dark); }

  .bets-header { display: grid; grid-template-columns: 2.2fr 1fr 1fr 1.3fr; padding: 10px 14px; font-size: 10px; color: var(--text-muted); font-weight: 700; text-transform: uppercase; border-bottom: 1px solid var(--border); }
  .bets-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; }
  .bet-row { display: grid; grid-template-columns: 2.2fr 1fr 1fr 1.3fr; padding: 10px 14px; align-items: center; font-size: 12px; border-bottom: 1px solid rgba(255,255,255,0.02); }
  .bet-row:hover { background: rgba(255,255,255,0.03); }
  .bet-user { display: flex; align-items: center; gap: 8px; font-weight: 600; min-width: 0; }
  .user-avatar { width: 24px; height: 24px; border-radius: 50%; background: linear-gradient(135deg, #00e5ff, #0077ff); display: flex; justify-content: center; align-items: center; font-size: 9px; font-weight: 900; color: #fff; letter-spacing: 0.3px; flex-shrink: 0; text-shadow: 0 1px 2px rgba(0,0,0,0.3); box-shadow: 0 0 8px rgba(0,229,255,0.3); }
  .user-meta { display: flex; flex-direction: column; min-width: 0; line-height: 1.2; }
  .user-name { font-weight: 700; font-size: 11px; letter-spacing: 0.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .user-rank { font-size: 9px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px; margin-top: 2px; }
  .user-rank.Bronze { color: #e8a76a; } .user-rank.Silver { color: #d9d9d9; } .user-rank.Gold { color: #f1c40f; } .user-rank.Platinum { color: #e5e4e2; } .user-rank.Diamond { color: #b9f2ff; } .user-rank.VIP { color: #ffe066; text-shadow: 0 0 6px rgba(212,175,55,0.7); }
  .bet-amount { color: var(--text-muted); font-weight: 600; font-size: 11px; }

  .game-area { flex: 1; display: flex; flex-direction: column; gap: 12px; min-width: 0; min-height: 0; }

  .history-title { font-size: 12px; font-weight: 700; color: var(--text-muted); margin-right: 6px; flex-shrink: 0; }
  .history-list { display: flex; gap: 6px; overflow-x: auto; flex: 1; scrollbar-width: none; }
  .history-item { padding: 5px 12px; border-radius: 20px; font-size: 12px; font-weight: 800; flex-shrink: 0; }
  .history-item.red { background: rgba(255,77,77,0.2); color: #ff8a8a; border: 1px solid rgba(255,77,77,0.45); }
  .history-item.blue { background: rgba(0,119,255,0.2); color: #66b3ff; border: 1px solid rgba(0,119,255,0.45); }
  .history-item.purple { background: rgba(168,85,247,0.2); color: #d8b4fe; border: 1px solid rgba(168,85,247,0.45); }

  .canvas-container { flex: 1; background: linear-gradient(180deg, #131624, #090a10); border: 1px solid var(--border); border-radius: 20px; position: relative; overflow: hidden; display: flex; justify-content: center; align-items: center; box-shadow: inset 0 0 50px rgba(0,0,0,0.5); min-height: 200px; }

  .btn-action { flex: 1; border: none; border-radius: 12px; font-size: 16px; font-weight: 900; cursor: pointer; text-transform: uppercase; letter-spacing: 1px; transition: 0.2s; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.2; min-width: 0; padding: 8px 10px; }

    color: #00e5ff; border: 2px solid #00e5ff;

  .btn-cashout::before { content: ''; position: absolute; top: -50%; left: -100%; width: 50%; height: 200%; background: linear-gradient(90deg, transparent, rgba(0,229,255,0.35), transparent); transform: skewX(-25deg); animation: cashoutShine 2.4s ease-in-out infinite; }
  .btn-cashout:hover { background: linear-gradient(135deg, #102a5a 0%, #2a5a9b 50%, #102a5a 100%); border-color: #33ebff; color: #33ebff; box-shadow: 0 0 25px rgba(0,229,255,0.7), 0 0 50px rgba(0,229,255,0.35), inset 0 0 20px rgba(0,229,255,0.15); }
  @keyframes cashoutPulse { 0%, 100% { box-shadow: 0 0 15px rgba(0,229,255,0.45), 0 0 30px rgba(0,229,255,0.2), inset 0 0 15px rgba(0,229,255,0.08); } 50% { box-shadow: 0 0 25px rgba(0,229,255,0.75), 0 0 45px rgba(0,229,255,0.35), inset 0 0 20px rgba(0,229,255,0.15); } }
  @keyframes cashoutShine { 0% { left: -100%; } 60%, 100% { left: 150%; } }

  .quick-bets button:disabled { opacity: 0.4; cursor: not-allowed; }

    .game-area { flex: none; display: flex; flex-direction: column; gap: 10px; min-height: auto; order: 1; }
    .history-bar { padding: 8px 12px; border-radius: 14px; }
    .history-title { font-size: 11px; }
    .history-item { padding: 4px 10px; font-size: 11px; }
    .canvas-container { flex: none; width: 100%; height: 42vh; min-height: 220px; max-height: 340px; border-radius: 16px; }
    .mult-value { font-size: 52px; }
    .mult-label { font-size: 11px; letter-spacing: 1px; margin-top: 6px; }
    .control-panel { flex-direction: column; padding: 10px; gap: 10px; border-radius: 16px; }
    .bet-box { padding: 12px; gap: 10px; border-radius: 14px; }
    .sidebar-bets { width: 100%; height: 260px; min-height: 200px; order: 2; flex-shrink: 0; border-radius: 16px; }
    .toast-container { top: 60px; right: 8px; left: 8px; }
    .toast { min-width: 0; width: 100%; transform: translateY(-120%); }
    .toast.show { transform: translateY(0); }
  }

  @media (max-width: 480px) {
    .crash-layout { padding: 8px; gap: 8px; }
    .canvas-container { height: 38vh; min-height: 200px; max-height: 300px; }
    .mult-value { font-size: 42px; }
    .mult-label { font-size: 10px; letter-spacing: 0.5px; }
    .history-bar { padding: 6px 10px; }
    .history-title { font-size: 10px; }
    .history-item { padding: 3px 8px; font-size: 10px; }
    .amount-input-wrap { padding: 3px; }
    .amount-input-wrap button { width: 32px; height: 32px; font-size: 16px; }
    .amount-input-wrap input { font-size: 16px; }
    .btn-action { font-size: 13px; padding: 6px 6px; }
    .btn-action .subtext { font-size: 10px; }
    .quick-bets { gap: 4px; }
    .quick-bets button { font-size: 10px; padding: 5px 4px; }
    .sidebar-bets { height: 220px; min-height: 180px; }
    .bets-header { padding: 8px 10px; font-size: 9px; }
    .bet-row { padding: 8px 10px; font-size: 11px; }
    .user-avatar { width: 20px; height: 20px; font-size: 8px; }
    .user-name { font-size: 10px; }
    .user-rank { font-size: 8px; }
    .bet-amount { font-size: 10px; }
    .bet-mult { font-size: 10px; padding: 2px 5px; }
    .bet-cashout { font-size: 10px; }
  }
</style>

<script>
const PLAYER_KEY = 'kingwin_guest_id';
const MAX_BET = 200;
const MIN_BET = 1;
const POLL_MS = 300;

let playerId = localStorage.getItem(PLAYER_KEY);
let playerBalance = 0;

let myBetIds = { 1: null, 2: null };
let myCashed = { 1: false, 2: false };
let queuedBets = { 1: null, 2: null };
let lastRoundIdSeen = null;

let round = {
  id: null, status: 'waiting', startTime: 0, crashPoint: 1,
  serverMult: 1, bets: [], history: [], hasRealBet: false
};

let graphPoints = [];
let lastGraphRoundId = null;
let lastBetsSig = '';
let lastHistorySig = '';

let localCrashed = false;
let localCrashMult = 1;
let crashedRoundId = null;
let timeOffset = 0;

/* ============ ЗВУКИ (Web Audio API) ============ */
let audioCtx = null;
let flyOsc = null;
let flyGain = null;
let flyActive = false;

function initAudio() {
  if (audioCtx) return;
  try {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  } catch(e) { audioCtx = null; }
}

// 1. Звук ставки — короткий «клик/всплеск»
function playBetSound() {
  initAudio();
  if (!audioCtx) return;
  const now = audioCtx.currentTime;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = 'triangle';
  osc.frequency.setValueAtTime(880, now);
  osc.frequency.exponentialRampToValueAtTime(1760, now + 0.08);
  gain.gain.setValueAtTime(0.0001, now);
  gain.gain.exponentialRampToValueAtTime(0.18, now + 0.01);
  gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.12);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start(now);
  osc.stop(now + 0.15);
}

// 2. Звук полёта — «космос»: глубокий гул с мерцанием
function startFlySound() {
  if (flyActive) return;
  initAudio();
  if (!audioCtx) return;
  flyActive = true;
  const now = audioCtx.currentTime;

  flyOsc = audioCtx.createOscillator();
  flyGain = audioCtx.createGain();
  flyOsc.type = 'sine';
  flyOsc.frequency.setValueAtTime(55, now);

  const lfo = audioCtx.createOscillator();
  const lfoGain = audioCtx.createGain();
  lfo.type = 'sine';
  lfo.frequency.setValueAtTime(0.5, now);
  lfoGain.gain.setValueAtTime(3, now);
  lfo.connect(lfoGain);
  lfoGain.connect(flyOsc.frequency);
  lfo.start(now);

  const filter = audioCtx.createBiquadFilter();
  filter.type = 'lowpass';
  filter.frequency.setValueAtTime(300, now);

  flyGain.gain.setValueAtTime(0.0001, now);
  flyGain.gain.exponentialRampToValueAtTime(0.05, now + 0.5);

  flyOsc.connect(filter);
  filter.connect(flyGain);
  flyGain.connect(audioCtx.destination);
  flyOsc.start(now);
  flyOsc._lfo = lfo;
}

function updateFlySound(mult) {
  if (!flyActive || !flyOsc || !audioCtx) return;
  const now = audioCtx.currentTime;
  const freq = Math.min(220, 55 + Math.log(mult) * 40);
  flyOsc.frequency.setTargetAtTime(freq, now, 0.2);
  const vol = Math.min(0.09, 0.04 + Math.log(mult) * 0.015);
  flyGain.gain.setTargetAtTime(vol, now, 0.2);
}

function stopFlySound() {
  if (!flyActive) return;
  flyActive = false;
  if (flyOsc && flyGain && audioCtx) {
    const now = audioCtx.currentTime;
    flyGain.gain.setTargetAtTime(0.0001, now, 0.08);
    if (flyOsc._lfo) { try { flyOsc._lfo.stop(now + 0.3); } catch(e){} }
    flyOsc.stop(now + 0.3);
    flyOsc = null;
    flyGain = null;
  }
}

// 3. Звук краша — «взрыв бомбы»
function playCrashSound() {
  initAudio();
  if (!audioCtx) return;
  const now = audioCtx.currentTime;

  // Низкий бум
  const boom = audioCtx.createOscillator();
  const boomGain = audioCtx.createGain();
  boom.type = 'sine';
  boom.frequency.setValueAtTime(80, now);
  boom.frequency.exponentialRampToValueAtTime(20, now + 0.6);
  boomGain.gain.setValueAtTime(0.6, now);
  boomGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.8);
  boom.connect(boomGain);
  boomGain.connect(audioCtx.destination);
  boom.start(now);
  boom.stop(now + 0.9);

  // Раскат
  const noiseSize = audioCtx.sampleRate * 1.2;
  const buffer = audioCtx.createBuffer(1, noiseSize, audioCtx.sampleRate);
  const data = buffer.getChannelData(0);
  for (let i = 0; i < noiseSize; i++) data[i] = Math.random() * 2 - 1;
  const noise = audioCtx.createBufferSource();
  noise.buffer = buffer;
  const noiseGain = audioCtx.createGain();
  noiseGain.gain.setValueAtTime(0.35, now);
  noiseGain.gain.exponentialRampToValueAtTime(0.0001, now + 1.2);
  const noiseFilter = audioCtx.createBiquadFilter();
  noiseFilter.type = 'lowpass';
  noiseFilter.frequency.setValueAtTime(800, now);
  noiseFilter.frequency.exponentialRampToValueAtTime(100, now + 1.2);
  noise.connect(noiseFilter);
  noiseFilter.connect(noiseGain);
  noiseGain.connect(audioCtx.destination);
  noise.start(now);

  // Треск детонатора
  const crackSize = audioCtx.sampleRate * 0.15;
  const crackBuf = audioCtx.createBuffer(1, crackSize, audioCtx.sampleRate);
  const crackData = crackBuf.getChannelData(0);
  for (let i = 0; i < crackSize; i++) crackData[i] = Math.random() * 2 - 1;
  const crack = audioCtx.createBufferSource();
  crack.buffer = crackBuf;
  const crackGain = audioCtx.createGain();
  crackGain.gain.setValueAtTime(0.2, now);
  crackGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.15);
  const crackFilter = audioCtx.createBiquadFilter();
  crackFilter.type = 'highpass';
  crackFilter.frequency.setValueAtTime(2000, now);
  crack.connect(crackFilter);
  crackFilter.connect(crackGain);
  crackGain.connect(audioCtx.destination);
  crack.start(now);
}

// 4. Звук забрал ставку — приятный «динь»
function playCashoutSound() {
  initAudio();
  if (!audioCtx) return;
  const now = audioCtx.currentTime;
  const freqs = [880, 1320];
  freqs.forEach((f, idx) => {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(f, now + idx * 0.08);
    gain.gain.setValueAtTime(0.0001, now + idx * 0.08);
    gain.gain.exponentialRampToValueAtTime(0.18, now + idx * 0.08 + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + idx * 0.08 + 0.25);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(now + idx * 0.08);
    osc.stop(now + idx * 0.08 + 0.3);
  });
}

function historyColorClass(mult) {
  if (mult >= 10) return 'gold';
  if (mult >= 4) return 'purple';
  if (mult > 1.50) return 'blue';
  return 'red';
}

function resetLocalCrash() {
  localCrashed = false; localCrashMult = 1; crashedRoundId = null;
  graphPoints = []; prevMult = 1;
}

async function loadBalance() {
  if (!playerId) { document.getElementById('balanceVal').textContent = '0.00 ₽'; return; }
  try {
    const r = await fetch('/api/guest/me?id=' + encodeURIComponent(playerId));
    const d = await r.json();
    if (r.ok && d.guest) {
      const total = (parseFloat(d.guest.bonus_balance) || 0) + (parseFloat(d.guest.deposit_balance) || 0);
      playerBalance = total;
      document.getElementById('balanceVal').textContent = playerBalance.toFixed(2) + ' ₽';
    }
  } catch(e) {}
}
loadBalance();
setInterval(loadBalance, 5000);

function currentLocalMultiplier() {
  if (localCrashed && crashedRoundId !== round.id) resetLocalCrash();
  if (round.status === 'waiting') return 1;
  if (round.status === 'crashed' || localCrashed) return localCrashMult;
  if (round.status === 'flying' && round.startTime) {
    const elapsed = Date.now() - round.startTime - timeOffset;
    if (elapsed <= 0) return 1;
    return Math.pow(1.00006, elapsed);
  }
  return 1;
}

function rebuildGraphFromStart() {
  graphPoints = [];
  if (!round.startTime) return;
  const elapsedMs = Date.now() - round.startTime - timeOffset;
  if (elapsedMs <= 0) { graphPoints.push({ x: 0, y: 1 }); return; }
  const stepMs = 80;
  const isCrashed = (round.status === 'crashed') || (localCrashed && crashedRoundId === round.id);
  const capMult = isCrashed ? round.crashPoint : Infinity;
  for (let t = 0; t <= elapsedMs; t += stepMs) {
    let m = Math.pow(1.00006, t);
    if (isCrashed && m >= round.crashPoint) {
      const crashMs = Math.log(round.crashPoint) / Math.log(1.00006);
      graphPoints.push({ x: crashMs / 1000, y: round.crashPoint });
      return;
    }
    graphPoints.push({ x: t / 1000, y: Math.min(m, capMult) });
  }
  const lastT = elapsedMs / 1000;
  const lastM = currentLocalMultiplier();
  const last = graphPoints[graphPoints.length - 1];
  if (!last || last.x < lastT) graphPoints.push({ x: lastT, y: lastM });
  else if (last) last.y = lastM;
}

async function pollRound() {
  try {
    const r = await fetch('/api/crash/current');
    const d = await r.json();
    applyServerState(d);
  } catch(e) {}
}

function restoreMyBetsFromServer(serverBets) {
  if (!playerId || !Array.isArray(serverBets)) return;
  const myActive = serverBets.filter(b => 
    b.player_id && 
    String(b.player_id) === String(playerId) && 
    !String(b.player_id).startsWith('BOT')
  );
  if (myActive.length === 0) return;
  let changed = false;
  myActive.forEach(b => {
    const betId = b.id;
    const existingSlot = [1, 2].find(id => myBetIds[id] === betId);
    if (existingSlot) {
      if (!!b.cashed_out !== myCashed[existingSlot]) {
        myCashed[existingSlot] = !!b.cashed_out;
        changed = true;
      }
      return;
    }
    for (const id of [1, 2]) {
      if (!myBetIds[id] && !queuedBets[id]) {
        myBetIds[id] = betId;
        myCashed[id] = !!b.cashed_out;
        changed = true;
        break;
      }
    }
  });
  if (changed) updateBetButtons();
}

function applyServerState(d) {
  if (d.status === 'flying' && d.startTime) {
    const serverElapsed = parseFloat(d.multiplier) > 1 ? Math.log(parseFloat(d.multiplier)) / Math.log(1.00006) : 0;
    const clientElapsed = Date.now() - d.startTime;
    if (clientElapsed > 0) timeOffset = timeOffset * 0.8 + (clientElapsed - serverElapsed) * 0.2;
  }
  const isNewRound = round.id !== null && d.roundId !== round.id;
  const roundChanged = round.id !== d.roundId;

  if (isNewRound || roundChanged) {
    myBetIds = { 1: null, 2: null };
    myCashed = { 1: false, 2: false };
    resetLocalCrash();
    loadBalance();
    setTimeout(() => {
      [1, 2].forEach(id => {
        if (queuedBets[id] && queuedBets[id].amount > 0) {
          const candidates = (round.bets || []).filter(b => String(b.player_id) === String(playerId) && !b.cashed_out);
          if (candidates.length > 0) {
            myBetIds[id] = candidates[candidates.length - 1].id;
            queuedBets[id] = null;
          }
        }
      });
      updateBetButtons();
    }, 800);
  }
  const prevStatus = round.status;
  if (prevStatus === 'crashed' && d.status !== 'crashed') resetLocalCrash();

  round.id = d.roundId; round.status = d.status; round.startTime = d.startTime || 0;
  round.crashPoint = d.crashPoint || round.crashPoint || 1;
  round.serverMult = parseFloat(d.multiplier) || 1;
  round.bets = d.bets || []; round.history = d.history || [];
  round.hasRealBet = d.hasRealBet || false;

  restoreMyBetsFromServer(round.bets);

  if (d.status === 'flying' && prevStatus !== 'flying') {
    startFlySound();
  }
  if (prevStatus === 'flying' && d.status !== 'flying') {
    stopFlySound();
  }

  if (d.status === 'crashed' && !localCrashed) {
    localCrashed = true; localCrashMult = round.crashPoint; crashedRoundId = round.id;
    playCrashSound();
  }
  if (roundChanged) {
    lastGraphRoundId = d.roundId; graphPoints = [];
    if ((d.status === 'flying' || d.status === 'crashed') && d.startTime) rebuildGraphFromStart();
  }
  renderBets(round.bets);
  renderHistory(round.history);
  updateBetButtons();
}

let prevMult = 1;
function frame() {
  if (localCrashed && crashedRoundId !== round.id) resetLocalCrash();
  const mult = currentLocalMultiplier();
  if (Math.abs(mult - prevMult) > 0.001) { multValueEl.textContent = mult.toFixed(2) + 'x'; prevMult = mult; }
  const effStatus = localCrashed ? 'crashed' : round.status;

  if (effStatus === 'waiting') {
    multValueEl.classList.remove('crashed', 'golden');
    multValueEl.style.opacity = '0.3';
    multValueEl.textContent = '1.00x';
    if (round.status === 'crashed') multLabelEl.textContent = 'Готовимся к вылету...';
    else if (!round.hasRealBet) multLabelEl.textContent = 'Ожидание первой ставки...';
    else multLabelEl.textContent = 'Готовимся к росту...';
    graphPoints = [];
  } else if (effStatus === 'flying') {
    multValueEl.classList.remove('crashed');
    multValueEl.style.opacity = '1';
    multLabelEl.textContent = '';
    updateFlySound(mult);
    if (mult < 1) multValueEl.textContent = '1.00x';
    if (mult >= 10) multValueEl.classList.add('golden');
    else multValueEl.classList.remove('golden');
    if (round.startTime) {
      const t = (Date.now() - round.startTime - timeOffset) / 1000;
      const last = graphPoints[graphPoints.length - 1];
      if (!last || t > last.x + 0.001) { graphPoints.push({ x: t, y: mult }); if (graphPoints.length > 2000) graphPoints.shift(); }
      else if (last) last.y = mult;
    }
  } else if (effStatus === 'crashed') {
    multValueEl.classList.add('crashed');
    multValueEl.style.opacity = '1';
    multLabelEl.textContent = '';
    if (round.startTime) {
      const crashSec = Math.log(round.crashPoint) / Math.log(1.00006) / 1000;
      const last = graphPoints[graphPoints.length - 1];
      if (!last || last.y < round.crashPoint - 0.001 || last.x < crashSec - 0.001) graphPoints.push({ x: crashSec, y: round.crashPoint });
    }
  }
  drawGraph(mult, effStatus);
  updateBetButtonsLive(mult, effStatus);
  requestAnimationFrame(frame);
}

function drawGraph(currentMult, status) {
  const W = canvas.width / (window.devicePixelRatio || 1);
  const H = canvas.height / (window.devicePixelRatio || 1);
  ctx.clearRect(0, 0, W, H);
  ctx.strokeStyle = 'rgba(255,255,255,0.05)'; ctx.lineWidth = 1;
  for (let i = 0; i < H; i += 60) { ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(W, i); ctx.stroke(); }
  for (let i = 0; i < W; i += 60) { ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, H); ctx.stroke(); }
  if ((status === 'flying' || status === 'crashed') && graphPoints.length > 1) {
    const paddingL = 30, paddingR = 20, paddingT = 30, paddingB = 30;
    const drawW = W - paddingL - paddingR;
    const drawH = H - paddingT - paddingB;
    const lastX = graphPoints[graphPoints.length - 1].x;
    const maxX = Math.max(3, lastX);
    const maxY = Math.max(currentMult * 1.15, 1.5);
    let lineColor = '#00e5ff', shadowColor = 'rgba(0,229,255,0.5)';
    if (status === 'crashed') { lineColor = '#ff4d4d'; shadowColor = 'rgba(255,77,77,0.5)'; }
    else if (currentMult >= 10) { lineColor = '#ffd700'; shadowColor = 'rgba(255,215,0,0.6)'; }
    ctx.beginPath(); ctx.strokeStyle = lineColor; ctx.lineWidth = 3; ctx.lineJoin = 'round';
    ctx.shadowBlur = 10; ctx.shadowColor = shadowColor;
    for (let i = 0; i < graphPoints.length; i++) {
      const p = graphPoints[i];
      const px = paddingL + (p.x / maxX) * drawW;
      const py = paddingT + drawH - ((p.y - 1) / (maxY - 1)) * drawH;
      if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.stroke(); ctx.shadowBlur = 0;
    const lastP = graphPoints[graphPoints.length - 1];
    const lx = paddingL + (lastP.x / maxX) * drawW;
    const ly = paddingT + drawH - ((lastP.y - 1) / (maxY - 1)) * drawH;
    ctx.beginPath(); ctx.fillStyle = lineColor; ctx.arc(lx, ly, 5, 0, Math.PI * 2); ctx.fill();
    ctx.shadowBlur = 18; ctx.shadowColor = shadowColor;
    ctx.beginPath(); ctx.arc(lx, ly, 5, 0, Math.PI * 2); ctx.fill(); ctx.shadowBlur = 0;
  }
}

function renderBets(bets) {
  const sig = (bets || []).map(b => `${b.id}:${b.cashed_out ? b.cashout_mult : 'p'}`).join('|');
  if (sig === lastBetsSig) return;
  lastBetsSig = sig;
  const list = document.getElementById('betsList');
  if (!bets || !bets.length) { list.innerHTML = ''; return; }
  list.innerHTML = bets.map(b => {
    const isMine = b.player_id && String(b.player_id) === String(playerId);
    const masked = b.player_name || '••••';
    const rank = b.player_rank || '';
    const label = (isMine ? '★ ' : '') + masked;
    let multHtml = '--', winHtml = '--';
    if (b.cashed_out) {
      const m = parseFloat(b.cashout_mult); const w = parseFloat(b.amount) * m;
      multHtml = `<span class="bet-mult win">${m.toFixed(2)}x</span>`;
      winHtml = `${w.toFixed(2)} ₽`;
    }
    return `<div class="bet-row">
        <div class="bet-user">
          <div class="user-avatar">KW</div>
          <div class="user-meta">
            <div class="user-name">${label}</div>
            ${rank ? `<div class="user-rank ${rank}">${rank}</div>` : ''}
          </div>
        </div>
        <div class="bet-amount">${parseFloat(b.amount).toFixed(2)} ₽</div>
        <div>${multHtml}</div>
        <div class="bet-cashout">${winHtml}</div>
      </div>`;
  }).join('');
}

function renderHistory(history) {
  const sig = (history || []).join('|');
  if (sig === lastHistorySig) return;
  lastHistorySig = sig;
  const list = document.getElementById('historyList');
  if (!history || !history.length) { list.innerHTML = ''; return; }
  list.innerHTML = history.map(m => {
    const cls = historyColorClass(m);
    return `<div class="history-item ${cls}">${parseFloat(m).toFixed(2)}x</div>`;
  }).join('');
}

function updateBetButtons() {
  const effStatus = localCrashed ? 'crashed' : round.status;
  [1, 2].forEach(id => {
    const btn = document.getElementById('btnBet' + id);
    const box = document.getElementById('betBox' + id);
    const betId = myBetIds[id];
    const cashed = myCashed[id];
    const queued = queuedBets[id] && queuedBets[id].amount > 0;
    const betAmountInput = document.getElementById('betAmount' + id);
    const btnMinus = document.getElementById('btnMinus' + id);
    const btnPlus = document.getElementById('btnPlus' + id);
    const quickBtns = [document.getElementById('quick' + id + '_1'), document.getElementById('quick' + id + '_2'), document.getElementById('quick' + id + '_3'), document.getElementById('quick' + id + '_4')];
    const settingsLocked = (betId !== null && betId !== 'queued' && !cashed) || queued;
    betAmountInput.disabled = settingsLocked;
    btnMinus.disabled = settingsLocked;
    btnPlus.disabled = settingsLocked;
    quickBtns.forEach(b => { if(b) b.disabled = settingsLocked; });
    if (queued) box.classList.add('queued'); else box.classList.remove('queued');
    if (queued) {
      btn.className = 'btn-action btn-bet';
      btn.innerHTML = `В очереди <div class="subtext">${queuedBets[id].amount} ₽</div>`;
      btn.disabled = false; btn.onclick = () => cancelQueue(id); return;
    }
    if (effStatus === 'waiting') {
      if (betId) {
        btn.className = 'btn-action btn-cancel';
        btn.innerHTML = `Отмена <div class="subtext">Ожидание...</div>`;
        btn.disabled = false; btn.onclick = () => placeBet(id);
      } else {
        const amt = parseInt(betAmountInput.value) || MIN_BET;
        btn.className = 'btn-action btn-bet';
        btn.innerHTML = `Ставка <div class="subtext">${amt} ₽</div>`;
        btn.disabled = false; btn.onclick = () => placeBet(id);
      }
    } else if (effStatus === 'flying') {
      if (betId && betId !== 'queued' && !cashed) {
        btn.className = 'btn-action btn-cashout';
        btn.innerHTML = `Забрать <div class="subtext">${(getBetAmountById(betId, round.bets) * currentLocalMultiplier()).toFixed(2)} ₽</div>`;
        btn.disabled = false; btn.onclick = () => doCashout(id);
      } else if (cashed) {
        btn.className = 'btn-action btn-bet';
        btn.innerHTML = `Выведено <div class="subtext">✓</div>`;
        btn.disabled = true;
      } else {
        const amt = parseInt(betAmountInput.value) || MIN_BET;
        btn.className = 'btn-action btn-bet';
        btn.innerHTML = `На след. раунд <div class="subtext">${amt} ₽</div>`;
        btn.disabled = false; btn.onclick = () => placeBet(id);
      }
    } else {
      if (betId && betId !== 'queued' && !cashed) {
        const amt = getBetAmountById(betId, round.bets);
        btn.className = 'btn-action btn-bet';
        btn.innerHTML = `Проигрыш <div class="subtext">${amt} ₽</div>`;
        btn.disabled = true;
      } else {
        const amt = parseInt(betAmountInput.value) || MIN_BET;
        btn.className = 'btn-action btn-bet';
        btn.innerHTML = `Ставка <div class="subtext">${amt} ₽</div>`;
        btn.disabled = false; btn.onclick = () => placeBet(id);
      }
    }
  });
}

function updateBetButtonsLive(mult, effStatus) {
  [1, 2].forEach(id => {
    if (effStatus === 'flying' && myBetIds[id] && myBetIds[id] !== 'queued' && !myCashed[id]) {
      const btn = document.getElementById('btnBet' + id);
      const amt = getBetAmountById(myBetIds[id], round.bets);
      if (amt > 0) {
        const val = (amt * mult).toFixed(2);
        const html = `Забрать <div class="subtext">${val} ₽</div>`;
        if (btn.innerHTML !== html) btn.innerHTML = html;
      }
    }
  });
}

function getBetAmountById(betId, bets) { if (!bets) return 0; const b = bets.find(x => x.id === betId); return b ? parseFloat(b.amount) : 0; }
function changeAmount(id, diff) { if (myBetIds[id] || queuedBets[id]) return; const input = document.getElementById('betAmount' + id); let val = parseInt(input.value) || MIN_BET; val += diff; if (val < MIN_BET) val = MIN_BET; if (val > MAX_BET) val = MAX_BET; input.value = val; document.getElementById('subtext' + id).textContent = val + ' ₽'; updateBetButtons(); }
function setAmount(id, val) { if (myBetIds[id] || queuedBets[id]) return; if (val < MIN_BET) val = MIN_BET; if (val > MAX_BET) val = MAX_BET; document.getElementById('betAmount' + id).value = val; document.getElementById('subtext' + id).textContent = val + ' ₽'; updateBetButtons(); }
async function cancelQueue(id) { if (!queuedBets[id]) return; queuedBets[id] = null; showToast('Ставка снята с очереди', 'info'); updateBetButtons(); }

async function placeBet(id) {
  if (myBetIds[id] && round.status === 'waiting') { showToast('Ставка уже принята', 'error'); return; }
  if (myBetIds[id] && myBetIds[id] !== 'queued' && round.status === 'flying' && !myCashed[id] && !localCrashed) return doCashout(id);
  if (queuedBets[id]) return cancelQueue(id);
  if (!playerId) { showToast('Войдите в аккаунт', 'error'); return; }
  const amt = parseInt(document.getElementById('betAmount' + id).value) || MIN_BET;
  if (amt < MIN_BET || amt > MAX_BET) { showToast(`Ставка от ${MIN_BET} до ${MAX_BET} ₽`, 'error'); return; }
  const btn = document.getElementById('btnBet' + id); btn.disabled = true;
  try {
    const r = await fetch('/api/crash/bet', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ player_id: playerId, amount: amt }) });
    const d = await r.json();
    if (!r.ok) { showToast(d.error || 'Ошибка ставки', 'error'); btn.disabled = false; updateBetButtons(); return; }
    if (d.queued) { queuedBets[id] = { amount: amt, roundIdWhenQueued: round.id }; showToast(`Ставка ${amt} ₽ — на следующий раунд`, 'success'); updateBetButtons(); return; }
    myBetIds[id] = d.bet.id; myCashed[id] = false;
    if (d.bet.round_id !== crashedRoundId) resetLocalCrash();
    playBetSound();
    showToast(`Ставка ${amt} ₽ принята`, 'success');
    loadBalance(); pollRound();
  } catch(e) { showToast('Ошибка соединения', 'error'); btn.disabled = false; updateBetButtons(); }
}

async function doCashout(id) {
  if (!myBetIds[id] || myCashed[id] || myBetIds[id] === 'queued') return;
  const betId = myBetIds[id]; myCashed[id] = true;
  try {
    const r = await fetch('/api/crash/cashout', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ bet_id: betId }) });
    const d = await r.json();
    if (!r.ok) { showToast(d.error || 'Ошибка вывода', 'error'); myCashed[id] = false; return; }
    playCashoutSound();
    showToast(`Выведено ${d.win.toFixed(2)} ₽ (x${d.mult.toFixed(2)})`, 'success');
    loadBalance(); pollRound();
  } catch(e) { showToast('Ошибка соединения', 'error'); myCashed[id] = false; }
}

function showToast(text, type='success') {
  const c = document.getElementById('toastContainer');
  const t = document.createElement('div');
  t.className = `toast ${type}`;
  t.innerHTML = `<div style="font-size:13px;font-weight:600;color:#fff">${text}</div>`;
  c.appendChild(t);
  setTimeout(() => t.classList.add('show'), 10);
  setTimeout(() => { t.classList.remove('show'); setTimeout(() => t.remove(), 300); }, 3000);
}

pollRound();
setInterval(pollRound, POLL_MS);
requestAnimationFrame(frame);
</script>
