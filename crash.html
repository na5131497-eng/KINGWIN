<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#090a10">
<title>KINGWIN — Краш</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root { 
    --bg-main:#090a10; --bg-panel:#151922; --bg-input:#0b0f19; 
    --accent:#00e5ff; --accent-green:#00e676; 
    --text-main:#fff; --text-muted:#8b92a5; 
    --border:rgba(255,255,255,0.05); --red:#ff4d4d; 
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing:border-box; margin:0; padding:0; font-family:'Montserrat',sans-serif; -webkit-tap-highlight-color:transparent; user-select:none; }
  body { 
    background:#050510; color:var(--text-main); 
    min-height:100vh; min-height:100dvh; 
    display:flex; flex-direction:column; 
    padding-top:var(--safe-top); padding-bottom:var(--safe-bottom);
    overflow-x:hidden;
  }

  /* === КОСМИЧЕСКИЙ ФОН === */
  .space-bg {
    position: fixed; inset: 0; z-index: 0; overflow: hidden;
    background: radial-gradient(circle at 50% 30%, #1a1c3b 0%, #050510 70%);
  }
  .space-bg::before, .space-bg::after {
    content:''; position:absolute; width:200%; height:200%;
    background-image: radial-gradient(1px 1px at 20px 30px, #ffffff, rgba(0,0,0,0)), radial-gradient(1px 1px at 40px 70px, #ffffff, rgba(0,0,0,0)), radial-gradient(1.5px 1.5px at 90px 40px, #ffffff, rgba(0,0,0,0)), radial-gradient(2px 2px at 160px 120px, #ffffff, rgba(0,0,0,0));
    background-repeat: repeat; background-size: 200px 200px;
    opacity: 0.6; animation: starMove 60s linear infinite;
  }
  .space-bg::after { opacity: 0.3; background-size: 300px 300px; animation-duration: 100s; animation-direction: reverse; }
  @keyframes starMove { from { transform: translateY(0); } to { transform: translateY(-200px); } }

  .app { position: relative; z-index: 1; display: flex; flex-direction: column; height: 100%; max-width: 600px; margin: 0 auto; width: 100%; }

  /* === ТОПБАР === */
  .topbar { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; z-index: 10; }
  .logo { font-size: 22px; font-weight: 900; letter-spacing: 1px; color: #fff; text-transform: uppercase; font-style: italic; }
  .logo span { color: var(--accent); }
  .balance-pill { background: rgba(255,255,255,0.1); padding: 8px 16px; border-radius: 10px; font-weight: 800; font-size: 14px; display: flex; align-items: center; gap: 8px; cursor: pointer; }

  /* === ИСТОРИЯ (сверху) === */
  .history-bar { display: flex; gap: 6px; padding: 0 16px 12px; overflow-x: auto; scrollbar-width: none; }
  .history-bar::-webkit-scrollbar { display: none; }
  .history-item { 
    min-width: 64px; height: 32px; border-radius: 6px; display: flex; align-items: center; justify-content: center; 
    font-size: 13px; font-weight: 800; flex-shrink: 0; color: #fff;
  }
  .history-item.blue { background: #1e3a8a; border: 1px solid #3b82f6; }
  .history-item.purple { background: #4c1d95; border: 1px solid #8b5cf6; }
  .history-item.red { background: #7f1d1d; border: 1px solid #ef4444; }
  .history-item.gold { background: #78350f; border: 1px solid #f1c40f; box-shadow: 0 0 10px rgba(241,196,15,0.4); }

  /* === ИГРОВОЕ ПОЛЕ === */
  .game-area { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; position: relative; min-height: 250px; }
  .canvas-wrap { position: relative; width: 100%; height: 300px; display: flex; justify-content: center; align-items: center; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  
  .multiplier-text {
    font-size: 54px; font-weight: 900; color: #fff; 
    text-shadow: 0 0 20px rgba(255,255,255,0.4);
    z-index: 10; transition: color 0.3s;
    position: absolute;
  }
  .multiplier-text.crashed { color: var(--red); text-shadow: 0 0 30px rgba(255,77,77,0.8); }
  
  .status-text { 
    font-size: 16px; font-weight: 800; letter-spacing: 2px; 
    text-transform: uppercase; color: #fff; margin-top: 10px; z-index: 10;
    text-align: center; position: absolute; bottom: -30px;
  }

  /* Ожидание (круг) */
  .waiting-circle {
    position: absolute; width: 140px; height: 140px;
    border-radius: 50%; border: 4px solid rgba(255,255,255,0.05);
    border-top-color: var(--accent); border-right-color: var(--accent);
    animation: spin 1s linear infinite;
    z-index: 5;
  }
  @keyframes spin { 100% { transform: rotate(360deg); } }

  /* Взрыв */
  .explosion {
    position: absolute; inset: 0; z-index: 5; pointer-events: none;
    background: radial-gradient(circle, rgba(255,200,50,0.8) 0%, rgba(255,50,50,0.5) 40%, transparent 70%);
    opacity: 0;
  }
  .explosion.active { animation: bang 0.5s ease-out forwards; }
  @keyframes bang { 0% { opacity: 0; transform: scale(0.5); } 20% { opacity: 1; transform: scale(1.1); } 100% { opacity: 0; transform: scale(1.5); } }

  /* === ПАНЕЛЬ УПРАВЛЕНИЯ === */
  .control-panel { padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  
  .auto-stop-row { display: flex; justify-content: space-between; align-items: center; }
  .auto-stop-label { font-size: 14px; font-weight: 800; display: flex; align-items: center; gap: 8px; }
  .toggle { width: 24px; height: 24px; border-radius: 50%; border: 2px solid #555; background: transparent; display: flex; justify-content: center; align-items: center; cursor: pointer; transition: 0.2s; }
  .toggle.on { border-color: var(--accent); background: var(--accent); }
  .toggle.on::after { content: ''; width: 10px; height: 10px; background: #000; border-radius: 50%; }
  
  .auto-input { background: var(--bg-input); border: 1px solid #1f2937; color: var(--text-muted); padding: 12px 16px; border-radius: 12px; font-size: 18px; font-weight: 800; width: 120px; text-align: center; outline: none; }
  
  .input-row { display: flex; gap: 10px; height: 56px; }
  .amount-input { flex: 1; background: var(--bg-input); border: 1px solid #1f2937; color: #fff; padding: 0 16px; border-radius: 12px; font-size: 22px; font-weight: 900; outline: none; }
  .btn-main { 
    flex: 1.5; background: linear-gradient(135deg, #00b4d8, #0077ff); color: #fff; 
    border: none; border-radius: 12px; font-size: 18px; font-weight: 900; text-transform: uppercase; 
    cursor: pointer; transition: 0.2s; box-shadow: 0 4px 15px rgba(0,119,255,0.3); 
  }
  .btn-main:active { transform: scale(0.98); }
  .btn-main.cashout { background: linear-gradient(135deg, #ff8c00, #ff4d4d); box-shadow: 0 4px 15px rgba(255,77,77,0.4); }
  .btn-main:disabled { opacity: 0.5; box-shadow: none; }

  .quick-bets { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; }
  .quick-bets button { 
    background: #1e2330; color: #fff; border: none; border-radius: 8px; padding: 10px 0; 
    font-size: 12px; font-weight: 800; cursor: pointer; transition: 0.2s;
  }
  .quick-bets button:active { background: #2a3444; }

  /* === ИНФО О РАУНДЕ === */
  .round-info { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 0 16px 16px; }
  .info-box { background: rgba(21, 25, 34, 0.8); backdrop-filter: blur(10px); border: 1px solid var(--border); border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 8px; }
  .info-label { font-size: 12px; color: var(--text-muted); font-weight: 700; }
  .info-value { font-size: 18px; font-weight: 900; color: #fff; display: flex; align-items: center; gap: 8px; }
  
  .coin { width: 24px; height: 24px; border-radius: 50%; background: linear-gradient(135deg, #00e5ff, #0077ff); display: flex; justify-content: center; align-items: center; font-size: 10px; font-weight: 900; color: #000; }

  .status-msg { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); font-size: 10px; color: var(--text-muted); font-weight: 800; letter-spacing: 2px; }

  @keyframes pulseText { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
  .pulse { animation: pulseText 1.5s infinite; }
</style>
</head>
<body>

<div class="space-bg"></div>

<div class="app">
  <div class="topbar">
    <div class="logo">KING<span>WIN</span></div>
    <div class="balance-pill">
      <span id="balanceVal">0.00</span> ₽
    </div>
  </div>

  <div class="history-bar" id="historyBar"></div>

  <div class="game-area">
    <div class="status-msg" id="roundIdText">#000000</div>
    
    <div class="canvas-wrap">
      <!-- Круг для ожидания -->
      <div class="waiting-circle" id="waitingCircle"></div>
      
      <canvas id="gameCanvas"></canvas>
      
      <div class="multiplier-text" id="multText" style="display:none;">1.00x</div>
      <div class="explosion" id="explosionFlash"></div>
    </div>
    
    <div class="status-text pulse" id="statusText">ЗАПРАВЛЯЕМ ШАТТЛ...</div>
  </div>

  <div class="control-panel">
    <div class="auto-stop-row">
      <div class="auto-stop-label"><div class="toggle"></div> АВТОСТОП</div>
      <input type="text" class="auto-input" value="x2.00" readonly>
    </div>

    <div class="input-row">
      <input type="number" id="betInput" class="amount-input" value="100" min="1">
      <button class="btn-main" id="actionBtn" onclick="onActionClick()">ПОСТАВИТЬ</button>
    </div>

    <div class="quick-bets">
      <button onclick="setBet(10)">Мин</button>
      <button onclick="setBet(100)">+100 ₽</button>
      <button onclick="setBet(500)">+500 ₽</button>
      <button onclick="setBet(1000)">+1000 ₽</button>
      <button onclick="setBet(5000)">+5000 ₽</button>
      <button onclick="setBet(10000)">+10000 ₽</button>
    </div>
  </div>

  <div class="round-info">
    <div class="info-box">
      <div class="info-label">Ставок</div>
      <div class="info-value"><div class="coin">KW</div><span id="playersCount">0</span></div>
    </div>
    <div class="info-box">
      <div class="info-label">Общий банк</div>
      <div class="info-value"><div class="coin">KW</div><span id="totalBank">0</span> ₽</div>
    </div>
  </div>
</div>

<script>
let currentPlayer = null;
let isFlying = false;
let currentMult = 1.0;
let currentRoundId = 0;
let currentStatus = 'waiting';
let activeBetId = null;
let points = [];
let pollTimer = null;
let animFrame = null;
let explosionParticles = [];
let isExploding = false;

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const rocketImg = new Image();
rocketImg.src = '/rocket.png';

let audioCtx = null;
function initAudio() { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
function playSound(type) {
  initAudio(); if (!audioCtx || audioCtx.state === 'suspended') return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.connect(gain); gain.connect(audioCtx.destination);
  
  if (type === 'bet') {
    osc.type = 'sine'; osc.frequency.setValueAtTime(600, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.1);
    gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
    osc.start(); osc.stop(audioCtx.currentTime + 0.1);
  } else if (type === 'crash') {
    osc.type = 'sawtooth'; osc.frequency.setValueAtTime(100, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(20, audioCtx.currentTime + 0.5);
    gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
    osc.start(); osc.stop(audioCtx.currentTime + 0.5);
  } else if (type === 'win') {
    osc.type = 'triangle'; osc.frequency.setValueAtTime(800, audioCtx.currentTime);
    osc.frequency.setValueAtTime(1000, audioCtx.currentTime + 0.1);
    osc.frequency.setValueAtTime(1200, audioCtx.currentTime + 0.2);
    gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
    gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.3);
    osc.start(); osc.stop(audioCtx.currentTime + 0.3);
  }
}

window.onload = async () => {
  document.body.addEventListener('touchstart', initAudio, { once: true });
  document.body.addEventListener('click', initAudio, { once: true });

  const id = localStorage.getItem('kingwin_guest_id');
  if (!id) { window.location.href = '/'; return; }
  currentPlayer = { id };
  
  resizeCanvas();
  window.addEventListener('resize', resizeCanvas);
  
  await loadBalance();
  startPolling();
};

function resizeCanvas() {
  const rect = canvas.parentElement.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  canvas.width = rect.width * dpr;
  canvas.height = rect.height * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

async function loadBalance() {
  try {
    const res = await fetch('/api/guest/me?id=' + currentPlayer.id + '&_t=' + Date.now());
    const data = await res.json();
    if (data.balance) document.getElementById('balanceVal').textContent = data.balance.total.toFixed(2);
  } catch(e){}
}

function startPolling() {
  if (pollTimer) clearInterval(pollTimer);
  pollTimer = setInterval(pollCrash, 500);
  pollCrash();
}

async function pollCrash() {
  try {
    const res = await fetch('/api/crash/state?guest_id=' + currentPlayer.id + '&_t=' + Date.now(), { cache: 'no-store' });
    if (!res.ok) return;
    const state = await res.json();

    document.getElementById('roundIdText').textContent = '#' + state.roundId;
    document.getElementById('totalBank').textContent = state.total_bank || 0;
    document.getElementById('playersCount').textContent = state.total_players || 0;
    
    renderHistory(state.history || []);

    const prevStatus = currentStatus;
    currentStatus = state.status;
    currentRoundId = state.roundId;

    if (state.my_bet && !state.my_bet.cashed_out) {
      activeBetId = state.my_bet.bet_id;
    } else {
      activeBetId = null;
    }

    if (state.status === 'waiting') {
      isFlying = false;
      isExploding = false;
      currentMult = 1.0;
      points = [];
      
      document.getElementById('waitingCircle').style.display = 'block';
      document.getElementById('multText').style.display = 'none';
      document.getElementById('statusText').textContent = 'ЗАПРАВЛЯЕМ ШАТТЛ...';
      document.getElementById('statusText').classList.add('pulse');
      
      document.getElementById('actionBtn').className = 'btn-main';
      document.getElementById('actionBtn').textContent = 'ПОСТАВИТЬ';
      document.getElementById('actionBtn').disabled = false;
      
      drawScene(0);
    } else if (state.status === 'flying') {
      isFlying = true;
      currentMult = state.currentMult;
      
      document.getElementById('waitingCircle').style.display = 'none';
      document.getElementById('multText').style.display = 'block';
      document.getElementById('multText').textContent = currentMult.toFixed(2) + 'x';
      document.getElementById('multText').className = 'multiplier-text';
      document.getElementById('statusText').textContent = 'В ПОЛЁТЕ!';
      document.getElementById('statusText').classList.remove('pulse');
      
      if (activeBetId) {
        document.getElementById('actionBtn').className = 'btn-main cashout';
        document.getElementById('actionBtn').textContent = 'ЗАБРАТЬ ' + (currentMult * parseFloat(document.getElementById('betInput').value)).toFixed(0) + ' ₽';
        document.getElementById('actionBtn').disabled = false;
      } else {
        document.getElementById('actionBtn').className = 'btn-main';
        document.getElementById('actionBtn').textContent = 'ОЖИДАНИЕ...';
        document.getElementById('actionBtn').disabled = true;
      }
      
      if (!animFrame) animateFlight();
    } else if (state.status === 'crashed') {
      if (prevStatus === 'flying') {
        triggerExplosion();
        playSound('crash');
      }
      isFlying = false;
      document.getElementById('waitingCircle').style.display = 'none';
      document.getElementById('multText').style.display = 'block';
      document.getElementById('multText').textContent = state.crashPoint.toFixed(2) + 'x';
      document.getElementById('multText').className = 'multiplier-text crashed';
      document.getElementById('statusText').textContent = 'КРАШ!';
      document.getElementById('statusText').classList.remove('pulse');
      
      document.getElementById('actionBtn').className = 'btn-main';
      document.getElementById('actionBtn').textContent = 'ПОДОЖДИТЕ...';
      document.getElementById('actionBtn').disabled = true;
    }

  } catch(e) {}
}

function animateFlight() {
  if (!isFlying) { animFrame = null; return; }
  drawScene(currentMult);
  animFrame = requestAnimationFrame(animateFlight);
}

function drawScene(mult) {
  const w = canvas.clientWidth;
  const h = canvas.clientHeight;
  const pad = 40;
  ctx.clearRect(0, 0, w, h);

  if (!isFlying && !isExploding) return; // В ожидании ничего не рисуем на канвасе

  const x0 = pad, y0 = h - pad;
  const x1 = w - pad, y1 = pad;

  // Прогресс полёта по логарифму (чтобы не улетала за экран)
  const progress = Math.min(1, Math.log(Math.max(mult, 1.01)) / Math.log(15));
  const x = x0 + (x1 - x0) * progress;
  const y = y0 + (y1 - y0) * progress;

  if (!isExploding && mult > 1.0) {
    points.push({ x, y });
    if (points.length > 400) points.shift();
  }

  // След
  if (!isExploding) {
    const grad = ctx.createLinearGradient(x0, y0, x, y);
    grad.addColorStop(0, 'rgba(0,229,255,0.1)');
    grad.addColorStop(0.5, '#00e5ff');
    grad.addColorStop(1, '#00ff88');

    ctx.beginPath();
    ctx.moveTo(x0, y0);
    if (points.length > 0) {
      for (let i = 0; i < points.length; i++) ctx.lineTo(points[i].x, points[i].y);
    }
    ctx.strokeStyle = grad;
    ctx.lineWidth = 4;
    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';
    ctx.shadowBlur = 15;
    ctx.shadowColor = '#00e5ff';
    ctx.stroke();
    ctx.shadowBlur = 0;

    // Ракета
    if (rocketImg.complete && mult > 1.0) {
      const size = 48;
      const angle = Math.atan2(y1 - y0, x1 - x0);
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(angle);
      ctx.shadowBlur = 20;
      ctx.shadowColor = 'rgba(0,229,255,0.8)';
      ctx.drawImage(rocketImg, -size/2, -size/2, size, size);
      ctx.restore();
      ctx.shadowBlur = 0;
    }
  }

  // Взрыв
  if (isExploding) {
    explosionParticles.forEach(p => {
      p.x += p.vx; p.y += p.vy; p.life -= 0.02;
      if (p.life > 0) {
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI*2);
        ctx.fillStyle = p.color;
        ctx.globalAlpha = p.life;
        ctx.fill();
      }
    });
    ctx.globalAlpha = 1;
  }
}

function triggerExplosion() {
  isExploding = true;
  const w = canvas.clientWidth;
  const h = canvas.clientHeight;
  const pad = 40;
  const x1 = w - pad, y1 = pad;

  const progress = Math.min(1, Math.log(Math.max(currentMult, 1.01)) / Math.log(15));
  const x = pad + (x1 - pad) * progress;
  const y = (h - pad) + (y1 - (h - pad)) * progress;

  const flash = document.getElementById('explosionFlash');
  flash.classList.remove('active'); void flash.offsetWidth; flash.classList.add('active');

  explosionParticles = [];
  for (let i=0; i<40; i++) {
    const a = Math.random() * Math.PI * 2;
    const sp = Math.random() * 5 + 1;
    explosionParticles.push({
      x: x, y: y, vx: Math.cos(a)*sp, vy: Math.sin(a)*sp,
      size: Math.random()*4+2, life: 1,
      color: ['#ff4d4d','#ffcc00','#fff'][Math.floor(Math.random()*3)]
    });
  }

  const explodeAnim = () => {
    if (!isExploding) return;
    drawScene(currentMult);
    requestAnimationFrame(explodeAnim);
  };
  explodeAnim();
  
  setTimeout(() => {
    isExploding = false;
    explosionParticles = [];
  }, 1500);
}

function renderHistory(history) {
  const bar = document.getElementById('historyBar');
  bar.innerHTML = '';
  history.slice(0, 10).forEach(v => {
    const val = parseFloat(v);
    let cls = 'blue';
    if (val >= 10) cls = 'gold';
    else if (val >= 4) cls = 'purple';
    else if (val < 2) cls = 'red';
    
    const el = document.createElement('div');
    el.className = 'history-item ' + cls;
    el.textContent = val.toFixed(2) + 'x';
    bar.appendChild(el);
  });
}

function setBet(amount) { document.getElementById('betInput').value = amount; }

async function onActionClick() {
  if (!currentPlayer) return;
  playSound('bet');

  if (currentStatus === 'flying' && activeBetId) {
    try {
      const res = await fetch('/api/crash/cashout', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ bet_id: activeBetId, guest_id: currentPlayer.id, mult: currentMult })
      });
      const data = await res.json();
      if (data.ok) {
        playSound('win');
        loadBalance();
        activeBetId = null;
      }
    } catch(e){}
    return;
  }

  if (currentStatus === 'waiting' && !activeBetId) {
    const amt = parseFloat(document.getElementById('betInput').value) || 0;
    if (amt < 1) return alert('Мин 1 ₽');

    try {
      const res = await fetch('/api/crash/start', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ guest_id: currentPlayer.id, amount: amt })
      });
      const data = await res.json();
      if (data.ok) {
        activeBetId = data.bet_id;
        loadBalance();
        document.getElementById('actionBtn').textContent = 'ОЖИДАНИЕ...';
        document.getElementById('actionBtn').disabled = true;
      } else {
        alert(data.error);
      }
    } catch(e){}
  }
}
</script>
</body>
</html>
