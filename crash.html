<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#090a10">
<title>KINGWIN — Краш</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root { 
    --bg-main:#090a10; --bg-panel:#151922; --bg-input:#0e121b; 
    --accent:#0077ff; --accent-light:#00b4d8; --logo-color:#0a84ff;
    --accent-green:#00e676; 
    --text-main:#fff; --text-muted:#8b92a5; 
    --border:rgba(255,255,255,0.05); --red:#ff4d4d; 
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing:border-box; margin:0; padding:0; font-family:'Montserrat',sans-serif; -webkit-tap-highlight-color:transparent; user-select:none; }
  
  html, body { height: 100%; height: 100dvh; overflow: hidden; background: #050510; }
  
  body { 
    color:var(--text-main); display:flex; flex-direction:column;
    padding-top:var(--safe-top); padding-bottom:var(--safe-bottom);
  }

  .space-bg {
    position: fixed; inset: 0; z-index: 0; overflow: hidden;
    background: radial-gradient(circle at 50% 40%, #151a2c 0%, #050510 80%);
  }
  .space-bg::before, .space-bg::after {
    content:''; position:absolute; width:200%; height:200%;
    background-image: radial-gradient(1.5px 1.5px at 20px 30px, #fff, rgba(0,0,0,0)), radial-gradient(1px 1px at 40px 70px, #fff, rgba(0,0,0,0)), radial-gradient(2px 2px at 90px 40px, #fff, rgba(0,0,0,0));
    background-repeat: repeat; background-size: 250px 250px;
    opacity: 0.5; animation: starMove 40s linear infinite;
  }
  .space-bg::after { opacity: 0.2; background-size: 350px 350px; animation-duration: 80s; animation-direction: reverse; }
  @keyframes starMove { from { transform: translateY(0); } to { transform: translateY(-250px); } }

  .app { position: relative; z-index: 1; display: flex; flex-direction: column; height: 100%; width: 100%; max-width: 500px; margin: 0 auto; padding: 0 16px; }

  .topbar { display: flex; justify-content: space-between; align-items: center; padding: 12px 0 8px; flex-shrink: 0; }
  .logo { font-size: 24px; font-weight: 900; letter-spacing: 2px; color: #fff; text-transform: uppercase; font-style: italic; display: flex; }
  .logo span { color: var(--logo-color); font-style: normal; font-weight: 900; }
  
  .header-right { display: flex; align-items: center; gap: 10px; }
  .balance-pill { background: rgba(255,255,255,0.08); padding: 8px 14px; border-radius: 10px; font-weight: 900; font-size: 14px; }
  .menu-btn { background: rgba(255,255,255,0.08); border: none; width: 38px; height: 38px; border-radius: 10px; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 4px; cursor: pointer; transition: 0.2s; }
  .menu-btn span { width: 18px; height: 2px; background: #fff; border-radius: 2px; transition: 0.2s; }

  .history-bar { display: flex; gap: 5px; padding-bottom: 8px; overflow-x: auto; scrollbar-width: none; flex-shrink: 0; }
  .history-bar::-webkit-scrollbar { display: none; }
  .history-item { 
    position: relative; min-width: 46px; height: 24px; border-radius: 6px; 
    display: flex; align-items: center; justify-content: center; 
    font-size: 11px; font-weight: 900; flex-shrink: 0; color: #fff; 
    box-shadow: inset 0 2px 4px rgba(255,255,255,0.3), inset 0 -2px 4px rgba(0,0,0,0.3), 0 3px 6px rgba(0,0,0,0.4);
    overflow: hidden;
  }
  .history-item::after { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 50%; background: linear-gradient(180deg, rgba(255,255,255,0.25) 0%, rgba(255,255,255,0) 100%); border-radius: 6px 6px 0 0; pointer-events: none; }
  
  .history-item.red { background: linear-gradient(135deg, #e53935, #b71c1c); border: 1px solid #ef5350; }
  .history-item.blue { background: linear-gradient(135deg, #1e88e5, #0d47a1); border: 1px solid #42a5f5; }
  .history-item.purple { background: linear-gradient(135deg, #8e24aa, #4a148c); border: 1px solid #ab47bc; }
  .history-item.gold { background: linear-gradient(135deg, #ffd700, #b8860b); border: 1px solid #ffeb3b; color: #000; text-shadow: 0 1px 1px rgba(255,255,255,0.5); }

  .game-area { flex: 1; display: flex; flex-direction: column; align-items: center; position: relative; min-height: 0; }
  .canvas-wrap { position: absolute; inset: 0; display: flex; justify-content: center; align-items: center; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 2; }
  
  .waiting-circle { width: 130px; height: 130px; border-radius: 50%; border: 5px solid rgba(255,255,255,0.05); border-top-color: var(--accent-light); border-right-color: var(--accent-light); animation: spin 1.2s linear infinite; z-index: 1; position: absolute; box-shadow: 0 0 20px rgba(0,180,216,0.2); }
  @keyframes spin { 100% { transform: rotate(360deg); } }

  .multiplier-text { 
    font-size: 64px; font-weight: 900; 
    color: var(--logo-color); 
    text-shadow: 0 0 25px rgba(10, 132, 255, 0.6); 
    z-index: 10; display: none; font-style: italic; 
  }
  .multiplier-text.crashed { 
    color: var(--red); 
    text-shadow: 0 0 30px rgba(255,77,77,0.8); 
  }
  
  .status-text { font-size: 15px; font-weight: 900; letter-spacing: 2px; text-transform: uppercase; color: #fff; z-index: 10; margin-top: auto; margin-bottom: 12px; text-shadow: 0 2px 10px rgba(0,0,0,0.8); }
  @keyframes pulseText { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
  .pulse { animation: pulseText 1.5s infinite; }

  .explosion { position: absolute; inset: 0; z-index: 5; pointer-events: none; background: radial-gradient(circle at center, rgba(255,200,50,0.6) 0%, rgba(255,50,50,0.3) 40%, transparent 70%); opacity: 0; }
  .explosion.active { animation: bang 0.6s ease-out forwards; }
  @keyframes bang { 0% { opacity: 0; transform: scale(0.8); } 20% { opacity: 1; transform: scale(1.1); } 100% { opacity: 0; transform: scale(1.3); } }

  .controls-area { flex-shrink: 0; padding-bottom: 8px; width: 100%; position: relative; }
  
  .queue-badge { position: absolute; top: -25px; left: 50%; transform: translateX(-50%); background: var(--accent-light); color: #000; font-size: 10px; font-weight: 900; padding: 3px 10px; border-radius: 10px; display: none; white-space: nowrap; box-shadow: 0 0 10px rgba(0,180,216,0.5); letter-spacing: 1px; }
  .queue-badge.show { display: block; animation: popIn 0.3s ease-out; }
  @keyframes popIn { 0% { transform: translateX(-50%) scale(0.8); opacity: 0; } 100% { transform: translateX(-50%) scale(1); opacity: 1; } }

  .auto-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .auto-label { font-size: 12px; font-weight: 800; display: flex; align-items: center; gap: 8px; cursor: pointer; transition: 0.2s; }
  .auto-label.disabled { opacity: 0.4; cursor: not-allowed; }
  
  .toggle { width: 20px; height: 20px; border-radius: 50%; border: 2px solid #555; background: transparent; display: flex; justify-content: center; align-items: center; transition: 0.2s; }
  .toggle.on { border-color: var(--accent-light); background: var(--accent-light); }
  .toggle.on::after { content: ''; width: 8px; height: 8px; background: #000; border-radius: 50%; }
  
  .auto-input { background: var(--bg-input); border: 1px solid #1f2937; color: #fff; padding: 8px 12px; border-radius: 8px; font-size: 14px; font-weight: 800; width: 90px; text-align: center; outline: none; transition: 0.2s; }
  .auto-input:disabled { color: #555; border-color: #111; }
  
  .input-row { display: flex; gap: 8px; height: 52px; margin-bottom: 10px; width: 100%; overflow: hidden; }
  .amount-input { flex: 1; min-width: 0; background: var(--bg-input); border: 1px solid #1f2937; color: #fff; padding: 0 12px; border-radius: 10px; font-size: 22px; font-weight: 900; outline: none; }
  
  .btn-main { flex: 1.4; min-width: 0; background: linear-gradient(135deg, var(--accent-light), var(--accent)); color: #fff; border: none; border-radius: 10px; font-size: 15px; font-weight: 900; text-transform: uppercase; cursor: pointer; box-shadow: 0 4px 15px rgba(0,119,255,0.3); display: flex; align-items: center; justify-content: center; transition: 0.2s; }
  .btn-main:active { transform: scale(0.98); }
  .btn-main.cashout { background: linear-gradient(135deg, #ff8c00, #ff4d4d); box-shadow: 0 4px 15px rgba(255,77,77,0.4); }
  .btn-main.queued { background: #1f2937; box-shadow: none; opacity: 0.7; cursor: default; }
  .btn-main:disabled { opacity: 0.5; box-shadow: none; }

  .quick-bets { display: grid; grid-template-columns: repeat(6, 1fr); gap: 5px; margin-bottom: 12px; width: 100%; }
  .quick-bets button { background: #1a1f2b; color: #fff; border: none; border-radius: 8px; padding: 10px 0; font-size: 11px; font-weight: 800; cursor: pointer; transition: 0.1s; }
  .quick-bets button:active { background: #2a3444; transform: scale(0.95); }

  .round-info { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px; width: 100%; }
  .info-box { background: rgba(21, 25, 34, 0.6); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; display: flex; flex-direction: column; gap: 4px; }
  .info-label { font-size: 10px; color: var(--text-muted); font-weight: 700; text-transform: uppercase; }
  .info-value { font-size: 16px; font-weight: 900; color: #fff; display: flex; align-items: center; gap: 6px; }
  .coin { width: 18px; height: 18px; border-radius: 50%; background: linear-gradient(135deg, #00b4d8, #0077ff); display: flex; justify-content: center; align-items: center; font-size: 8px; font-weight: 900; color: #fff; }

  .bets-list-wrap { height: 52px; overflow-y: auto; scrollbar-width: none; margin-bottom: 8px; background: rgba(21,25,34,0.4); border-radius: 8px; padding: 4px; }
  .bets-list-wrap::-webkit-scrollbar { display: none; }
  .bet-row { display: flex; justify-content: space-between; align-items: center; padding: 4px 8px; border-bottom: 1px solid rgba(255,255,255,0.02); font-size: 11px; font-weight: 700; color: #8b92a5; }
  .bet-row:last-child { border-bottom: none; }
  .bet-row .b-name { color: #fff; }
  .bet-row .b-amt { color: var(--accent-light); }
  .bet-row.won .b-amt { color: var(--accent-green); }

  .footer-round { text-align: center; font-size: 11px; font-weight: 800; color: #4b5563; padding-bottom: env(safe-area-inset-bottom); width: 100%; }

  .sidebar-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(3px); z-index: 999; opacity: 0; pointer-events: none; transition: 0.3s; }
  .sidebar-overlay.show { opacity: 1; pointer-events: auto; }
  .sidebar { position: fixed; top: 0; right: -280px; width: 280px; height: 100%; background: #151922; z-index: 1000; transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1); display: flex; flex-direction: column; border-left: 1px solid rgba(255,255,255,0.05); box-shadow: -10px 0 30px rgba(0,0,0,0.5); }
  .sidebar.show { right: 0; }
  .sidebar-header { display: flex; justify-content: space-between; align-items: center; padding: 20px; border-bottom: 1px solid rgba(255,255,255,0.05); }
  .sidebar-logo { font-size: 20px; font-weight: 900; font-style: italic; }
  .sidebar-logo span { color: var(--logo-color); font-style: normal; }
  .close-btn { background: transparent; border: none; color: var(--text-muted); font-size: 24px; cursor: pointer; }
  .sidebar-menu { flex: 1; overflow-y: auto; padding: 16px 10px; display: flex; flex-direction: column; gap: 4px; }
  .sidebar-menu::-webkit-scrollbar { width: 4px; }
  .sidebar-menu::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 4px; }
  .menu-item { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; border-radius: 12px; text-decoration: none; color: #fff; font-size: 14px; font-weight: 700; cursor: pointer; transition: 0.2s; }
  .menu-item:hover, .menu-item.active { background: rgba(255,255,255,0.05); color: var(--accent-light); }
  .menu-item svg { width: 20px; height: 20px; fill: currentColor; margin-right: 12px; }
  .menu-item .left { display: flex; align-items: center; }
  .menu-item .arrow { width: 12px; height: 12px; fill: var(--text-muted); transition: 0.3s; }
  .menu-item.open .arrow { transform: rotate(180deg); }
  .submenu { max-height: 0; overflow: hidden; transition: max-height 0.3s ease; padding-left: 20px; display: flex; flex-direction: column; }
  .submenu.open { max-height: 300px; }
  .submenu a { padding: 12px 16px; color: var(--text-muted); text-decoration: none; font-size: 13px; font-weight: 600; border-radius: 8px; display: flex; align-items: center; gap: 10px; }
  .submenu a:hover { color: #fff; background: rgba(255,255,255,0.05); }
  .submenu a .dot { width: 4px; height: 4px; background: var(--accent-light); border-radius: 50%; }
</style>
</head>
<body>

<div class="space-bg"></div>

<div class="app">
  <div class="topbar">
    <div class="logo">KING<span>WIN</span></div>
    <div class="header-right">
      <div class="balance-pill"><span id="balanceVal">0.00</span> ₽</div>

        <span></span><span></span><span></span>
      </button>
    </div>

  <div class="history-bar" id="historyBar"></div>

  <div class="game-area">
    <div class="canvas-wrap">
      <div class="waiting-circle" id="waitingCircle"></div>
      <canvas id="gameCanvas"></canvas>
      <div class="multiplier-text" id="multText">1.00x</div>
      <div class="explosion" id="explosionFlash"></div>
    </div>
    <div class="status-text pulse" id="statusText">ЗАПРАВЛЯЕМ ШАТТЛ...</div>
  </div>

  <div class="controls-area">
    <div class="queue-badge" id="queueBadge">СТАВКА НА СЛЕД. РАУНД</div>

    <div class="auto-row">
      <div class="auto-label" id="autoLabel" onclick="toggleAuto()">
        <div class="toggle" id="autoToggle"></div> АВТОСТОП
      </div>
      <input type="number" id="autoInput" class="auto-input" value="2.00" step="0.1" min="1.01">
    </div>

    <div class="input-row">
      <input type="number" id="betInput" class="amount-input" value="100" min="1" max="500">
      <button class="btn-main" id="actionBtn" onclick="onActionClick()">ПОСТАВИТЬ</button>
    </div>

    <div class="quick-bets">
      <button onclick="addBet(10)">+10</button>
      <button onclick="addBet(50)">+50</button>
      <button onclick="addBet(100)">+100</button>
      <button onclick="addBet(200)">+200</button>
      <button onclick="addBet(300)">+300</button>
      <button onclick="addBet(500)">Макс</button>
    </div>

    <div class="round-info">
      <div class="info-box">
        <div class="info-label">Ставок</div>
        <div class="info-value"><div class="coin">KW</div><span id="playersCount">0</span></div>
      </div>
      <div class="info-box">
        <div class="info-label">Общий банк</div>

    <div class="bets-list-wrap" id="betsList">
      <div class="bet-row"><span class="b-name">Ожидание ставок...</span></div>

    <div class="footer-round" id="roundIdText">KINGWIN CRASH #000000</div>

</div>

  <div class="sidebar-header">
    <div class="sidebar-logo">KING<span>WIN</span></div>
    <button class="close-btn" onclick="toggleSidebar()">✕</button>
  </div>
  <div class="sidebar-menu">
    <a href="/" class="menu-item">
      <div class="left"><svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg> Главная</div>
    </a>
    
    <div class="menu-item" onclick="toggleSubmenu(this, 'gamesSubmenu')">

    </div>

      <a href="/crash.html"><div class="dot"></div> Краш</a>
      <a href="/cases.html"><div class="dot"></div> Кейсы</a>

    <div style="height: 1px; background: rgba(255,255,255,0.05); margin: 10px 0;"></div>

    <a href="#" class="menu-item">
      <div class="left"><svg viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg> Стать VIP</a>
    </a>
    <a href="/cases.html" class="menu-item">
      <div class="left"><svg viewBox="0 0 24 24"><path d="M21 8h-2V6c0-1.1-.9-2-2-2H7c-1.1 0-2 .9-2 2v2H3c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h18c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zM7 6h10v2H7V6zm14 12H3V10h18v8z"/></svg> Кейсы</a>
    </a>

      <div class="left"><svg viewBox="0 0 24 24"><path d="M11.8 10.9c-2.27-.59-3-1.2-3-2.15 0-1.09 1.01-1.85 2.7-1.85 1.78 0 2.44.85 2.5 2.1h2.21c-.07-1.72-1.12-3.3-3.21-3.81V3h-3v2.16c-1.94.42-3.5 1.68-3.5 3.61 0 2.31 1.91 3.46 4.7 4.13 2.5.6 3 1.48 3 2.41 0 .69-.49 1.79-2.7 1.79-2.06 0-2.87-.92-2.98-2.1h-2.2c.12 2.19 1.76 3.42 3.68 3.83V21h3v-2.15c1.95-.37 3.5-1.5 3.5-3.55 0-2.84-2.43-3.81-4.7-4.4z"/></svg> Кэшбек</a>
    </a>

<script>
let currentPlayer = null;
let isFlying = false;
let currentMult = 1.0;
let currentRoundId = 0;
let currentStatus = 'waiting';
let activeBetId = null;
let queuedBetAmount = 0;
let points = [];
let pollTimer = null;
let animFrame = null;
let explosionParticles = [];
let isExploding = false;
let isAutoStopEnabled = false;
let flightStartTime = 0;
let knownCrashPoint = 100;
let lastKnownBalance = 0;

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const rocketImg = new Image();
rocketImg.src = '/rocket.png';

let audioCtx = null;
function initAudio() { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
function playSound(type) {
  initAudio(); if (!audioCtx || audioCtx.state === 'suspended') return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.connect(gain); gain.connect(audioCtx.destination);
  
  if (type === 'bet') {
    osc.type = 'sine'; osc.frequency.setValueAtTime(600, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.1);
    gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
    osc.start(); osc.stop(audioCtx.currentTime + 0.1);
  } else if (type === 'crash') {
    osc.type = 'sawtooth'; osc.frequency.setValueAtTime(80, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(15, audioCtx.currentTime + 0.8);
    gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.8);
    osc.start(); osc.stop(audioCtx.currentTime + 0.8);
    
    const osc2 = audioCtx.createOscillator();
    const gain2 = audioCtx.createGain();
    osc2.type = 'square';
    osc2.frequency.setValueAtTime(200, audioCtx.currentTime);
    osc2.frequency.exponentialRampToValueAtTime(30, audioCtx.currentTime + 0.3);
    gain2.gain.setValueAtTime(0.15, audioCtx.currentTime);
    gain2.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
    osc2.connect(gain2); gain2.connect(audioCtx.destination);
    osc2.start(); osc2.stop(audioCtx.currentTime + 0.3);
  } else if (type === 'win') {
    osc.type = 'triangle'; osc.frequency.setValueAtTime(800, audioCtx.currentTime);
    osc.frequency.setValueAtTime(1000, audioCtx.currentTime + 0.1);
    osc.frequency.setValueAtTime(1200, audioCtx.currentTime + 0.2);
    gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
    gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.3);
    osc.start(); osc.stop(audioCtx.currentTime + 0.3);
  }
}

window.onload = async () => {
  document.body.addEventListener('touchstart', initAudio, { once: true });
  document.body.addEventListener('click', initAudio, { once: true });

  const id = localStorage.getItem('kingwin_guest_id');
  if (!id) { window.location.href = '/'; return; }
  currentPlayer = { id };
  
  resizeCanvas();
  window.addEventListener('resize', resizeCanvas);
  
  await loadBalance();
  startPolling();
  startRenderLoop();

  const betInput = document.getElementById('betInput');
  betInput.addEventListener('input', function() {
    if (this.value > 500) this.value = 500;
    if (this.value < 1 && this.value !== '') this.value = 1;
  });
};

function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('show');
  document.getElementById('sidebarOverlay').classList.toggle('show');
}

function toggleSubmenu(el, id) {
  el.classList.toggle('open');
  document.getElementById(id).classList.toggle('open');
}

function toggleAuto() {
  if (currentStatus !== 'waiting') return;
  isAutoStopEnabled = !isAutoStopEnabled;
  const el = document.getElementById('autoToggle');
  if (isAutoStopEnabled) el.classList.add('on');
  else el.classList.remove('on');
}

function resizeCanvas() {
  const rect = canvas.parentElement.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  canvas.width = rect.width * dpr;
  canvas.height = rect.height * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

async function loadBalance() {
  try {
    const res = await fetch('/api/guest/me?id=' + currentPlayer.id + '&_t=' + Date.now());
    const data = await res.json();
    if (data.balance) {
      lastKnownBalance = data.balance.total || 0;
      document.getElementById('balanceVal').textContent = lastKnownBalance.toFixed(2);
    }
  } catch(e){}
}

function startPolling() {
  if (pollTimer) clearInterval(pollTimer);
  pollTimer = setInterval(pollCrash, 400);
  pollCrash();
}

function startRenderLoop() {
  const loop = () => {
    if (currentStatus === 'flying' && flightStartTime > 0) {
      const elapsed = (Date.now() - flightStartTime) / 1000;
      let calcMult = Math.pow(1.06, elapsed);
      if (calcMult >= knownCrashPoint) calcMult = knownCrashPoint;

      if (calcMult > currentMult) {
        currentMult = calcMult;
        document.getElementById('multText').textContent = currentMult.toFixed(2) + 'x';
        if (activeBetId) {
          document.getElementById('actionBtn').textContent = 'ЗАБРАТЬ ' + (currentMult * parseFloat(document.getElementById('betInput').value)).toFixed(0) + ' ₽';
        }
      }
    }
    drawScene(currentMult);
    requestAnimationFrame(loop);
  };
  requestAnimationFrame(loop);
}

async function pollCrash() {
  try {
    const res = await fetch('/api/crash/state?guest_id=' + currentPlayer.id + '&_t=' + Date.now(), { cache: 'no-store' });
    if (!res.ok) return;
    const state = await res.json();

    document.getElementById('roundIdText').textContent = 'KINGWIN CRASH #' + state.roundId;
    document.getElementById('totalBank').textContent = state.total_bank || 0;
    document.getElementById('playersCount').textContent = state.total_players || 0;
    
    renderHistory(state.history || []);
    renderBets(state.bets || []);

    const prevStatus = currentStatus;
    currentStatus = state.status;
    currentRoundId = state.roundId;

    if (state.my_bet && !state.my_bet.cashed_out) {
      activeBetId = state.my_bet.bet_id;
    } else {
      activeBetId = null;
    }

    if (currentStatus === 'flying') {
      document.getElementById('autoLabel').classList.add('disabled');
      document.getElementById('autoInput').disabled = true;
    } else {
      document.getElementById('autoLabel').classList.remove('disabled');
      document.getElementById('autoInput').disabled = false;
    }

    if (state.status === 'waiting') {
      isFlying = false;
      isExploding = false;
      currentMult = 1.0;
      flightStartTime = 0;
      points = [];
      
      document.getElementById('waitingCircle').style.display = 'block';
      document.getElementById('multText').style.display = 'none';
      document.getElementById('statusText').textContent = 'ЗАПРАВЛЯЕМ ШАТТЛ...';
      document.getElementById('statusText').classList.add('pulse');
      
      if (queuedBetAmount > 0 && !activeBetId) {
        const amt = queuedBetAmount;
        queuedBetAmount = 0;
        document.getElementById('queueBadge').classList.remove('show');
        await placeBetOnServer(amt);
      } else if (!activeBetId) {
        document.getElementById('actionBtn').className = 'btn-main';
        document.getElementById('actionBtn').textContent = 'ПОСТАВИТЬ';
        document.getElementById('actionBtn').disabled = false;
      }
      
    } else if (state.status === 'flying') {
      if (prevStatus !== 'flying') {
        flightStartTime = Date.now();
        knownCrashPoint = 999;
      }
      
      isFlying = true;
      
      document.getElementById('waitingCircle').style.display = 'none';
      document.getElementById('multText').style.display = 'block';
      
      document.getElementById('statusText').textContent = '';
      document.getElementById('statusText').classList.remove('pulse');
      
      if (activeBetId) {
        document.getElementById('actionBtn').className = 'btn-main cashout';
        document.getElementById('actionBtn').disabled = false;

        if (isAutoStopEnabled) {
          const autoTarget = parseFloat(document.getElementById('autoInput').value) || 2.0;
          if (currentMult >= autoTarget) onActionClick(true);
        }
      } else if (queuedBetAmount > 0) {
        document.getElementById('actionBtn').className = 'btn-main queued';
        document.getElementById('actionBtn').textContent = 'В ОЧЕРЕДИ';
        document.getElementById('actionBtn').disabled = true;
        document.getElementById('queueBadge').classList.add('show');
      } else {
        document.getElementById('actionBtn').className = 'btn-main';
        document.getElementById('actionBtn').textContent = 'ПОСТАВИТЬ';
        document.getElementById('actionBtn').disabled = false;
      }
      
    } else if (state.status === 'crashed') {
      if (prevStatus === 'flying') {
        triggerExplosion();
        playSound('crash');
      }
      isFlying = false;
      document.getElementById('waitingCircle').style.display = 'none';
      document.getElementById('multText').style.display = 'block';
      document.getElementById('multText').textContent = state.crashPoint.toFixed(2) + 'x';
      document.getElementById('multText').className = 'multiplier-text crashed';
      
      document.getElementById('statusText').textContent = '';
      document.getElementById('statusText').classList.remove('pulse');
      
      if (queuedBetAmount > 0) {
        document.getElementById('actionBtn').className = 'btn-main queued';
        document.getElementById('actionBtn').textContent = 'В ОЧЕРЕДИ';
        document.getElementById('actionBtn').disabled = true;
        document.getElementById('queueBadge').classList.add('show');
      } else {
        document.getElementById('actionBtn').className = 'btn-main';
        document.getElementById('actionBtn').textContent = 'ПОДОЖДИТЕ...';
        document.getElementById('actionBtn').disabled = true;
      }
    }

  } catch(e) { console.error('pollCrash error:', e); }
}

function drawScene(mult) {
  const w = canvas.clientWidth;
  const h = canvas.clientHeight;
  const pad = 30;
  ctx.clearRect(0, 0, w, h);

  if (!isFlying && !isExploding) return;

  const x0 = pad, y0 = h - pad;
  const x1 = w - pad, y1 = pad;

  const progress = Math.min(1, Math.log(Math.max(mult, 1.01)) / Math.log(15));
  const x = x0 + (x1 - x0) * progress;
  const y = y0 + (y1 - y0) * progress;

  if (!isExploding && mult > 1.0) {
    points.push({ x, y });
    if (points.length > 400) points.shift();
  }

  if (!isExploding) {
    const grad = ctx.createLinearGradient(x0, y0, x, y);
    grad.addColorStop(0, 'rgba(0,180,216,0.1)');
    grad.addColorStop(0.5, '#00b4d8');
    grad.addColorStop(1, '#00ff88');

    ctx.beginPath();
    ctx.moveTo(x0, y0);
    if (points.length > 0) {
      for (let i = 0; i < points.length; i++) ctx.lineTo(points[i].x, points[i].y);
    }
    ctx.strokeStyle = grad;
    ctx.lineWidth = 4;
    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';
    ctx.shadowBlur = 15;
    ctx.shadowColor = '#00b4d8';
    ctx.stroke();
    ctx.shadowBlur = 0;

    if (rocketImg.complete && mult > 1.0) {
      const size = 64; 
      const angle = Math.atan2(y1 - y0, x1 - x0);
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(angle);
      ctx.shadowBlur = 25;
      ctx.shadowColor = 'rgba(0,180,216,0.8)';
      ctx.drawImage(rocketImg, -size/2, -size/2, size, size);
      ctx.restore();
      ctx.shadowBlur = 0;
    }
  }

  if (isExploding) {
    explosionParticles.forEach(p => {
      p.x += p.vx; p.y += p.vy; p.life -= 0.02;
      if (p.life > 0) {
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI*2);
        ctx.fillStyle = p.color;
        ctx.globalAlpha = p.life;
        ctx.fill();
      }
    });
    ctx.globalAlpha = 1;
  }
}

function triggerExplosion() {
  isExploding = true;
  const w = canvas.clientWidth;
  const h = canvas.clientHeight;
  const pad = 30;
  const x1 = w - pad, y1 = pad;

  const progress = Math.min(1, Math.log(Math.max(currentMult, 1.01)) / Math.log(15));
  const x = pad + (x1 - pad) * progress;
  const y = (h - pad) + (y1 - (h - pad)) * progress;

  const flash = document.getElementById('explosionFlash');
  flash.classList.remove('active'); void flash.offsetWidth; flash.classList.add('active');

  explosionParticles = [];
  for (let i=0; i<40; i++) {
    const a = Math.random() * Math.PI * 2;
    const sp = Math.random() * 5 + 1;
    explosionParticles.push({
      x: x, y: y, vx: Math.cos(a)*sp, vy: Math.sin(a)*sp,
      size: Math.random()*4+2, life: 1,
      color: ['#ff4d4d','#ffcc00','#fff'][Math.floor(Math.random()*3)]
    });
  }

  setTimeout(() => {
    isExploding = false;
    explosionParticles = [];
  }, 1500);
}

function renderHistory(history) {
  const bar = document.getElementById('historyBar');
  bar.innerHTML = '';
  history.slice(0, 10).forEach(v => {
    const val = parseFloat(v);
    let cls = 'blue';
    if (val <= 1.50) cls = 'red';
    else if (val > 1.50 && val <= 3.99) cls = 'blue';
    else if (val >= 4.00 && val <= 9.99) cls = 'purple';
    else if (val >= 10.00) cls = 'gold';
    
    const el = document.createElement('div');
    el.className = 'history-item ' + cls;
    el.textContent = val.toFixed(2) + 'x';
    bar.appendChild(el);
  });
}

function renderBets(bets) {
  const container = document.getElementById('betsList');
  if (!bets || bets.length === 0) {
    container.innerHTML = '<div class="bet-row"><span class="b-name">Ожидание ставок...</span></div>';
    return;
  }
  bets.sort((a, b) => b.cashed_out - a.cashed_out || b.amount - a.amount);
  container.innerHTML = bets.map(b => {
    const wonClass = b.cashed_out ? 'won' : '';
    const multText = b.cashed_out ? ` (x${b.cashout_mult.toFixed(2)})` : '';
    return `<div class="bet-row ${wonClass}"><span class="b-name">${b.guest_id}</span><span class="b-amt">${b.amount} ₽${multText}</span></div>`;
  }).join('');
}

function addBet(amount) { 
  let curr = parseFloat(document.getElementById('betInput').value) || 0;
  let val = curr + amount;
  if (val > 500) val = 500;
  if (val < 1) val = 1;
  document.getElementById('betInput').value = val; 
}

async function placeBetOnServer(amt) {
  console.log('[BET] Отправка ставки:', amt);
  try {
    const res = await fetch('/api/crash/start', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ guest_id: currentPlayer.id, amount: amt })
    });
    const data = await res.json();
    console.log('[BET] Ответ сервера:', data);
    
    if (data.ok) {
      activeBetId = data.bet_id;
      await loadBalance();
      return true;
    } else {
      alert('❌ Ошибка ставки:\n' + (data.error || 'Неизвестная ошибка'));
      return false;
    }
  } catch(e) {
    console.error('[BET] Ошибка сети:', e);
    alert('❌ Ошибка сети: ' + e.message);
    return false;
  }
}

async function onActionClick(isAuto = false) {
  if (!currentPlayer) return;
  if (!isAuto) playSound('bet');

  if (currentStatus === 'flying' && activeBetId) {
    try {
      const res = await fetch('/api/crash/cashout', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ bet_id: activeBetId, guest_id: currentPlayer.id, mult: currentMult })
      });
      const data = await res.json();
      if (data.ok) {
        if (!isAuto) playSound('win');
        loadBalance();
        activeBetId = null;
      } else {
        alert('❌ Ошибка кэшаута: ' + (data.error || ''));
      }
    } catch(e) { alert('Ошибка сети'); }
    return;
  }

  if (queuedBetAmount > 0) {
    queuedBetAmount = 0;
    document.getElementById('queueBadge').classList.remove('show');
    document.getElementById('actionBtn').textContent = 'ПОСТАВИТЬ';
    document.getElementById('actionBtn').className = 'btn-main';
    return;
  }

  const amt = parseFloat(document.getElementById('betInput').value) || 0;
  if (amt < 1) return alert('Мин 1 ₽');
  if (amt > 500) return alert('Макс 500 ₽');

  if (lastKnownBalance < amt) {
    return alert('❌ Недостаточно средств.\nВаш баланс: ' + lastKnownBalance.toFixed(2) + ' ₽\nСтавка: ' + amt + ' ₽');
  }

  if (currentStatus === 'waiting' && !activeBetId) {
    const ok = await placeBetOnServer(amt);
    if (ok) {
      document.getElementById('actionBtn').textContent = 'ОЖИДАНИЕ...';
      document.getElementById('actionBtn').disabled = true;
    }
  } else if (currentStatus === 'flying' && !activeBetId) {
    queuedBetAmount = amt;
    document.getElementById('queueBadge').classList.add('show');
    document.getElementById('actionBtn').className = 'btn-main queued';
    document.getElementById('actionBtn').textContent = 'В ОЧЕРЕДИ';
    document.getElementById('actionBtn').disabled = true;
  }
}
</script>
