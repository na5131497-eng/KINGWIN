<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>KINGWIN — Crash</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-main: #090a10; --bg-panel: #181a24; --bg-dark: #11121a;
    --accent: #00e5ff; --accent-green: #00ff88;
    --text-main: #fff; --text-muted: #8b92a5;
    --border: rgba(255,255,255,0.06);
    --red: #ff4d4d; --yellow: #f1c40f; --gold: #ffd700;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Montserrat', sans-serif; }
  html, body { height: 100%; }
  body { background: var(--bg-main); color: var(--text-main); height: 100vh; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }

  /* ВЫДВИЖНОЕ МЕНЮ */
  .float-menu-btn { position: fixed; top: 15px; left: 15px; z-index: 1000; background: #181a24; border: 1px solid #00e5ff; color: #00e5ff; width: 44px; height: 44px; border-radius: 10px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 24px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); transition: 0.3s; }
  .float-menu-btn:hover { background: rgba(0,229,255,0.1); transform: scale(1.05); }
  .float-menu { position: fixed; top: 15px; left: 70px; z-index: 999; background: rgba(17,18,26,0.95); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; padding: 10px; display: flex; flex-direction: column; gap: 6px; width: 180px; box-shadow: 0 10px 30px rgba(0,0,0,0.6); transform: translateX(-20px); opacity: 0; pointer-events: none; transition: 0.3s; }
  .float-menu.show { transform: translateX(0); opacity: 1; pointer-events: auto; }
  .float-menu a { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 10px; text-decoration: none; color: #8b92a5; font-size: 12px; font-weight: 700; transition: 0.2s; text-transform: uppercase; border: 1px solid transparent; }
  .float-menu a:hover { background: rgba(0,229,255,0.1); color: #00e5ff; border-color: rgba(0,229,255,0.3); }
  .float-menu a svg { width: 18px; height: 18px; fill: currentColor; }

  .topbar { display: flex; justify-content: space-between; align-items: center; padding: 10px 16px; background: var(--bg-panel); border-bottom: 1px solid var(--border); flex-shrink: 0; z-index: 100; padding-left: 70px; }
  .topbar-left { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .topbar-logo { font-size: 18px; font-weight: 900; letter-spacing: 2px; background: linear-gradient(135deg, #00e5ff, #0077ff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; flex-shrink: 0; }
  .balance-badge { display: flex; align-items: center; gap: 6px; background: rgba(0,0,0,0.5); border: 1px solid rgba(0,229,255,0.35); padding: 6px 12px; border-radius: 20px; font-size: 12px; font-weight: 700; cursor: pointer; transition: 0.3s; white-space: nowrap; }
  .balance-badge .lbl { color: var(--text-muted); font-weight: 600; font-size: 10px; text-transform: uppercase; letter-spacing: 1px; }
  .balance-badge .val { color: var(--accent); font-weight: 900; font-size: 13px; }

  .crash-layout { display: flex; width: 100%; flex: 1; min-height: 0; padding: 16px; gap: 16px; max-width: 1400px; margin: 0 auto; overflow: hidden; }
  .sidebar-bets { width: 320px; background: var(--bg-panel); border: 1px solid var(--border); border-radius: 20px; display: flex; flex-direction: column; flex-shrink: 0; overflow: hidden; }
  .tabs { display: flex; padding: 12px; gap: 8px; border-bottom: 1px solid var(--border); background: var(--bg-dark); }
  .tab-btn { flex: 1; background: transparent; border: none; color: var(--text-muted); font-size: 11px; font-weight: 700; padding: 7px 0; cursor: pointer; border-radius: 8px; transition: 0.2s; text-transform: uppercase; }
  .tab-btn.active { background: rgba(255,255,255,0.1); color: #fff; }
  .bets-header { display: grid; grid-template-columns: 2.2fr 1fr 1fr 1.3fr; padding: 10px 14px; font-size: 10px; color: var(--text-muted); font-weight: 700; text-transform: uppercase; border-bottom: 1px solid var(--border); }
  .bets-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; }
  .bet-row { display: grid; grid-template-columns: 2.2fr 1fr 1fr 1.3fr; padding: 10px 14px; align-items: center; font-size: 12px; border-bottom: 1px solid rgba(255,255,255,0.02); }
  .bet-row:hover { background: rgba(255,255,255,0.03); }
  .bet-user { display: flex; align-items: center; gap: 8px; font-weight: 600; min-width: 0; }
  .user-avatar { width: 24px; height: 24px; border-radius: 50%; background: linear-gradient(135deg, #00e5ff, #0077ff); display: flex; justify-content: center; align-items: center; font-size: 9px; font-weight: 900; color: #fff; letter-spacing: 0.3px; flex-shrink: 0; text-shadow: 0 1px 2px rgba(0,0,0,0.3); box-shadow: 0 0 8px rgba(0,229,255,0.3); }
  .user-meta { display: flex; flex-direction: column; min-width: 0; line-height: 1.2; }
  .user-name { font-weight: 700; font-size: 11px; letter-spacing: 0.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .user-rank { font-size: 9px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px; margin-top: 2px; }
  .user-rank.Bronze   { color: #e8a76a; }
  .user-rank.Silver   { color: #d9d9d9; }
  .user-rank.Gold     { color: #f1c40f; }
  .user-rank.Platinum { color: #e5e4e2; }
  .user-rank.Diamond  { color: #b9f2ff; }
  .user-rank.VIP      { color: #ffe066; text-shadow: 0 0 6px rgba(212,175,55,0.7); }
  .bet-amount { color: var(--text-muted); font-weight: 600; font-size: 11px; }
  .bet-mult { display: inline-block; padding: 2px 6px; border-radius: 6px; font-weight: 800; font-size: 11px; text-align: center; }
  .bet-mult.win { background: rgba(63,191,127,0.2); color: var(--accent-green); }
  .bet-mult.lose { background: transparent; color: var(--text-muted); }
  .bet-cashout { text-align: right; font-weight: 800; color: var(--accent-green); font-size: 11px; }

  .game-area { flex: 1; display: flex; flex-direction: column; gap: 12px; min-width: 0; min-height: 0; }
  .history-bar { display: flex; align-items: center; gap: 10px; background: var(--bg-panel); border: 1px solid var(--border); border-radius: 20px; padding: 10px 16px; flex-shrink: 0; }
  .history-title { font-size: 12px; font-weight: 700; color: var(--text-muted); margin-right: 6px; flex-shrink: 0; }
  .history-list { display: flex; gap: 6px; overflow-x: auto; flex: 1; scrollbar-width: none; }
  .history-list::-webkit-scrollbar { display: none; }
  .history-item { padding: 5px 12px; border-radius: 20px; font-size: 12px; font-weight: 800; flex-shrink: 0; }
  .history-item.red    { background: rgba(255,77,77,0.2);   color: #ff8a8a; border: 1px solid rgba(255,77,77,0.45); }
  .history-item.blue   { background: rgba(0,119,255,0.2);   color: #66b3ff; border: 1px solid rgba(0,119,255,0.45); }
  .history-item.purple { background: rgba(168,85,247,0.2);  color: #d8b4fe; border: 1px solid rgba(168,85,247,0.45); }
  .history-item.gold   { background: rgba(241,196,15,0.2);  color: #ffe066; border: 1px solid rgba(241,196,15,0.55); box-shadow: 0 0 10px rgba(241,196,15,0.35); }

  .canvas-container { flex: 1; background: linear-gradient(180deg, #131624, #090a10); border: 1px solid var(--border); border-radius: 20px; position: relative; overflow: hidden; display: flex; justify-content: center; align-items: center; box-shadow: inset 0 0 50px rgba(0,0,0,0.5); min-height: 200px; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .multiplier-display { position: absolute; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center; pointer-events: none; }
  .mult-value { font-size: 72px; font-weight: 900; color: #fff; text-shadow: 0 5px 30px rgba(0,229,255,0.4); line-height: 1; transition: color 0.3s, text-shadow 0.3s; }
  .mult-value.crashed { color: var(--red); text-shadow: 0 5px 30px rgba(255,77,77,0.4); }
  .mult-value.golden { color: var(--gold); text-shadow: 0 5px 30px rgba(255,215,0,0.6); }
  .mult-label { font-size: 13px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 2px; margin-top: 10px; font-weight: 700; min-height: 16px; }

  .control-panel { background: var(--bg-panel); border: 1px solid var(--border); border-radius: 20px; padding: 16px; display: flex; gap: 16px; flex-shrink: 0; }
  .bet-box { flex: 1; background: var(--bg-dark); border: 1px solid var(--border); border-radius: 16px; padding: 12px; display: flex; flex-direction: column; gap: 10px; min-width: 0; position: relative; }
  .bet-box.queued { border-color: rgba(0,229,255,0.4); box-shadow: 0 0 18px rgba(0,229,255,0.12); }
  .queue-badge { display: none; position: absolute; top: -10px; right: 12px; background: linear-gradient(135deg, #00e5ff, #0077ff); color: #000; font-size: 9px; font-weight: 900; padding: 3px 10px; border-radius: 10px; letter-spacing: 1px; text-transform: uppercase; box-shadow: 0 0 12px rgba(0,229,255,0.5); }
  .bet-box.queued .queue-badge { display: block; }
  
  .bet-options { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .check-group { display: flex; gap: 10px; }
  .check-label { display: flex; align-items: center; gap: 5px; font-size: 11px; color: var(--text-muted); font-weight: 600; cursor: pointer; }
  .check-label input { accent-color: var(--accent); cursor: pointer; }
  .check-label input:disabled { opacity: 0.4; cursor: not-allowed; }
  .check-label input:disabled + span { opacity: 0.4; }
  
  .mult-input { font-size: 11px; color: var(--text-muted); font-weight: 700; white-space: nowrap; }
  .mult-input input { width: 46px; background: transparent; border: none; color: #fff; font-weight: 700; outline: none; font-size: 12px; }
  .mult-input input:disabled { opacity: 0.4; cursor: not-allowed; }
  
  .amount-row { display: flex; gap: 8px; }
  .amount-input-wrap { flex: 1; display: flex; align-items: center; background: rgba(0,0,0,0.4); border: 1px solid var(--border); border-radius: 12px; padding: 4px; min-width: 0; }
  .amount-input-wrap button { width: 36px; height: 36px; border-radius: 8px; background: rgba(255,255,255,0.05); border: none; color: #fff; font-size: 18px; cursor: pointer; font-weight: 700; transition: 0.2s; flex-shrink: 0; }
  .amount-input-wrap button:hover { background: rgba(255,255,255,0.1); }
  .amount-input-wrap input { flex: 1; min-width: 0; background: transparent; border: none; color: #fff; text-align: center; font-size: 18px; font-weight: 800; outline: none; font-family: inherit; }
  .amount-input-wrap input:disabled { opacity: 0.6; cursor: not-allowed; }
  
  .btn-action { flex: 1; border: none; border-radius: 12px; font-size: 16px; font-weight: 900; cursor: pointer; text-transform: uppercase; letter-spacing: 1px; transition: 0.2s; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.2; min-width: 0; padding: 8px 10px; }
  .btn-action .subtext { font-size: 11px; font-weight: 600; opacity: 0.9; margin-top: 3px; }
  .btn-bet { background: var(--yellow); color: #000; box-shadow: 0 0 20px rgba(241,196,15,0.2); }
  .btn-bet:hover { background: #f7d341; }
  .btn-bet:disabled { opacity: 0.5; cursor: not-allowed; box-shadow: none; }
  .btn-cancel { background: var(--red); color: #fff; box-shadow: 0 0 20px rgba(255,77,77,0.2); }
  .btn-cancel:hover { background: #ff3333; }

  .btn-cashout {
    background: linear-gradient(135deg, #0a1a3a 0%, #1a3a6b 50%, #0a1a3a 100%);
    color: #00e5ff; border: 2px solid #00e5ff;
    box-shadow: 0 0 15px rgba(0,229,255,0.45), 0 0 30px rgba(0,229,255,0.2), inset 0 0 15px rgba(0,229,255,0.08);
    text-shadow: 0 0 10px rgba(0,229,255,0.7);
    animation: cashoutPulse 1.6s ease-in-out infinite;
    position: relative; overflow: hidden;
  }
  .btn-cashout::before { content: ''; position: absolute; top: -50%; left: -100%; width: 50%; height: 200%; background: linear-gradient(90deg, transparent, rgba(0,229,255,0.35), transparent); transform: skewX(-25deg); animation: cashoutShine 2.4s ease-in-out infinite; }
  .btn-cashout:hover { background: linear-gradient(135deg, #102a5a 0%, #2a5a9b 50%, #102a5a 100%); border-color: #33ebff; color: #33ebff; box-shadow: 0 0 25px rgba(0,229,255,0.7), 0 0 50px rgba(0,229,255,0.35), inset 0 0 20px rgba(0,229,255,0.15); }
  @keyframes cashoutPulse { 0%, 100% { box-shadow: 0 0 15px rgba(0,229,255,0.45), 0 0 30px rgba(0,229,255,0.2), inset 0 0 15px rgba(0,229,255,0.08); } 50% { box-shadow: 0 0 25px rgba(0,229,255,0.75), 0 0 45px rgba(0,229,255,0.35), inset 0 0 20px rgba(0,229,255,0.15); } }
  @keyframes cashoutShine { 0% { left: -100%; } 60%, 100% { left: 150%; } }

  .quick-bets { display: flex; gap: 6px; }
  .quick-bets button { flex: 1; background: rgba(255,255,255,0.05); border: 1px solid var(--border); color: var(--text-muted); padding: 6px; border-radius: 8px; font-size: 11px; font-weight: 700; cursor: pointer; }
  .quick-bets button:hover { background: rgba(255,255,255,0.1); color: #fff; }
  .quick-bets button:disabled { opacity: 0.4; cursor: not-allowed; }

  .toast-container { position: fixed; top: 60px; right: 16px; z-index: 9999; display: flex; flex-direction: column; gap: 8px; }
  .toast { background: rgba(24,26,36,0.95); border-left: 4px solid var(--accent); padding: 12px 16px; border-radius: 8px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); min-width: 220px; transform: translateX(120%); transition: transform 0.3s; display: flex; align-items: center; gap: 10px; }
  .toast.show { transform: translateX(0); }
  .toast.success { border-left-color: var(--accent-green); }
  .toast.error { border-left-color: var(--red); }
  .toast.info { border-left-color: var(--accent); }

  @media (max-width: 900px) {
    html, body { height: auto; min-height: 100%; overflow: auto; }
    body { height: auto; min-height: 100dvh; overflow-y: auto; display: block; }
    .topbar { padding: 10px 14px; padding-left: 70px; }
    .topbar-logo { font-size: 16px; letter-spacing: 1px; }
    .balance-badge { padding: 6px 10px; font-size: 12px; }
    .balance-badge .lbl { display: none; }
    .balance-badge .val { font-size: 12px; }
    .crash-layout { display: flex; flex-direction: column; padding: 10px; gap: 10px; max-width: none; min-height: auto; height: auto; overflow: visible; }
    .game-area { flex: none; display: flex; flex-direction: column; gap: 10px; min-height: auto; order: 1; }
    .history-bar { padding: 8px 12px; border-radius: 14px; }
    .history-title { font-size: 11px; }
    .history-item { padding: 4px 10px; font-size: 11px; }
    .canvas-container { flex: none; width: 100%; height: 42vh; min-height: 220px; max-height: 340px; border-radius: 16px; }
    .mult-value { font-size: 52px; }
    .mult-label { font-size: 11px; letter-spacing: 1px; margin-top: 6px; }
    .control-panel { flex-direction: column; padding: 10px; gap: 10px; border-radius: 16px; }
    .bet-box { padding: 12px; gap: 10px; border-radius: 14px; }
    .sidebar-bets { width: 100%; height: 260px; min-height: 200px; order: 2; flex-shrink: 0; border-radius: 16px; }
    .toast-container { top: 60px; right: 8px; left: 8px; }
    .toast { min-width: 0; width: 100%; transform: translateY(-120%); }
    .toast.show { transform: translateY(0); }
  }

  @media (max-width: 480px) {
    .crash-layout { padding: 8px; gap: 8px; }
    .canvas-container { height: 38vh; min-height: 200px; max-height: 300px; }
    .mult-value { font-size: 42px; }
    .mult-label { font-size: 10px; letter-spacing: 0.5px; }
    .history-bar { padding: 6px 10px; }
    .history-title { font-size: 10px; }
    .history-item { padding: 3px 8px; font-size: 10px; }
    .amount-input-wrap { padding: 3px; }
    .amount-input-wrap button { width: 32px; height: 32px; font-size: 16px; }
    .amount-input-wrap input { font-size: 16px; }
    .btn-action { font-size: 13px; padding: 6px 6px; }
    .btn-action .subtext { font-size: 10px; }
    .quick-bets { gap: 4px; }
    .quick-bets button { font-size: 10px; padding: 5px 4px; }
    .bet-options { flex-wrap: wrap; gap: 6px; }
    .check-label { font-size: 10px; }
    .mult-input { font-size: 10px; }
    .mult-input input { width: 40px; font-size: 11px; }
    .sidebar-bets { height: 220px; min-height: 180px; }
    .bets-header { padding: 8px 10px; font-size: 9px; }
    .bet-row { padding: 8px 10px; font-size: 11px; }
    .user-avatar { width: 20px; height: 20px; font-size: 8px; }
    .user-name { font-size: 10px; }
    .user-rank { font-size: 8px; }
    .bet-amount { font-size: 10px; }
    .bet-mult { font-size: 10px; padding: 2px 5px; }
    .bet-cashout { font-size: 10px; }
  }
</style>
</head>
<body>

<!-- ДАЛЬШЕ ИДЕТ HTML ИГРЫ CRASH -->
<div class="topbar">
  <div class="topbar-left">
    <div class="topbar-logo">KINGWIN</div>
  </div>
  <div class="balance-badge" id="balanceBadge">
    <span class="lbl">Баланс</span>
    <span class="val" id="balanceVal">0.00 ₽</span>
  </div>
</div>

<div class="toast-container" id="toastContainer"></div>

<div class="crash-layout">
  <aside class="sidebar-bets">
    <div class="tabs">
      <button class="tab-btn active">Все ставки</button>
      <button class="tab-btn">Мои ставки</button>
      <button class="tab-btn">Топ</button>
    </div>
    <div class="bets-header">
      <div>Игрок</div>
      <div>Ставка</div>
      <div>Множ.</div>
      <div style="text-align:right">Выигрыш</div>
    </div>
    <div class="bets-list" id="betsList"></div>
  </aside>

  <div class="game-area">
    <div class="history-bar">
      <div class="history-title">История</div>
      <div class="history-list" id="historyList"></div>
    </div>

    <div class="canvas-container">
      <canvas id="gameCanvas"></canvas>
      <div class="multiplier-display">
