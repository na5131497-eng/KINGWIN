<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎯 PLINKO — KINGWIN</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Montserrat', sans-serif; }
  body { background: radial-gradient(circle at top center, #1a1c29 0%, #090a10 60%); color: #fff; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
  
  /* ТОПБАР */
  .topbar { height: 70px; display: flex; justify-content: space-between; align-items: center; padding: 0 20px; border-bottom: 1px solid rgba(255,255,255,0.06); background: rgba(9,10,16,0.8); backdrop-filter: blur(10px); position: sticky; top: 0; z-index: 100; }
  .logo { font-size: 20px; font-weight: 900; letter-spacing: 2px; background: linear-gradient(135deg, #00e5ff, #0077ff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; cursor: pointer; text-decoration: none; }
  .back-btn { padding: 8px 16px; border-radius: 10px; background: #181a24; border: 1px solid rgba(255,255,255,0.06); color: #8b92a5; text-decoration: none; font-size: 13px; font-weight: 700; transition: 0.3s; }
  .back-btn:hover { border-color: #00e5ff; color: #00e5ff; }
  .balance-badge { display: flex; align-items: center; gap: 8px; padding: 8px 16px; background: #181a24; border: 1px solid rgba(255,255,255,0.06); border-radius: 20px; font-size: 14px; font-weight: 700; }
  .balance-badge .lbl { font-size: 10px; color: #8b92a5; text-transform: uppercase; }
  .balance-badge .num { color: #00ff88; }

  /* КОНТЕНТ */
  .content { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 20px; position: relative; }
  
  /* ДЕКОРАТИВНЫЕ ЭЛЕМЕНТЫ */
  .glow { position: absolute; width: 300px; height: 300px; background: radial-gradient(circle, rgba(0,229,255,0.15) 0%, transparent 70%); border-radius: 50%; filter: blur(40px); z-index: 0; }
  
  .icon-wrap { position: relative; z-index: 1; margin-bottom: 20px; }
  .icon { font-size: 80px; filter: drop-shadow(0 0 20px rgba(0,229,255,0.6)); animation: float 3s ease-in-out infinite; }
  @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-15px); } }

  h1 { font-size: 38px; font-weight: 900; letter-spacing: 4px; margin-bottom: 10px; z-index: 1; background: linear-gradient(135deg, #fff, #8b92a5); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  p { font-size: 16px; color: #8b92a5; max-width: 500px; line-height: 1.6; margin-bottom: 30px; z-index: 1; font-weight: 500; }
  
  .badge { background: rgba(0,229,255,0.1); border: 1px solid rgba(0,229,255,0.3); color: #00e5ff; padding: 8px 20px; border-radius: 20px; font-size: 13px; font-weight: 800; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 30px; z-index: 1; box-shadow: 0 0 20px rgba(0,229,255,0.2); }
  
  .btn { background: linear-gradient(135deg, #00e5ff, #0077ff); color: #000; padding: 16px 40px; border-radius: 12px; font-weight: 900; font-size: 16px; border: none; cursor: pointer; text-decoration: none; transition: 0.3s; box-shadow: 0 0 25px rgba(0,229,255,0.4); z-index: 1; text-transform: uppercase; letter-spacing: 1px; }
  .btn:hover { transform: translateY(-3px) scale(1.02); box-shadow: 0 0 40px rgba(0,229,255,0.7); }
</style>
</head>
<body>

<div class="topbar">
  <a href="/" class="logo">KINGWIN</a>
  <a href="/" class="back-btn">← На главную</a>
  <div class="balance-badge">
    <span class="lbl">Баланс</span>
    <span class="num"><span id="bal">0</span> ₽</span>
  </div>
</div>

<div class="content">
  <div class="glow"></div>
  
  <div class="icon-wrap">
    <div class="icon">🎯</div>
  </div>
  
  <div class="badge">Скоро в эфире</div>
  
  <h1>PLINKO</h1>
  <p>Мы уже настраиваем физику падения шариков и multipliers. Самая залипательная игра вернется на эту страницу совсем скоро!</p>
  
  <a href="/" class="btn">Вернуться на главную</a>
</div>

<script>
  async function loadBalance() {
    const playerId = localStorage.getItem('kingwin_player_id');
    if(!playerId) return;
    try {
      const r = await fetch('/api/guest/me?id=' + encodeURIComponent(playerId));
      const d = await r.json();
      if(r.ok && d.guest) {
        const total = (parseFloat(d.guest.bonus_balance) || 0) + (parseFloat(d.guest.deposit_balance) || 0);
        document.getElementById('bal').textContent = total.toFixed(2);
      }
    } catch(e) {}
  }
  loadBalance();
  setInterval(loadBalance, 5000);
</script>
</body>
</html>
