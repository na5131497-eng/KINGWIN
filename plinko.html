<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0e14">
<title>KINGWIN — Plinko</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-main: #090a10; --bg-panel: #151922;
    --accent: #00e5ff; --accent-green: #00ff88; --gold: #f1c40f;
    --text-main: #fff; --text-muted: #8b92a5;
    --border: rgba(255,255,255,0.1); --red: #ff4d4d;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Montserrat', sans-serif; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; background: var(--bg-main); color: var(--text-main); }
  .app { display: flex; flex-direction: column; height: 100vh; height: 100dvh; }

  .float-menu-btn { position: fixed; top: 15px; left: 15px; z-index: 1000; background: #181a24; border: 1px solid var(--accent); color: var(--accent); width: 44px; height: 44px; border-radius: 10px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 24px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); transition: 0.3s; }
  .float-menu { position: fixed; top: 15px; left: 70px; z-index: 999; background: rgba(17,18,26,0.95); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; padding: 10px; display: flex; flex-direction: column; gap: 6px; width: 180px; box-shadow: 0 10px 30px rgba(0,0,0,0.6); transform: translateX(-20px); opacity: 0; pointer-events: none; transition: 0.3s; }
  .float-menu.show { transform: translateX(0); opacity: 1; pointer-events: auto; }
  .float-menu a { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 10px; text-decoration: none; color: #8b92a5; font-size: 12px; font-weight: 700; transition: 0.2s; text-transform: uppercase; border: 1px solid transparent; }
  .float-menu a:hover { background: rgba(0,229,255,0.1); color: var(--accent); border-color: rgba(0,229,255,0.3); }

  .topbar { height: 60px; background: var(--bg-panel); border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; padding: 0 20px; padding-left: 70px; flex-shrink: 0; z-index: 100; }
  .logo { font-size: 18px; font-weight: 900; letter-spacing: 2px; background: linear-gradient(135deg, #00e5ff, #0077ff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-decoration: none; }
  .top-actions { display: flex; align-items: center; gap: 10px; }
  .balance-pill { background: rgba(0,255,136,0.12); border: 1px solid rgba(0,255,136,0.35); color: var(--accent-green); padding: 8px 16px; border-radius: 8px; font-weight: 900; font-size: 13px; white-space: nowrap; }

  .main-body { display: flex; flex: 1; overflow: hidden; }
  .sidebar { width: 300px; background: var(--bg-panel); border-right: 1px solid var(--border); display: flex; flex-direction: column; padding: 20px; flex-shrink: 0; z-index: 10; overflow-y: auto; }
  .sidebar h3 { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; font-weight: 800; margin-bottom: 10px; margin-top: 5px; }
  .input-group { background: rgba(0,0,0,0.4); border: 1px solid var(--border); border-radius: 10px; padding: 10px 15px; margin-bottom: 15px; display: flex; align-items: center; gap: 10px; }
  .input-group input { flex: 1; background: transparent; border: none; color: #fff; font-size: 20px; font-weight: 900; outline: none; font-family: inherit; min-width: 0; }
  .input-group .currency { color: var(--text-muted); font-size: 14px; font-weight: 700; }
  
  .quick-bets { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 20px; }
  .quick-bets button { flex: 1; min-width: 40px; background: rgba(255,255,255,0.05); border: 1px solid var(--border); color: var(--text-muted); padding: 8px 0; border-radius: 8px; font-weight: 700; font-size: 11px; cursor: pointer; transition: 0.2s; }
  .quick-bets button.active { border-color: var(--accent); color: var(--accent); background: rgba(0,229,255,0.1); }

  .risk-grid { display: flex; gap: 6px; margin-bottom: 20px; }
  .risk-btn { flex: 1; background: transparent; border: 1px solid var(--border); color: var(--text-muted); padding: 10px 0; border-radius: 8px; font-weight: 800; font-size: 11px; cursor: pointer; transition: 0.2s; text-transform: uppercase; }
  .risk-btn.active[data-risk="low"] { border-color: #3fbf7f; color: #3fbf7f; background: rgba(63,191,127,0.1); }
  .risk-btn.active[data-risk="medium"] { border-color: #f1c40f; color: #f1c40f; background: rgba(241,196,15,0.1); }
  .risk-btn.active[data-risk="high"] { border-color: #ff4d4d; color: #ff4d4d; background: rgba(255,77,77,0.1); }

  .btn-play { width: 100%; background: linear-gradient(135deg, var(--accent), #0077ff); color: #000; border: none; border-radius: 10px; padding: 16px; font-size: 16px; font-weight: 900; text-transform: uppercase; cursor: pointer; transition: 0.3s; margin-top: auto; flex-shrink: 0; box-shadow: 0 4px 15px rgba(0,229,255,0.3); }
  .btn-play:hover:not(:disabled) { box-shadow: 0 6px 20px rgba(0,229,255,0.5); transform: translateY(-2px); }
  .btn-play:disabled { opacity: 0.5; cursor: not-allowed; background: #333; color: #888; box-shadow: none; }

  .game-area { flex: 1; display: flex; flex-direction: column; position: relative; overflow: hidden; background: radial-gradient(circle at center, #121826, #090a10 80%); padding: 15px; }
  
  .canvas-wrap { flex: 1; position: relative; display: flex; justify-content: center; align-items: center; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; }

  .toast-container { position: fixed; top: 80px; right: 20px; z-index: 999999; display: flex; flex-direction: column; gap: 10px; pointer-events: none; }
  .toast { background: rgba(24,26,36,0.95); border-left: 4px solid var(--accent); padding: 16px 20px; border-radius: 8px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); min-width: 250px; transform: translateX(120%); transition: 0.3s; font-weight: 600; font-size: 14px; color: #fff; }
  .toast.show { transform: translateX(0); }
  .toast.success { border-left-color: var(--accent-green); }
  .toast.error { border-left-color: var(--red); }

  @media (max-width: 900px) {
    .main-body { flex-direction: column; }
    .sidebar { width: 100%; height: auto; flex-direction: row; flex-wrap: wrap; border-right: none; border-bottom: 1px solid var(--border); padding: 10px; align-items: center; justify-content: space-between; gap: 8px; }
    .sidebar h3 { display: none; }
    .input-group { margin-bottom: 0; flex: 1; min-width: 100px; }
    .quick-bets { margin-bottom: 0; flex: 2; min-width: 160px; }
    .risk-grid { margin-bottom: 0; flex: 1.5; min-width: 140px; }
    .btn-play { width: auto; min-width: 100px; margin-top: 0; flex: 1; padding: 10px; font-size: 13px; }
    .game-area { padding: 5px; }
    .toast-container { top: 60px; right: 10px; left: 10px; }
    .toast { width: 100%; min-width: 0; transform: translateY(-120%); }
    .toast.show { transform: translateY(0); }
  }
</style>
</head>
<body>

<div class="toast-container" id="toastContainer"></div>

<button class="float-menu-btn" onclick="document.getElementById('floatMenu').classList.toggle('show')">☰</button>
<div class="float-menu" id="floatMenu">
  <a href="/">Главная</a>
  <a href="/crash.html">Crash</a>
  <a href="/cases.html">Cases</a>
  <a href="/miner.html">Miner</a>
  <a href="/ladder.html">Ladder</a>
</div>

<div class="app">
  <div class="topbar">
    <a href="/" class="logo">KINGWIN</a>
    <div class="top-actions">
      <div class="balance-pill"><span id="balanceVal">0.00</span> ₽</div>
    </div>
  </div>

  <div class="main-body">
    <div class="sidebar">
      <h3>Сумма ставки</h3>
      <div class="input-group">
        <input type="number" id="betAmount" value="10.00" min="1" step="1">
        <span class="currency">₽</span>
      </div>
      <div class="quick-bets" id="quickBets">
        <button onclick="setBet(10)" class="active">10</button>
        <button onclick="setBet(25)">25</button>
        <button onclick="setBet(50)">50</button>
        <button onclick="setBet(100)">100</button>
      </div>
      
      <h3>Уровень риска</h3>
      <div class="risk-grid" id="riskGrid">
        <button class="risk-btn active" data-risk="low" onclick="setRisk('low')">Низкий</button>
        <button class="risk-btn" data-risk="medium" onclick="setRisk('medium')">Средний</button>
        <button class="risk-btn" data-risk="high" onclick="setRisk('high')">Высокий</button>
      </div>

      <button class="btn-play" id="btnPlay" onclick="dropBall()">Играть</button>
    </div>

    <div class="game-area">
      <div class="canvas-wrap">
        <canvas id="gameCanvas"></canvas>
      </div>
    </div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
let currentPlayer = null;
let balance = 0;
let busy = false;
let currentBet = 10;
let currentRisk = 'low';

// ВСЕГДА 8 РЯДОВ. Множители как ты просил.
const RISK_CONFIG = {
  low: { 
    rows: 8, 
    multipliers: [5.3, 2.2, 1.1, 0.9, 0.5, 0.9, 1.1, 2.2, 5.3] 
  },
  medium: { 
    rows: 8, 
    multipliers: [13, 3.1, 1.3, 0.6, 0.4, 0.6, 1.3, 3.1, 13] 
  },
  high: { 
    rows: 8, 
    multipliers: [24, 4, 1.5, 0.3, 0.2, 0.3, 1.5, 4, 24] 
  }
};

const canvas = $('gameCanvas');
const ctx = canvas.getContext('2d');
let W, H, pegs = [], slots = [], ROWS = 8;
let boardWidth = 0, boardHeight = 0, startY = 0, rowGap = 0, pegGap = 0;
const BALL_SIZE = 8;

function resizeCanvas() {
  const p = canvas.parentElement;
  const dpr = window.devicePixelRatio || 1;
  W = p.clientWidth;
  H = p.clientHeight;
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  buildBoard();
}
window.addEventListener('resize', resizeCanvas);

function buildBoard() {
  ROWS = 8;
  
  // Отступы, чтобы влезло на телефон
  const padTop = 50;
  const padBottom = 70;
  
  // Ширина сетки: не больше экрана, но с отступами
  boardWidth = Math.min(W - 40, 500); 
  boardHeight = H - padTop - padBottom;
  
  startY = padTop + 20;
  rowGap = boardHeight / ROWS;
  
  // Ширина между колышками
  pegGap = boardWidth / (ROWS + 2);
  
  pegs = [];
  // Генерируем колышки (верхний ряд 3, нижний 10)
  for (let r = 0; r < ROWS; r++) {
    const count = r + 3;
    const rowWidth = (count - 1) * pegGap;
    const rowStartX = W / 2 - rowWidth / 2;
    
    for (let c = 0; c < count; c++) {
      pegs.push({
        x: rowStartX + c * pegGap,
        y: startY + r * rowGap,
        row: r,
        col: c
      });
    }
  }
  
  slots = [];
  const slotCount = RISK_CONFIG[currentRisk].multipliers.length;
  const cellW = boardWidth / (slotCount - 1); // Расстояние между центрами
  
  const bottomY = startY + ROWS * rowGap + 10;
  // Центр первого слота совпадает с первым колышком последнего ряда
  const firstPegX = W / 2 - ((ROWS + 2 - 1) * pegGap) / 2; 
  
  for (let i = 0; i < slotCount; i++) {
    slots.push({
      x: firstPegX + i * pegGap, // Центр слота
      y: bottomY,
      w: pegGap - 4,             // Ширина сумки
      h: padBottom - 20,
      index: i
    });
  }
}

function getSlotStyle(mult) {
  if (mult >= 13) return { bg1: '#ff9a9e', bg2: '#fecfef', border: '#ff4d4d', text: '#fff' }; // Королевский
  if (mult >= 4) return { bg1: '#fceabb', bg2: '#f8b500', border: '#d4af37', text: '#000' };  // Золото
  if (mult >= 1.1) return { bg1: '#a8ff78', bg2: '#78ffd6', border: '#3fbf7f', text: '#000' }; // Зелёный
  return { bg1: '#2c3e50', bg2: '#000000', border: '#8b92a5', text: '#fff' };                 // Тёмный
}

function drawBag(cx, cy, w, h, mult) {
  const style = getSlotStyle(mult);
  
  // Тень
  ctx.beginPath();
  ctx.ellipse(cx, cy + h, w/2, 5, 0, 0, Math.PI*2);
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  ctx.fill();

  // Мешок (снизу)
  const bagY = cy + h * 0.3;
  const bagH = h * 0.7;
  
  ctx.beginPath();
  ctx.moveTo(cx - w/2 + 4, bagY);
  ctx.bezierCurveTo(cx - w/2 - 5, bagY + bagH * 0.5, cx, cy + h, cx + w/2 - 4, bagY);
  ctx.quadraticCurveTo(cx + w/2 - 2, bagY - 5, cx, bagY - 8);
  ctx.quadraticCurveTo(cx - w/2 + 2, bagY - 5, cx - w/2 + 4, bagY);
  
  const grad = ctx.createLinearGradient(cx, bagY, cx, cy + h);
  grad.addColorStop(0, style.bg1);
  grad.addColorStop(1, style.bg2);
  ctx.fillStyle = grad;
  ctx.fill();
  ctx.strokeStyle = style.border;
  ctx.lineWidth = 1.5;
  ctx.stroke();

  // Верёвка
  ctx.beginPath();
  ctx.moveTo(cx - w/2 + 4, bagY);
  ctx.quadraticCurveTo(cx, bagY - 12, cx + w/2 - 4, bagY);
  ctx.strokeStyle = '#d4af37';
  ctx.lineWidth = 2;
  ctx.stroke();

  // Текст
  ctx.fillStyle = style.text;
  ctx.font = '900 10px Montserrat';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.shadowColor = 'rgba(0,0,0,0.8)';
  ctx.shadowBlur = 3;
  ctx.fillText('x' + mult, cx, cy + h/2 + 4);
  ctx.shadowBlur = 0;
}

function drawBoard() {
  ctx.clearRect(0, 0, W, H);
  
  // Бортики (стены) по краям сетки
  const wallXOffset = (boardWidth / 2) + 15;
  const leftWallX = W/2 - wallXOffset;
  const rightWallX = W/2 + wallXOffset;
  
  ctx.fillStyle = '#1a2230';
  ctx.shadowColor = '#00e5ff';
  ctx.shadowBlur = 8;
  
  // Левый бортик
  ctx.beginPath();
  ctx.roundRect(leftWallX, startY - 15, 6, boardHeight + 25, [4, 4, 0, 0]);
  ctx.fill();
  
  // Правый бортик
  ctx.beginPath();
  ctx.roundRect(rightWallX - 6, startY - 15, 6, boardHeight + 25, [4, 4, 0, 0]);
  ctx.fill();
  ctx.shadowBlur = 0;

  // Колышки
  pegs.forEach(peg => {
    ctx.beginPath();
    ctx.arc(peg.x, peg.y, 3, 0, Math.PI * 2);
    ctx.fillStyle = '#4a5a70';
    ctx.fill();
    
    // Блик
    ctx.beginPath();
    ctx.arc(peg.x - 1, peg.y - 1, 1, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255,255,255,0.6)';
    ctx.fill();
  });
  
  // Сумки
  const mults = RISK_CONFIG[currentRisk].multipliers;
  slots.forEach(slot => {
    const mult = mults[slot.index];
    drawBag(slot.x, slot.y, slot.w, slot.h, mult);
  });
  
  // Шарики
  balls.forEach(ball => {
    ctx.beginPath();
    const grad = ctx.createRadialGradient(ball.x - 2, ball.y - 2, 1, ball.x, ball.y, BALL_SIZE);
    grad.addColorStop(0, '#ffffff');
    grad.addColorStop(0.5, '#00e5ff');
    grad.addColorStop(1, '#0077ff');
    
    ctx.fillStyle = grad;
    ctx.shadowBlur = 10;
    ctx.shadowColor = 'rgba(0,229,255,0.8)';
    ctx.arc(ball.x, ball.y, BALL_SIZE, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
  });
}

let balls = [];

function animate() {
  drawBoard();
  
  for (let i = balls.length - 1; i >= 0; i--) {
    const b = balls[i];
    
    if (b.state === 'falling') {
      b.y += b.speedY;
      b.x += (b.targetX - b.x) * 0.15;
      
      if (b.y >= b.nextPegY) {
        b.y = b.nextPegY;
        b.step++;
        
        if (b.step < b.path.length) {
          const nextPeg = getNextPegCoord(b.path, b.step);
          b.targetX = nextPeg.x;
          b.nextPegY = nextPeg.y;
        } else {
          const slotX = slots[b.finalSlot].x; // Точка сбора
          b.targetX = slotX;
          b.state = 'landing';
          b.landY = slots[b.finalSlot].y + slots[b.finalSlot].h / 2;
        }
      }
    } else if (b.state === 'landing') {
      b.y += b.speedY * 1.5;
      b.x += (b.targetX - b.x) * 0.2;
      
      if (b.y >= b.landY) {
        b.state = 'done';
        const win = currentBet * RISK_CONFIG[currentRisk].multipliers[b.finalSlot];
        showToast(`Множитель: x${RISK_CONFIG[currentRisk].multipliers[b.finalSlot]} (${win.toFixed(2)} ₽)`, win >= currentBet ? 'success' : 'error');
        
        setTimeout(() => { 
          balls = balls.filter(x => x.id !== b.id); 
          busy = false; 
          $('btnPlay').disabled = false;
        }, 800);
      }
    }
  }
  
  requestAnimationFrame(animate);
}

function getNextPegCoord(path, step) {
  const count = step + 2;
  const rowWidth = (count - 1) * pegGap;
  const rowStartX = W/2 - rowWidth / 2;
  
  let offset = 0;
  for (let i = 0; i < step; i++) {
    offset += (path[i] === 1 ? 1 : -1);
  }
  
  const targetCol = offset + Math.floor(count/2);
  const clampedCol = Math.max(0, Math.min(count-1, targetCol));
  
  return {
    x: rowStartX + clampedCol * pegGap,
    y: startY + (step) * rowGap // Строго по рядам
  };
}

function showToast(text, type='success') {
  const container = $('toastContainer');
  const toast = document.createElement('div');
  toast.className = `toast ${type}`;
  toast.textContent = text;
  container.appendChild(toast);
  setTimeout(() => toast.classList.add('show'), 10);
  setTimeout(() => { toast.classList.remove('show'); setTimeout(() => toast.remove(), 300); }, 3000);
}

function loadMe() {
  try {
    const urlParams = new URLSearchParams(window.location.search);
    const urlId = urlParams.get('id');
    if (urlId) { localStorage.setItem('kingwin_guest_id', urlId); return { guestId: String(urlId) }; }
    const savedId = localStorage.getItem('kingwin_guest_id');
    if (savedId) return { guestId: String(savedId) };
  } catch(e) {}
  return null;
}

async function refreshBalance() {
  if (!currentPlayer) return;
  try {
    const r = await fetch('/api/guest/me?id=' + encodeURIComponent(currentPlayer.guestId));
    if (!r.ok) return;
    const data = await r.json();
    if (data.balance && typeof data.balance.total === 'number') balance = data.balance.total;
    else if (data.guest) balance = (parseFloat(data.guest.deposit_balance) || 0) + (parseFloat(data.guest.bonus_balance) || 0);
    $('balanceVal').textContent = balance.toFixed(2);
  } catch(e) {}
}

function setBet(v) {
  if (busy) return;
  currentBet = v;
  $('betAmount').value = v.toFixed(2);
  document.querySelectorAll('#quickBets button').forEach(b => b.classList.remove('active'));
  if (event && event.target) event.target.classList.add('active');
}

function setRisk(r) {
  if (busy) return;
  currentRisk = r;
  document.querySelectorAll('#riskGrid button').forEach(b => b.classList.remove('active'));
  if (event && event.target) event.target.classList.add('active');
  buildBoard();
  drawBoard();
}

async function dropBall() {
  if (busy) return;
  if (!currentPlayer) { showToast('Войдите в аккаунт', 'error'); return; }
  currentBet = parseFloat($('betAmount').value) || 0;
  if (currentBet < 1) { showToast('Мин. ставка 1 ₽', 'error'); return; }
  
  await refreshBalance();
  if (balance < currentBet) { showToast(`Недостаточно средств. Баланс: ${balance.toFixed(2)} ₽`, 'error'); return; }

  busy = true;
  $('btnPlay').disabled = true;

  try {
    const r = await fetch('/api/plinko/drop', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ guest_id: currentPlayer.guestId, bet: currentBet, risk: currentRisk })
    });
    const d = await r.json();
    
    if (!r.ok) {
      showToast(d.error || 'Ошибка', 'error');
      busy = false;
      $('btnPlay').disabled = false;
      return;
    }
    
    // Спавним шарик ровно по центру верхнего колышка
    const countTop = 3;
    const rowWidthTop = (countTop - 1) * pegGap;
    const topPegX = W/2 - rowWidthTop / 2 + pegGap; // Центральный колышек верхнего ряда
    
    const ball = {
      id: Date.now(),
      x: topPegX, 
      y: startY - 20,
      targetX: topPegX,
      nextPegY: startY,
      speedY: 7,
      path: d.path,
      step: 0,
      state: 'falling',
      finalSlot: d.slot
    };
    
    balls.push(ball);
    refreshBalance();
  } catch(e) {
    showToast('Ошибка соединения', 'error');
    busy = false;
    $('btnPlay').disabled = false;
  }
}

window.onload = () => {
  currentPlayer = loadMe();
  if (currentPlayer) {
    refreshBalance();
    setInterval(refreshBalance, 3000);
  } else {
    showToast('Войдите в аккаунт на главной странице', 'error');
    setTimeout(() => { window.location.href = '/'; }, 1500);
  }
  
  resizeCanvas();
  animate();
};
</script>
</body>
</html>
