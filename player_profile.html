<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KINGWIN — Профиль</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Montserrat', sans-serif; background: #0a0d14; color: #fff; padding-bottom: 40px; }
  .topbar { display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; background: #111625; border-bottom: 1px solid rgba(255,255,255,0.05); }
  .logo { font-size: 20px; font-weight: 900; background: linear-gradient(135deg, #00e5ff, #0077ff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; cursor: pointer; }
  .back-btn { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: #fff; padding: 8px 15px; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 600; }
  
  .container { max-width: 1200px; margin: 20px auto; padding: 0 20px; display: flex; gap: 20px; align-items: flex-start; flex-wrap: wrap; }
  .sidebar { width: 300px; flex-shrink: 0; display: flex; flex-direction: column; gap: 15px; }
  .profile-card { background: #111625; border-radius: 16px; padding: 20px; border: 1px solid rgba(255,255,255,0.05); }
  .avatar-row { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
  .avatar { width: 50px; height: 50px; border-radius: 50%; background: #1c2b45; display: flex; justify-content: center; align-items: center; font-size: 24px; }
  .player-name { font-size: 16px; font-weight: 800; text-transform: uppercase; }
  .balances { display: flex; flex-direction: column; gap: 10px; margin-bottom: 15px; }
  .bal-box { background: rgba(0,0,0,0.3); padding: 10px; border-radius: 10px; display: flex; justify-content: space-between; align-items: center; }
  .bal-label { font-size: 12px; color: #8fa2b8; text-transform: uppercase; }
  .bal-val { font-size: 16px; font-weight: 800; color: #3fbf7f; }
  
  .action-btns { display: flex; flex-direction: column; gap: 10px; }
  .action-btns button { width: 100%; padding: 12px; border-radius: 8px; border: none; font-weight: 700; font-size: 14px; cursor: pointer; }
  .btn-dep { background: #00e5ff; color: #000; }
  .btn-wd { background: rgba(255,255,255,0.1); color: #fff; }
  .btn-logout { background: transparent; color: #ff4d4d; border: 1px solid rgba(255,77,77,0.3); margin-top: 10px; }
  
  .main-content { flex: 1; background: #111625; border-radius: 16px; border: 1px solid rgba(255,255,255,0.05); min-width: 300px; }
  .tabs-header { display: flex; border-bottom: 1px solid rgba(255,255,255,0.05); padding: 0 20px; overflow-x: auto; }
  .tab-btn { padding: 15px 20px; background: transparent; border: none; color: #8fa2b8; font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap; }
  .tab-btn.active { color: #fff; border-bottom: 2px solid #00e5ff; }
  .tab-content { padding: 20px; display: none; }
  .tab-content.active { display: block; }
  
  .history-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .history-table th { text-align: left; padding: 10px; color: #8fa2b8; border-bottom: 1px solid rgba(255,255,255,0.05); }
  .history-table td { padding: 15px 10px; border-bottom: 1px solid rgba(255,255,255,0.02); }

  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(5px); display: none; justify-content: center; align-items: center; z-index: 1000; padding: 20px; }
  .modal-overlay.show { display: flex; }
  .modal-box { background: #111625; border: 1px solid #2a2d3e; border-radius: 16px; padding: 30px; width: 100%; max-width: 400px; text-align: center; }
  .modal-box h2 { font-size: 20px; margin-bottom: 15px; }
  .modal-box p { color: #8fa2b8; font-size: 14px; margin-bottom: 20px; }
  .modal-box input { width: 100%; background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; padding: 14px; color: #fff; font-size: 20px; text-align: center; margin-bottom: 15px; }
  .modal-box button { width: 100%; background: #00e5ff; color: #000; border: none; border-radius: 8px; padding: 14px; font-size: 16px; font-weight: 800; cursor: pointer; }
  
  .toast-container { position: fixed; top: 20px; right: 20px; z-index: 9999; }
  .toast { background: rgba(24,26,36,0.95); border-left: 4px solid #00e5ff; padding: 16px 20px; border-radius: 8px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); transform: translateX(120%); transition: 0.3s; margin-bottom: 10px; font-size: 14px; font-weight: 600; }
  .toast.show { transform: translateX(0); }

  @media (max-width: 768px) {
    .sidebar { width: 100%; }
    .history-table th, .history-table td { padding: 10px 5px; font-size: 12px; }
  }
</style>
</head>
<body>
<div class="toast-container" id="toastContainer"></div>

<div class="topbar">
  <div class="logo" onclick="window.location.href='/'">KINGWIN</div>
  <button class="back-btn" onclick="window.location.href='/'">← На главную</button>
</div>

<div class="container">
  <div class="sidebar">
    <div class="profile-card">
      <div class="avatar-row">
        <div class="avatar">👤</div>
        <div>
          <div class="player-name" id="uiName">Игрок</div>
          <div style="font-size: 11px; color: #8fa2b8;">ID: <span id="uiId">—</span></div>
        </div>
      </div>
      
      <div class="balances">
        <div class="bal-box">
          <div class="bal-label">Общий баланс</div>
          <div class="bal-val"><span id="uiTotalBalance">0.00</span> ₽</div>
        </div>
        <div class="bal-box">
          <div class="bal-label">Бонусный баланс</div>
          <div class="bal-val" style="color: #00e5ff;"><span id="uiBonusBalance">0.00</span> ₽</div>
        </div>
      </div>
      
      <div class="action-btns">
        <button class="btn-dep" onclick="window.location.href='/'">Пополнить</button>
        <button class="btn-wd" onclick="openModal('withdrawModal')">Вывести</button>
        <button class="btn-logout" onclick="openModal('logoutModal')">Выйти</button>
      </div>
    </div>
  </div>

  <div class="main-content">
    <div class="tabs-header">
      <button class="tab-btn active" onclick="switchTab('history')">Операции</button>
    </div>
    
    <div class="tab-content active" id="tab-history">
      <table class="history-table">
        <thead><tr><th>Тип</th><th>Сумма</th><th>Дата</th></tr></thead>
        <tbody id="uiHistoryTable">
          <tr><td colspan="3" style="text-align:center; color:#8fa2b8; padding:30px;">Загрузка...</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<div class="modal-overlay" id="withdrawModal">
  <div class="modal-box">
    <h2>Вывод средств</h2>
    <input type="number" id="withdrawAmount" placeholder="0">
    <div style="font-size:12px; color:#8fa2b8; margin-bottom:20px;">Доступно: <span id="uiMaxWithdraw">0.00</span> ₽</div>
    <button onclick="doWithdraw()">Вывести</button>
  </div>
</div>

<div class="modal-overlay" id="logoutModal">
  <div class="modal-box">
    <h2>Выход из аккаунта</h2>
    <p>Вы уверены, что хотите выйти?</p>
    <button style="background: #ff4d4d; color: #fff; margin-bottom: 10px;" onclick="confirmLogout()">Выйти</button>
    <button style="background: transparent; border: 1px solid #2a2d3e; color: #fff;" onclick="closeModal('logoutModal')">Отмена</button>
  </div>
</div>

<script>
let currentPlayer = null;

function showToast(text, type='success') {
  const container = document.getElementById('toastContainer');
  const toast = document.createElement('div');
  toast.className = `toast ${type}`;
  toast.textContent = text;
  container.appendChild(toast);
  setTimeout(() => toast.classList.add('show'), 10);
  setTimeout(() => { toast.classList.remove('show'); setTimeout(() => toast.remove(), 300); }, 3000); 
}

function openModal(id) { document.getElementById(id).classList.add('show'); }
function closeModal(id) { document.getElementById(id).classList.remove('show'); }

function confirmLogout() {
  localStorage.removeItem('kingwin_player_id');
  window.location.href = '/';
}

async function loadProfile() {
  const urlParams = new URLSearchParams(window.location.search);
  const id = urlParams.get('id') || localStorage.getItem('kingwin_player_id');
  
  if(!id) { window.location.href = '/'; return; }

  try {
    const res = await fetch(`/api/guest/me?id=${id}`);
    const data = await res.json();
    if(data.guest) {
      currentPlayer = data.guest;
      document.getElementById('uiName').textContent = currentPlayer.name;
      document.getElementById('uiId').textContent = currentPlayer.id;
      
      const bonus = parseFloat(currentPlayer.bonus_balance || 0);
      const dep = parseFloat(currentPlayer.deposit_balance || 0);
      const total = bonus + dep;
      
      document.getElementById('uiTotalBalance').textContent = total.toFixed(2);
      document.getElementById('uiBonusBalance').textContent = bonus.toFixed(2);
      document.getElementById('uiMaxWithdraw').textContent = total.toFixed(2);
      
      loadHistory(id);
    }
  } catch(e) { console.error(e); }
}

async function loadHistory(id) {
  try {
    const [wRes, dRes] = await Promise.all([ fetch('/api/withdrawals'), fetch('/api/deposits') ]);
    const withdrawals = await wRes.json();
    const deposits = await dRes.json();
    
    const myW = withdrawals.filter(w => w.nick.toLowerCase() === currentPlayer.name.toLowerCase());
    const myD = deposits.filter(d => d.nick.toLowerCase() === currentPlayer.name.toLowerCase());
    
    const all = [
      ...myW.map(w => ({ type: 'Вывод', sum: w.sum, date: w.date, status: w.status })),
      ...myD.map(d => ({ type: 'Депозит', sum: d.sum, date: d.date, status: d.status }))
    ].sort((a,b) => new Date(b.date) - new Date(a.date));
    
    const tbody = document.getElementById('uiHistoryTable');
    if(all.length === 0) {
      tbody.innerHTML = `<tr><td colspan="3" style="text-align:center; color:#8fa2b8; padding:30px;">История пуста</td></tr>`;
      return;
    }
    
    tbody.innerHTML = all.map(item => {
      let badgeClass = 'pending', statusText = 'В обработке';
      if(item.status === 'approved') { badgeClass = 'approved'; statusText = 'Одобрено'; }
      if(item.status === 'rejected') { badgeClass = 'rejected'; statusText = 'Отклонено'; }
      
      return `
        <tr>
          <td><b>${item.type}</b></td>
          <td style="color:${item.type === 'Вывод' ? '#ff4d4d' : '#3fbf7f'}">${item.type === 'Вывод' ? '-' : '+'}${item.sum} ₽</td>
          <td>${item.date} <br><span style="font-size:10px; padding:2px 5px; border-radius:4px; background:rgba(255,255,255,0.05)">${statusText}</span></td>
        </tr>
      `;
    }).join('');
  } catch(e) { console.error(e); }
}

async function doWithdraw() {
  if(!currentPlayer) return;
  const amount = parseFloat(document.getElementById('withdrawAmount').value);
  const totalBal = (parseFloat(currentPlayer.bonus_balance) || 0) + (parseFloat(currentPlayer.deposit_balance) || 0);
  
  if(!amount || amount <= 0) { showToast('Введите сумму больше 0', 'error'); return; }
  if(amount > totalBal) { showToast(`Недостаточно средств. Доступно: ${totalBal.toFixed(2)} ₽`, 'error'); return; }

  closeModal('withdrawModal');

  try {
    const res = await fetch('/api/guest/withdraw', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ id: currentPlayer.id, sum: amount })
    });
    const data = await res.json();
    
    if(res.ok) {
      showToast('Успешный вывод! Ожидайте зачисления.', 'success');
      loadProfile(); // перезагружаем баланс и историю
    } else {
      showToast(data.error || 'Ошибка вывода', 'error');
    }
  } catch(e) { showToast('Ошибка соединения', 'error'); }
}

window.onload = loadProfile;
</script>
</body>
</html>
