<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KINGWIN — Джекпот</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Montserrat', sans-serif; }
  body { 
    background: radial-gradient(circle at center, #1a2332 0%, #0a0d14 100%); 
    color: #fff; 
    height: 100vh; 
    display: flex; 
    flex-direction: column; 
    justify-content: space-between; 
    overflow: hidden;
  }

  .header { 
    display: flex; 
    justify-content: space-between; 
    align-items: center; 
    padding: 30px 50px; 
  }
  .logo { 
    font-size: 36px; 
    font-weight: 900; 
    letter-spacing: 4px; 
    background: linear-gradient(135deg, #00e5ff, #0077ff); 
    -webkit-background-clip: text; 
    -webkit-text-fill-color: transparent; 
  }
  .logo-sub { 
    font-size: 12px; 
    letter-spacing: 8px; 
    color: #a0aec0; 
    text-transform: uppercase; 
  }
  
  .jackpot-container { 
    flex: 1; 
    display: flex; 
    flex-direction: column; 
    justify-content: center; 
    align-items: center; 
    position: relative; 
  }
  .jackpot-title { 
    font-size: 24px; 
    color: #f1c40f; 
    letter-spacing: 10px; 
    text-transform: uppercase; 
    margin-bottom: 20px; 
    text-shadow: 0 0 10px rgba(241,196,15,.5); 
  }
  
  .jackpot-screen { 
    background: rgba(0,0,0,.6); 
    border: 4px solid #f1c40f; 
    border-radius: 20px; 
    padding: 40px 60px; 
    box-shadow: 0 0 50px rgba(241,196,15,.3), inset 0 0 30px rgba(241,196,15,.1);
    position: relative; 
    overflow: hidden;
  }
  
  .digits { 
    display: flex; 
    align-items: center;
    font-family: 'Courier New', monospace; 
    font-size: 120px; 
    font-weight: 900; 
    line-height: 1; 
    color: #fff; 
    text-shadow: 0 0 20px rgba(255,255,255,.4); 
  }
  .digit-box { 
    width: 80px; 
    height: 120px; 
    position: relative; 
    overflow: hidden; 
    text-align: center; 
    display: inline-block;
  }
  .digit { 
    position: absolute; 
    top: 0; 
    left: 0; 
    width: 100%; 
    height: 100%; 
    display: flex; 
    justify-content: center; 
    align-items: center; 
  }
  .comma { font-size: 100px; margin: 0 5px; color: #f1c40f; }
  .currency { font-size: 70px; margin-left: 15px; color: #f1c40f; }

  .winners-bar { 
    background: rgba(241,196,15,.1); 
    border-top: 1px solid rgba(241,196,15,.3); 
    border-bottom: 1px solid rgba(241,196,15,.3); 
    padding: 15px 0; 
    overflow: hidden; 
    white-space: nowrap; 
  }
  .winners-track { 
    display: inline-block; 
    animation: scroll 20s linear infinite; 
  }
  .winners-track span { 
    font-size: 18px; 
    font-weight: 700; 
    color: #fff; 
    margin: 0 40px; 
  }
  .winners-track b { color: #f1c40f; }
  @keyframes scroll { 
    0% { transform: translateX(100%); } 
    100% { transform: translateX(-100%); } 
  }

  .footer { 
    text-align: center; 
    padding: 20px; 
    color: #a0aec0; 
    font-size: 14px; 
    letter-spacing: 2px; 
  }
</style>
</head>
<body>

<div class="header">
  <div>
    <div class="logo">KINGWIN</div>
    <div class="logo-sub">Progressive Jackpot</div>
  </div>
</div>

<div class="jackpot-container">
  <div class="jackpot-title">Текущий банк</div>
  <div class="jackpot-screen">
    <div class="digits" id="jackpotDigits"></div>
  </div>
</div>

<div class="winners-bar">
  <div class="winners-track" id="winnersTrack">
    <span>Пока нет победителей</span>
  </div>
</div>

<div class="footer">Сыграй в блэкджек и выиграй три семёрки бубён!</div>

<script>
let currentJackpot = 0;
let targetJackpot = 0;

// Инициализация 6 ячеек (4 до запятой + 2 после)
const wrap = document.getElementById('jackpotDigits');
const digitElements = [];

function initDisplay() {
  wrap.innerHTML = '';
  digitElements.length = 0;
  
  // 4 знака до запятой
  for(let i = 0; i < 4; i++) {
    const box = document.createElement('div');
    box.className = 'digit-box';
    const d = document.createElement('div');
    d.className = 'digit';
    d.textContent = '0';
    box.appendChild(d);
    wrap.appendChild(box);
    digitElements.push(d);
  }
  
  const comma = document.createElement('span');
  comma.className = 'comma';
  comma.textContent = '.';
  wrap.appendChild(comma);
  
  // 2 знака после запятой
  for(let i = 0; i < 2; i++) {
    const box = document.createElement('div');
    box.className = 'digit-box';
    const d = document.createElement('div');
    d.className = 'digit';
    d.textContent = '0';
    box.appendChild(d);
    wrap.appendChild(box);
    digitElements.push(d);
  }
}

function renderJackpot(val) {
  const str = val.toFixed(2);
  const parts = str.split('.');
  const intPart = parts[0].padStart(4, '0');
  const floatPart = parts[1];
  const fullStr = intPart + floatPart;
  
  for(let i = 0; i < 6; i++) {
    if (digitElements[i].textContent !== fullStr[i]) {
      digitElements[i].textContent = fullStr[i];
    }
  }
}

async function fetchJackpot() {
  try {
    const res = await fetch('/api/jackpot');
    const data = await res.json();
    targetJackpot = data.jackpot || 0;
  } catch (e) { console.error(e); }
}

async function fetchWinners() {
  try {
    const res = await fetch('/api/jackpot/winners');
    const winners = await res.json();
    const track = document.getElementById('winnersTrack');
    if (winners.length > 0) {
      track.innerHTML = winners.map(w => `<span>🏆 <b>${w.nick}</b> выиграл ${parseFloat(w.amount).toFixed(2)} ₽</span>`).join('');
    } else {
      track.innerHTML = '<span>Пока нет победителей</span>';
    }
  } catch (e) { console.error(e); }
}

function animate() {
  if (Math.abs(currentJackpot - targetJackpot) > 0.01) {
    const diff = targetJackpot - currentJackpot;
    currentJackpot += diff * 0.05;
    renderJackpot(currentJackpot);
  } else if (currentJackpot !== targetJackpot) {
    currentJackpot = targetJackpot;
    renderJackpot(currentJackpot);
  }
  requestAnimationFrame(animate);
}

initDisplay();
fetchJackpot();
fetchWinners();
setInterval(fetchJackpot, 2000);
setInterval(fetchWinners, 10000);
animate();
</script>
</body>
</html>
