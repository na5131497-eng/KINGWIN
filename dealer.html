<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>KINGWIN — Дилерская панель</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-main: #0b0e14; --bg-panel: #151922; --bg-card: #1a1f2b;
    --accent: #00e5ff; --accent-green: #00e676;
    --text-main: #fff; --text-muted: #8b92a5;
    --border: rgba(255,255,255,0.05); --red: #ff4d4d; --gold: #f1c40f;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Montserrat', sans-serif; }
  body { background: var(--bg-main); color: var(--text-main); display: flex; flex-direction: column; min-height: 100vh; padding: 20px; }

  /* Логин */
  .login-screen { position: fixed; inset: 0; background: var(--bg-main); display: flex; align-items: center; justify-content: center; z-index: 2000; }
  .login-box { background: var(--bg-panel); border: 1px solid var(--border); border-radius: 20px; padding: 40px; width: 100%; max-width: 380px; text-align: center; }
  .login-box .name { font-size: 28px; font-weight: 900; color: var(--accent); margin-bottom: 5px; }
  .login-box input { width: 100%; background: rgba(0,0,0,0.3); border: 1px solid var(--border); border-radius: 8px; padding: 12px; color: #fff; margin-bottom: 15px; outline: none; font-size: 14px; text-align: center; font-family: inherit;}
  .login-box input:focus { border-color: var(--accent); }
  .login-box button { width: 100%; padding: 14px; font-size: 14px; margin-top: 10px; background: var(--accent-green); color: #000; border: none; border-radius: 8px; font-weight: 800; cursor: pointer; font-family: inherit;}

  /* Рабочий интерфейс */
  .dealer-panel { display: none; flex-direction: column; max-width: 600px; width: 100%; margin: 0 auto; }
  .dealer-panel.active { display: flex; }
  
  .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
  .header h1 { font-size: 22px; }
  .logout-btn { background: transparent; border: 1px solid var(--border); color: var(--text-muted); padding: 8px 15px; border-radius: 8px; cursor: pointer; font-family: inherit;}

  .panel { background: var(--bg-panel); border-radius: 15px; padding: 25px; border: 1px solid var(--border); margin-bottom: 20px; }
  .form-group { margin-bottom: 15px; }
  .form-group label { display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 5px; text-transform: uppercase; font-weight: 700; }
  .form-control { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid var(--border); background: rgba(0,0,0,0.3); color: #fff; outline: none; font-size: 14px; font-family: inherit;}
  .form-control:focus { border-color: var(--accent); }
  
  .btn-submit { width: 100%; padding: 15px; border-radius: 10px; background: var(--accent-green); color: #000; font-weight: 900; font-size: 16px; border: none; cursor: pointer; margin-top: 10px; font-family: inherit;}
  .btn-submit:hover { filter: brightness(1.1); }

  .toast { position: fixed; top: 20px; right: 20px; background: var(--bg-panel); border-left: 4px solid var(--accent); padding: 15px 25px; border-radius: 8px; font-weight: 600; box-shadow: 0 5px 15px rgba(0,0,0,0.3); transform: translateX(150%); transition: 0.3s; z-index: 9999; }
  .toast.show { transform: translateX(0); }
  .toast.error { border-left-color: var(--red); }
</style>
</head>
<body>

<!-- ЭКРАН ЛОГИНА -->
<div class="login-screen" id="loginScreen">
  <div class="login-box">
    <div class="name">KINGWIN DEALER</div>
    <p style="color:var(--text-muted); font-size:13px; margin-bottom:25px;">Введите логин и пароль дилера</p>
    <input type="text" id="loginInput" placeholder="Логин (dealer)" value="dealer">
    <input type="password" id="passInput" placeholder="Пароль" value="56UpahoS">
    <button onclick="doLogin()">Войти</button>
    <div id="loginErr" style="color:var(--red); font-size:12px; margin-top:15px; height:15px;"></div>
  </div>
</div>

<!-- РАБОЧАЯ ПАНЕЛЬ -->
<div class="dealer-panel" id="dealerPanel">
  <div class="header">
    <h1>Панель дилера</h1>
    <button class="logout-btn" onclick="logout()">Выйти</button>
  </div>

  <div class="panel">
    <h3 style="margin-bottom: 20px;">Ввод результата игры</h3>
    
    <div class="form-group">
      <label>Тип игры</label>
      <select id="gameType" class="form-control">
        <option value="bj">Блэкджек</option>
        <option value="bac">Баккара</option>
        <option value="roulette">Рулетка (выпадение числа)</option>
      </select>
    </div>

    <div class="form-group" id="numberGroup" style="display:none;">
      <label>Выпавшее число (0-36)</label>
      <input type="number" id="rouletteNumber" class="form-control" placeholder="Например: 17" min="0" max="36">
    </div>

    <div class="form-group" id="playerGroup">
      <label>Ник игрока (или ID карты)</label>
      <input type="text" id="playerNick" class="form-control" placeholder="Например: 12345678">
    </div>

    <div class="form-group" id="betGroup">
      <label>Ставка (₽)</label>
      <input type="number" id="betAmount" class="form-control" placeholder="100" min="1">
    </div>

    <div class="form-group" id="winGroup">
      <label>Выигрыш игрока (₽)</label>
      <input type="number" id="winAmount" class="form-control" placeholder="200" min="0">
    </div>

    <button class="btn-submit" onclick="submitRound()">Отправить результат</button>
  </div>
</div>

<div class="toast" id="toast">Успешно!</div>

<script>
let currentDealer = null;

// Переключение полей в зависимости от игры
document.getElementById('gameType').addEventListener('change', function() {
  const type = this.value;
  const numGroup = document.getElementById('numberGroup');
  const playerGroup = document.getElementById('playerGroup');
  const betGroup = document.getElementById('betGroup');
  const winGroup = document.getElementById('winGroup');

  if (type === 'roulette') {
    numGroup.style.display = 'block';
    playerGroup.style.display = 'none';
    betGroup.style.display = 'none';
    winGroup.style.display = 'none';
  } else {
    numGroup.style.display = 'none';
    playerGroup.style.display = 'block';
    betGroup.style.display = 'block';
    winGroup.style.display = 'block';
  }
});

function showToast(msg, isError = false) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.borderColor = isError ? 'var(--red)' : 'var(--accent-green)';
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3000);
}

async function doLogin() {
  const login = document.getElementById('loginInput').value.trim();
  const pass = document.getElementById('passInput').value;
  const err = document.getElementById('loginErr');
  err.textContent = '';

  if (!login || !pass) { err.textContent = 'Заполните поля'; return; }

  try {
    const res = await fetch('/api/dealer/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ login, pass })
    });
    const data = await res.json();
    
    if (data.ok) {
      currentDealer = data.dealer;
      document.getElementById('loginScreen').style.display = 'none';
      document.getElementById('dealerPanel').classList.add('active');
      showToast('Добро пожаловать, ' + data.dealer.name);
    } else {
      err.textContent = data.error || 'Ошибка';
    }
  } catch (e) {
    err.textContent = 'Ошибка соединения с сервером';
  }
}

function logout() {
  currentDealer = null;
  location.reload();
}

async function submitRound() {
  if (!currentDealer) return;

  const gameType = document.getElementById('gameType').value;

  // Если это Рулетка (ввод числа)
  if (gameType === 'roulette') {
    const num = parseInt(document.getElementById('rouletteNumber').value, 10);
    if (isNaN(num) || num < 0 || num > 36) return showToast('Введите число от 0 до 36', true);

    // Определяем цвет
    const redNumbers = [1,3,5,7,9,12,14,16,18,19,21,23,25,27,30,32,34,36];
    let color = 'black';
    if (num === 0) color = 'green';
    else if (redNumbers.includes(num)) color = 'red';

    try {
      const res = await fetch('/api/dealer/result', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ number: num, color: color })
      });
      const data = await res.json();
      if (data.ok) {
        showToast('Число ' + num + ' записано в историю!');
        document.getElementById('rouletteNumber').value = '';
      } else {
        showToast(data.error || 'Ошибка', true);
      }
    } catch(e) { showToast('Ошибка соединения', true); }
    return;
  }

  // Для Блэкджека и Баккары
  const nick = document.getElementById('playerNick').value.trim();
  const bet = parseFloat(document.getElementById('betAmount').value) || 0;
  const win = parseFloat(document.getElementById('winAmount').value) || 0;

  if (!nick) return showToast('Введите ник игрока', true);
  if (bet <= 0) return showToast('Ставка должна быть больше 0', true);

  try {
    const res = await fetch('/api/dealer/round', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        dealer_id: currentDealer.id,
        game_type: gameType,
        nick: nick,
        bet: bet,
        win: win
      })
    });
    const data = await res.json();
    
    if (data.ok) {
      showToast('Раунд записан! Новый баланс: ' + data.balance + ' ₽');
      document.getElementById('winAmount').value = '';
    } else {
      showToast(data.error || 'Ошибка', true);
    }
  } catch (e) {
    showToast('Ошибка соединения', true);
  }
}
</script>
</body>
</html>
