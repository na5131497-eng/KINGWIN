<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KINGWIN — Вход дилерам</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Montserrat', sans-serif; background: radial-gradient(circle at top left, #1a2332, #0a0d14); color: #fff; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
  .login-container { background: rgba(18, 24, 38, 0.85); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.05); border-radius: 20px; padding: 40px; width: 100%; max-width: 400px; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); text-align: center; animation: fadeIn 0.5s ease-out; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
  .logo-text { font-size: 32px; font-weight: 800; letter-spacing: 3px; text-transform: uppercase; background: linear-gradient(135deg, #00e5ff, #0077ff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 5px; filter: drop-shadow(0 0 10px rgba(0, 229, 255, 0.3)); }
  .login-subtitle { font-size: 14px; color: #a0aec0; font-weight: 600; margin-bottom: 35px; text-transform: uppercase; letter-spacing: 1px; }
  .input-group { position: relative; margin-bottom: 25px; text-align: left; }
  .input-group label { display: block; font-size: 14px; color: #a0aec0; margin-bottom: 8px; font-weight: 600; }
  .input-group input { width: 100%; background: transparent; border: none; border-bottom: 2px solid rgba(255, 255, 255, 0.2); color: #fff; font-size: 16px; padding: 10px 0; font-family: inherit; transition: border-color 0.3s; }
  .input-group input:focus { outline: none; border-bottom-color: #00e5ff; }
  .btn-glow { width: 100%; background: #00e5ff; color: #000; border: none; border-radius: 10px; padding: 15px; font-size: 16px; font-weight: 700; text-transform: uppercase; letter-spacing: 2px; cursor: pointer; margin-top: 10px; transition: all 0.3s ease; box-shadow: 0 0 15px rgba(0, 229, 255, 0.4), 0 0 30px rgba(0, 229, 255, 0.2); font-family: inherit; }
  .btn-glow:hover { background: #33ebff; box-shadow: 0 0 20px rgba(0, 229, 255, 0.6), 0 0 40px rgba(0, 229, 255, 0.4); transform: translateY(-2px); }
  .login-err { color: #ff4d4d; font-size: 13px; margin-top: 15px; height: 18px; font-weight: 600; }
  
  .main-container { background: rgba(18, 24, 38, 0.85); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.05); border-radius: 20px; padding: 30px; width: 100%; max-width: 500px; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); }
  .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; padding-bottom: 15px; border-bottom: 1px solid rgba(255, 255, 255, 0.1); }
  .topbar .name { font-size: 14px; color: #a0aec0; }
  .topbar .name b { color: #00e5ff; }
  .logout { background: transparent; border: 1px solid rgba(255, 255, 255, 0.2); color: #a0aec0; padding: 6px 12px; border-radius: 6px; font-size: 12px; cursor: pointer; text-transform: uppercase; font-family: inherit; transition: 0.3s; }
  .logout:hover { border-color: #ff4d4d; color: #ff4d4d; }
  h1 { font-size: 22px; margin-bottom: 5px; }
  .sub { color: #a0aec0; font-size: 13px; margin-bottom: 20px; }
  .tabs { display: flex; gap: 10px; margin-bottom: 25px; }
  .tabs button { flex: 1; background: rgba(255, 255, 255, 0.05); border: 1px solid transparent; color: #a0aec0; padding: 12px; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; transition: 0.3s; font-family: inherit; }
  .tabs button.active { background: rgba(0, 229, 255, 0.1); border-color: #00e5ff; color: #00e5ff; }
  .tab { display: none; } .tab.active { display: block; animation: fadeIn 0.3s; }
  .form-group { margin-bottom: 15px; }
  .form-group label { display: block; font-size: 12px; color: #a0aec0; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
  .form-group input, .form-group select { width: 100%; background: rgba(0, 0, 0, 0.3); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 8px; padding: 12px; font-size: 15px; color: #fff; font-family: inherit; transition: 0.3s; }
  .form-group input:focus, .form-group select:focus { outline: none; border-color: #00e5ff; box-shadow: 0 0 10px rgba(0, 229, 255, 0.2); }
  .row { display: flex; gap: 15px; } .row .form-group { flex: 1; }
  .choice-group { display: grid; grid-template-columns: repeat(auto-fit, minmax(60px, 1fr)); gap: 8px; margin-top: 5px; }
  .choice-btn { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); color: #a0aec0; padding: 12px 5px; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; transition: 0.3s; text-align: center; font-family: inherit; }
  .choice-btn:hover { background: rgba(255, 255, 255, 0.1); }
  .choice-btn.selected { background: rgba(0, 229, 255, 0.15); border-color: #00e5ff; color: #00e5ff; box-shadow: 0 0 10px rgba(0, 229, 255, 0.2); }
  .btn-submit { width: 100%; background: #00e5ff; color: #000; border: none; border-radius: 8px; padding: 15px; font-size: 16px; font-weight: 700; cursor: pointer; margin-top: 15px; transition: 0.3s; font-family: inherit; }
  .btn-submit:hover:not(:disabled) { background: #33ebff; box-shadow: 0 0 15px rgba(0, 229, 255, 0.4); }
  .btn-submit:disabled { opacity: 0.5; cursor: not-allowed; }
  .msg { margin-top: 15px; padding: 12px; border-radius: 8px; font-size: 14px; display: none; text-align: center; font-weight: 600; }
  .msg.ok { background: rgba(63, 191, 127, 0.15); color: #3fbf7f; border: 1px solid rgba(63, 191, 127, 0.3); display: block; }
  .msg.err { background: rgba(224, 74, 95, 0.15); color: #ff4d4d; border: 1px solid rgba(224, 74, 95, 0.3); display: block; }
  .hidden { display: none !important; }
  
  .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0, 0, 0, 0.7); backdrop-filter: blur(5px); display: none; justify-content: center; align-items: center; z-index: 1000; padding: 20px; }
  .modal-overlay.show { display: flex; animation: fadeIn 0.2s ease-out; }
  .modal-box { background: rgba(18, 24, 38, 0.95); border: 1px solid rgba(0, 229, 255, 0.2); border-radius: 16px; padding: 30px; width: 100%; max-width: 350px; text-align: center; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), 0 0 20px rgba(0, 229, 255, 0.1); transform: translateY(0); animation: slideUp 0.3s ease-out; }
  @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
  .modal-box h3 { font-size: 20px; margin-bottom: 10px; color: #fff; }
  .modal-box p { font-size: 14px; color: #a0aec0; margin-bottom: 25px; }
  .modal-actions { display: flex; gap: 10px; }
  .btn-cancel { flex: 1; background: transparent; border: 1px solid rgba(255, 255, 255, 0.2); color: #fff; padding: 12px; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; transition: 0.3s; font-family: inherit; }
  .btn-cancel:hover { background: rgba(255, 255, 255, 0.05); }
  .btn-confirm { flex: 1; background: #ff4d4d; border: none; color: #fff; padding: 12px; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; transition: 0.3s; font-family: inherit; }
  .btn-confirm:hover { background: #ff3333; box-shadow: 0 0 15px rgba(255, 77, 77, 0.4); }

  @media (max-width: 500px) {
    .login-container, .main-container { padding: 20px; border-radius: 15px; }
    .row { flex-direction: column; gap: 0; }
    .tabs { flex-direction: column; }
    .choice-group { grid-template-columns: repeat(2, 1fr); }
  }
</style>
</head>
<body>

<div id="loginScreen" class="login-container">
  <div class="logo-text">KINGWIN</div>
  <div class="login-subtitle">Вход дилерам</div>
  <div class="input-group"><label>Username</label><input type="text" id="loginUser" placeholder="dealer" autocomplete="username"></div>
  <div class="input-group"><label>Password</label><input type="password" id="loginPass" placeholder="••••••" autocomplete="current-password"></div>
  <div class="login-err" id="loginErr"></div>
  <button class="btn-glow" onclick="doLogin()">Submit</button>
</div>

<div id="mainScreen" class="main-container hidden">
  <div class="topbar">
    <div class="name">Дилер: <b id="dealerName">—</b></div>
    <button class="logout" onclick="openLogoutModal()">Выйти</button>
  </div>
  <h1>Внести данные</h1>
  <div class="sub">Данные сохранятся с текущей датой</div>

  <div class="tabs">
    <button class="active" data-tab="bj" onclick="switchTab('bj')">Блэкджек</button>
    <button data-tab="bac" onclick="switchTab('bac')">Баккара</button>
  </div>

  <div class="tab active" id="tab-bj">
    <div class="form-group">
      <label>Игрок</label>
      <input type="text" id="nick" placeholder="Ник игрока">
    </div>
    <div class="form-group">
      <label>Количество колод</label>
      <div class="choice-group" id="decks-group">
        <button type="button" class="choice-btn selected" onclick="selectDeck(this, '6')">6 колод</button>
        <button type="button" class="choice-btn" onclick="selectDeck(this, '4')">4 колоды</button>
        <button type="button" class="choice-btn" onclick="selectDeck(this, '2')">2 колоды</button>
        <button type="button" class="choice-btn" onclick="selectDeck(this, '1')">1 колода</button>
      </div>
      <input type="hidden" id="decks" value="6">
    </div>
    <div class="row">
      <div class="form-group"><label>Депозит (₽)</label><input type="number" id="dep" min="10" max="10000" step="1" placeholder="10"></div>
      <div class="form-group"><label>Вывод (₽)</label><input type="number" id="out" min="0" max="10000" step="1" placeholder="0"></div>
    </div>
    <div class="row">
      <div class="form-group"><label>Комиссия (₽)</label><input type="number" id="fee" min="0" step="1" placeholder="0"></div>
    </div>
    
    <div class="form-group" style="margin-top: 10px; text-align: left;">
      <label style="display: flex; align-items: center; gap: 10px; cursor: pointer; text-transform: none;">
        <input type="checkbox" id="winJackpot" style="width: 20px; height: 20px; min-width: 20px; cursor: pointer;">
        <span>Выпал джекпот (Три 7 бубен)</span>
      </label>
    </div>

    <button class="btn-submit" id="btnBJ" onclick="saveBJ()">Внести сессию</button>
    <div class="msg" id="msgBj"></div>
  </div>

  <div class="tab" id="tab-bac">
    <div class="form-group">
      <label>Игрок</label>
      <input type="text" id="bac_player" placeholder="Ник игрока">
    </div>
    <div class="form-group">
      <label>Ставка на</label>
      <div class="choice-group" id="bac-bet-group">
        <button type="button" class="choice-btn" onclick="selectBet(this, 'игрок')">Игрок</button>
        <button type="button" class="choice-btn" onclick="selectBet(this, 'банк')">Банк</button>
        <button type="button" class="choice-btn" onclick="selectBet(this, 'ничья')">Ничья</button>
      </div>
      <input type="hidden" id="bac_bet" value="">
    </div>
    <div class="form-group">
      <label>Сумма ставки (₽)</label>
      <input type="number" id="bac_sum" min="10" max="10000" step="1" placeholder="10">
    </div>
    <div class="form-group">
      <label>Результат раздачи</label>
      <div class="choice-group" id="bac-result-group">
        <button type="button" class="choice-btn" onclick="selectResult(this, 'игрок')">Победил Игрок</button>
        <button type="button" class="choice-btn" onclick="selectResult(this, 'банк')">Победил Банк</button>
        <button type="button" class="choice-btn" onclick="selectResult(this, 'ничья')">Ничья</button>
      </div>
      <input type="hidden" id="bac_result" value="">
    </div>
    <button class="btn-submit" id="btnBac" onclick="saveBac()">Внести раздачу</button>
    <div class="msg" id="msgBac"></div>
  </div>
</div>

<div class="modal-overlay" id="logoutModal">
  <div class="modal-box">
    <h3>Выход из аккаунта</h3>
    <p>Вы уверены, что хотите выйти?</p>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeLogoutModal()">Отмена</button>
      <button class="btn-confirm" onclick="confirmLogout()">Выйти</button>
    </div>
  </div>
</div>

<script>
let currentDealer = null;

function selectDeck(btn, val) {
  document.querySelectorAll('#decks-group .choice-btn').forEach(b => b.classList.remove('selected'));
  btn.classList.add('selected');
  document.getElementById('decks').value = val;
}
function selectBet(btn, val) {
  document.querySelectorAll('#bac-bet-group .choice-btn').forEach(b => b.classList.remove('selected'));
  btn.classList.add('selected');
  document.getElementById('bac_bet').value = val;
}
function selectResult(btn, val) {
  document.querySelectorAll('#bac-result-group .choice-btn').forEach(b => b.classList.remove('selected'));
  btn.classList.add('selected');
  document.getElementById('bac_result').value = val;
}

function switchTab(name){
  document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.querySelector(`.tabs button[data-tab="${name}"]`).classList.add('active');
  document.getElementById('tab-' + name).classList.add('active');
}

function showMsg(id, text, ok){
  const m = document.getElementById(id);
  m.textContent = text;
  m.className = 'msg ' + (ok ? 'ok' : 'err');
}

async function doLogin(){
  const login = document.getElementById('loginUser').value.trim();
  const pass = document.getElementById('loginPass').value;
  const err = document.getElementById('loginErr');
  const btn = document.querySelector('.btn-glow');
  
  btn.textContent = 'Загрузка...';
  btn.disabled = true;

  try {
    const r = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ login, pass, type: 'dealer' })
    });
    const data = await r.json();
    if(!r.ok){ err.textContent = data.error || 'Ошибка'; return; }
    
    currentDealer = data.dealer;
    err.textContent = '';
    document.getElementById('loginScreen').classList.add('hidden');
    document.getElementById('mainScreen').classList.remove('hidden');
    document.getElementById('dealerName').textContent = currentDealer.name;
  } catch(e){ 
    err.textContent = 'Ошибка соединения'; 
  } finally {
    btn.textContent = 'Submit';
    btn.disabled = false;
  }
}

document.getElementById('loginPass').addEventListener('keypress', e=>{ if(e.key==='Enter') doLogin(); });

function openLogoutModal(){ document.getElementById('logoutModal').classList.add('show'); }
function closeLogoutModal(){ document.getElementById('logoutModal').classList.remove('show'); }
function confirmLogout(){
  currentDealer = null;
  document.getElementById('loginScreen').classList.remove('hidden');
  document.getElementById('mainScreen').classList.add('hidden');
  document.getElementById('loginUser').value = '';
  document.getElementById('loginPass').value = '';
  closeLogoutModal();
}

async function saveBJ(){
  const nick = document.getElementById('nick').value.trim();
  const decks = parseInt(document.getElementById('decks').value, 10);
  const dep = parseFloat(document.getElementById('dep').value) || 0;
  const outSum = parseFloat(document.getElementById('out').value) || 0;
  const fee = parseFloat(document.getElementById('fee').value) || 0;
  const winJackpot = document.getElementById('winJackpot').checked;
  
  if(!nick){ showMsg('msgBj', 'Укажите ник игрока', false); return; }
  if(dep < 10 || dep > 10000){ showMsg('msgBj', 'Депозит от 10 до 10 000', false); return; }
  if(outSum < 0 || outSum > 10000){ showMsg('msgBj', 'Вывод от 0 до 10 000', false); return; }
  if(fee < 0){ showMsg('msgBj', 'Комиссия не может быть отрицательной', false); return; }

  const btn = document.getElementById('btnBJ');
  btn.disabled = true;
  btn.textContent = 'Отправка...';

  const date = new Date().toISOString().slice(0,10);
  const net = outSum - fee;                       // на руки игроку
  const result = dep - outSum - fee;              // результат казино (может быть отрицательным)

  try {
    const r = await fetch('/api/sessions', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ date, nick, decks, dep, outSum, fee, net, result, dealer: currentDealer.name, winJackpot })
    });
    if(!r.ok) throw new Error('Ошибка сервера');
    const okText = result >= 0
      ? `Сессия сохранена. Доход казино: ${result} ₽`
      : `Сессия сохранена. Игрок в плюсе: ${Math.abs(result)} ₽`;
    showMsg('msgBj', okText, true);
    ['nick','dep','out','fee'].forEach(id=>document.getElementById(id).value='');
    document.getElementById('winJackpot').checked = false;
  } catch(e){
    showMsg('msgBj', 'Ошибка: ' + e.message, false);
  } finally {
    btn.disabled = false;
    btn.textContent = 'Внести сессию';
  }
}

async function saveBac(){
  const player = document.getElementById('bac_player').value.trim();
  const bet = document.getElementById('bac_bet').value;
  const sum = parseFloat(document.getElementById('bac_sum').value) || 0;
  const result = document.getElementById('bac_result').value;
  
  if(!player){ showMsg('msgBac', 'Укажите игрока', false); return; }
  if(!bet){ showMsg('msgBac', 'Выберите на кого ставка', false); return; }
  if(!result){ showMsg('msgBac', 'Выберите результат', false); return; }
  if(sum < 10 || sum > 10000){ showMsg('msgBac', 'Ставка от 10 до 10 000', false); return; }

  const btn = document.getElementById('btnBac');
  btn.disabled = true;
  btn.textContent = 'Отправка...';

  const date = new Date().toISOString().slice(0,10);

  try {
    const r = await fetch('/api/baccarat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ date, player, bet, sum, result, dealer: currentDealer.name })
    });
    if(!r.ok) throw new Error('Ошибка сервера');
    showMsg('msgBac', 'Раздача сохранена', true);
    ['bac_player','bac_sum'].forEach(id=>document.getElementById(id).value='');
    
    document.querySelectorAll('#bac-bet-group .choice-btn').forEach(b => b.classList.remove('selected'));
    document.querySelectorAll('#bac-result-group .choice-btn').forEach(b => b.classList.remove('selected'));
    document.getElementById('bac_bet').value = '';
    document.getElementById('bac_result').value = '';
    
  } catch(e){
    showMsg('msgBac', 'Ошибка: ' + e.message, false);
  } finally {
    btn.disabled = false;
    btn.textContent = 'Внести раздачу';
  }
}
</script>
</body>
</html>
