<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<title>KINGWIN — Рулетка (Скоро)</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-main: #0b0e14; --bg-panel: #151922; --bg-card: #1a1f2b;
    --accent: #00e5ff; --accent-green: #00e676;
    --text-main: #fff; --text-muted: #8b92a5;
    --border: rgba(255,255,255,0.05); --red: #ff4d4d; --gold: #f1c40f;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Montserrat', sans-serif; -webkit-tap-highlight-color: transparent; }
  
  body { 
    background: var(--bg-main); color: var(--text-main); min-height: 100dvh; 
    display: flex; flex-direction: column; justify-content: center; align-items: center;
    overflow-x: hidden; text-align: center; padding: 20px;
  }

  .bg-crowns { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
  .floating-crown { position: absolute; opacity: 0.12; animation: floatCrown linear infinite; filter: drop-shadow(0 0 6px rgba(241,196,15,.3)); will-change: transform; }
  .floating-crown svg { width: 100%; height: 100%; display: block; }
  @keyframes floatCrown {
    0% { transform: translateY(0) translateX(0) rotate(0deg); }
    25% { transform: translateY(-30px) translateX(20px) rotate(8deg); }
    50% { transform: translateY(-50px) translateX(-10px) rotate(-5deg); }
    75% { transform: translateY(-20px) translateX(15px) rotate(6deg); }
    100% { transform: translateY(0) translateX(0) rotate(0deg); }
  }

  .content {
    position: relative;
    z-index: 1;
    background: rgba(255,255,255,0.03);
    border: 1px solid var(--border);
    border-radius: 24px;
    padding: 40px 30px;
    max-width: 400px;
    width: 100%;
    box-shadow: 0 10px 40px rgba(0,0,0,0.5);
  }

  .icon {
    font-size: 80px;
    margin-bottom: 20px;
    display: inline-block;
    animation: pulseIcon 2s infinite;
  }
  @keyframes pulseIcon {
    0% { transform: scale(1); }
    50% { transform: scale(1.1); }
    100% { transform: scale(1); }
  }

  h1 {
    font-size: 26px;
    font-weight: 900;
    margin-bottom: 10px;
    color: var(--text-main);
  }
  p {
    font-size: 14px;
    color: var(--text-muted);
    line-height: 1.5;
    margin-bottom: 30px;
  }

  .btn-back {
    display: inline-block;
    background: var(--accent-green);
    color: #000;
    text-decoration: none;
    padding: 16px 32px;
    border-radius: 12px;
    font-weight: 900;
    font-size: 16px;
    transition: 0.2s;
    box-shadow: 0 4px 15px rgba(0,230,118,0.2);
  }
  .btn-back:active {
    transform: scale(0.95);
  }

</style>
</head>
<body>

<!-- ФОН (Короны) -->
<div class="bg-crowns" id="bgCrowns"></div>

<div class="content">
  <div class="icon">🎡</div>
  <h1>Рулетка на реконструкции</h1>
  <p>Мы улучшаем этот режим, чтобы он был ещё интереснее. Скоро всё заработает!</p>
  <a href="/" class="btn-back">← Вернуться на главную</a>
</div>

<script>
  // Простой генератор фоновых корон (как на главной)
  window.onload = function() {
    const bg = document.getElementById('bgCrowns');
    for (let i = 0; i < 15; i++) {
      const crown = document.createElement('div');
      crown.className = 'floating-crown';
      if (Math.random() > 0.5) crown.classList.add('broken');
      
      crown.style.left = Math.random() * 100 + '%';
      crown.style.top = Math.random() * 100 + '%';
      crown.style.width = (20 + Math.random() * 40) + 'px';
      crown.style.height = crown.style.width;
      crown.style.animationDuration = (5 + Math.random() * 10) + 's';
      crown.style.animationDelay = (Math.random() * -10) + 's';
      
      crown.innerHTML = `<svg viewBox="0 0 24 24"><path d="M5 16L3 5l5.5 5L12 4l3.5 6L21 5l-2 11H5zm14 3c0 .6-.4 1-1 1H6c-.6 0-1-.4-1-1v-1h14v1z"/></svg>`;
      bg.appendChild(crown);
    }
  };
</script>
</body>
</html>
